name: Deploy Skills Explorer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'AssistOSExplorer branch to deploy'
        required: false
        default: 'main'
        type: string
      workspace_name:
        description: 'Workspace directory name on the remote host'
        required: false
        default: 'explorerWorkspace'
        type: string
      router_port:
        description: 'Router port on the remote host'
        required: false
        default: '8097'
        type: string
      public_url:
        description: 'Public Explorer URL'
        required: false
        default: 'https://skills.axiologic.dev'
        type: string
      profile:
        description: 'Ploinky profile to use. Defaults to vars.PLOINKY_PROFILE, then prod.'
        required: false
        default: ''
        type: string
      proxies_branch:
        description: 'proxies repo branch. Falls back to vars.PROXIES_BRANCH, then main.'
        required: false
        default: ''
        type: string
      ploinky_branch:
        description: 'Ploinky runtime branch. Falls back to vars.PLOINKY_BRANCH, then master.'
        required: false
        default: ''
        type: string
      achilles_branch:
        description: 'achillesAgentLib branch. Falls back to vars.ACHILLES_BRANCH, then master.'
        required: false
        default: ''
        type: string
      webmeet_infra_image_tag:
        description: 'liveKitServerAgent image tag override. Falls back to vars.WEBMEET_INFRA_IMAGE_TAG, then webmeet-infra.'
        required: false
        default: ''
        type: string
      ploinky_node_image_tag:
        description: 'Ploinky Node image tag override. Falls back to vars.PLOINKY_NODE_IMAGE_TAG, then 24-bookworm-tools.'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-skills-explorer
  cancel-in-progress: false

env:
  SSH_USER: ${{ vars.SSH_USER || 'admin' }}
  SSH_HOST: ${{ vars.SSH_HOST || '193.180.209.191' }}
  WORKSPACE: ${{ inputs.workspace_name || vars.EXPLORER_WORKSPACE || 'explorerWorkspace' }}
  ROUTER_PORT: ${{ inputs.router_port || vars.EXPLORER_ROUTER_PORT || '8097' }}
  PUBLIC_URL: ${{ inputs.public_url || vars.EXPLORER_PUBLIC_URL || 'https://skills.axiologic.dev' }}
  EXPLORER_BRANCH: ${{ inputs.branch || 'main' }}
  PLOINKY_PROFILE: ${{ inputs.profile || vars.PLOINKY_PROFILE || 'prod' }}

jobs:
  deploy:
    name: Deploy or Update Explorer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PLOINKY_MASTER_KEY: ${{ secrets.PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret SSH_KEY"
            exit 1
          fi
          if [ -z "${PLOINKY_MASTER_KEY:-}" ]; then
            echo "::error::Missing required repository secret PLOINKY_MASTER_KEY"
            exit 1
          fi
          if ! printf '%s' "$PLOINKY_MASTER_KEY" | grep -Eq '^[A-Fa-f0-9]{64}$'; then
            echo "::error::PLOINKY_MASTER_KEY must be exactly 64 hex characters"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::SSH_USER and SSH_HOST must be configured"
            exit 1
          fi

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy workspace
        env:
          PLOINKY_MASTER_KEY: ${{ secrets.PLOINKY_MASTER_KEY }}
          WEBMEET_EGRESS_URL: ${{ vars.WEBMEET_EGRESS_URL }}
          WEBMEET_INFRA_IMAGE_TAG: ${{ inputs.webmeet_infra_image_tag || vars.WEBMEET_INFRA_IMAGE_TAG || 'webmeet-infra' }}
          PLOINKY_NODE_IMAGE_TAG: ${{ inputs.ploinky_node_image_tag || vars.PLOINKY_NODE_IMAGE_TAG || '24-bookworm-tools' }}
          DEFAULT_LOCAL_LLM_IMAGE: docker.io/assistos/default-local-llm:cpu-qwen25-coder-1.5b
          WEBMEET_INFRA_HEALTH_PORT: ${{ vars.WEBMEET_INFRA_HEALTH_PORT }}
          WEBMEET_EGRESS_REDIS_ADDRESS: ${{ vars.WEBMEET_EGRESS_REDIS_ADDRESS }}
          WEBMEET_TLS_HTTPS_PORT: ${{ vars.WEBMEET_TLS_HTTPS_PORT }}
          WEBMEET_TLS_HTTP_PORT: ${{ vars.WEBMEET_TLS_HTTP_PORT }}
          WEBMEET_CERTBOT_AUTO_ISSUE: ${{ vars.WEBMEET_CERTBOT_AUTO_ISSUE }}
          WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS: ${{ vars.WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS }}
          WEBMEET_ICE_TRANSPORT_POLICY: ${{ vars.WEBMEET_ICE_TRANSPORT_POLICY }}
          STRICT_INFRA_CHECKS: ${{ vars.STRICT_INFRA_CHECKS }}
          PROXIES_BRANCH: ${{ inputs.proxies_branch || vars.PROXIES_BRANCH || 'main' }}
          PLOINKY_BRANCH: ${{ inputs.ploinky_branch || vars.PLOINKY_BRANCH || 'master' }}
          ACHILLES_BRANCH: ${{ inputs.achilles_branch || vars.ACHILLES_BRANCH || 'master' }}
        run: |
          set -euo pipefail

          write_env() {
            local name="$1"
            local value="${!name:-}"
            if [ "$name" != "PLOINKY_MASTER_KEY" ] && [ -z "$value" ]; then
              return 0
            fi
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          {
            write_env PLOINKY_MASTER_KEY
            write_env WEBMEET_EGRESS_URL
            write_env WEBMEET_INFRA_IMAGE_TAG
            write_env PLOINKY_NODE_IMAGE_TAG
            write_env DEFAULT_LOCAL_LLM_IMAGE
            write_env WEBMEET_INFRA_HEALTH_PORT
            write_env WEBMEET_EGRESS_REDIS_ADDRESS
            write_env WEBMEET_TLS_HTTPS_PORT
            write_env WEBMEET_TLS_HTTP_PORT
            write_env WEBMEET_CERTBOT_AUTO_ISSUE
            write_env WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS
            write_env WEBMEET_ICE_TRANSPORT_POLICY
            write_env STRICT_INFRA_CHECKS
          } > /tmp/skills_explorer_env
          chmod 600 /tmp/skills_explorer_env

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/skills_explorer_env "${SSH_USER}@${SSH_HOST}:/tmp/skills_explorer_env"

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "WORKSPACE='$WORKSPACE' EXPLORER_BRANCH='$EXPLORER_BRANCH' PROXIES_BRANCH='$PROXIES_BRANCH' PLOINKY_BRANCH='$PLOINKY_BRANCH' ACHILLES_BRANCH='$ACHILLES_BRANCH' ROUTER_PORT='$ROUTER_PORT' PUBLIC_URL='$PUBLIC_URL' PLOINKY_PROFILE='$PLOINKY_PROFILE' bash -s" << 'REMOTE'
          set -euo pipefail
          # Ensure the plaintext env file is removed even if a later step exits non-zero.
          trap 'rm -f /tmp/skills_explorer_env' EXIT

          resolve_ploinky() {
            if [ -x "$HOME/ploinky/bin/ploinky" ]; then
              printf '%s\n' "$HOME/ploinky/bin/ploinky"
              return 0
            fi
            if [ -x "$HOME/.local/bin/ploinky" ]; then
              printf '%s\n' "$HOME/.local/bin/ploinky"
              return 0
            fi
            if command -v ploinky >/dev/null 2>&1; then
              command -v ploinky
              return 0
            fi
            return 1
          }

          PLOINKY="$(resolve_ploinky)" || {
            echo "[deploy] ERROR: ploinky is not installed on the remote host."
            echo "[deploy] Run the Provision Skills Explorer Host workflow first."
            exit 1
          }

          for tool in git node npm podman curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[deploy] ERROR: missing required tool '$tool'."
              echo "[deploy] Run the Provision Skills Explorer Host workflow first."
              exit 1
            fi
          done

          WORK_DIR="$HOME/$WORKSPACE"
          mkdir -p "$WORK_DIR/logs"
          cd "$WORK_DIR"
          # Pin every ploinky command to this workspace's .ploinky tree. Without
          # this, a cold or partially destroyed workspace can resolve upward to a
          # stale ~/.ploinky and read or mutate the wrong encrypted state.
          export PLOINKY_WORKSPACE_ROOT="$WORK_DIR"

          set -a
          . /tmp/skills_explorer_env
          set +a
          rm -f /tmp/skills_explorer_env

          WEBMEET_INFRA_IMAGE_TAG="${WEBMEET_INFRA_IMAGE_TAG:-webmeet-infra}"
          PLOINKY_NODE_IMAGE_TAG="${PLOINKY_NODE_IMAGE_TAG:-24-bookworm-tools}"
          DEFAULT_LOCAL_LLM_IMAGE="${DEFAULT_LOCAL_LLM_IMAGE:-docker.io/assistos/default-local-llm:cpu-qwen25-coder-1.5b}"
          WEBMEET_INFRA_HEALTH_PORT="${WEBMEET_INFRA_HEALTH_PORT:-17000}"
          if [ "${WEBMEET_EGRESS_URL:-}" = "http://webmeetLivekitEgress:7980" ]; then
            echo "[deploy] Ignoring retired split-agent WEBMEET_EGRESS_URL override."
            WEBMEET_EGRESS_URL=""
          fi
          if [ "${PLOINKY_PROFILE:-prod}" = "prod" ]; then
            WEBMEET_EGRESS_URL="${WEBMEET_EGRESS_URL:-http://host.containers.internal:7980}"
          fi

          read_routing_port() {
            node -e 'try{const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).port;process.stdout.write(p?String(p):"")}catch(e){process.stdout.write("")}' "$1" 2>/dev/null || true
          }
          SAFE_TO_SHUTDOWN=0
          if [ -f "$WORK_DIR/.ploinky/routing.json" ]; then
            WORKSPACE_ROUTING_PORT="$(read_routing_port "$WORK_DIR/.ploinky/routing.json")"
            if [ "$WORKSPACE_ROUTING_PORT" = "$ROUTER_PORT" ]; then
              SAFE_TO_SHUTDOWN=1
            elif [ -n "$WORKSPACE_ROUTING_PORT" ]; then
              echo "[deploy] ERROR: existing routing.json port ($WORKSPACE_ROUTING_PORT) != ROUTER_PORT ($ROUTER_PORT)."
              echo "[deploy] 'ploinky shutdown' would target a port this run does not own. Aborting."
              exit 1
            fi
          fi
          if [ "$SAFE_TO_SHUTDOWN" = "1" ]; then
            echo "[deploy] Workspace owns :$ROUTER_PORT; shutting it down before redeploy..."
            env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" shutdown || \
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" stop || true
          else
            echo "[deploy] Cold/unconfirmed workspace; skipping 'ploinky shutdown' because no matching routing.json owns :$ROUTER_PORT."
          fi

          if [ "$SAFE_TO_SHUTDOWN" != "1" ] && ss -ltn 2>/dev/null | awk '{print $4}' | grep -Eq "[:.]${ROUTER_PORT}$"; then
            echo "[deploy] ERROR: port ${ROUTER_PORT} is already in use and is not owned by this workspace."
            exit 1
          fi

          echo "[deploy] Ensuring Ploinky runtime is on requested branch..."
          resolve_realpath() {
            if command -v realpath >/dev/null 2>&1; then
              realpath "$1"
            else
              readlink -f "$1"
            fi
          }

          checkout_runtime_branch() {
            local repo_dir="$1"
            local branch="$2"
            local label="$3"
            local canonical_origin="${4:-}"
            git -C "$repo_dir" check-ref-format --branch "$branch" >/dev/null
            if [ -n "$canonical_origin" ]; then
              git -C "$repo_dir" remote set-url origin "$canonical_origin"
            fi
            git -C "$repo_dir" fetch --prune origin
            if git -C "$repo_dir" show-ref --verify --quiet "refs/heads/$branch"; then
              git -C "$repo_dir" checkout "$branch"
            else
              git -C "$repo_dir" checkout -b "$branch" "origin/$branch"
            fi
            git -C "$repo_dir" reset --hard "origin/$branch"
            echo "[deploy] $label at $(git -C "$repo_dir" rev-parse --short HEAD) ($branch)"
          }

          PLOINKY_BRANCH="${PLOINKY_BRANCH:-master}"
          PLOINKY_BIN="$(resolve_realpath "$PLOINKY")"
          PLOINKY_DIR="$(cd "$(dirname "$PLOINKY_BIN")/.." && pwd -P)"
          if [ ! -d "$PLOINKY_DIR/.git" ] && [ -d "$HOME/ploinky/.git" ]; then
            PLOINKY_DIR="$HOME/ploinky"
            PLOINKY="$PLOINKY_DIR/bin/ploinky"
          fi
          if [ -d "$PLOINKY_DIR/.git" ]; then
            checkout_runtime_branch "$PLOINKY_DIR" "$PLOINKY_BRANCH" "Ploinky runtime" \
              "https://github.com/AssistOS-AI/ploinky.git"
          elif [ "$PLOINKY_BRANCH" != "master" ]; then
            echo "[deploy] ERROR: cannot checkout Ploinky branch '$PLOINKY_BRANCH'; '$PLOINKY_DIR' is not a git checkout."
            exit 1
          fi

          ACHILLES_BRANCH="${ACHILLES_BRANCH:-master}"
          ACHILLES_DIR="$PLOINKY_DIR/node_modules/achillesAgentLib"
          if [ -d "$ACHILLES_DIR/.git" ]; then
            checkout_runtime_branch "$ACHILLES_DIR" "$ACHILLES_BRANCH" "achillesAgentLib" \
              "https://github.com/AssistOS-AI/AchillesAgentLib.git"
          elif [ "$ACHILLES_BRANCH" != "master" ]; then
            echo "[deploy] ERROR: cannot checkout achillesAgentLib branch '$ACHILLES_BRANCH'; '$ACHILLES_DIR' is not a git checkout."
            exit 1
          fi

          echo "[deploy] Installing Ploinky repos..."
          # Ploinky retired 'add repo <name> <url> <branch>' / 'enable repo <name>' in favor of
          # 'install <url|repoName> [name] [--branch X]'. Repos are activated by install; the
          # explorer manifest's "enable" list brings up the agent stack at start time.
          "$PLOINKY" install https://github.com/AssistOS-AI/AssistOSExplorer.git AchillesIDE --branch "${EXPLORER_BRANCH:-main}" || true
          "$PLOINKY" install https://github.com/AssistOS-AI/proxies.git proxies --branch "${PROXIES_BRANCH:-main}" || true

          sync_managed_repos() {
            for repo_spec in "AchillesIDE:${EXPLORER_BRANCH:-main}" "proxies:${PROXIES_BRANCH:-main}"; do
              repo_name="${repo_spec%%:*}"
              repo_branch="${repo_spec#*:}"
              repo_dir="$WORK_DIR/.ploinky/repos/$repo_name"
              if [ -d "$repo_dir/.git" ]; then
                git -C "$repo_dir" fetch origin
                # A failed prior update can leave a managed checkout with an
                # unresolved index. Clear it before checkout; deployments treat
                # origin/$repo_branch as canonical for these managed repos.
                git -C "$repo_dir" reset --hard
                git -C "$repo_dir" clean -fd
                git -C "$repo_dir" checkout "$repo_branch"
                git -C "$repo_dir" reset --hard "origin/$repo_branch"
                git -C "$repo_dir" clean -fd
                echo "[deploy] $repo_name at $(git -C "$repo_dir" rev-parse --short HEAD)"
              fi
            done
          }

          echo "[deploy] Normalizing managed repositories before update..."
          sync_managed_repos

          echo "[deploy] Updating Ploinky, Achilles dependencies, and installed repos..."
          if ! env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" update; then
            echo "[deploy] Initial update failed; retrying once in case Ploinky self-updated during this run..."
            env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" update
          fi

          echo "[deploy] Re-pinning managed repositories after update..."
          sync_managed_repos

          "$PLOINKY" profile "${PLOINKY_PROFILE:-prod}"
          "$PLOINKY" sandbox disable

          set_var() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" var "$name" "$value"
              echo "[deploy] Set $name"
            fi
          }

          set_var PLOINKY_CODE_WRITABLE "1"
          set_var ASSISTOS_FS_ROOT "$WORK_DIR"
          set_var WORKSPACE_ROOT "$WORK_DIR"
          set_var PLOINKY_WORKSPACE_ROOT "$WORK_DIR"

          set_var WEBMEET_EGRESS_URL "${WEBMEET_EGRESS_URL:-}"
          set_var WEBMEET_INFRA_IMAGE_TAG "${WEBMEET_INFRA_IMAGE_TAG:-webmeet-infra}"
          set_var WEBMEET_INFRA_HEALTH_PORT "${WEBMEET_INFRA_HEALTH_PORT:-17000}"
          set_var WEBMEET_EGRESS_REDIS_ADDRESS "${WEBMEET_EGRESS_REDIS_ADDRESS:-}"
          set_var WEBMEET_TLS_HTTPS_PORT "${WEBMEET_TLS_HTTPS_PORT:-}"
          set_var WEBMEET_TLS_HTTP_PORT "${WEBMEET_TLS_HTTP_PORT:-}"
          set_var WEBMEET_CERTBOT_AUTO_ISSUE "${WEBMEET_CERTBOT_AUTO_ISSUE:-}"
          set_var WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS "${WEBMEET_CERTBOT_RENEW_INTERVAL_SECONDS:-}"
          set_var WEBMEET_ICE_TRANSPORT_POLICY "${WEBMEET_ICE_TRANSPORT_POLICY:-all}"

          echo "[deploy] Pulling Ploinky Node image docker.io/assistos/ploinky-node:${PLOINKY_NODE_IMAGE_TAG}..."
          podman pull "docker.io/assistos/ploinky-node:${PLOINKY_NODE_IMAGE_TAG}"

          echo "[deploy] Pulling liveKitServerAgent image docker.io/assistos/livekit-server-agent:${WEBMEET_INFRA_IMAGE_TAG}..."
          podman pull "docker.io/assistos/livekit-server-agent:${WEBMEET_INFRA_IMAGE_TAG}"

          echo "[deploy] Pulling default local LLM image ${DEFAULT_LOCAL_LLM_IMAGE}..."
          podman pull "${DEFAULT_LOCAL_LLM_IMAGE}"
          podman image inspect "${DEFAULT_LOCAL_LLM_IMAGE}" --format '[deploy] default local LLM image architecture={{.Architecture}} os={{.Os}}'

          echo "[deploy] Starting Explorer..."
          nohup env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" start AchillesIDE/explorer "$ROUTER_PORT" \
            --branch "${EXPLORER_BRANCH:-main}" \
            --repo-branch "proxies=${PROXIES_BRANCH:-main}" \
            --reset-repos \
            > "$WORK_DIR/logs/skills-explorer-start.log" 2>&1 &

          echo "[deploy] Waiting for local router..."
          sleep 10
          for i in $(seq 1 390); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${ROUTER_PORT}/dashboard" || true)"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "[deploy] Local router responding with HTTP $code"
              break
            fi
            if [ "$i" = "390" ]; then
              echo "[deploy] ERROR: local router did not respond in time"
              tail -120 "$WORK_DIR/logs/skills-explorer-start.log" || true
              exit 1
            fi
            sleep 2
          done

          case "$(printf '%s' "${STRICT_INFRA_CHECKS:-0}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) INFRA_FATAL=1; INFRA_ATTEMPTS=120 ;;
            *) INFRA_FATAL=0; INFRA_ATTEMPTS=15 ;;
          esac
          echo "[deploy] Verifying liveKitServerAgent health on 127.0.0.1:${WEBMEET_INFRA_HEALTH_PORT} (fatal=${INFRA_FATAL})..."
          LK_OK=0
          for i in $(seq 1 "$INFRA_ATTEMPTS"); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEBMEET_INFRA_HEALTH_PORT}/" || true)"
            if [ "$code" = "200" ]; then
              LK_OK=1
              echo "[deploy] liveKitServerAgent health responding with HTTP $code"
              break
            fi
            sleep 2
          done
          if [ "$LK_OK" != "1" ]; then
            if [ "$INFRA_FATAL" = "1" ]; then
              echo "[deploy] ERROR: liveKitServerAgent health did not respond and STRICT_INFRA_CHECKS=1."
              tail -120 "$WORK_DIR/logs/skills-explorer-start.log" || true
              exit 1
            fi
            echo "[deploy] WARNING: liveKitServerAgent health not responding; continuing (non-strict)."
          fi

          echo "[deploy] Containers:"
          podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -100
          echo "[deploy] Workspace status:"
          env PLOINKY_MASTER_KEY="$PLOINKY_MASTER_KEY" "$PLOINKY" status || true
          REMOTE

      - name: Verify public URL
        run: |
          set -euo pipefail
          echo "[deploy] Verifying ${PUBLIC_URL}/dashboard from GitHub runner..."
          for i in $(seq 1 60); do
            code="$(curl -L -s -o /tmp/skills-explorer-response.txt -w '%{http_code}' "${PUBLIC_URL%/}/dashboard" || true)"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "[deploy] Public URL responding with HTTP $code"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "[deploy] ERROR: public URL did not become reachable"
              echo "[deploy] Last HTTP code: ${code:-none}"
              sed -n '1,40p' /tmp/skills-explorer-response.txt 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          echo "[deploy] Verifying ${PUBLIC_URL}/public-services/soul-gateway-health/ from GitHub runner..."
          for i in $(seq 1 60); do
            code="$(curl -L -s -o /tmp/soul-gateway-health-response.txt -w '%{http_code}' "${PUBLIC_URL%/}/public-services/soul-gateway-health/" || true)"
            if [ "$code" = "200" ]; then
              echo "[deploy] Soul Gateway health responding with HTTP $code"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "[deploy] ERROR: Soul Gateway public health did not become reachable"
              echo "[deploy] Last HTTP code: ${code:-none}"
              sed -n '1,40p' /tmp/soul-gateway-health-response.txt 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Skills Explorer Deploy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Workspace: \`${WORKSPACE}\`"
            echo "- Router port: \`${ROUTER_PORT}\`"
            echo "- Local dashboard: \`http://127.0.0.1:${ROUTER_PORT}/dashboard\`"
            echo "- Public URL: \`${PUBLIC_URL}\`"
            echo "- Branch: \`${EXPLORER_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/skills_explorer_env
