name: Destroy Explorer QA Box

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Confirm removal of the QA Box, its Ploinky-managed tunnel, and all QA data volumes'
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: 'admin'
  SSH_HOST: '45.136.70.141'
  SSH_ED25519_FINGERPRINT: 'SHA256:pcVG+7QFbfi3Ojn3LeveNutqCWaTOIlgek1o3GKD/KA'
  WORKSPACE: 'explorerQaWorkspace'
  CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
  ROUTER_PORT: '8097'
  PUBLIC_HOST: 'explorer-qa.axiologic.dev'
  CLOUDFLARE_TUNNEL_NAME: 'explorer-qa'
  CLOUDFLARE_API_SECRET_HANDLE: 'publication/explorer-qa-api'
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  destroy:
    name: Destroy Explorer QA outer Box
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          if [ "$SSH_HOST" != '45.136.70.141' ] || [ "$SSH_USER" != 'admin' ] ||
            [ "$WORKSPACE" != 'explorerQaWorkspace' ]; then
            echo "::error::Explorer QA destroy target is not the pinned admin@45.136.70.141/explorerQaWorkspace identity"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "::error::EXPLORER_QA_CLOUDFLARE_API_TOKEN is a Global API Key; Ploinky requires a scoped Account or User API Token used as a Bearer token"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Explorer QA Cloudflare account or zone variables are missing or malformed"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "::error::Explorer QA managed Cloudflare tunnel name is malformed"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "$SOUL_GATEWAY_WORKSPACE" ]; then
            echo "::error::Refusing to destroy the production Soul Gateway workspace"
            exit 1
          fi
          if [ "$CONFIRM_DESTROY" != "true" ]; then
            echo "::error::confirm_destroy must be enabled"
            exit 1
          fi
          if [ "$PUBLIC_HOST" != 'explorer-qa.axiologic.dev' ] ||
            [ "$CLOUDFLARE_TUNNEL_NAME" != 'explorer-qa' ] ||
            [ "$ROUTER_PORT" != '8097' ]; then
            echo "::error::Explorer QA destroy publication identity is not pinned"
            exit 1
          fi
          HOST_KEY_CANDIDATE="$RUNNER_TEMP/explorer_qa_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOST_KEY_CANDIDATE"
          HOST_KEY_FINGERPRINT="$({ ssh-keygen -lf "$HOST_KEY_CANDIDATE" -E sha256 || true; } | awk '{print $2}' | sort -u)"
          if [ "$HOST_KEY_FINGERPRINT" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::Explorer QA ED25519 host fingerprint did not match the pinned identity"
            exit 1
          fi
          chmod 600 "$HOST_KEY_CANDIDATE"
          echo "Validated the pinned Explorer QA SSH host identity."

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 "$RUNNER_TEMP/explorer_qa_known_hosts" ~/.ssh/explorer_qa_known_hosts

      - name: Destroy Explorer QA Box
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          umask 077

          LOCAL_ENV_FILE=''
          REMOTE_ENV_FILE=''
          REMOTE_ENV_UPLOADED='false'
          cleanup_destroy_files() {
            if [ -n "$LOCAL_ENV_FILE" ]; then rm -f "$LOCAL_ENV_FILE"; fi
            if [ "$REMOTE_ENV_UPLOADED" = 'true' ]; then
              case "$REMOTE_ENV_FILE" in
                /tmp/explorer_qa_destroy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9])
                  ssh \
                    -i ~/.ssh/deploy_key \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
                    "${SSH_USER}@${SSH_HOST}" \
                    "rm -f -- '$REMOTE_ENV_FILE'" >/dev/null 2>&1 || true
                  ;;
              esac
            fi
          }
          trap cleanup_destroy_files EXIT

          write_shell_var() {
            local name="$1"
            local value="${!name:-}"
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          LOCAL_ENV_FILE="$(mktemp /tmp/explorer_qa_destroy.XXXXXX)"
          REMOTE_ENV_FILE="/tmp/$(basename "$LOCAL_ENV_FILE")"
          {
            write_shell_var WORKSPACE
            write_shell_var ROUTER_PORT
            write_shell_var PUBLIC_HOST
            write_shell_var CLOUDFLARE_TUNNEL_NAME
            write_shell_var CLOUDFLARE_API_SECRET_HANDLE
            write_shell_var CLOUDFLARE_API_TOKEN
            write_shell_var CLOUDFLARE_ACCOUNT_ID
            write_shell_var CLOUDFLARE_ZONE_ID
            write_shell_var SOUL_GATEWAY_WORKSPACE
            write_shell_var SOUL_GATEWAY_ROUTER_PORT
          } > "$LOCAL_ENV_FILE"

          REMOTE_ENV_UPLOADED='true'
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            "$LOCAL_ENV_FILE" \
            "${SSH_USER}@${SSH_HOST}:$REMOTE_ENV_FILE"
          rm -f "$LOCAL_ENV_FILE"
          LOCAL_ENV_FILE=''

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- '$REMOTE_ENV_FILE'" <<'REMOTE'
          set -euo pipefail
          REMOTE_ENV_FILE="${1:-}"
          CLOUDFLARE_CREDENTIAL_FILE=""
          cleanup_remote_files() {
            rm -f "$REMOTE_ENV_FILE"
            if [ -n "$CLOUDFLARE_CREDENTIAL_FILE" ]; then
              rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
            fi
          }
          case "$REMOTE_ENV_FILE" in
            /tmp/explorer_qa_destroy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *)
              echo "[destroy-qa] ERROR: invalid destroy configuration path."
              exit 1
              ;;
          esac
          trap cleanup_remote_files EXIT

          if [ ! -f "$REMOTE_ENV_FILE" ] || [ -L "$REMOTE_ENV_FILE" ]; then
            echo "[destroy-qa] ERROR: destroy configuration was not transferred."
            exit 1
          fi
          set -a
          . "$REMOTE_ENV_FILE"
          set +a
          rm -f "$REMOTE_ENV_FILE"

          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "[destroy-qa] ERROR: invalid workspace name '${WORKSPACE:-}'."
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "${SOUL_GATEWAY_WORKSPACE:-soulGateway}" ]; then
            echo "[destroy-qa] ERROR: refusing to operate on the production Soul Gateway workspace."
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "[destroy-qa] ERROR: invalid router port '${ROUTER_PORT:-}'."
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "[destroy-qa] ERROR: router port must be between 1 and 65535."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "[destroy-qa] ERROR: a scoped Cloudflare API token is required."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "[destroy-qa] ERROR: the configured Cloudflare credential is a Global API Key, not a scoped Bearer API Token."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "[destroy-qa] ERROR: Cloudflare account or zone identifiers are malformed."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "[destroy-qa] ERROR: managed Cloudflare tunnel name is malformed."
            exit 1
          fi

          for tool in git node curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[destroy-qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          if ! command -v podman >/dev/null 2>&1 && ! command -v docker >/dev/null 2>&1; then
            echo "[destroy-qa] ERROR: neither Podman nor Docker is installed."
            exit 1
          fi

          WORK_DIR="$HOME/$WORKSPACE"
          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ] ||
            [ "$WORK_DIR" != '/home/admin/explorerQaWorkspace' ]; then
            echo "[destroy-qa] ERROR: remote Explorer QA identity is not the pinned admin workspace."
            exit 1
          fi
          PINNED_BOX_PATH_HASH="$(
            node --input-type=module -e '
              import crypto from "node:crypto";
              import path from "node:path";
              process.stdout.write(
                crypto.createHash("sha256").update(path.resolve(process.argv[1])).digest("hex").slice(0, 12),
              );
            ' "$WORK_DIR"
          )"
          if [ "$PINNED_BOX_PATH_HASH" != '7a31ab7775eb' ]; then
            echo "[destroy-qa] ERROR: Explorer QA workspace hash does not match the pinned identity."
            exit 1
          fi
          if [ -L "$WORK_DIR" ]; then
            echo "[destroy-qa] ERROR: workspace identity path must not be a symlink: $WORK_DIR"
            exit 1
          fi
          if [ -L "$WORK_DIR/.ploinky" ]; then
            echo "[destroy-qa] ERROR: workspace authority directory must not be a symlink: $WORK_DIR/.ploinky"
            exit 1
          fi
          if [ ! -d "$WORK_DIR" ]; then
            echo "[destroy-qa] No QA identity directory exists at $WORK_DIR; nothing to destroy."
            exit 0
          fi

          RUNTIME_DIR="$WORK_DIR/.runtime/ploinky"
          PLOINKY="$RUNTIME_DIR/bin/ploinky"
          if [ ! -d "$RUNTIME_DIR/.git" ] || [ ! -x "$PLOINKY" ]; then
            echo "[destroy-qa] ERROR: the dedicated QA Ploinky runtime is missing or invalid."
            echo "[destroy-qa] Refusing to substitute a shared host runtime for exact Box destruction."
            exit 1
          fi
          inspect_outer_box_status() {
            env PLOINKY_WORKSPACE_ROOT="$WORK_DIR" \
              node --input-type=module - \
                "$RUNTIME_DIR/ploinky-box/supervisor.mjs" <<'NODE'
          import { pathToFileURL } from 'node:url';

          const supervisorModule = process.argv[2];
          const {
            createBoxSupervisor,
            formatBoxStatus,
          } = await import(pathToFileURL(supervisorModule).href);
          const status = createBoxSupervisor().inspectBoxStatus();
          process.stdout.write(formatBoxStatus(status));
          NODE
          }
          RUNTIME_ORIGIN="$(git -C "$RUNTIME_DIR" remote get-url origin)"
          case "${RUNTIME_ORIGIN%.git}" in
            https://github.com/AssistOS-AI/ploinky) ;;
            *)
              echo "[destroy-qa] ERROR: unexpected Ploinky runtime origin '$RUNTIME_ORIGIN'."
              exit 1
              ;;
          esac

          resolve_default_branch() {
            local repository_url="$1"
            local symref_record default_ref default_branch
            if ! symref_record="$(git ls-remote --symref "$repository_url" HEAD)"; then
              echo "[destroy-qa] ERROR: unable to resolve the default branch for $repository_url." >&2
              return 1
            fi
            default_ref="$({
              printf '%s\n' "$symref_record" |
                awk '$1 == "ref:" && $3 == "HEAD" { print $2; exit }'
            })"
            case "$default_ref" in
              refs/heads/*) ;;
              *)
                echo "[destroy-qa] ERROR: remote HEAD for $repository_url is not a branch." >&2
                return 1
                ;;
            esac
            default_branch="${default_ref#refs/heads/}"
            git check-ref-format --branch "$default_branch" >/dev/null
            printf '%s\n' "$default_branch"
          }

          PLOINKY_URL='https://github.com/AssistOS-AI/ploinky.git'
          PLOINKY_BRANCH="$(resolve_default_branch "$PLOINKY_URL")"
          AGENTLIB_URL='https://github.com/AssistOS-AI/achillesAgentLib.git'
          export PLOINKY_AGENTLIB_REF="$(resolve_default_branch "$AGENTLIB_URL")"
          git -C "$RUNTIME_DIR" fetch --prune origin \
            "refs/heads/$PLOINKY_BRANCH:refs/remotes/origin/$PLOINKY_BRANCH"

          SOUL_HEALTH_URL="http://127.0.0.1:${SOUL_GATEWAY_ROUTER_PORT:-8080}/base-agent-additional-server/soul-gateway/7000/healthz/"
          SOUL_UP_BEFORE=0
          if curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            SOUL_UP_BEFORE=1
            echo "[destroy-qa] Protected Soul Gateway was healthy before destruction."
          fi

          export PLOINKY_WORKSPACE_ROOT="$WORK_DIR"
          echo "[destroy-qa] Exact Box status before destruction:"
          inspect_outer_box_status || true

          DEPLOYED_PLOINKY_HEAD="$(git -C "$RUNTIME_DIR" rev-parse HEAD)"
          if ! git -C "$RUNTIME_DIR" merge-base --is-ancestor \
            "$DEPLOYED_PLOINKY_HEAD" \
            "refs/remotes/origin/$PLOINKY_BRANCH"; then
            echo "[destroy-qa] ERROR: deployed Ploinky runtime is not from '$PLOINKY_BRANCH'."
            exit 1
          fi
          echo "[destroy-qa] Using deployed Ploinky runtime $(git -C "$RUNTIME_DIR" rev-parse --short HEAD) from $PLOINKY_BRANCH."
          echo "[destroy-qa] The deployed runtime remains authoritative for its immutable edge generation during teardown."

          mkdir -p "$WORK_DIR/.ploinky"
          chmod 700 "$WORK_DIR/.ploinky"
          EDGE_DESIRED_FILE="$WORK_DIR/.ploinky/edge-desired.json"
          node --input-type=module - \
            "$EDGE_DESIRED_FILE" \
            "$CLOUDFLARE_ACCOUNT_ID" \
            "$CLOUDFLARE_ZONE_ID" \
            "$CLOUDFLARE_TUNNEL_NAME" \
            "$CLOUDFLARE_API_SECRET_HANDLE" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const target = path.resolve(process.argv[2]);
          const [
            accountId,
            zoneId,
            tunnelName,
            apiTokenSecret,
          ] = process.argv.slice(3);
          const desired = {
            hosts: {},
            cloudflare: {
              accountId,
              zoneId,
              tunnelName,
              apiTokenSecret,
              deleteTunnelOnTeardown: true,
            },
          };
          try {
            const current = fs.lstatSync(target);
            if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
              throw new Error(`refusing unsafe edge desired target: ${target}`);
            }
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          const temporary = `${target}.${process.pid}.tmp`;
          try {
            fs.writeFileSync(temporary, `${JSON.stringify(desired, null, 2)}\n`, {
              encoding: 'utf8',
              flag: 'wx',
              mode: 0o600,
            });
            fs.renameSync(temporary, target);
            fs.chmodSync(target, 0o600);
          } finally {
            try { fs.unlinkSync(temporary); } catch (error) {
              if (error?.code !== 'ENOENT') throw error;
            }
          }
          NODE

          GRAPH_REPOSITORIES=(
            'AchillesIDE|https://github.com/AssistOS-AI/AssistOSExplorer.git'
            'UmamiAgent|https://github.com/AssistOS-AI/UmamiAgent.git'
            'AchillesCLI|https://github.com/AssistOS-AI/AchillesCLI.git'
            'copilot-agents|https://github.com/AssistOS-AI/copilot-agents.git'
            'proxies|https://github.com/AssistOS-AI/proxies.git'
            'container-image-builds|https://github.com/AssistOS-AI/container-image-builds.git'
          )
          BRANCH_ARGS=(
            --branch-fallback fail
            --reset-repos
          )
          for repository_record in "${GRAPH_REPOSITORIES[@]}"; do
            IFS='|' read -r repository_name repository_url <<< "$repository_record"
            default_branch="$(resolve_default_branch "$repository_url")"
            BRANCH_ARGS+=(--repo-branch "$repository_name=$default_branch")
            echo "[destroy-qa] Selected $repository_name/$default_branch for teardown reconciliation."
          done

          PLAN_JSON="$(
            "$PLOINKY" --dry-run --port "$ROUTER_PORT" start explorer \
              --profile=default \
              "${BRANCH_ARGS[@]}"
          )"
          BOX_INSTANCE="$(
            printf '%s' "$PLAN_JSON" |
              node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  const plan = JSON.parse(input);
                  if (!/^ploinky-box-[a-z0-9-]+-[a-f0-9]{12}$/.test(plan.identity || "")) {
                    throw new Error("invalid Box identity in dry-run plan");
                  }
                  process.stdout.write(plan.identity);
                });
              '
          )"
          if [ "$BOX_INSTANCE" != "ploinky-box-explorerqaworkspace-$PINNED_BOX_PATH_HASH" ]; then
            echo "[destroy-qa] ERROR: dry-run Box identity is not the pinned Explorer QA instance."
            exit 1
          fi

          node --input-type=module - \
            "$RUNTIME_DIR/ploinky-box/supervisor.mjs" \
            "$ROUTER_PORT" <<'NODE'
          import { pathToFileURL } from 'node:url';

          const supervisorModule = process.argv[2];
          const routerPort = Number(process.argv[3]);
          if (!Number.isSafeInteger(routerPort) || routerPort < 1 || routerPort > 65535) {
            throw new Error('invalid Router port');
          }
          const { createBoxSupervisor } = await import(pathToFileURL(supervisorModule).href);
          await createBoxSupervisor().prepareBoxForCommand({ explicitPort: routerPort });
          NODE

          BOX_ENGINE=""
          for candidate in podman docker; do
            if command -v "$candidate" >/dev/null 2>&1 &&
              "$candidate" container inspect "$BOX_INSTANCE" >/dev/null 2>&1; then
              if [ -n "$BOX_ENGINE" ]; then
                echo "[destroy-qa] ERROR: Box identity exists in more than one container engine."
                exit 1
              fi
              BOX_ENGINE="$candidate"
            fi
          done
          if [ -z "$BOX_ENGINE" ]; then
            echo "[destroy-qa] ERROR: exact Box instance '$BOX_INSTANCE' was not found."
            exit 1
          fi

          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const target = "/workspace/.ploinky";
              try {
                const current = fs.lstatSync(target);
                if (!current.isDirectory() || current.isSymbolicLink()) {
                  throw new Error(`refusing unsafe Ploinky authority directory: ${target}`);
                }
                if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                  throw new Error(`Ploinky authority directory has the wrong owner: ${target}`);
                }
              } catch (error) {
                if (error?.code !== "ENOENT") throw error;
                fs.mkdirSync(target, { mode: 0o700 });
              }
              fs.chmodSync(target, 0o700);
            '

          STAGED_EDGE_DESIRED="/workspace/.ploinky/.explorer-qa-edge-desired.json"
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const staged = "/workspace/.ploinky/.explorer-qa-edge-desired.json";
              try {
                const current = fs.lstatSync(staged);
                if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
                  throw new Error(`refusing unsafe staged edge desired file: ${staged}`);
                }
                if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                  throw new Error(`staged edge desired file has the wrong owner: ${staged}`);
                }
                fs.unlinkSync(staged);
              } catch (error) {
                if (error?.code !== "ENOENT") throw error;
              }
            '
          "$BOX_ENGINE" container cp \
            "$EDGE_DESIRED_FILE" \
            "$BOX_INSTANCE:$STAGED_EDGE_DESIRED"
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const staged = "/workspace/.ploinky/.explorer-qa-edge-desired.json";
              const target = "/workspace/.ploinky/edge-desired.json";
              try {
                const stagedStat = fs.lstatSync(staged);
                if (!stagedStat.isFile() || stagedStat.isSymbolicLink() || stagedStat.nlink !== 1) {
                  throw new Error(`refusing unsafe staged edge desired file: ${staged}`);
                }
                if (typeof process.getuid === "function" && stagedStat.uid !== process.getuid()) {
                  throw new Error(`staged edge desired file has the wrong owner: ${staged}`);
                }
                JSON.parse(fs.readFileSync(staged, "utf8"));
                try {
                  const current = fs.lstatSync(target);
                  if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
                    throw new Error(`refusing unsafe edge desired target: ${target}`);
                  }
                  if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                    throw new Error(`edge desired target has the wrong owner: ${target}`);
                  }
                } catch (error) {
                  if (error?.code !== "ENOENT") throw error;
                }
                fs.renameSync(staged, target);
                fs.chmodSync(target, 0o600);
              } finally {
                try { fs.unlinkSync(staged); } catch (error) {
                  if (error?.code !== "ENOENT") throw error;
                }
              }
            '

          CLOUDFLARE_CREDENTIAL_FILE="$(mktemp /tmp/explorer_qa_cloudflare.XXXXXX)"
          node --input-type=module - "$CLOUDFLARE_CREDENTIAL_FILE" <<'NODE'
          import fs from 'node:fs';

          const target = process.argv[2];
          const values = {
            'publication/explorer-qa-api': String(process.env.CLOUDFLARE_API_TOKEN || ''),
          };
          if (Object.values(values).some((value) => !value)) {
            throw new Error('Cloudflare credentials are missing');
          }
          fs.writeFileSync(target, JSON.stringify(values), {
            encoding: 'utf8',
            flag: 'w',
            mode: 0o600,
          });
          fs.chmodSync(target, 0o600);
          NODE
          STAGED_CREDENTIAL_FILE="/workspace/.ploinky/.explorer-qa-cloudflare-credentials.json"
          CREDENTIAL_STATUS=0
          "$BOX_ENGINE" container cp \
            "$CLOUDFLARE_CREDENTIAL_FILE" \
            "$BOX_INSTANCE:$STAGED_CREDENTIAL_FILE" || CREDENTIAL_STATUS=$?
          if [ "$CREDENTIAL_STATUS" = "0" ]; then
            "$BOX_ENGINE" container exec \
              --user podman \
              --workdir /workspace \
              --env PLOINKY_WORKSPACE_ROOT=/workspace \
              "$BOX_INSTANCE" \
              node --input-type=module --eval '
                import fs from "node:fs";
                import { setSecretValue } from "/opt/ploinky/cli/utils/security/encryptedSecretsFile.js";
                const file = process.argv.at(-1);
                const values = JSON.parse(fs.readFileSync(file, "utf8"));
                const expected = [
                  "publication/explorer-qa-api",
                ];
                if (JSON.stringify(Object.keys(values).sort()) !== JSON.stringify(expected)) {
                  throw new Error("unexpected Cloudflare credential handles");
                }
                for (const [name, value] of Object.entries(values)) {
                  if (!String(value || "")) throw new Error(`empty Cloudflare credential ${name}`);
                  setSecretValue(name, value);
                }
              ' "$STAGED_CREDENTIAL_FILE" || CREDENTIAL_STATUS=$?
          fi
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            rm -f "$STAGED_CREDENTIAL_FILE" >/dev/null 2>&1 || true
          rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
          CLOUDFLARE_CREDENTIAL_FILE=""
          if [ "$CREDENTIAL_STATUS" != "0" ]; then
            echo "[destroy-qa] ERROR: unable to persist Cloudflare credentials in the encrypted Ploinky store."
            exit "$CREDENTIAL_STATUS"
          fi

          echo "[destroy-qa] Reconciling the empty Ploinky route set before destruction..."
          PLOINKY_RECONCILE_STATUS=0
          "$PLOINKY" --port "$ROUTER_PORT" start explorer \
            --profile=default \
            "${BRANCH_ARGS[@]}" || PLOINKY_RECONCILE_STATUS=$?
          CLOUDFLARE_REMOVED=0
          BOX_STATUS="$(inspect_outer_box_status || true)"
          if [ "$PLOINKY_RECONCILE_STATUS" = "0" ]; then
            for _ in $(seq 1 60); do
              BOX_STATUS="$(inspect_outer_box_status || true)"
              if [[ "$BOX_STATUS" == *"Cloudflare mode: local-only"* ]] &&
                [[ "$BOX_STATUS" == *"Cloudflare management: none"* ]] &&
                [[ "$BOX_STATUS" == *"Cloudflare publication: local-only"* ]] &&
                [[ "$BOX_STATUS" == *"Cloudflare connector: absent"* ]]; then
                CLOUDFLARE_REMOVED=1
                break
              fi
              sleep 2
            done
          fi
          printf '%s\n' "$BOX_STATUS"
          if [ "$CLOUDFLARE_REMOVED" = "1" ]; then
            echo "[destroy-qa] Ploinky removed the exact Explorer QA Cloudflare publication."
          else
            echo "[destroy-qa] WARNING: managed empty-route reconciliation did not converge; using the exact-identity teardown fallback."
          fi

          PLOINKY_DESTROY_STATUS=1
          if [ "$CLOUDFLARE_REMOVED" = "1" ]; then
            echo "[destroy-qa] Destroying the exact outer Box for $WORK_DIR through Ploinky..."
            PLOINKY_DESTROY_STATUS=0
            printf 'yes\n' | "$PLOINKY" destroy || PLOINKY_DESTROY_STATUS=$?
          fi
          if [ "$PLOINKY_DESTROY_STATUS" != "0" ] ||
            "$BOX_ENGINE" container inspect "$BOX_INSTANCE" >/dev/null 2>&1; then
            echo "[destroy-qa] Removing only the pinned outer Box '$BOX_INSTANCE' through $BOX_ENGINE."
            "$BOX_ENGINE" container rm -f "$BOX_INSTANCE"
          fi

          BOX_STATUS="$(inspect_outer_box_status)"
          printf '%s\n' "$BOX_STATUS"
          case "$BOX_STATUS" in
            *"Ploinky Box: absent"*|*"Ploinky Box: absent-retained-volumes"*) ;;
            *)
              echo "[destroy-qa] ERROR: outer Box still appears to exist."
              exit 1
              ;;
          esac

          if [ "$CLOUDFLARE_REMOVED" != "1" ]; then
            echo "[destroy-qa] Removing only the exact dedicated Explorer QA Cloudflare publication..."
            node --input-type=module <<'NODE'
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || '');
          const tunnelName = String(process.env.CLOUDFLARE_TUNNEL_NAME || '');
          const publicHost = String(process.env.PUBLIC_HOST || '');
          const apiToken = String(process.env.CLOUDFLARE_API_TOKEN || '');
          if (!/^[a-f0-9]{32}$/.test(accountId) || !/^[a-f0-9]{32}$/.test(zoneId)
            || tunnelName !== 'explorer-qa' || publicHost !== 'explorer-qa.axiologic.dev'
            || !apiToken) {
            throw new Error('exact Explorer QA Cloudflare identity is not pinned');
          }
          const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const request = async (pathname, { method = 'GET' } = {}) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              method,
              headers: { Authorization: `Bearer ${apiToken}` },
              redirect: 'error',
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              const codes = Array.isArray(payload?.errors)
                ? payload.errors.map((entry) => String(entry?.code || 'unknown')).join(',')
                : 'unknown';
              throw new Error(`Cloudflare ${method} ${pathname.split('?')[0]} failed (${codes})`);
            }
            return payload.result;
          };
          const listTunnels = () => request(
            `/accounts/${accountId}/cfd_tunnel?${new URLSearchParams({
              name: tunnelName,
              is_deleted: 'false',
              per_page: '100',
            })}`,
          );
          const listRecords = () => request(
            `/zones/${zoneId}/dns_records?${new URLSearchParams({
              name: publicHost,
              per_page: '100',
            })}`,
          );
          const tunnels = await listTunnels();
          const records = await listRecords();
          if (!Array.isArray(tunnels) || tunnels.length > 1
            || !Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA Cloudflare inventory is ambiguous');
          }
          if (tunnels.length === 0) {
            if (records.length !== 0) {
              throw new Error('Explorer QA DNS exists without its exact dedicated tunnel');
            }
            process.stdout.write('[destroy-qa] Exact Explorer QA Cloudflare publication was already absent.\n');
            process.exit(0);
          }
          const tunnel = tunnels[0];
          const tunnelId = String(tunnel?.id || '');
          if (!/^[a-f0-9-]{36}$/.test(tunnelId) || tunnel?.name !== tunnelName
            || tunnel?.deleted_at != null
            || (tunnel?.account_tag != null && tunnel.account_tag !== accountId)) {
            throw new Error('Explorer QA dedicated tunnel identity changed');
          }
          const detail = await request(`/accounts/${accountId}/cfd_tunnel/${tunnelId}`);
          const configuration = await request(
            `/accounts/${accountId}/cfd_tunnel/${tunnelId}/configurations`,
          );
          if (detail?.id !== tunnelId || detail?.name !== tunnelName || detail?.deleted_at != null) {
            throw new Error('Explorer QA dedicated tunnel detail changed');
          }
          const ingress = configuration?.config?.ingress ?? configuration?.ingress ?? [];
          if (!Array.isArray(ingress) || ingress.length > 2) {
            throw new Error('Explorer QA dedicated tunnel contains shared or ambiguous ingress');
          }
          if (ingress.length) {
            const catchAll = ingress.at(-1);
            if (catchAll?.hostname != null || catchAll?.service !== 'http_status:404') {
              throw new Error('Explorer QA dedicated tunnel lacks its terminal 404 ingress');
            }
          }
          if (ingress.length === 2
            && (ingress[0]?.hostname !== publicHost
              || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
            throw new Error('Explorer QA dedicated tunnel contains an unrelated route');
          }
          const expectedTarget = `${tunnelId}.cfargotunnel.com`;
          if (records.length === 1 && (records[0]?.name !== publicHost
            || records[0]?.type !== 'CNAME' || records[0]?.content !== expectedTarget
            || records[0]?.proxied !== true || !/^[a-f0-9]{32}$/.test(String(records[0]?.id || '')))) {
            throw new Error('Explorer QA DNS points outside the exact dedicated tunnel');
          }
          if (records.length === 1) {
            await request(`/zones/${zoneId}/dns_records/${records[0].id}`, { method: 'DELETE' });
          }
          await request(
            `/accounts/${accountId}/cfd_tunnel/${tunnelId}/connections`,
            { method: 'DELETE' },
          );
          await request(`/accounts/${accountId}/cfd_tunnel/${tunnelId}`, { method: 'DELETE' });
          for (let attempt = 0; attempt < 15; attempt += 1) {
            const [remainingTunnels, remainingRecords] = await Promise.all([listTunnels(), listRecords()]);
            if (Array.isArray(remainingTunnels) && remainingTunnels.length === 0
              && Array.isArray(remainingRecords) && remainingRecords.length === 0) {
              process.stdout.write('[destroy-qa] Exact Explorer QA Cloudflare publication deletion verified.\n');
              process.exit(0);
            }
            await wait(2000);
          }
          throw new Error('Explorer QA Cloudflare publication deletion did not verify');
          NODE
          fi
          unset CLOUDFLARE_API_TOKEN

          if [ "$SOUL_UP_BEFORE" = "1" ] && ! curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            echo "[destroy-qa] ERROR: protected Soul Gateway became unhealthy during QA destruction."
            exit 1
          fi

          BOX_PATH_HASH="${BOX_INSTANCE##*-}"
          if [ "$BOX_PATH_HASH" != "$PINNED_BOX_PATH_HASH" ]; then
            echo "[destroy-qa] ERROR: refusing to derive QA volume ownership from malformed Box identity '$BOX_INSTANCE'."
            exit 1
          fi
          QA_VOLUME_ROLES=(workspace containers ploinky-deps)
          QA_VOLUME_RECORDS=()
          for engine in podman docker; do
            command -v "$engine" >/dev/null 2>&1 || continue
            while IFS= read -r volume_name; do
              [ -n "$volume_name" ] || continue
              volume_role="$(
                "$engine" volume inspect "$volume_name" \
                  --format '{{ index .Labels "io.assistos.ploinky-box.role" }}'
              )"
              role_allowed=0
              for allowed_role in "${QA_VOLUME_ROLES[@]}"; do
                if [ "$volume_role" = "$allowed_role" ]; then role_allowed=1; fi
              done
              if [ "$role_allowed" != "1" ] || [ "$volume_name" != "$BOX_INSTANCE-$volume_role" ]; then
                echo "[destroy-qa] ERROR: refusing a volume with conflicting exact QA ownership: $volume_name"
                exit 1
              fi
              observed_role="$(
                "$engine" volume inspect "$volume_name" \
                  --format '{{ index .Labels "io.assistos.ploinky-box.role" }}'
              )"
              observed_hash="$(
                "$engine" volume inspect "$volume_name" \
                  --format '{{ index .Labels "io.assistos.ploinky-box.path-hash" }}'
              )"
              if [ "$observed_role" != "$volume_role" ] || [ "$observed_hash" != "$BOX_PATH_HASH" ]; then
                echo "[destroy-qa] ERROR: refusing to remove volume with mismatched Ploinky ownership: $volume_name"
                exit 1
              fi
              QA_VOLUME_RECORDS+=("$engine|$volume_name")
            done < <(
              {
                "$engine" volume ls -q --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH"
                for volume_role in "${QA_VOLUME_ROLES[@]}"; do
                  volume_name="$BOX_INSTANCE-$volume_role"
                  if "$engine" volume inspect "$volume_name" >/dev/null 2>&1; then
                    printf '%s\n' "$volume_name"
                  fi
                done
              } | sort -u
            )
          done
          for record in "${QA_VOLUME_RECORDS[@]}"; do
            IFS='|' read -r engine volume_name <<< "$record"
            "$engine" volume rm "$volume_name"
            if "$engine" volume inspect "$volume_name" >/dev/null 2>&1; then
              echo "[destroy-qa] ERROR: QA volume deletion did not verify: $volume_name"
              exit 1
            fi
          done
          if ! node --input-type=module - "$WORK_DIR" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const target = path.resolve(process.argv[2]);
          if (target !== '/home/admin/explorerQaWorkspace') {
            throw new Error(`refusing recursive cleanup outside exact QA identity: ${target}`);
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isDirectory() || current.isSymbolicLink()
              || (typeof process.getuid === 'function' && current.uid !== process.getuid())) {
              throw new Error(`refusing unsafe QA identity directory: ${target}`);
            }
            fs.rmSync(target, { recursive: true, force: false, maxRetries: 3 });
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          NODE
          then
            echo "[destroy-qa] Root-owned nested runtime data requires the pinned privileged cleanup fallback."
            sudo -n /usr/bin/node --input-type=module - "$WORK_DIR" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          if (typeof process.getuid !== 'function' || process.getuid() !== 0) {
            throw new Error('privileged QA cleanup did not run as root');
          }
          const target = path.resolve(process.argv[2]);
          if (target !== '/home/admin/explorerQaWorkspace') {
            throw new Error(`refusing privileged cleanup outside exact QA identity: ${target}`);
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isDirectory() || current.isSymbolicLink()) {
              throw new Error(`refusing unsafe privileged QA identity directory: ${target}`);
            }
            fs.rmSync(target, { recursive: true, force: false, maxRetries: 3 });
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          NODE
          fi
          if [ -e "$WORK_DIR" ] || [ -L "$WORK_DIR" ]; then
            echo "[destroy-qa] ERROR: QA identity directory deletion did not verify: $WORK_DIR"
            exit 1
          fi

          echo "[destroy-qa] Outer Box and its exact dedicated Cloudflare route, DNS record, and managed tunnel were removed."
          echo "[destroy-qa] QA workspace, nested-container, dependency volumes, and host identity directory were removed."
          REMOTE
          REMOTE_ENV_UPLOADED='false'

      - name: Create summary
        if: success()
        run: |
          {
            echo "## Explorer QA Box Destroy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Identity directory: \`~/${WORKSPACE}\`"
            echo "- Outer Box: removed when present"
            echo "- Ploinky branch: configured repository default, verified against the deployed runtime"
            echo "- Ploinky Cloudflare route and managed tunnel: removed"
            echo "- Unrelated Cloudflare tunnels and routes: preserved"
            echo "- Public hostname: \`${PUBLIC_HOST}\`"
            echo "- Named QA data volumes: removed"
            echo "- Host identity directory: removed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            ~/.ssh/deploy_key \
            ~/.ssh/explorer_qa_known_hosts \
            /tmp/explorer_qa_destroy.env
