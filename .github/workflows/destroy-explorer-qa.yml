name: Destroy Explorer QA Box

on:
  workflow_dispatch:
    inputs:
      delete_data:
        description: 'Also delete the QA data (.data, workspace documents, encryption identity). Unchecked keeps them for the next deploy.'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: 'admin'
  SSH_HOST: '45.136.70.141'
  SSH_ED25519_FINGERPRINT: 'SHA256:pcVG+7QFbfi3Ojn3LeveNutqCWaTOIlgek1o3GKD/KA'
  WORKSPACE: 'explorerQaWorkspace'
  DELETE_DATA: ${{ inputs.delete_data }}
  ROUTER_PORT: '8097'
  PUBLIC_HOST: 'explorer-qa.axiologic.dev'
  CLOUDFLARE_TUNNEL_NAME: 'explorer-qa'
  CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID: '091c4096-d1c8-4dbc-bb12-0c6357431d96'
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  destroy:
    name: Destroy Explorer QA outer Box
    runs-on: ubuntu-latest
    # A keep-data destroy quiesces the nested services first, which takes up to about 15 minutes.
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      - name: Check out the reviewed teardown helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up the teardown test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test the teardown helpers and this workflow
        run: |
          QA_TEARDOWN_PRIVILEGED_TESTS=1 node --test tests/smoke/lib/qa-teardown.test.mjs tests/smoke/lib/deploy-qa-destroy-workflow.test.mjs

      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          if [ "$SSH_HOST" != '45.136.70.141' ] || [ "$SSH_USER" != 'admin' ] ||
            [ "$WORKSPACE" != 'explorerQaWorkspace' ]; then
            echo "::error::Explorer QA destroy target is not the pinned admin@45.136.70.141/explorerQaWorkspace identity"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "::error::EXPLORER_QA_CLOUDFLARE_API_TOKEN is a Global API Key; Ploinky requires a scoped Account or User API Token used as a Bearer token"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Explorer QA Cloudflare account or zone variables are missing or malformed"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "::error::Explorer QA managed Cloudflare tunnel name is malformed"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "$SOUL_GATEWAY_WORKSPACE" ]; then
            echo "::error::Refusing to destroy the production Soul Gateway workspace"
            exit 1
          fi
          case "${DELETE_DATA:-}" in
            true|false) ;;
            *)
              echo "::error::delete_data must be true or false"
              exit 1
              ;;
          esac
          if [ "$PUBLIC_HOST" != 'explorer-qa.axiologic.dev' ] ||
            [ "$CLOUDFLARE_TUNNEL_NAME" != 'explorer-qa' ] ||
            [ "$ROUTER_PORT" != '8097' ]; then
            echo "::error::Explorer QA destroy publication identity is not pinned"
            exit 1
          fi
          if [ "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" != '091c4096-d1c8-4dbc-bb12-0c6357431d96' ]; then
            echo "::error::The protected shared Cloudflare tunnel identity is not pinned"
            exit 1
          fi
          HOST_KEY_CANDIDATE="$RUNNER_TEMP/explorer_qa_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOST_KEY_CANDIDATE"
          HOST_KEY_FINGERPRINT="$({ ssh-keygen -lf "$HOST_KEY_CANDIDATE" -E sha256 || true; } | awk '{print $2}' | sort -u)"
          if [ "$HOST_KEY_FINGERPRINT" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::Explorer QA ED25519 host fingerprint did not match the pinned identity"
            exit 1
          fi
          chmod 600 "$HOST_KEY_CANDIDATE"
          echo "Validated the pinned Explorer QA SSH host identity."

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 "$RUNNER_TEMP/explorer_qa_known_hosts" ~/.ssh/explorer_qa_known_hosts

      - name: Tear down the Explorer QA Box on the host
        run: |
          set -euo pipefail
          umask 077
          case "$DELETE_DATA" in
            true) TEARDOWN_MODE='delete-data' ;;
            false) TEARDOWN_MODE='keep-data' ;;
            *)
              echo "::error::delete_data must be true or false"
              exit 1
              ;;
          esac
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          SCP=(scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts")
          REMOTE_DIR=''
          cleanup_destroy_files() {
            case "$REMOTE_DIR" in
              /tmp/explorer-qa-destroy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9])
                "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" \
                  "rm -f '$REMOTE_DIR/qa-teardown.mjs' '$REMOTE_DIR/qa-teardown-privileged.mjs' '$REMOTE_DIR/quiesce-explorer-qa.mjs' '$REMOTE_DIR/protected-before.json' '$REMOTE_DIR/protected-after.json'; rmdir '$REMOTE_DIR'" >/dev/null 2>&1 || true
                ;;
            esac
          }
          trap cleanup_destroy_files EXIT
          REMOTE_DIR="$("${SSH[@]}" "${SSH_USER}@${SSH_HOST}" 'umask 077; mktemp -d /tmp/explorer-qa-destroy.XXXXXXXX')"
          [[ "$REMOTE_DIR" =~ ^/tmp/explorer-qa-destroy\.[A-Za-z0-9]{8}$ ]]
          # The helpers are uploaded to a private directory and verified by SHA-256 under the host lock.
          # No Cloudflare credential is sent to the host: the runner deletes the publication afterwards.
          for helper in qa-teardown.mjs qa-teardown-privileged.mjs quiesce-explorer-qa.mjs; do
            "${SCP[@]}" "$GITHUB_WORKSPACE/.github/scripts/$helper" "${SSH_USER}@${SSH_HOST}:$REMOTE_DIR/$helper"
          done
          SHA_TEARDOWN="$(sha256sum "$GITHUB_WORKSPACE/.github/scripts/qa-teardown.mjs" | awk '{print $1}')"
          SHA_PRIVILEGED="$(sha256sum "$GITHUB_WORKSPACE/.github/scripts/qa-teardown-privileged.mjs" | awk '{print $1}')"
          SHA_QUIESCE="$(sha256sum "$GITHUB_WORKSPACE/.github/scripts/quiesce-explorer-qa.mjs" | awk '{print $1}')"
          for sha in "$SHA_TEARDOWN" "$SHA_PRIVILEGED" "$SHA_QUIESCE"; do
            [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
          done
          [[ "$SOUL_GATEWAY_ROUTER_PORT" =~ ^[0-9]{1,5}$ ]]

          status=0
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" \
            "flock -n -E 75 --close /home/admin/.qa-deployment-operation.lock bash -s -- '$REMOTE_DIR' '$TEARDOWN_MODE' '$SHA_TEARDOWN' '$SHA_PRIVILEGED' '$SHA_QUIESCE' '$SOUL_GATEWAY_ROUTER_PORT'" <<'REMOTE' | tee "$RUNNER_TEMP/explorer-qa-destroy.log" || status=$?
          set -euo pipefail
          HELPERS_DIR="${1:-}"
          TEARDOWN_MODE="${2:-}"
          SHA_TEARDOWN="${3:-}"
          SHA_PRIVILEGED="${4:-}"
          SHA_QUIESCE="${5:-}"
          SOUL_PORT="${6:-}"
          if [[ ! "$HELPERS_DIR" =~ ^/tmp/explorer-qa-destroy\.[A-Za-z0-9]{8}$ ]]; then
            echo "[destroy-qa] ERROR: invalid teardown helper directory."
            exit 1
          fi
          case "$TEARDOWN_MODE" in
            keep-data) QUIESCE_POLICY=fatal ;;
            delete-data) QUIESCE_POLICY=skip ;;
            *)
              echo "[destroy-qa] ERROR: unsupported teardown mode '$TEARDOWN_MODE'."
              exit 1
              ;;
          esac
          for sha in "$SHA_TEARDOWN" "$SHA_PRIVILEGED" "$SHA_QUIESCE"; do
            if [[ ! "$sha" =~ ^[a-f0-9]{64}$ ]]; then
              echo "[destroy-qa] ERROR: malformed helper checksum."
              exit 1
            fi
          done
          if [[ ! "$SOUL_PORT" =~ ^[0-9]{1,5}$ ]] || [ "$SOUL_PORT" -lt 1 ] || [ "$SOUL_PORT" -gt 65535 ]; then
            echo "[destroy-qa] ERROR: invalid Soul Gateway router port '$SOUL_PORT'."
            exit 1
          fi

          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ]; then
            echo "[destroy-qa] ERROR: remote Explorer QA identity is not the pinned admin account."
            exit 1
          fi
          for tool in node curl sha256sum cmp; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[destroy-qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          if ! command -v podman >/dev/null 2>&1 && ! command -v docker >/dev/null 2>&1; then
            echo "[destroy-qa] ERROR: neither Podman nor Docker is installed."
            exit 1
          fi
          # The shared host Node can be older than the helpers' minimum, so prefer
          # the QA-scoped Node that the deploy workflow installs and verifies.
          case "$(uname -m)" in
            x86_64) QA_NODE_ARCH=x64 ;;
            aarch64|arm64) QA_NODE_ARCH=arm64 ;;
            *) QA_NODE_ARCH='' ;;
          esac
          QA_NODE_HOME="/home/admin/.qa-deployment-tools/node-v24.19.0-linux-$QA_NODE_ARCH"
          if [ -n "$QA_NODE_ARCH" ] && [ -f "$QA_NODE_HOME/bin/node" ] && [ ! -L "$QA_NODE_HOME/bin/node" ] &&
            [ "$("$QA_NODE_HOME/bin/node" --version 2>/dev/null)" = 'v24.19.0' ]; then
            export PATH="$QA_NODE_HOME/bin:$PATH"
            echo '[destroy-qa] Using the QA-scoped Node v24.19.0 installed by the deploy workflow.'
          fi
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 22 ]; then
            echo "[destroy-qa] ERROR: the teardown helpers need Node.js 22 or newer; the QA-scoped Node is missing and the host has $(node --version)."
            exit 1
          fi

          WORK_DIR=/home/admin/explorerQaWorkspace
          PINNED_BOX_PATH_HASH="$(
            node --input-type=module -e '
              import crypto from "node:crypto";
              import path from "node:path";
              process.stdout.write(
                crypto.createHash("sha256").update(path.resolve(process.argv[1])).digest("hex").slice(0, 12),
              );
            ' "$WORK_DIR"
          )"
          if [ "$PINNED_BOX_PATH_HASH" != '7a31ab7775eb' ]; then
            echo "[destroy-qa] ERROR: Explorer QA workspace hash does not match the pinned identity."
            exit 1
          fi
          if [ -L "$WORK_DIR" ]; then
            echo "[destroy-qa] ERROR: workspace identity path must not be a symlink: $WORK_DIR"
            exit 1
          fi
          if [ -e "$WORK_DIR" ] && [ ! -d "$WORK_DIR" ]; then
            echo "[destroy-qa] ERROR: workspace identity path is not a directory: $WORK_DIR"
            exit 1
          fi

          if [ -L "$HELPERS_DIR" ] || [ ! -d "$HELPERS_DIR" ]; then
            echo "[destroy-qa] ERROR: the teardown helper directory is missing."
            exit 1
          fi
          for helper in qa-teardown.mjs qa-teardown-privileged.mjs quiesce-explorer-qa.mjs; do
            if [ -L "$HELPERS_DIR/$helper" ] || [ ! -f "$HELPERS_DIR/$helper" ]; then
              echo "[destroy-qa] ERROR: teardown helper '$helper' was not transferred."
              exit 1
            fi
          done
          printf '%s  %s\n' "$SHA_TEARDOWN" "$HELPERS_DIR/qa-teardown.mjs" | sha256sum -c - >/dev/null
          printf '%s  %s\n' "$SHA_PRIVILEGED" "$HELPERS_DIR/qa-teardown-privileged.mjs" | sha256sum -c - >/dev/null
          printf '%s  %s\n' "$SHA_QUIESCE" "$HELPERS_DIR/quiesce-explorer-qa.mjs" | sha256sum -c - >/dev/null

          # The log and the step summary of this public repository only ever show these fields. The
          # helpers' own JSON can carry user file names (workspace.keep) and identity checksums.
          summarize() {
            node --input-type=module -e '
              import fs from "node:fs";
              const kind = process.argv[1];
              const lines = fs.readFileSync(0, "utf8").split("\n").filter(Boolean);
              let value = null;
              if (lines.length === 1) {
                try { value = JSON.parse(lines[0]); } catch { value = null; }
              }
              const word = (item) => (typeof item === "string" && /^[A-Za-z0-9_.:-]{1,64}$/.test(item) ? item : null);
              const code = (item) => (typeof item === "string" && /^QA_[A-Z0-9_]{1,80}$/.test(item) ? item : null);
              const hex = (item) => (typeof item === "string" && /^[a-f0-9]{12,64}$/.test(item) ? item : null);
              const digest = (item) => (typeof item === "string" && /^sha256:[a-f0-9]{64}$/.test(item) ? item : null);
              // A name is printed only when it has exactly the form that the teardown itself generates:
              // a backup, one of its sibling files, a pruning tombstone, or a delete-data tombstone.
              // Every other entry of the backup root or of /home/admin is counted, never named.
              const GENERATED_BACKUP = /^(?:redeploy-[A-Za-z0-9]{8}(?:-(?:helpers|lock-ready\.json|lock-released\.json|lock-release|lock\.log|lock-source\.txt|quiesce\.log))?|\.pruning-redeploy-[A-Za-z0-9]{8})$/;
              const GENERATED_DELETING = /^\.(?:explorerQaWorkspace|qa-deployment-state)\.deleting-[0-9]{1,10}$/;
              const sift = (items, pattern) => {
                if (!Array.isArray(items)) return { names: [], other: Number.isSafeInteger(items) ? items : 0 };
                const entries = items.map((item) => (typeof item === "string" ? item : item?.name));
                const named = entries.filter((entry) => typeof entry === "string" && pattern.test(entry));
                return { names: named, other: entries.length - named.length };
              };
              const list = (items) => (Array.isArray(items) ? items : []);
              const ids = (items) => list(items).map((item) => hex(item?.id)).filter(Boolean);
              const count = (items) => (Array.isArray(items) ? items.length : (Number.isSafeInteger(items) ? items : null));
              const backups = (items) => sift(items, GENERATED_BACKUP);
              const deletions = (items) => sift(items, GENERATED_DELETING);
              const retainedBackups = (items) => {
                const entries = list(items);
                const unrecognized = entries.filter((item) => item?.reason === "unrecognized").length;
                const others = entries.filter((item) => item?.reason !== "unrecognized");
                const named = others.filter((item) => typeof item?.name === "string" && GENERATED_BACKUP.test(item.name));
                return {
                  named: named.map((item) => ({ name: item.name, reason: word(item.reason) })),
                  unrecognized,
                  other: others.length - named.length,
                };
              };
              if (kind === "code") {
                process.stdout.write(code(value?.code) || "unknown");
                process.exit(0);
              }
              if (!value || typeof value !== "object") {
                process.stdout.write(JSON.stringify({ unreadable: true }));
                process.exit(0);
              }
              const common = { result: word(value.result), scope: word(value.scope), mode: word(value.mode), phase: word(value.phase), code: code(value.code) };
              const stash = typeof value.stash === "boolean" ? value.stash : word(value.stash);
              let summary;
              if (kind === "plan") {
                summary = {
                  ...common,
                  digest: digest(value.digest),
                  containers: ids(value.containers),
                  volumes: count(value.volumes),
                  images: { remove: ids(value.images?.remove), retained: ids(value.images?.retained) },
                  stash,
                  marker: word(value.marker?.operation),
                  capacitySufficient: typeof value.capacity?.sufficient === "boolean" ? value.capacity.sufficient : null,
                  pendingDeletions: deletions(value.workspace?.pendingDeletions),
                  legacyBackups: {
                    remove: backups(value.legacyBackups?.remove),
                    replayTombstones: backups(value.legacyBackups?.replayTombstones),
                    retained: backups(value.legacyBackups?.retained),
                    retainedSiblings: backups(value.legacyBackups?.retainedSiblings),
                    unrecognized: list(value.legacyBackups?.unrecognized).length,
                  },
                };
              } else {
                summary = {
                  ...common,
                  removedContainers: ids(value.removedContainers),
                  removedImages: ids(value.removedImages),
                  retainedImages: list(value.retainedImages).map((item) => ({ id: hex(item?.id), reason: word(item?.reason) })),
                  removedVolumes: count(value.removedVolumes),
                  quiesce: word(value.quiesce?.result),
                  quiescePreflight: word(value.quiesce?.preflight?.result),
                  stash,
                  marker: word(value.marker?.operation),
                  workspace: { result: word(value.workspace?.result), keepDigest: digest(value.workspace?.keep?.digest) },
                  finishedDeletions: deletions(value.finishedDeletions),
                  legacyBackups: { removed: backups(value.legacyBackups?.removed), replayedTombstones: backups(value.legacyBackups?.replayedTombstones) },
                  retainedBackups: retainedBackups(value.retainedBackups),
                  warnings: count(value.warnings),
                };
              }
              process.stdout.write(JSON.stringify(summary));
            ' "$1"
          }

          SOUL_HEALTH_URL="http://127.0.0.1:${SOUL_PORT}/base-agent-additional-server/soul-gateway/7000/healthz/"
          SOUL_UP_BEFORE=0
          if curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            SOUL_UP_BEFORE=1
            echo "[destroy-qa] Protected Soul Gateway was healthy before destruction."
          fi

          PROTECTED_BEFORE_FILE="$HELPERS_DIR/protected-before.json"
          PROTECTED_AFTER_FILE="$HELPERS_DIR/protected-after.json"
          node "$HELPERS_DIR/qa-teardown.mjs" protected-snapshot < /dev/null > "$PROTECTED_BEFORE_FILE" || {
            echo "[destroy-qa] Snapshot failure code: $(summarize code < "$PROTECTED_BEFORE_FILE")"
            echo "[destroy-qa] ERROR: unable to record the protected host resource identities."
            exit 1
          }
          echo "[destroy-qa] Protected host resource identity sha256=$(sha256sum "$PROTECTED_BEFORE_FILE" | awk '{print $1}')"

          PLAN="$(node "$HELPERS_DIR/qa-teardown.mjs" plan --scope destroy --mode "$TEARDOWN_MODE" --lock-held < /dev/null)" || {
            printf '[destroy-qa] Teardown plan summary: %s\n' "$(printf '%s' "$PLAN" | summarize plan)"
            echo "[destroy-qa] ERROR: the teardown plan was refused; nothing was changed."
            exit 1
          }
          printf '[destroy-qa] Teardown plan summary: %s\n' "$(printf '%s' "$PLAN" | summarize plan)"
          PLAN_DIGEST="$(
            printf '%s' "$PLAN" | node --input-type=module -e '
              import fs from "node:fs";
              const lines = fs.readFileSync(0, "utf8").split("\n").filter(Boolean);
              if (lines.length !== 1) process.exit(1);
              const plan = JSON.parse(lines[0]);
              if (plan?.result !== "planned" || !/^sha256:[a-f0-9]{64}$/.test(String(plan.digest))) process.exit(1);
              process.stdout.write(plan.digest);
            '
          )" || {
            echo "[destroy-qa] ERROR: the teardown plan output is malformed; nothing was changed."
            exit 1
          }

          echo "[destroy-qa] Tearing down the Explorer QA Box (mode $TEARDOWN_MODE, quiesce $QUIESCE_POLICY)."
          EXECUTE_OUT="$(
            node "$HELPERS_DIR/qa-teardown.mjs" execute --scope destroy --mode "$TEARDOWN_MODE" --quiesce "$QUIESCE_POLICY" --plan-digest "$PLAN_DIGEST" --lock-held < /dev/null
          )" || {
            printf '[destroy-qa] Teardown summary: %s\n' "$(printf '%s' "$EXECUTE_OUT" | summarize execute)"
            FAILURE_CODE="$(printf '%s' "$EXECUTE_OUT" | summarize code)"
            case "$FAILURE_CODE" in
              QA_TEARDOWN_QUIESCE_PREFLIGHT_FAILED|QA_TEARDOWN_QUIESCE_FAILED)
                echo "[destroy-qa] ERROR: the nested services could not be quiesced ($FAILURE_CODE). No container was stopped and nothing was deleted; Explorer QA is still up (its nested services may need a restart)."
                echo "[destroy-qa] Options: fix Explorer QA and dispatch the destroy workflow again, dispatch it with delete_data ticked (that skips the quiesce), or run the deploy workflow."
                ;;
              *)
                echo "[destroy-qa] ERROR: the Explorer QA teardown failed ($FAILURE_CODE). Re-run the destroy workflow to finish it."
                ;;
            esac
            exit 1
          }
          printf '[destroy-qa] Teardown summary: %s\n' "$(printf '%s' "$EXECUTE_OUT" | summarize execute)"
          printf '%s' "$EXECUTE_OUT" | node --input-type=module -e '
            import fs from "node:fs";
            const lines = fs.readFileSync(0, "utf8").split("\n").filter(Boolean);
            if (lines.length !== 1 || JSON.parse(lines[0])?.result !== "torn-down") process.exit(1);
          ' || {
            echo "[destroy-qa] ERROR: the teardown receipt is malformed."
            exit 1
          }

          node "$HELPERS_DIR/qa-teardown.mjs" protected-snapshot < /dev/null > "$PROTECTED_AFTER_FILE" || {
            echo "[destroy-qa] Snapshot failure code: $(summarize code < "$PROTECTED_AFTER_FILE")"
            echo "[destroy-qa] ERROR: unable to record the protected host resource identities after teardown."
            exit 1
          }
          if ! cmp -s "$PROTECTED_BEFORE_FILE" "$PROTECTED_AFTER_FILE"; then
            echo "[destroy-qa] ERROR: protected host resources changed during QA teardown."
            exit 1
          fi
          echo "[destroy-qa] Protected host resource identities remained unchanged."

          if [ "$SOUL_UP_BEFORE" = "1" ] && ! curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            echo "[destroy-qa] ERROR: protected Soul Gateway became unhealthy during QA destruction."
            exit 1
          fi
          echo "[destroy-qa] Explorer QA teardown finished (mode $TEARDOWN_MODE)."
          REMOTE
          if [ "$status" -eq 75 ]; then
            echo "::error::Another Explorer QA deployment operation holds the host lock; nothing was changed. Dispatch the destroy workflow again when it finishes."
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Delete the dedicated Cloudflare publication
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          echo "Removing only the exact dedicated Explorer QA Cloudflare publication..."
          node --input-type=module <<'NODE'
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || '');
          const tunnelName = String(process.env.CLOUDFLARE_TUNNEL_NAME || '');
          const publicHost = String(process.env.PUBLIC_HOST || '');
          const apiToken = String(process.env.CLOUDFLARE_API_TOKEN || '');
          const protectedTunnelId = String(process.env.CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID || '');
          if (!/^[a-f0-9]{32}$/.test(accountId) || !/^[a-f0-9]{32}$/.test(zoneId)
            || tunnelName !== 'explorer-qa' || publicHost !== 'explorer-qa.axiologic.dev'
            || !apiToken) {
            throw new Error('exact Explorer QA Cloudflare identity is not pinned');
          }
          if (protectedTunnelId !== '091c4096-d1c8-4dbc-bb12-0c6357431d96') {
            throw new Error('the protected shared Cloudflare tunnel identity is not pinned');
          }
          const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const request = async (pathname, { method = 'GET' } = {}) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              method,
              headers: { Authorization: `Bearer ${apiToken}` },
              redirect: 'error',
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              const codes = Array.isArray(payload?.errors)
                ? payload.errors.map((entry) => String(entry?.code || 'unknown')).join(',')
                : 'unknown';
              throw new Error(`Cloudflare ${method} ${pathname.split('?')[0]} failed (${codes})`);
            }
            return payload.result;
          };
          const listTunnels = () => request(
            `/accounts/${accountId}/cfd_tunnel?${new URLSearchParams({
              name: tunnelName,
              is_deleted: 'false',
              per_page: '100',
            })}`,
          );
          const listRecords = () => request(
            `/zones/${zoneId}/dns_records?${new URLSearchParams({
              name: publicHost,
              per_page: '100',
            })}`,
          );
          const tunnels = await listTunnels();
          const records = await listRecords();
          if (!Array.isArray(tunnels) || tunnels.length > 1
            || !Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA Cloudflare inventory is ambiguous');
          }
          if (tunnels.length === 0) {
            if (records.length !== 0) {
              throw new Error('Explorer QA DNS exists without its exact dedicated tunnel');
            }
            process.stdout.write('Exact Explorer QA Cloudflare publication was already absent.\n');
            process.exit(0);
          }
          const tunnel = tunnels[0];
          const tunnelId = String(tunnel?.id || '');
          if (!/^[a-f0-9-]{36}$/.test(tunnelId) || tunnel?.name !== tunnelName
            || tunnel?.deleted_at != null
            || (tunnel?.account_tag != null && tunnel.account_tag !== accountId)) {
            throw new Error('Explorer QA dedicated tunnel identity changed');
          }
          if (tunnelId === protectedTunnelId) {
            throw new Error('refusing to delete the protected shared Cloudflare tunnel');
          }
          const detail = await request(`/accounts/${accountId}/cfd_tunnel/${tunnelId}`);
          const configuration = await request(
            `/accounts/${accountId}/cfd_tunnel/${tunnelId}/configurations`,
          );
          if (detail?.id !== tunnelId || detail?.name !== tunnelName || detail?.deleted_at != null) {
            throw new Error('Explorer QA dedicated tunnel detail changed');
          }
          const ingress = configuration?.config?.ingress ?? configuration?.ingress ?? [];
          if (!Array.isArray(ingress) || ingress.length > 2) {
            throw new Error('Explorer QA dedicated tunnel contains shared or ambiguous ingress');
          }
          if (ingress.length) {
            const catchAll = ingress.at(-1);
            if (catchAll?.hostname != null || catchAll?.service !== 'http_status:404') {
              throw new Error('Explorer QA dedicated tunnel lacks its terminal 404 ingress');
            }
          }
          if (ingress.length === 2
            && (ingress[0]?.hostname !== publicHost
              || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
            throw new Error('Explorer QA dedicated tunnel contains an unrelated route');
          }
          const expectedTarget = `${tunnelId}.cfargotunnel.com`;
          if (records.length === 1 && (records[0]?.name !== publicHost
            || records[0]?.type !== 'CNAME' || records[0]?.content !== expectedTarget
            || records[0]?.proxied !== true || !/^[a-f0-9]{32}$/.test(String(records[0]?.id || '')))) {
            throw new Error('Explorer QA DNS points outside the exact dedicated tunnel');
          }
          if (records.length === 1) {
            await request(`/zones/${zoneId}/dns_records/${records[0].id}`, { method: 'DELETE' });
          }
          await request(
            `/accounts/${accountId}/cfd_tunnel/${tunnelId}/connections`,
            { method: 'DELETE' },
          );
          await request(`/accounts/${accountId}/cfd_tunnel/${tunnelId}`, { method: 'DELETE' });
          for (let attempt = 0; attempt < 15; attempt += 1) {
            const [remainingTunnels, remainingRecords] = await Promise.all([listTunnels(), listRecords()]);
            if (Array.isArray(remainingTunnels) && remainingTunnels.length === 0
              && Array.isArray(remainingRecords) && remainingRecords.length === 0) {
              process.stdout.write('Exact Explorer QA Cloudflare publication deletion verified.\n');
              process.exit(0);
            }
            await wait(2000);
          }
          throw new Error('Explorer QA Cloudflare publication deletion did not verify');
          NODE

      - name: Create summary
        if: success()
        run: |
          {
            echo "## Explorer QA Box Destroy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Identity directory: \`~/${WORKSPACE}\`"
            if [ "$DELETE_DATA" = 'true' ]; then
              echo "- Mode: delete data (the whole QA workspace and its state were removed)"
            else
              echo "- Mode: keep data (the documents, \`.data\` and the encryption identity stay for the next deploy)"
            fi
            if [ "$DELETE_DATA" != 'true' ]; then
              echo "- Router access policy: parked for the next deploy, which restores it"
            fi
            echo "- Outer Box and QA containers: removed when present"
            echo "- QA Box image: removed when present; retained when another container still uses it or when it is not the QA image"
            echo "- Legacy QA backups: removed when recognised as complete"
            echo "- Dedicated Cloudflare route, DNS record and managed tunnel: removed"
            echo "- Unrelated Cloudflare tunnels and routes: preserved"
            echo "- Public hostname: \`${PUBLIC_HOST}\`"
            # Only the sanitized summary line is copied; the helpers' raw receipts are never logged.
            if grep -q '^\[destroy-qa\] Teardown summary: ' "$RUNNER_TEMP/explorer-qa-destroy.log" 2>/dev/null; then
              echo ""
              echo "### Teardown receipt (safe fields only)"
              echo ""
              echo '```json'
              sed -n 's/^\[destroy-qa\] Teardown summary: //p' "$RUNNER_TEMP/explorer-qa-destroy.log" | tail -n 1
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            ~/.ssh/deploy_key \
            ~/.ssh/explorer_qa_known_hosts
