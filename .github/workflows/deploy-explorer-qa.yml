name: Deploy Explorer QA Box

on:
  workflow_dispatch:

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: 'admin'
  SSH_HOST: '45.136.70.141'
  SSH_ED25519_FINGERPRINT: 'SHA256:pcVG+7QFbfi3Ojn3LeveNutqCWaTOIlgek1o3GKD/KA'
  WORKSPACE: 'explorerQaWorkspace'
  ROUTER_PORT: '8097'
  PUBLIC_HOST: 'explorer-qa.axiologic.dev'
  PUBLIC_URL: 'https://explorer-qa.axiologic.dev'
  CLOUDFLARE_TUNNEL_NAME: 'explorer-qa'
  CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID: '091c4096-d1c8-4dbc-bb12-0c6357431d96'
  CLOUDFLARE_TUNNEL_SECRET_HANDLE: 'publication/explorer-qa-tunnel'
  CLOUDFLARE_API_SECRET_HANDLE: 'publication/explorer-qa-api'
  MEDIA_PUBLIC_IPV4: '45.136.70.141'
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  deploy:
    name: Deploy Explorer QA through Ploinky Box
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          if [ "$SSH_HOST" != '45.136.70.141' ] || [ "$SSH_USER" != 'admin' ] ||
            [ "$WORKSPACE" != 'explorerQaWorkspace' ]; then
            echo "::error::Explorer QA target identity is not the pinned admin@45.136.70.141/explorerQaWorkspace target"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "::error::EXPLORER_QA_CLOUDFLARE_API_TOKEN is a Global API Key; Ploinky requires a scoped Account or User API Token used as a Bearer token"
            exit 1
          fi
          if [[ ! "$PLOINKY_MASTER_KEY" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::EXPLORER_QA_PLOINKY_MASTER_KEY must be exactly 64 hex characters"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Explorer QA Cloudflare account or zone variables are missing or malformed"
            exit 1
          fi
          if [ "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" != '091c4096-d1c8-4dbc-bb12-0c6357431d96' ]; then
            echo "::error::Protected shared tunnel identity is not pinned"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "::error::Explorer QA managed Cloudflare tunnel name is malformed"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "$SOUL_GATEWAY_WORKSPACE" ]; then
            echo "::error::Refusing to deploy into the production Soul Gateway workspace"
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "::error::Invalid router port '${ROUTER_PORT:-}'"
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "::error::Router port must be between 1 and 65535"
            exit 1
          fi
          case "$ROUTER_PORT" in
            8042|8043|8080|8085|8317|8318)
              echo "::error::Refusing to use protected proxies-host port ${ROUTER_PORT}"
              exit 1
              ;;
          esac
          if [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "::error::PUBLIC_URL and PUBLIC_HOST must identify the fixed Explorer QA hostname"
            exit 1
          fi
          TUNNEL_LIST_RESPONSE="$(mktemp /tmp/explorer_qa_tunnel_list.XXXXXX)"
          DNS_RESPONSE="$(mktemp /tmp/explorer_qa_dns.XXXXXX)"
          SHARED_TUNNEL_RESPONSE="$(mktemp /tmp/explorer_qa_shared_tunnel.XXXXXX)"
          SHARED_CONFIG_RESPONSE="$(mktemp /tmp/explorer_qa_shared_config.XXXXXX)"
          trap 'rm -f "$TUNNEL_LIST_RESPONSE" "$DNS_RESPONSE" "$SHARED_TUNNEL_RESPONSE" "$SHARED_CONFIG_RESPONSE"' EXIT
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode "name=$PUBLIC_HOST" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
            > "$DNS_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" \
            > "$SHARED_TUNNEL_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID/configurations" \
            > "$SHARED_CONFIG_RESPONSE"

          node --input-type=module - \
            "$TUNNEL_LIST_RESPONSE" \
            "$DNS_RESPONSE" \
            "$SHARED_TUNNEL_RESPONSE" \
            "$SHARED_CONFIG_RESPONSE" \
            "$RUNNER_TEMP/explorer_qa_protected_cloudflare_before.json" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const [listPath, dnsPath, sharedTunnelPath, sharedConfigPath, snapshotPath] = process.argv.slice(2);
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const tunnelName = String(process.env.CLOUDFLARE_TUNNEL_NAME || '');
          const sharedTunnelId = String(process.env.CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID || '');
          const publicHost = String(process.env.PUBLIC_HOST || '');
          const parse = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const requireSuccess = (payload, label) => {
            if (payload?.success !== true) throw new Error(`${label} inventory failed`);
            return payload.result;
          };
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value)
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([key, child]) => [key, stable(child)]));
          };
          const digest = (value) => `sha256:${crypto.createHash('sha256')
            .update(JSON.stringify(stable(value))).digest('hex')}`;
          const api = async (pathname) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              redirect: 'error',
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) throw new Error('protected Cloudflare inventory failed');
            return payload.result;
          };

          const named = requireSuccess(parse(listPath), 'named tunnel');
          if (!Array.isArray(named) || named.length > 1
            || named.some((entry) => entry?.id === sharedTunnelId)) {
            throw new Error('active explorer-qa tunnel inventory is ambiguous or aliases the protected shared tunnel');
          }
          const records = requireSuccess(parse(dnsPath), 'Explorer QA DNS');
          if (!Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA DNS is ambiguous or points outside the selected tunnel');
          }
          if (named.length === 0 && records.length !== 0) {
            throw new Error('Explorer QA DNS exists without the authorized dedicated tunnel');
          }
          if (named.length === 1) {
            const tunnelId = String(named[0]?.id || '');
            if (!/^[a-f0-9-]{36}$/.test(tunnelId) || named[0]?.name !== tunnelName
              || named[0]?.deleted_at != null
              || (named[0]?.account_tag != null && named[0]?.account_tag !== accountId)) {
              throw new Error('selected dedicated Explorer QA tunnel identity is invalid');
            }
            const detail = await api(`/accounts/${accountId}/cfd_tunnel/${tunnelId}`);
            const config = await api(`/accounts/${accountId}/cfd_tunnel/${tunnelId}/configurations`);
            if (detail?.id !== tunnelId || detail?.name !== tunnelName || detail?.deleted_at != null) {
              throw new Error('dedicated Explorer QA tunnel detail changed during inventory');
            }
            const ingress = config?.config?.ingress ?? config?.ingress ?? [];
            if (!Array.isArray(ingress) || ingress.length > 2) {
              throw new Error('dedicated Explorer QA tunnel is shared or has ambiguous ingress');
            }
            if (ingress.length) {
              const catchAll = ingress.at(-1);
              if (catchAll?.hostname != null || catchAll?.service !== 'http_status:404') {
                throw new Error('dedicated Explorer QA tunnel lacks the terminal 404 ingress');
              }
            }
            if (ingress.length === 2
              && (ingress[0]?.hostname !== publicHost
                || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
              throw new Error('dedicated Explorer QA tunnel contains unrelated or incorrect ingress');
            }
            const expectedTarget = `${tunnelId}.cfargotunnel.com`;
            if (records.length === 1 && (records[0]?.name !== publicHost
              || records[0]?.type !== 'CNAME'
              || records[0]?.content !== expectedTarget
              || records[0]?.proxied !== true)) {
              throw new Error('Explorer QA DNS points outside the dedicated tunnel');
            }
          }

          const sharedDetail = requireSuccess(parse(sharedTunnelPath), 'protected shared tunnel detail');
          const sharedConfig = requireSuccess(parse(sharedConfigPath), 'protected shared tunnel configuration');
          if (sharedDetail?.id !== sharedTunnelId || sharedDetail?.name !== 'proxies'
            || sharedDetail?.deleted_at != null
            || (sharedDetail?.account_tag != null && sharedDetail.account_tag !== accountId)) {
            throw new Error('protected proxies tunnel identity changed');
          }
          const sharedIngress = sharedConfig?.config?.ingress;
          const expectedIngress = [
            ['antigravity.axiologic.dev', 'http://localhost:8001'],
            ['proxy.axiologic.dev', 'http://localhost:8318'],
            ['soul.axiologic.dev', 'http://localhost:8042'],
            ['search.axiologic.dev', 'http://localhost:8043'],
            ['kiro.axiologic.dev', 'http://localhost:8000'],
            ['explorer-qa.axiologic.dev', 'http://localhost:8097'],
            ['office-qa.axiologic.dev', 'http://localhost:8082'],
          ];
          if (!Array.isArray(sharedIngress) || sharedIngress.length !== 8
            || expectedIngress.some(([hostname, service], index) => (
              sharedIngress[index]?.hostname !== hostname || sharedIngress[index]?.service !== service
            ))
            || sharedIngress.at(-1)?.hostname != null
            || sharedIngress.at(-1)?.service !== 'http_status:404') {
            throw new Error('protected proxies ingress topology is not the authorized immutable baseline');
          }
          const protectedDns = [];
          for (let page = 1; ; page += 1) {
            if (page > 100) throw new Error('protected DNS inventory exceeded the fail-closed page bound');
            const query = new URLSearchParams({ page: String(page), per_page: '100' });
            const result = await api(`/zones/${process.env.CLOUDFLARE_ZONE_ID}/dns_records?${query}`);
            if (!Array.isArray(result)) throw new Error('protected DNS inventory is malformed');
            protectedDns.push(...result.filter((record) => record?.name !== publicHost));
            if (result.length < 100) break;
          }
          protectedDns.sort((left, right) => String(left?.id || '').localeCompare(String(right?.id || '')));
          const snapshot = {
            tunnel: { id: sharedDetail.id, name: sharedDetail.name, accountTag: sharedDetail.account_tag || accountId },
            ingress: sharedIngress,
            dns: protectedDns,
          };
          fs.writeFileSync(snapshotPath, `${JSON.stringify(stable(snapshot))}\n`, { mode: 0o600, flag: 'wx' });
          const protectedDigest = digest(snapshot);
          fs.appendFileSync(process.env.GITHUB_ENV, `PROTECTED_CLOUDFLARE_DIGEST=${protectedDigest}\n`);
          console.log(`Validated protected proxies topology ${protectedDigest} and a safe dedicated Explorer QA tunnel slot.`);
          NODE

          HOST_KEY_CANDIDATE="$RUNNER_TEMP/explorer_qa_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOST_KEY_CANDIDATE"
          HOST_KEY_FINGERPRINT="$({ ssh-keygen -lf "$HOST_KEY_CANDIDATE" -E sha256 || true; } | awk '{print $2}' | sort -u)"
          if [ "$HOST_KEY_FINGERPRINT" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::Explorer QA ED25519 host fingerprint did not match the pinned identity"
            exit 1
          fi
          chmod 600 "$HOST_KEY_CANDIDATE"
          echo "Validated the pinned Explorer QA SSH host identity."

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 "$RUNNER_TEMP/explorer_qa_known_hosts" ~/.ssh/explorer_qa_known_hosts

      - name: Reconcile and start Explorer QA Box
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          umask 077

          TUNNEL_LIST_RESPONSE=''
          TUNNEL_MUTATION_RESPONSE=''
          TUNNEL_TOKEN_RESPONSE=''
          TUNNEL_DETAIL_RESPONSE=''
          TUNNEL_CONFIG_RESPONSE=''
          TUNNEL_DNS_RESPONSE=''
          LOCAL_ENV_FILE=''
          REMOTE_ENV_FILE=''
          REMOTE_ENV_UPLOADED='false'
          cleanup_local_files() {
            for target in \
              "$TUNNEL_LIST_RESPONSE" \
              "$TUNNEL_MUTATION_RESPONSE" \
              "$TUNNEL_TOKEN_RESPONSE" \
              "$TUNNEL_DETAIL_RESPONSE" \
              "$TUNNEL_CONFIG_RESPONSE" \
              "$TUNNEL_DNS_RESPONSE" \
              "$LOCAL_ENV_FILE"; do
              if [ -n "$target" ]; then rm -f "$target"; fi
            done
            if [ "$REMOTE_ENV_UPLOADED" = 'true' ]; then
              case "$REMOTE_ENV_FILE" in
                /tmp/explorer_qa_deploy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9])
                  ssh \
                    -i ~/.ssh/deploy_key \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
                    "${SSH_USER}@${SSH_HOST}" \
                    "rm -f -- '$REMOTE_ENV_FILE'" >/dev/null 2>&1 || true
                  ;;
              esac
            fi
          }
          trap cleanup_local_files EXIT

          TUNNEL_LIST_RESPONSE="$(mktemp /tmp/explorer_qa_provision_list.XXXXXX)"
          TUNNEL_MUTATION_RESPONSE="$(mktemp /tmp/explorer_qa_provision_mutation.XXXXXX)"
          TUNNEL_TOKEN_RESPONSE="$(mktemp /tmp/explorer_qa_provision_token.XXXXXX)"
          TUNNEL_DETAIL_RESPONSE="$(mktemp /tmp/explorer_qa_provision_detail.XXXXXX)"
          TUNNEL_CONFIG_RESPONSE="$(mktemp /tmp/explorer_qa_provision_config.XXXXXX)"
          TUNNEL_DNS_RESPONSE="$(mktemp /tmp/explorer_qa_provision_dns.XXXXXX)"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          CLOUDFLARE_TUNNEL_ID="$(
            node --input-type=module - "$TUNNEL_LIST_RESPONSE" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tunnels = payload?.success === true ? payload.result : null;
          if (!Array.isArray(tunnels) || tunnels.length > 1) {
            throw new Error('dedicated Explorer QA tunnel inventory is ambiguous');
          }
          process.stdout.write(String(tunnels[0]?.id || ''));
          NODE
          )"
          CLOUDFLARE_TUNNEL_CREATED='false'
          if [ -z "$CLOUDFLARE_TUNNEL_ID" ]; then
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"name":"explorer-qa","config_src":"cloudflare"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
              > "$TUNNEL_MUTATION_RESPONSE"
            CLOUDFLARE_TUNNEL_ID="$(
              node --input-type=module - "$TUNNEL_MUTATION_RESPONSE" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tunnel = payload?.success === true ? payload.result : null;
          if (!tunnel || tunnel.name !== 'explorer-qa' || tunnel.deleted_at != null) {
            throw new Error('Cloudflare did not create the exact dedicated Explorer QA tunnel');
          }
          process.stdout.write(String(tunnel.id || ''));
          NODE
            )"
            CLOUDFLARE_TUNNEL_CREATED='true'
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_ID" =~ ^[a-f0-9-]{36}$ ]] ||
            [ "$CLOUDFLARE_TUNNEL_ID" = "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" ]; then
            echo "::error::Dedicated Explorer QA tunnel identity is malformed or aliases the protected shared tunnel"
            exit 1
          fi
          export CLOUDFLARE_TUNNEL_ID CLOUDFLARE_TUNNEL_CREATED
          {
            printf 'CLOUDFLARE_TUNNEL_ID=%s\n' "$CLOUDFLARE_TUNNEL_ID"
            printf 'CLOUDFLARE_TUNNEL_CREATED=%s\n' "$CLOUDFLARE_TUNNEL_CREATED"
          } >> "$GITHUB_ENV"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID" \
            > "$TUNNEL_DETAIL_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/configurations" \
            > "$TUNNEL_CONFIG_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode "name=$PUBLIC_HOST" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
            > "$TUNNEL_DNS_RESPONSE"
          node --input-type=module - \
            "$TUNNEL_LIST_RESPONSE" \
            "$TUNNEL_DETAIL_RESPONSE" \
            "$TUNNEL_CONFIG_RESPONSE" \
            "$TUNNEL_DNS_RESPONSE" \
            "$CLOUDFLARE_TUNNEL_ID" \
            "$CLOUDFLARE_TUNNEL_CREATED" <<'NODE'
          import fs from 'node:fs';

          const [listPath, detailPath, configPath, dnsPath, selectedId, created] = process.argv.slice(2);
          const parseResult = (file, label) => {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (payload?.success !== true) throw new Error(`${label} inventory failed`);
            return payload.result;
          };
          const named = parseResult(listPath, 'dedicated tunnel list');
          const detail = parseResult(detailPath, 'dedicated tunnel detail');
          const config = parseResult(configPath, 'dedicated tunnel configuration');
          const records = parseResult(dnsPath, 'dedicated tunnel DNS');
          if (!Array.isArray(named) || named.length !== 1 || named[0]?.id !== selectedId
            || detail?.id !== selectedId || detail?.name !== 'explorer-qa'
            || detail?.deleted_at != null
            || (detail?.account_tag != null && detail.account_tag !== process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error('dedicated Explorer QA tunnel create/reuse did not converge to one exact identity');
          }
          const ingress = config?.config?.ingress ?? config?.ingress ?? [];
          if (!Array.isArray(ingress) || ingress.length > 2) {
            throw new Error('dedicated Explorer QA tunnel has shared or ambiguous ingress');
          }
          if (ingress.length) {
            if (ingress.at(-1)?.hostname != null || ingress.at(-1)?.service !== 'http_status:404') {
              throw new Error('dedicated Explorer QA tunnel lacks the terminal 404 ingress');
            }
          }
          if (ingress.length === 2
            && (ingress[0]?.hostname !== process.env.PUBLIC_HOST
              || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
            throw new Error('dedicated Explorer QA tunnel contains an unrelated route');
          }
          if (!Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA DNS is ambiguous');
          }
          const expectedTarget = `${selectedId}.cfargotunnel.com`;
          if (records.length === 1 && (records[0]?.type !== 'CNAME'
            || records[0]?.name !== process.env.PUBLIC_HOST
            || records[0]?.content !== expectedTarget
            || records[0]?.proxied !== true)) {
            throw new Error('Explorer QA DNS does not target the selected dedicated tunnel');
          }
          if (created === 'true' && (ingress.length > 1 || records.length !== 0)) {
            throw new Error('new dedicated tunnel was not empty at its create/reuse boundary');
          }
          NODE
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/token" \
            > "$TUNNEL_TOKEN_RESPONSE"
          CLOUDFLARE_TUNNEL_TOKEN="$(
            node --input-type=module - "$TUNNEL_TOKEN_RESPONSE" "$CLOUDFLARE_TUNNEL_ID" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedTunnel = process.argv[3];
          const token = payload?.success === true ? String(payload.result || '').trim() : '';
          if (!token) throw new Error('Cloudflare returned no dedicated connector credential');
          let claims = null;
          for (const candidate of [token, ...token.split('.')]) {
            try {
              const decoded = JSON.parse(Buffer.from(candidate, 'base64url').toString('utf8'));
              const account = String(decoded?.a || decoded?.accountId || '');
              const tunnel = String(decoded?.t || decoded?.tunnelId || '');
              if (account && tunnel) { claims = { account, tunnel }; break; }
            } catch { }
          }
          if (!claims || claims.account !== process.env.CLOUDFLARE_ACCOUNT_ID
            || claims.tunnel !== expectedTunnel) {
            throw new Error('connector token claims do not match the dedicated Explorer QA tunnel/account');
          }
          process.stdout.write(token);
          NODE
          )"
          if [ "$CLOUDFLARE_TUNNEL_TOKEN" = "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare management and connector authorities must be separate credentials"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_TUNNEL_TOKEN"
          export CLOUDFLARE_TUNNEL_TOKEN
          rm -f \
            "$TUNNEL_LIST_RESPONSE" \
            "$TUNNEL_MUTATION_RESPONSE" \
            "$TUNNEL_TOKEN_RESPONSE" \
            "$TUNNEL_DETAIL_RESPONSE" \
            "$TUNNEL_CONFIG_RESPONSE" \
            "$TUNNEL_DNS_RESPONSE"
          TUNNEL_LIST_RESPONSE=''
          TUNNEL_MUTATION_RESPONSE=''
          TUNNEL_TOKEN_RESPONSE=''
          TUNNEL_DETAIL_RESPONSE=''
          TUNNEL_CONFIG_RESPONSE=''
          TUNNEL_DNS_RESPONSE=''
          echo "[deploy-qa] Dedicated Explorer QA tunnel id=$CLOUDFLARE_TUNNEL_ID created=$CLOUDFLARE_TUNNEL_CREATED."

          write_shell_var() {
            local name="$1"
            local value="${!name:-}"
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          LOCAL_ENV_FILE="$(mktemp /tmp/explorer_qa_deploy.XXXXXX)"
          REMOTE_ENV_FILE="/tmp/$(basename "$LOCAL_ENV_FILE")"
          {
            write_shell_var WORKSPACE
            write_shell_var ROUTER_PORT
            write_shell_var PUBLIC_HOST
            write_shell_var PUBLIC_URL
            write_shell_var CLOUDFLARE_TUNNEL_NAME
            write_shell_var CLOUDFLARE_TUNNEL_ID
            write_shell_var CLOUDFLARE_TUNNEL_SECRET_HANDLE
            write_shell_var CLOUDFLARE_API_SECRET_HANDLE
            write_shell_var CLOUDFLARE_API_TOKEN
            write_shell_var CLOUDFLARE_TUNNEL_TOKEN
            write_shell_var CLOUDFLARE_ACCOUNT_ID
            write_shell_var CLOUDFLARE_ZONE_ID
            write_shell_var MEDIA_PUBLIC_IPV4
            write_shell_var PLOINKY_MASTER_KEY
            write_shell_var SOUL_GATEWAY_WORKSPACE
            write_shell_var SOUL_GATEWAY_ROUTER_PORT
          } > "$LOCAL_ENV_FILE"

          REMOTE_ENV_UPLOADED='true'
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            "$LOCAL_ENV_FILE" \
            "${SSH_USER}@${SSH_HOST}:$REMOTE_ENV_FILE"
          rm -f "$LOCAL_ENV_FILE"
          LOCAL_ENV_FILE=''

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- '$REMOTE_ENV_FILE'" <<'REMOTE'
          set -euo pipefail
          REMOTE_ENV_FILE="${1:-}"
          CLOUDFLARE_CREDENTIAL_FILE=""
          PROTECTED_BEFORE_FILE=""
          PROTECTED_AFTER_FILE=""
          cleanup_remote_files() {
            rm -f "$REMOTE_ENV_FILE"
            if [ -n "$CLOUDFLARE_CREDENTIAL_FILE" ]; then
              rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
            fi
            if [ -n "$PROTECTED_BEFORE_FILE" ]; then
              rm -f "$PROTECTED_BEFORE_FILE"
            fi
            if [ -n "$PROTECTED_AFTER_FILE" ]; then
              rm -f "$PROTECTED_AFTER_FILE"
            fi
          }
          case "$REMOTE_ENV_FILE" in
            /tmp/explorer_qa_deploy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *)
              echo "[deploy-qa] ERROR: invalid deployment configuration path."
              exit 1
              ;;
          esac
          trap cleanup_remote_files EXIT

          if [ ! -f "$REMOTE_ENV_FILE" ] || [ -L "$REMOTE_ENV_FILE" ]; then
            echo "[deploy-qa] ERROR: deployment configuration was not transferred."
            exit 1
          fi
          set -a
          . "$REMOTE_ENV_FILE"
          set +a
          rm -f "$REMOTE_ENV_FILE"

          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "[deploy-qa] ERROR: invalid workspace name '${WORKSPACE:-}'."
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "${SOUL_GATEWAY_WORKSPACE:-soulGateway}" ]; then
            echo "[deploy-qa] ERROR: refusing to operate on the production Soul Gateway workspace."
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "[deploy-qa] ERROR: invalid router port '${ROUTER_PORT:-}'."
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "[deploy-qa] ERROR: router port must be between 1 and 65535."
            exit 1
          fi
          case "$ROUTER_PORT" in
            8042|8043|8080|8085|8317|8318)
              echo "[deploy-qa] ERROR: refusing to use protected proxies-host port $ROUTER_PORT."
              exit 1
              ;;
          esac
          if [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "[deploy-qa] ERROR: public URL and hostname do not identify Explorer QA."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "[deploy-qa] ERROR: a scoped Cloudflare API token is required."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "[deploy-qa] ERROR: the configured Cloudflare credential is a Global API Key, not a scoped Bearer API Token."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "[deploy-qa] ERROR: Cloudflare account or zone identifiers are malformed."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "[deploy-qa] ERROR: the authorized existing Cloudflare tunnel ID is malformed."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo "[deploy-qa] ERROR: the authorized existing Cloudflare tunnel token is required."
            exit 1
          fi
          if [[ ! "$PLOINKY_MASTER_KEY" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "[deploy-qa] ERROR: the QA Ploinky master key is malformed."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "[deploy-qa] ERROR: managed Cloudflare tunnel name is malformed."
            exit 1
          fi

          for tool in git node curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[deploy-qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          if ! command -v podman >/dev/null 2>&1 && ! command -v docker >/dev/null 2>&1; then
            echo "[deploy-qa] ERROR: neither Podman nor Docker is installed."
            exit 1
          fi

          WORK_DIR="$HOME/$WORKSPACE"
          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ] ||
            [ "$WORK_DIR" != '/home/admin/explorerQaWorkspace' ]; then
            echo "[deploy-qa] ERROR: remote Explorer QA identity is not the pinned admin workspace."
            exit 1
          fi
          BOX_PATH_HASH="$(
            node --input-type=module -e '
              import crypto from "node:crypto";
              import path from "node:path";
              process.stdout.write(
                crypto.createHash("sha256").update(path.resolve(process.argv[1])).digest("hex").slice(0, 12),
              );
            ' "$WORK_DIR"
          )"
          if [ "$BOX_PATH_HASH" != '7a31ab7775eb' ]; then
            echo "[deploy-qa] ERROR: Explorer QA workspace hash does not match the pinned identity."
            exit 1
          fi
          BOX_INSTANCE="ploinky-box-explorerqaworkspace-$BOX_PATH_HASH"
          if [ -L "$WORK_DIR" ]; then
            echo "[deploy-qa] ERROR: workspace identity path must not be a symlink: $WORK_DIR"
            exit 1
          fi
          if [ -L "$WORK_DIR/.ploinky" ]; then
            echo "[deploy-qa] ERROR: workspace authority directory must not be a symlink: $WORK_DIR/.ploinky"
            exit 1
          fi

          snapshot_protected_resources() {
            local target="$1"
            node --input-type=module - "$BOX_PATH_HASH" "$BOX_INSTANCE" <<'NODE' > "$target"
          import { execFileSync } from 'node:child_process';

          const [qaHash, qaName] = process.argv.slice(2);
          const run = (engine, args) => execFileSync(engine, args, { encoding: 'utf8' }).trim();
          const engines = ['podman', 'docker'].filter((engine) => {
            try { run('sh', ['-lc', `command -v ${engine}`]); return true; } catch { return false; }
          });
          const protectedState = [];
          for (const engine of engines) {
            const containerIds = run(engine, ['container', 'ls', '-aq']).split('\n').filter(Boolean);
            for (const id of containerIds) {
              const item = JSON.parse(run(engine, ['container', 'inspect', id]))[0];
              const labels = item?.Config?.Labels || item?.Labels || {};
              const name = String(item?.Name || '').replace(/^\//, '');
              if (labels['io.assistos.ploinky-box.path-hash'] === qaHash || name === qaName) continue;
              protectedState.push({
                engine,
                kind: 'container',
                id: item.Id,
                name,
                image: item.Image,
                labels: Object.fromEntries(Object.entries(labels).sort()),
              });
            }
            const volumeNames = run(engine, ['volume', 'ls', '-q']).split('\n').filter(Boolean);
            for (const name of volumeNames) {
              const item = JSON.parse(run(engine, ['volume', 'inspect', name]))[0];
              const labels = item?.Labels || {};
              if (labels['io.assistos.ploinky-box.path-hash'] === qaHash
                || name.startsWith(`${qaName}-`)) continue;
              protectedState.push({
                engine,
                kind: 'volume',
                name,
                labels: Object.fromEntries(Object.entries(labels).sort()),
              });
            }
          }
          protectedState.sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
          process.stdout.write(`${JSON.stringify(protectedState)}\n`);
          NODE
          }

          PROTECTED_BEFORE_FILE="$(mktemp /tmp/explorer_qa_protected_before.XXXXXX)"
          PROTECTED_AFTER_FILE="$(mktemp /tmp/explorer_qa_protected_after.XXXXXX)"
          snapshot_protected_resources "$PROTECTED_BEFORE_FILE"
          echo "[deploy-qa] Protected host resource identity sha256=$(sha256sum "$PROTECTED_BEFORE_FILE" | awk '{print $1}')"

          canonicalize_container_candidates() {
            local engine="$1"
            local candidate
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              "$engine" container inspect "$candidate" --format '{{.Id}}'
            done
          }

          declare -a QA_CONTAINER_RECORDS=()
          declare -a QA_VOLUME_RECORDS=()
          QA_VOLUME_ROLES=(workspace containers ploinky-deps)
          for engine in podman docker; do
            command -v "$engine" >/dev/null 2>&1 || continue
            while IFS= read -r container_id; do
              [ -n "$container_id" ] || continue
              container_name="$($engine container inspect "$container_id" --format '{{.Name}}' | sed 's#^/##')"
              container_hash="$($engine container inspect "$container_id" --format '{{ index .Config.Labels "io.assistos.ploinky-box.path-hash" }}')"
              container_role="$($engine container inspect "$container_id" --format '{{ index .Config.Labels "io.assistos.ploinky-box.role" }}')"
              if [ "$container_hash" != "$BOX_PATH_HASH" ] || [ "$container_role" != 'box' ] ||
                [ "$container_name" != "$BOX_INSTANCE" ]; then
                echo "[deploy-qa] ERROR: exact QA Box identity has conflicting ownership labels."
                exit 1
              fi
              QA_CONTAINER_RECORDS+=("$engine|$container_id|$container_name")
              echo "[deploy-qa] Rollback Box: engine=$engine id=$container_id name=$container_name pathHash=$container_hash role=$container_role"
              "$engine" container exec "$container_id" sh -lc '
                for nested_engine in podman docker; do
                  command -v "$nested_engine" >/dev/null 2>&1 || continue
                  "$nested_engine" container ls -a --format "[deploy-qa] Rollback nested container: id={{.ID}} name={{.Names}} image={{.Image}} status={{.Status}} labels={{.Labels}}"
                  "$nested_engine" volume ls --format "[deploy-qa] Rollback nested volume: name={{.Name}} labels={{.Labels}}"
                done
              '
            done < <(
              {
                "$engine" container ls -aq --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH"
                if "$engine" container inspect "$BOX_INSTANCE" >/dev/null 2>&1; then
                  "$engine" container inspect "$BOX_INSTANCE" --format '{{.Id}}'
                fi
              } | canonicalize_container_candidates "$engine" | sort -u
            )

            while IFS= read -r volume_name; do
              [ -n "$volume_name" ] || continue
              volume_hash="$($engine volume inspect "$volume_name" --format '{{ index .Labels "io.assistos.ploinky-box.path-hash" }}')"
              volume_role="$($engine volume inspect "$volume_name" --format '{{ index .Labels "io.assistos.ploinky-box.role" }}')"
              role_allowed=0
              for allowed_role in "${QA_VOLUME_ROLES[@]}"; do
                if [ "$volume_role" = "$allowed_role" ]; then role_allowed=1; fi
              done
              if [ "$volume_hash" != "$BOX_PATH_HASH" ] || [ "$role_allowed" != '1' ] ||
                [ "$volume_name" != "$BOX_INSTANCE-$volume_role" ]; then
                echo "[deploy-qa] ERROR: exact QA volume identity has conflicting ownership labels: $volume_name"
                exit 1
              fi
              QA_VOLUME_RECORDS+=("$engine|$volume_name|$volume_role")
              echo "[deploy-qa] Rollback volume: engine=$engine name=$volume_name pathHash=$volume_hash role=$volume_role"
            done < <(
              {
                "$engine" volume ls -q --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH"
                for volume_role in "${QA_VOLUME_ROLES[@]}"; do
                  exact_volume="$BOX_INSTANCE-$volume_role"
                  if "$engine" volume inspect "$exact_volume" >/dev/null 2>&1; then printf '%s\n' "$exact_volume"; fi
                done
              } | sort -u
            )
          done

          if [ "${#QA_CONTAINER_RECORDS[@]}" -gt 1 ]; then
            echo "[deploy-qa] ERROR: exact QA Box identity is ambiguous across engines or immutable IDs."
            exit 1
          fi
          echo "[deploy-qa] Removing only the exact Explorer QA Box, labeled volumes, and identity directory..."
          for record in "${QA_CONTAINER_RECORDS[@]}"; do
            IFS='|' read -r engine container_id _ <<< "$record"
            "$engine" container rm -f "$container_id"
          done
          for record in "${QA_VOLUME_RECORDS[@]}"; do
            IFS='|' read -r engine volume_name _ <<< "$record"
            "$engine" volume rm "$volume_name"
          done
          if ! node --input-type=module - "$WORK_DIR" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const target = path.resolve(process.argv[2]);
          if (target !== '/home/admin/explorerQaWorkspace') {
            throw new Error(`refusing recursive cleanup outside exact QA identity: ${target}`);
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isDirectory() || current.isSymbolicLink()
              || (typeof process.getuid === 'function' && current.uid !== process.getuid())) {
              throw new Error(`refusing unsafe QA identity directory: ${target}`);
            }
            fs.rmSync(target, { recursive: true, force: false, maxRetries: 3 });
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          NODE
          then
            echo "[deploy-qa] Root-owned nested runtime data requires the pinned privileged cleanup fallback."
            sudo -n /usr/bin/node --input-type=module - "$WORK_DIR" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          if (typeof process.getuid !== 'function' || process.getuid() !== 0) {
            throw new Error('privileged QA cleanup did not run as root');
          }
          const target = path.resolve(process.argv[2]);
          if (target !== '/home/admin/explorerQaWorkspace') {
            throw new Error(`refusing privileged cleanup outside exact QA identity: ${target}`);
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isDirectory() || current.isSymbolicLink()) {
              throw new Error(`refusing unsafe privileged QA identity directory: ${target}`);
            }
            fs.rmSync(target, { recursive: true, force: false, maxRetries: 3 });
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          NODE
          fi
          for engine in podman docker; do
            command -v "$engine" >/dev/null 2>&1 || continue
            if [ -n "$($engine container ls -aq --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH")" ] ||
              "$engine" container inspect "$BOX_INSTANCE" >/dev/null 2>&1 ||
              [ -n "$($engine volume ls -q --filter "label=io.assistos.ploinky-box.path-hash=$BOX_PATH_HASH")" ]; then
              echo "[deploy-qa] ERROR: exact QA orphan resources remained after cleanup."
              exit 1
            fi
            for volume_role in "${QA_VOLUME_ROLES[@]}"; do
              if "$engine" volume inspect "$BOX_INSTANCE-$volume_role" >/dev/null 2>&1; then
                echo "[deploy-qa] ERROR: exact QA volume remained after cleanup."
                exit 1
              fi
            done
          done
          if [ -e "$WORK_DIR" ] || [ -L "$WORK_DIR" ]; then
            echo "[deploy-qa] ERROR: exact QA identity directory remained after cleanup."
            exit 1
          fi
          echo "[deploy-qa] Exact prior Explorer QA deployment cleanup verified."

          mkdir -p "$WORK_DIR"
          chmod 700 "$WORK_DIR"
          node --input-type=module - "$WORK_DIR/.env" <<'NODE'
          import fs from 'node:fs';

          const target = process.argv[2];
          const key = String(process.env.PLOINKY_MASTER_KEY || '');
          const content = `PLOINKY_MASTER_KEY=${key}\n`;
          if (!/^[A-Fa-f0-9]{64}$/.test(key)) {
            throw new Error('invalid QA Ploinky master key');
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1
              || (typeof process.getuid === 'function' && current.uid !== process.getuid())) {
              throw new Error(`refusing unsafe workspace master-key target: ${target}`);
            }
            if (fs.readFileSync(target, 'utf8') !== content) {
              throw new Error('existing QA workspace master key does not match the authorized key');
            }
            fs.chmodSync(target, 0o600);
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
            fs.writeFileSync(target, content, { encoding: 'utf8', flag: 'wx', mode: 0o600 });
            fs.chmodSync(target, 0o600);
          }
          NODE
          unset PLOINKY_MASTER_KEY
          mkdir -p "$WORK_DIR/.runtime"
          RUNTIME_DIR="$WORK_DIR/.runtime/ploinky"

          inspect_outer_box_status() {
            env PLOINKY_WORKSPACE_ROOT="$WORK_DIR" \
              node --input-type=module - \
                "$RUNTIME_DIR/ploinky-box/supervisor.mjs" <<'NODE'
          import { pathToFileURL } from 'node:url';

          const supervisorModule = process.argv[2];
          const {
            createBoxSupervisor,
            formatBoxStatus,
          } = await import(pathToFileURL(supervisorModule).href);
          const status = createBoxSupervisor().inspectBoxStatus();
          process.stdout.write(formatBoxStatus(status));
          NODE
          }

          if [ -e "$RUNTIME_DIR" ] && [ ! -d "$RUNTIME_DIR/.git" ]; then
            echo "[deploy-qa] ERROR: managed runtime path is not a Ploinky git checkout: $RUNTIME_DIR"
            exit 1
          fi
          if [ ! -d "$RUNTIME_DIR/.git" ]; then
            echo "[deploy-qa] Cloning the dedicated QA Ploinky runtime..."
            git clone --no-checkout https://github.com/AssistOS-AI/ploinky.git "$RUNTIME_DIR"
          fi

          RUNTIME_ORIGIN="$(git -C "$RUNTIME_DIR" remote get-url origin)"
          case "${RUNTIME_ORIGIN%.git}" in
            https://github.com/AssistOS-AI/ploinky) ;;
            *)
              echo "[deploy-qa] ERROR: unexpected Ploinky runtime origin '$RUNTIME_ORIGIN'."
              exit 1
              ;;
          esac

          resolve_default_branch() {
            local repository_url="$1"
            local symref_record default_ref default_branch
            if ! symref_record="$(git ls-remote --symref "$repository_url" HEAD)"; then
              echo "[deploy-qa] ERROR: unable to resolve the default branch for $repository_url." >&2
              return 1
            fi
            default_ref="$({
              printf '%s\n' "$symref_record" |
                awk '$1 == "ref:" && $3 == "HEAD" { print $2; exit }'
            })"
            case "$default_ref" in
              refs/heads/*) ;;
              *)
                echo "[deploy-qa] ERROR: remote HEAD for $repository_url is not a branch." >&2
                return 1
                ;;
            esac
            default_branch="${default_ref#refs/heads/}"
            git check-ref-format --branch "$default_branch" >/dev/null
            printf '%s\n' "$default_branch"
          }

          GRAPH_REPOSITORIES=(
            'AchillesIDE|https://github.com/AssistOS-AI/AssistOSExplorer.git'
            'UmamiAgent|https://github.com/AssistOS-AI/UmamiAgent.git'
            'AchillesCLI|https://github.com/AssistOS-AI/AchillesCLI.git'
            'copilot-agents|https://github.com/AssistOS-AI/copilot-agents.git'
            'proxies|https://github.com/AssistOS-AI/proxies.git'
            'container-image-builds|https://github.com/AssistOS-AI/container-image-builds.git'
          )
          BRANCH_ARGS=()
          declare -A EXPECTED_BRANCHES=()
          declare -A EXPECTED_COMMITS=()

          echo "[deploy-qa] Resolving every managed repository from its configured default branch..."
          for repository_record in "${GRAPH_REPOSITORIES[@]}"; do
            IFS='|' read -r repository_name repository_url <<< "$repository_record"
            default_branch="$(resolve_default_branch "$repository_url")"
            if ! branch_record="$(
              git ls-remote --exit-code --heads \
                "$repository_url" \
                "refs/heads/$default_branch"
            )"; then
              echo "[deploy-qa] ERROR: $repository_name has no '$default_branch' branch."
              exit 1
            fi
            expected_commit="$(
              printf '%s\n' "$branch_record" | awk 'NR == 1 { print $1 }'
            )"
            if [[ ! "$expected_commit" =~ ^[a-f0-9]{40}$ ]]; then
              echo "[deploy-qa] ERROR: unable to resolve $repository_name/$default_branch."
              exit 1
            fi
            EXPECTED_BRANCHES["$repository_name"]="$default_branch"
            EXPECTED_COMMITS["$repository_name"]="$expected_commit"
            BRANCH_ARGS+=(--repo-branch "$repository_name=$default_branch")
            echo "[deploy-qa] Selected $repository_name/$default_branch at $expected_commit."
          done
          EXPLORER_BRANCH="${EXPECTED_BRANCHES[AchillesIDE]}"

          PLOINKY_URL='https://github.com/AssistOS-AI/ploinky.git'
          PLOINKY_BRANCH="$(resolve_default_branch "$PLOINKY_URL")"
          echo "[deploy-qa] Selected Ploinky/$PLOINKY_BRANCH."

          if [ -x "$RUNTIME_DIR/bin/ploinky" ] &&
