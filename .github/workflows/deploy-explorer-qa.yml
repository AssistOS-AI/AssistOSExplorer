name: Deploy Explorer QA Box

on:
  workflow_dispatch:

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: 'admin'
  SSH_HOST: '45.136.70.141'
  SSH_ED25519_FINGERPRINT: 'SHA256:pcVG+7QFbfi3Ojn3LeveNutqCWaTOIlgek1o3GKD/KA'
  WORKSPACE: 'explorerQaWorkspace'
  ROUTER_PORT: '8097'
  PUBLIC_HOST: 'explorer-qa.axiologic.dev'
  PUBLIC_URL: 'https://explorer-qa.axiologic.dev'
  CLOUDFLARE_TUNNEL_NAME: 'explorer-qa'
  CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID: '091c4096-d1c8-4dbc-bb12-0c6357431d96'
  CLOUDFLARE_TUNNEL_SECRET_HANDLE: 'publication/explorer-qa-tunnel'
  CLOUDFLARE_API_SECRET_HANDLE: 'publication/explorer-qa-api'
  MEDIA_PUBLIC_IPV4: '45.136.70.141'
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  deploy:
    name: Deploy Explorer QA through Ploinky Box
    runs-on: ubuntu-latest
    # Quiesce takes up to about 15 minutes, start plus readiness took 10 minutes
    # on 2026-10-13 and may take 30; a runner timeout would drop SSH mid-copy.
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out the reviewed deployment helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the AssistOSExplorer main commit
        run: |
          set -euo pipefail
          # The deployed AssistOSExplorer is always the head of main at this moment.
          # The in-place selection, the early check and the late check all compare
          # with this one pinned commit.
          if ! MAIN_RECORD="$(git ls-remote --exit-code --heads https://github.com/AssistOS-AI/AssistOSExplorer.git refs/heads/main)"; then
            echo "::error::Unable to resolve refs/heads/main of AssistOSExplorer"
            exit 1
          fi
          if [ "$(printf '%s\n' "$MAIN_RECORD" | awk 'NF { count++ } END { print count + 0 }')" -ne 1 ]; then
            echo "::error::AssistOSExplorer refs/heads/main did not resolve to exactly one record"
            exit 1
          fi
          if [[ ! "$MAIN_RECORD" =~ ^[a-f0-9]{40}[[:space:]]refs/heads/main$ ]]; then
            echo "::error::AssistOSExplorer refs/heads/main resolved to a malformed record"
            exit 1
          fi
          MAIN_COMMIT="${MAIN_RECORD%%[[:space:]]*}"
          echo "EXPECTED_EXPLORER_COMMIT=$MAIN_COMMIT" >> "$GITHUB_ENV"
          echo "[deploy-qa] Helpers and tests come from ${GITHUB_REF_NAME:-unknown}@${GITHUB_SHA:-unknown}."
          echo "[deploy-qa] Deploying AssistOSExplorer main at $MAIN_COMMIT."

      - name: Set up the deployment test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test deployment admission and recovery
        run: |
          QA_TEARDOWN_PRIVILEGED_TESTS=1 node --test tests/smoke/lib/deploy-*.test.mjs tests/smoke/lib/qa-*.test.mjs tests/smoke/lib/retired-source-absence.test.mjs

      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          if [ "$SSH_HOST" != '45.136.70.141' ] || [ "$SSH_USER" != 'admin' ] ||
            [ "$WORKSPACE" != 'explorerQaWorkspace' ]; then
            echo "::error::Explorer QA target identity is not the pinned admin@45.136.70.141/explorerQaWorkspace target"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "::error::EXPLORER_QA_CLOUDFLARE_API_TOKEN is a Global API Key; Ploinky requires a scoped Account or User API Token used as a Bearer token"
            exit 1
          fi
          if [[ ! "$PLOINKY_MASTER_KEY" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::EXPLORER_QA_PLOINKY_MASTER_KEY must be exactly 64 hex characters"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Explorer QA Cloudflare account or zone variables are missing or malformed"
            exit 1
          fi
          if [ "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" != '091c4096-d1c8-4dbc-bb12-0c6357431d96' ]; then
            echo "::error::Protected shared tunnel identity is not pinned"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "::error::Explorer QA managed Cloudflare tunnel name is malformed"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "$SOUL_GATEWAY_WORKSPACE" ]; then
            echo "::error::Refusing to deploy into the production Soul Gateway workspace"
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "::error::Invalid router port '${ROUTER_PORT:-}'"
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "::error::Router port must be between 1 and 65535"
            exit 1
          fi
          case "$ROUTER_PORT" in
            8042|8043|8080|8085|8317|8318)
              echo "::error::Refusing to use protected proxies-host port ${ROUTER_PORT}"
              exit 1
              ;;
          esac
          if [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "::error::PUBLIC_URL and PUBLIC_HOST must identify the fixed Explorer QA hostname"
            exit 1
          fi
          TUNNEL_LIST_RESPONSE="$(mktemp /tmp/explorer_qa_tunnel_list.XXXXXX)"
          DNS_RESPONSE="$(mktemp /tmp/explorer_qa_dns.XXXXXX)"
          SHARED_TUNNEL_RESPONSE="$(mktemp /tmp/explorer_qa_shared_tunnel.XXXXXX)"
          SHARED_CONFIG_RESPONSE="$(mktemp /tmp/explorer_qa_shared_config.XXXXXX)"
          trap 'rm -f "$TUNNEL_LIST_RESPONSE" "$DNS_RESPONSE" "$SHARED_TUNNEL_RESPONSE" "$SHARED_CONFIG_RESPONSE"' EXIT
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode "name=$PUBLIC_HOST" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
            > "$DNS_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" \
            > "$SHARED_TUNNEL_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID/configurations" \
            > "$SHARED_CONFIG_RESPONSE"

          node --input-type=module - \
            "$TUNNEL_LIST_RESPONSE" \
            "$DNS_RESPONSE" \
            "$SHARED_TUNNEL_RESPONSE" \
            "$SHARED_CONFIG_RESPONSE" \
            "$RUNNER_TEMP/explorer_qa_protected_cloudflare_before.json" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const [listPath, dnsPath, sharedTunnelPath, sharedConfigPath, snapshotPath] = process.argv.slice(2);
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const tunnelName = String(process.env.CLOUDFLARE_TUNNEL_NAME || '');
          const sharedTunnelId = String(process.env.CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID || '');
          const publicHost = String(process.env.PUBLIC_HOST || '');
          const parse = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const requireSuccess = (payload, label) => {
            if (payload?.success !== true) throw new Error(`${label} inventory failed`);
            return payload.result;
          };
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value)
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([key, child]) => [key, stable(child)]));
          };
          const digest = (value) => `sha256:${crypto.createHash('sha256')
            .update(JSON.stringify(stable(value))).digest('hex')}`;
          const api = async (pathname) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              redirect: 'error',
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) throw new Error('protected Cloudflare inventory failed');
            return payload.result;
          };

          const named = requireSuccess(parse(listPath), 'named tunnel');
          if (!Array.isArray(named) || named.length > 1
            || named.some((entry) => entry?.id === sharedTunnelId)) {
            throw new Error('active explorer-qa tunnel inventory is ambiguous or aliases the protected shared tunnel');
          }
          const records = requireSuccess(parse(dnsPath), 'Explorer QA DNS');
          if (!Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA DNS is ambiguous or points outside the selected tunnel');
          }
          if (named.length === 0 && records.length !== 0) {
            throw new Error('Explorer QA DNS exists without the authorized dedicated tunnel');
          }
          if (named.length === 1) {
            const tunnelId = String(named[0]?.id || '');
            if (!/^[a-f0-9-]{36}$/.test(tunnelId) || named[0]?.name !== tunnelName
              || named[0]?.deleted_at != null
              || (named[0]?.account_tag != null && named[0]?.account_tag !== accountId)) {
              throw new Error('selected dedicated Explorer QA tunnel identity is invalid');
            }
            const detail = await api(`/accounts/${accountId}/cfd_tunnel/${tunnelId}`);
            const config = await api(`/accounts/${accountId}/cfd_tunnel/${tunnelId}/configurations`);
            if (detail?.id !== tunnelId || detail?.name !== tunnelName || detail?.deleted_at != null) {
              throw new Error('dedicated Explorer QA tunnel detail changed during inventory');
            }
            const ingress = config?.config?.ingress ?? config?.ingress ?? [];
            if (!Array.isArray(ingress) || ingress.length > 2) {
              throw new Error('dedicated Explorer QA tunnel is shared or has ambiguous ingress');
            }
            if (ingress.length) {
              const catchAll = ingress.at(-1);
              if (catchAll?.hostname != null || catchAll?.service !== 'http_status:404') {
                throw new Error('dedicated Explorer QA tunnel lacks the terminal 404 ingress');
              }
            }
            if (ingress.length === 2
              && (ingress[0]?.hostname !== publicHost
                || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
              throw new Error('dedicated Explorer QA tunnel contains unrelated or incorrect ingress');
            }
            const expectedTarget = `${tunnelId}.cfargotunnel.com`;
            if (records.length === 1 && (records[0]?.name !== publicHost
              || records[0]?.type !== 'CNAME'
              || records[0]?.content !== expectedTarget
              || records[0]?.proxied !== true)) {
              throw new Error('Explorer QA DNS points outside the dedicated tunnel');
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_TUNNEL_ID=${tunnelId}\n`);
          }

          const sharedDetail = requireSuccess(parse(sharedTunnelPath), 'protected shared tunnel detail');
          const sharedConfig = requireSuccess(parse(sharedConfigPath), 'protected shared tunnel configuration');
          if (sharedDetail?.id !== sharedTunnelId || sharedDetail?.name !== 'proxies'
            || sharedDetail?.deleted_at != null
            || (sharedDetail?.account_tag != null && sharedDetail.account_tag !== accountId)) {
            throw new Error('protected proxies tunnel identity changed');
          }
          const sharedIngress = sharedConfig?.config?.ingress;
          const expectedIngress = [
            ['antigravity.axiologic.dev', 'http://localhost:8001'],
            ['proxy.axiologic.dev', 'http://localhost:8318'],
            ['soul.axiologic.dev', 'http://localhost:8042'],
            ['search.axiologic.dev', 'http://localhost:8043'],
            ['kiro.axiologic.dev', 'http://localhost:8000'],
            ['explorer-qa.axiologic.dev', 'http://localhost:8097'],
            ['office-qa.axiologic.dev', 'http://localhost:8082'],
          ];
          if (!Array.isArray(sharedIngress) || sharedIngress.length !== 8
            || expectedIngress.some(([hostname, service], index) => (
              sharedIngress[index]?.hostname !== hostname || sharedIngress[index]?.service !== service
            ))
            || sharedIngress.at(-1)?.hostname != null
            || sharedIngress.at(-1)?.service !== 'http_status:404') {
            throw new Error('protected proxies ingress topology is not the authorized immutable baseline');
          }
          const protectedDns = [];
          for (let page = 1; ; page += 1) {
            if (page > 100) throw new Error('protected DNS inventory exceeded the fail-closed page bound');
            const query = new URLSearchParams({ page: String(page), per_page: '100' });
            const result = await api(`/zones/${process.env.CLOUDFLARE_ZONE_ID}/dns_records?${query}`);
            if (!Array.isArray(result)) throw new Error('protected DNS inventory is malformed');
            protectedDns.push(...result.filter((record) => record?.name !== publicHost));
            if (result.length < 100) break;
          }
          protectedDns.sort((left, right) => String(left?.id || '').localeCompare(String(right?.id || '')));
          const snapshot = {
            tunnel: { id: sharedDetail.id, name: sharedDetail.name, accountTag: sharedDetail.account_tag || accountId },
            ingress: sharedIngress,
            dns: protectedDns,
          };
          fs.writeFileSync(snapshotPath, `${JSON.stringify(stable(snapshot))}\n`, { mode: 0o600, flag: 'wx' });
          const protectedDigest = digest(snapshot);
          fs.appendFileSync(process.env.GITHUB_ENV, `PROTECTED_CLOUDFLARE_DIGEST=${protectedDigest}\n`);
          console.log(`Validated protected proxies topology ${protectedDigest} and a safe dedicated Explorer QA tunnel slot.`);
          NODE

          HOST_KEY_CANDIDATE="$RUNNER_TEMP/explorer_qa_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOST_KEY_CANDIDATE"
          HOST_KEY_FINGERPRINT="$({ ssh-keygen -lf "$HOST_KEY_CANDIDATE" -E sha256 || true; } | awk '{print $2}' | sort -u)"
          if [ "$HOST_KEY_FINGERPRINT" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::Explorer QA ED25519 host fingerprint did not match the pinned identity"
            exit 1
          fi
          chmod 600 "$HOST_KEY_CANDIDATE"
          echo "Validated the pinned Explorer QA SSH host identity."

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 "$RUNNER_TEMP/explorer_qa_known_hosts" ~/.ssh/explorer_qa_known_hosts

      - name: Update the existing Explorer QA installation in place
        id: inplace
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "${EXPECTED_EXPLORER_COMMIT:-}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The pinned AssistOSExplorer commit is missing or malformed"
            exit 1
          fi
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5)
          REMOTE_DIR="$("${SSH[@]}" "${SSH_USER}@${SSH_HOST}" 'umask 077; mktemp -d /tmp/explorer-qa-update.XXXXXXXX')"
          [[ "$REMOTE_DIR" =~ ^/tmp/explorer-qa-update\.[A-Za-z0-9]{8}$ ]]
          cleanup_update() {
            "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" \
              "rm -f '$REMOTE_DIR/update-explorer-qa.mjs' '$REMOTE_DIR/rollback-explorer-qa.mjs' '$REMOTE_DIR/qa-teardown.mjs' '$REMOTE_DIR/update.json'; rmdir '$REMOTE_DIR'" || true
          }
          trap cleanup_update EXIT
          # The route step runs the read-only route of the teardown helper; the updater imports the recovery helper.
          for helper in update-explorer-qa.mjs rollback-explorer-qa.mjs qa-teardown.mjs; do
            scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
              "$GITHUB_WORKSPACE/.github/scripts/$helper" "${SSH_USER}@${SSH_HOST}:$REMOTE_DIR/$helper"
          done
          status=0
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" \
            "flock -n -E 75 --close /home/admin/.qa-deployment-operation.lock bash -s -- '$REMOTE_DIR' '$EXPECTED_EXPLORER_COMMIT'" \
            > "$RUNNER_TEMP/explorer-qa-update-result.json" <<'UPDATE' || status=$?
          set -euo pipefail
          update_dir="$1"
          expected_commit="${2:-}"
          [[ "$update_dir" =~ ^/tmp/explorer-qa-update\.[A-Za-z0-9]{8}$ ]]
          if [[ ! "$expected_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Unsupported pinned AssistOSExplorer commit' >&2
            exit 1
          fi
          test "$(id -un)" = admin
          test "$HOME" = /home/admin
          workspace=/home/admin/explorerQaWorkspace
          if { [ -e "$workspace" ] || [ -L "$workspace" ]; } && { [ ! -d "$workspace" ] || [ -L "$workspace" ]; }; then
            echo '[deploy-qa] ERROR: the QA workspace path is not a real directory.' >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo 'Unsupported QA architecture' >&2; exit 1 ;;
          esac
          node_home="/home/admin/.qa-deployment-tools/node-v24.19.0-linux-$arch"
          if [ ! -x "$node_home/bin/node" ]; then
            # The route needs the QA-scoped Node, and a host that has never been installed has none. Only a
            # host with no QA workspace and no QA container at all may proceed, to the first installation,
            # which installs the QA Node and proves the route again under the Reconcile lock.
            if [ -e "$workspace" ] || [ -L "$workspace" ]; then
              echo "[deploy-qa] ERROR: the QA toolchain is missing at $node_home but the QA workspace exists. Install the pinned Node v24.19.0 archive there by hand (docs/deploy-explorer-qa.md), then dispatch again; the deploy does not reinstall it over an existing installation." >&2
              exit 1
            fi
            for engine in podman docker; do
              command -v "$engine" >/dev/null 2>&1 || continue
              ids="$("$engine" container ls -aq --filter label=io.assistos.ploinky-box.path-hash=7a31ab7775eb)" || {
                echo "[deploy-qa] ERROR: the QA toolchain is missing at $node_home and $engine could not prove that no QA container exists." >&2
                exit 1
              }
              names="$("$engine" container ls -a --format '{{.Names}}')" || {
                echo "[deploy-qa] ERROR: the QA toolchain is missing at $node_home and $engine could not list container names." >&2
                exit 1
              }
              if [ -n "$ids" ]; then
                echo "[deploy-qa] ERROR: the QA toolchain is missing at $node_home but $engine holds a labelled QA container." >&2
                exit 1
              fi
              while IFS= read -r name; do
                case "$name" in
                  ploinky-box-explorerqaworkspace-7a31ab7775eb*)
                    echo "[deploy-qa] ERROR: the QA toolchain is missing at $node_home but $engine holds the QA container $name." >&2
                    exit 1
                    ;;
                esac
              done <<< "$names"
            done
            echo "[deploy-qa] The QA toolchain is not installed and no QA workspace or container exists; proceeding to the first installation."
            exit 42
          fi
          export PATH="$node_home/bin:$PATH"
          test "$(node --version)" = v24.19.0
          # Every failure of a helper is normalised to exit 1, so a status of 42 or 43 can only come
          # from this script and never from the node process. The route also covers an absent workspace,
          # so no separate absence proof runs first; that is why it follows the QA Node check above, and
          # a first installation needs the QA Node that neither destroy mode removes.
          route="$(node "$update_dir/qa-teardown.mjs" route --lock-held)" || { printf '%s\n' "$route"; exit 1; }
          route_kind="$(printf '%s' "$route" | node --input-type=module -e '
            import fs from "node:fs";
            const route = JSON.parse(fs.readFileSync(0, "utf8"));
            if (route?.result !== "routed" || !["fresh", "rebuild", "select"].includes(route.route)) process.exit(1);
            process.stdout.write(route.route);
          ')" || exit 1
          printf '[deploy-qa] Deployment route: %s\n' "$route"
          case "$route_kind" in
            fresh)
              echo '[deploy-qa] No current Box; the guarded Reconcile step installs fresh, onto any data left in place.'
              exit 42
              ;;
            rebuild)
              echo '[deploy-qa] The current Box needs a rebuild; the in-place updater was not run.'
              exit 43
              ;;
            select) ;;
            *) exit 1 ;;
          esac
          selection="$(node "$update_dir/update-explorer-qa.mjs" select --expected-commit "$expected_commit" --lock-held)" || { printf '%s\n' "$selection"; exit 1; }
          mode="$(printf '%s' "$selection" | node --input-type=module -e '
            import fs from "node:fs";
            const selection = JSON.parse(fs.readFileSync(0, "utf8"));
            if (selection?.result !== "selected" || !["in-place", "redeploy"].includes(selection.mode)) process.exit(1);
            process.stdout.write(selection.mode);
          ')" || exit 1
          printf '[deploy-qa] Deployment selection: %s\n' "$selection"
          case "$mode" in
            redeploy)
              # Anything other than an Explorer-only change that the updater accepts
              # goes to the guarded Reconcile step; the updater does not run again.
              echo '[deploy-qa] Rebuild selected automatically; the in-place updater was not run.'
              exit 43
              ;;
            in-place) ;;
            *) exit 1 ;;
          esac
          node "$update_dir/update-explorer-qa.mjs" execute --receipt "$update_dir/update.json" --expected-commit "$expected_commit" --lock-held || exit 1
          UPDATE
          cat "$RUNNER_TEMP/explorer-qa-update-result.json"
          if [ "$status" -eq 42 ]; then
            echo 'updated=false' >> "$GITHUB_OUTPUT"
            echo '[deploy-qa] No current Box; proceeding to a fresh installation.'
          elif [ "$status" -eq 43 ]; then
            echo 'updated=false' >> "$GITHUB_OUTPUT"
            echo 'operation=rebuild' >> "$GITHUB_OUTPUT"
            echo '[deploy-qa] Proceeding to the guarded rebuild path.'
          elif [ "$status" -eq 0 ]; then
            echo 'updated=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::In-place update failed. The deploy workflow will not recreate or destroy this installation.'
            exit "$status"
          fi

      - name: Reconcile and start Explorer QA Box
        if: steps.inplace.outputs.updated == 'false'
        env:
          OPERATION: ${{ steps.inplace.outputs.operation }}
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
          QA_USERPERSISTO_GOOGLE_CLIENT_ID: ${{ vars.EXPLORER_QA_USERPERSISTO_GOOGLE_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
          PLOINKY_MASTER_KEY: ${{ secrets.EXPLORER_QA_PLOINKY_MASTER_KEY }}
        run: |
          set -euo pipefail
          umask 077

          TUNNEL_LIST_RESPONSE=''
          TUNNEL_MUTATION_RESPONSE=''
          TUNNEL_TOKEN_RESPONSE=''
          TUNNEL_DETAIL_RESPONSE=''
          TUNNEL_CONFIG_RESPONSE=''
          TUNNEL_DNS_RESPONSE=''
          LOCAL_ENV_FILE=''
          REMOTE_ENV_FILE=''
          REMOTE_ENV_UPLOADED='false'
          cleanup_local_files() {
            for target in \
              "$TUNNEL_LIST_RESPONSE" \
              "$TUNNEL_MUTATION_RESPONSE" \
              "$TUNNEL_TOKEN_RESPONSE" \
              "$TUNNEL_DETAIL_RESPONSE" \
              "$TUNNEL_CONFIG_RESPONSE" \
              "$TUNNEL_DNS_RESPONSE" \
              "$LOCAL_ENV_FILE"; do
              if [ -n "$target" ]; then rm -f "$target"; fi
            done
            if [ "$REMOTE_ENV_UPLOADED" = 'true' ]; then
              case "$REMOTE_ENV_FILE" in
                /tmp/explorer_qa_deploy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9])
                  ssh \
                    -i ~/.ssh/deploy_key \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
                    "${SSH_USER}@${SSH_HOST}" \
                    "rm -f -- '$REMOTE_ENV_FILE'" >/dev/null 2>&1 || true
                  ;;
              esac
            fi
          }
          trap cleanup_local_files EXIT

          TUNNEL_LIST_RESPONSE="$(mktemp /tmp/explorer_qa_provision_list.XXXXXX)"
          TUNNEL_MUTATION_RESPONSE="$(mktemp /tmp/explorer_qa_provision_mutation.XXXXXX)"
          TUNNEL_TOKEN_RESPONSE="$(mktemp /tmp/explorer_qa_provision_token.XXXXXX)"
          TUNNEL_DETAIL_RESPONSE="$(mktemp /tmp/explorer_qa_provision_detail.XXXXXX)"
          TUNNEL_CONFIG_RESPONSE="$(mktemp /tmp/explorer_qa_provision_config.XXXXXX)"
          TUNNEL_DNS_RESPONSE="$(mktemp /tmp/explorer_qa_provision_dns.XXXXXX)"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          CLOUDFLARE_TUNNEL_ID="$(
            node --input-type=module - "$TUNNEL_LIST_RESPONSE" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tunnels = payload?.success === true ? payload.result : null;
          if (!Array.isArray(tunnels) || tunnels.length > 1) {
            throw new Error('dedicated Explorer QA tunnel inventory is ambiguous');
          }
          if (tunnels.length === 1 && (tunnels[0]?.name !== process.env.CLOUDFLARE_TUNNEL_NAME
            || tunnels[0]?.deleted_at != null)) {
            throw new Error('dedicated Explorer QA tunnel identity changed');
          }
          process.stdout.write(String(tunnels[0]?.id || ''));
          NODE
          )"
          CLOUDFLARE_TUNNEL_CREATED='false'
          if [ -z "$CLOUDFLARE_TUNNEL_ID" ]; then
            if [ -n "${OPERATION:-}" ]; then
              echo "::error::A rebuild reuses the existing dedicated Explorer QA tunnel and never creates one"
              exit 1
            fi
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"name":"explorer-qa","config_src":"cloudflare"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
              > "$TUNNEL_MUTATION_RESPONSE"
            CLOUDFLARE_TUNNEL_ID="$(
              node --input-type=module - "$TUNNEL_MUTATION_RESPONSE" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tunnel = payload?.success === true ? payload.result : null;
          if (!tunnel || tunnel.name !== 'explorer-qa' || tunnel.deleted_at != null) {
            throw new Error('Cloudflare did not create the exact dedicated Explorer QA tunnel');
          }
          process.stdout.write(String(tunnel.id || ''));
          NODE
            )"
            CLOUDFLARE_TUNNEL_CREATED='true'
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_ID" =~ ^[a-f0-9-]{36}$ ]] ||
            [ "$CLOUDFLARE_TUNNEL_ID" = "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" ]; then
            echo "::error::Dedicated Explorer QA tunnel identity is malformed or aliases the protected shared tunnel"
            exit 1
          fi
          export CLOUDFLARE_TUNNEL_ID CLOUDFLARE_TUNNEL_CREATED
          {
            printf 'CLOUDFLARE_TUNNEL_ID=%s\n' "$CLOUDFLARE_TUNNEL_ID"
            printf 'CLOUDFLARE_TUNNEL_CREATED=%s\n' "$CLOUDFLARE_TUNNEL_CREATED"
          } >> "$GITHUB_ENV"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID" \
            > "$TUNNEL_DETAIL_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/configurations" \
            > "$TUNNEL_CONFIG_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode "name=$PUBLIC_HOST" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
            > "$TUNNEL_DNS_RESPONSE"
          node --input-type=module - \
            "$TUNNEL_LIST_RESPONSE" \
            "$TUNNEL_DETAIL_RESPONSE" \
            "$TUNNEL_CONFIG_RESPONSE" \
            "$TUNNEL_DNS_RESPONSE" \
            "$CLOUDFLARE_TUNNEL_ID" \
            "$CLOUDFLARE_TUNNEL_CREATED" <<'NODE'
          import fs from 'node:fs';

          const [listPath, detailPath, configPath, dnsPath, selectedId, created] = process.argv.slice(2);
          const parseResult = (file, label) => {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (payload?.success !== true) throw new Error(`${label} inventory failed`);
            return payload.result;
          };
          const named = parseResult(listPath, 'dedicated tunnel list');
          const detail = parseResult(detailPath, 'dedicated tunnel detail');
          const config = parseResult(configPath, 'dedicated tunnel configuration');
          const records = parseResult(dnsPath, 'dedicated tunnel DNS');
          if (!['true', 'false'].includes(created)
            || !Array.isArray(named) || named.length !== 1 || named[0]?.id !== selectedId
            || detail?.id !== selectedId || detail?.name !== 'explorer-qa'
            || detail?.deleted_at != null
            || (detail?.account_tag != null && detail.account_tag !== process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error('dedicated Explorer QA tunnel create/reuse did not converge to one exact identity');
          }
          const ingress = config?.config?.ingress ?? config?.ingress ?? [];
          if (!Array.isArray(ingress) || ingress.length > 2) {
            throw new Error('dedicated Explorer QA tunnel has shared or ambiguous ingress');
          }
          if (ingress.length) {
            if (ingress.at(-1)?.hostname != null || ingress.at(-1)?.service !== 'http_status:404') {
              throw new Error('dedicated Explorer QA tunnel lacks the terminal 404 ingress');
            }
          }
          if (ingress.length === 2
            && (ingress[0]?.hostname !== process.env.PUBLIC_HOST
              || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
            throw new Error('dedicated Explorer QA tunnel contains an unrelated route');
          }
          if (!Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA DNS is ambiguous');
          }
          const expectedTarget = `${selectedId}.cfargotunnel.com`;
          if (records.length === 1 && (records[0]?.type !== 'CNAME'
            || records[0]?.name !== process.env.PUBLIC_HOST
            || records[0]?.content !== expectedTarget
            || records[0]?.proxied !== true)) {
            throw new Error('Explorer QA DNS does not target the selected dedicated tunnel');
          }
          if (created === 'true' && (ingress.length > 1 || records.length !== 0)) {
            throw new Error('new dedicated tunnel was not empty at its create/reuse boundary');
          }
          NODE
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/token" \
            > "$TUNNEL_TOKEN_RESPONSE"
          CLOUDFLARE_TUNNEL_TOKEN="$(
            node --input-type=module - "$TUNNEL_TOKEN_RESPONSE" "$CLOUDFLARE_TUNNEL_ID" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedTunnel = process.argv[3];
          const token = payload?.success === true ? String(payload.result || '').trim() : '';
          if (!token) throw new Error('Cloudflare returned no dedicated connector credential');
          let claims = null;
          for (const candidate of [token, ...token.split('.')]) {
            try {
              const decoded = JSON.parse(Buffer.from(candidate, 'base64url').toString('utf8'));
              const account = String(decoded?.a || decoded?.accountId || '');
              const tunnel = String(decoded?.t || decoded?.tunnelId || '');
              if (account && tunnel) { claims = { account, tunnel }; break; }
            } catch { }
          }
          if (!claims || claims.account !== process.env.CLOUDFLARE_ACCOUNT_ID
            || claims.tunnel !== expectedTunnel) {
            throw new Error('connector token claims do not match the dedicated Explorer QA tunnel/account');
          }
          process.stdout.write(token);
          NODE
          )"
          if [ "$CLOUDFLARE_TUNNEL_TOKEN" = "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare management and connector authorities must be separate credentials"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_TUNNEL_TOKEN"
          export CLOUDFLARE_TUNNEL_TOKEN
          rm -f \
            "$TUNNEL_LIST_RESPONSE" \
            "$TUNNEL_MUTATION_RESPONSE" \
            "$TUNNEL_TOKEN_RESPONSE" \
            "$TUNNEL_DETAIL_RESPONSE" \
            "$TUNNEL_CONFIG_RESPONSE" \
            "$TUNNEL_DNS_RESPONSE"
          TUNNEL_LIST_RESPONSE=''
          TUNNEL_MUTATION_RESPONSE=''
          TUNNEL_TOKEN_RESPONSE=''
          TUNNEL_DETAIL_RESPONSE=''
          TUNNEL_CONFIG_RESPONSE=''
          TUNNEL_DNS_RESPONSE=''
          echo "[deploy-qa] Dedicated Explorer QA tunnel id=$CLOUDFLARE_TUNNEL_ID created=$CLOUDFLARE_TUNNEL_CREATED."

          write_shell_var() {
            local name="$1"
            local value="${!name:-}"
            printf '%s=' "$name"
            printf '%q\n' "$value"
          }

          LOCAL_ENV_FILE="$(mktemp /tmp/explorer_qa_deploy.XXXXXX)"
          REMOTE_ENV_FILE="/tmp/$(basename "$LOCAL_ENV_FILE")"
          QA_QUIESCE_SOURCE="$(cat "$GITHUB_WORKSPACE/.github/scripts/quiesce-explorer-qa.mjs")"
          QA_QUIESCE_SHA="$(printf '%s' "$QA_QUIESCE_SOURCE" | sha256sum | awk '{print $1}')"
          QA_ROLLBACK_SOURCE="$(cat "$GITHUB_WORKSPACE/.github/scripts/rollback-explorer-qa.mjs")"
          QA_ROLLBACK_SHA="$(printf '%s' "$QA_ROLLBACK_SOURCE" | sha256sum | awk '{print $1}')"
          QA_TEARDOWN_SOURCE="$(cat "$GITHUB_WORKSPACE/.github/scripts/qa-teardown.mjs")"
          QA_TEARDOWN_SHA="$(printf '%s' "$QA_TEARDOWN_SOURCE" | sha256sum | awk '{print $1}')"
          QA_TEARDOWN_PRIVILEGED_SOURCE="$(cat "$GITHUB_WORKSPACE/.github/scripts/qa-teardown-privileged.mjs")"
          QA_TEARDOWN_PRIVILEGED_SHA="$(printf '%s' "$QA_TEARDOWN_PRIVILEGED_SOURCE" | sha256sum | awk '{print $1}')"
          # Each helper travels as one environment value, which Linux limits to 128 KiB.
          for helper_source in "$QA_QUIESCE_SOURCE" "$QA_ROLLBACK_SOURCE" "$QA_TEARDOWN_SOURCE" "$QA_TEARDOWN_PRIVILEGED_SOURCE"; do
            if [ "$(printf '%s' "$helper_source" | wc -c)" -gt 120000 ]; then
              echo "::error::A deployment helper is larger than one environment value may be"
              exit 1
            fi
          done
          QA_DISPATCH="${DISPATCH_REF//[^A-Za-z0-9._\/-]/_}@${DISPATCH_SHA}"
          {
            write_shell_var WORKSPACE
            write_shell_var ROUTER_PORT
            write_shell_var PUBLIC_HOST
            write_shell_var PUBLIC_URL
            write_shell_var CLOUDFLARE_TUNNEL_NAME
            write_shell_var CLOUDFLARE_TUNNEL_ID
            write_shell_var CLOUDFLARE_TUNNEL_SECRET_HANDLE
            write_shell_var CLOUDFLARE_API_SECRET_HANDLE
            write_shell_var CLOUDFLARE_API_TOKEN
            write_shell_var CLOUDFLARE_TUNNEL_TOKEN
            write_shell_var CLOUDFLARE_ACCOUNT_ID
            write_shell_var CLOUDFLARE_ZONE_ID
            write_shell_var MEDIA_PUBLIC_IPV4
            write_shell_var PLOINKY_MASTER_KEY
            write_shell_var QA_USERPERSISTO_GOOGLE_CLIENT_ID
            write_shell_var SOUL_GATEWAY_WORKSPACE
            write_shell_var SOUL_GATEWAY_ROUTER_PORT
            write_shell_var QA_QUIESCE_SOURCE
            write_shell_var QA_QUIESCE_SHA
            write_shell_var QA_ROLLBACK_SOURCE
            write_shell_var QA_ROLLBACK_SHA
          write_shell_var QA_TEARDOWN_SOURCE
          write_shell_var QA_TEARDOWN_SHA
          write_shell_var QA_TEARDOWN_PRIVILEGED_SOURCE
          write_shell_var QA_TEARDOWN_PRIVILEGED_SHA
            write_shell_var EXPECTED_EXPLORER_COMMIT
          write_shell_var QA_DISPATCH
          } > "$LOCAL_ENV_FILE"

          REMOTE_ENV_UPLOADED='true'
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            "$LOCAL_ENV_FILE" \
            "${SSH_USER}@${SSH_HOST}:$REMOTE_ENV_FILE"
          rm -f "$LOCAL_ENV_FILE"
          LOCAL_ENV_FILE=''

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" "flock -n -E 75 --close /home/admin/.qa-deployment-operation.lock bash -s -- '$REMOTE_ENV_FILE' '${OPERATION:-update}'" <<'REMOTE' | tee "$RUNNER_TEMP/explorer-qa-reconcile.log"
          set -euo pipefail
          umask 077
          REMOTE_ENV_FILE="${1:-}"
          QA_OPERATION="${2:-update}"
          case "$QA_OPERATION" in
            update|rebuild) ;;
            *)
              echo "[deploy-qa] ERROR: unsupported QA operation."
              exit 1
              ;;
          esac
          CLOUDFLARE_CREDENTIAL_FILE=""
          PROTECTED_BEFORE_FILE=""
          PROTECTED_AFTER_FILE=""
          QA_HELPERS_DIR=""
          QA_ANCESTRY_DIR=""
          QA_MARKED=0
          # BEGIN QA ancestry directory removal
          # The ancestry proof clones into a private directory under /tmp. Only that exact
          # mktemp shape is removed, and only after it is proven to be a real directory
          # owned by this user.
          remove_qa_ancestry_dir() {
            [ -n "$QA_ANCESTRY_DIR" ] || return 0
            node --input-type=module - "$QA_ANCESTRY_DIR" <<'NODE' || return 1
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const scratch = process.argv[2];
          assert.match(scratch, /^\/tmp\/explorer_qa_ancestry\.[A-Za-z0-9]{6}$/);
          let stat;
          try { stat = fs.lstatSync(scratch); } catch (error) { if (error.code === 'ENOENT') process.exit(0); throw error; }
          assert(stat.isDirectory() && !stat.isSymbolicLink() && stat.uid === process.getuid());
          fs.rmSync(scratch, { recursive: true });
          NODE
            QA_ANCESTRY_DIR=""
          }
          # END QA ancestry directory removal
          cleanup_remote_files() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$QA_MARKED" = 1 ]; then
              echo '[deploy-qa] Install marker kept; the next deploy finishes this installation from the preserved data.'
            fi
            rm -f "$REMOTE_ENV_FILE"
            if [ -n "$CLOUDFLARE_CREDENTIAL_FILE" ]; then
              rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
            fi
            if [ -n "$PROTECTED_BEFORE_FILE" ]; then
              rm -f "$PROTECTED_BEFORE_FILE"
            fi
            if [ -n "$PROTECTED_AFTER_FILE" ]; then
              rm -f "$PROTECTED_AFTER_FILE"
            fi
            if [ -n "$QA_HELPERS_DIR" ]; then
              rm -f "$QA_HELPERS_DIR/qa-teardown.mjs" "$QA_HELPERS_DIR/qa-teardown-privileged.mjs" \
                "$QA_HELPERS_DIR/rollback-explorer-qa.mjs" "$QA_HELPERS_DIR/quiesce-explorer-qa.mjs"
              rmdir "$QA_HELPERS_DIR" 2>/dev/null || true
            fi
            remove_qa_ancestry_dir || true
            exit "$status"
          }
          case "$REMOTE_ENV_FILE" in
            /tmp/explorer_qa_deploy.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *)
              echo "[deploy-qa] ERROR: invalid deployment configuration path."
              exit 1
              ;;
          esac
          trap cleanup_remote_files EXIT

          if [ ! -f "$REMOTE_ENV_FILE" ] || [ -L "$REMOTE_ENV_FILE" ]; then
            echo "[deploy-qa] ERROR: deployment configuration was not transferred."
            exit 1
          fi
          set -a
          . "$REMOTE_ENV_FILE"
          set +a
          rm -f "$REMOTE_ENV_FILE"
          # BEGIN QA transferred helper integrity
          if [ "$(printf '%s' "$QA_QUIESCE_SOURCE" | sha256sum | awk '{print $1}')" != "$QA_QUIESCE_SHA" ]; then
            echo '[deploy-qa] ERROR: deployment shutdown helper changed in transfer.'
            exit 1
          fi
          if [ "$(printf '%s' "$QA_ROLLBACK_SOURCE" | sha256sum | awk '{print $1}')" != "$QA_ROLLBACK_SHA" ]; then
            echo '[deploy-qa] ERROR: deployment recovery helper changed in transfer.'
            exit 1
          fi
          if [ "$(printf '%s' "$QA_TEARDOWN_SOURCE" | sha256sum | awk '{print $1}')" != "$QA_TEARDOWN_SHA" ]; then
            echo '[deploy-qa] ERROR: teardown helper changed in transfer.'
            exit 1
          fi
          if [ "$(printf '%s' "$QA_TEARDOWN_PRIVILEGED_SOURCE" | sha256sum | awk '{print $1}')" != "$QA_TEARDOWN_PRIVILEGED_SHA" ]; then
            echo '[deploy-qa] ERROR: privileged teardown helper changed in transfer.'
            exit 1
          fi
          # END QA transferred helper integrity

          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "[deploy-qa] ERROR: invalid workspace name '${WORKSPACE:-}'."
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "${SOUL_GATEWAY_WORKSPACE:-soulGateway}" ]; then
            echo "[deploy-qa] ERROR: refusing to operate on the production Soul Gateway workspace."
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "[deploy-qa] ERROR: invalid router port '${ROUTER_PORT:-}'."
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "[deploy-qa] ERROR: router port must be between 1 and 65535."
            exit 1
          fi
          case "$ROUTER_PORT" in
            8042|8043|8080|8085|8317|8318)
              echo "[deploy-qa] ERROR: refusing to use protected proxies-host port $ROUTER_PORT."
              exit 1
              ;;
          esac
          if [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "[deploy-qa] ERROR: public URL and hostname do not identify Explorer QA."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "[deploy-qa] ERROR: a scoped Cloudflare API token is required."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "[deploy-qa] ERROR: the configured Cloudflare credential is a Global API Key, not a scoped Bearer API Token."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "[deploy-qa] ERROR: Cloudflare account or zone identifiers are malformed."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_ID" =~ ^[a-f0-9-]{36}$ ]] ||
            [ "$CLOUDFLARE_TUNNEL_ID" = '091c4096-d1c8-4dbc-bb12-0c6357431d96' ]; then
            echo "[deploy-qa] ERROR: the Cloudflare tunnel is not a dedicated QA tunnel identity."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo "[deploy-qa] ERROR: the authorized existing Cloudflare tunnel token is required."
            exit 1
          fi
          if [[ ! "$PLOINKY_MASTER_KEY" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "[deploy-qa] ERROR: the QA Ploinky master key is malformed."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "[deploy-qa] ERROR: managed Cloudflare tunnel name is malformed."
            exit 1
          fi

          for tool in git node curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[deploy-qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          if ! command -v podman >/dev/null 2>&1 && ! command -v docker >/dev/null 2>&1; then
            echo "[deploy-qa] ERROR: neither Podman nor Docker is installed."
            exit 1
          fi

          WORK_DIR="$HOME/$WORKSPACE"
          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ] ||
            [ "$WORK_DIR" != '/home/admin/explorerQaWorkspace' ]; then
            echo "[deploy-qa] ERROR: remote Explorer QA identity is not the pinned admin workspace."
            exit 1
          fi
          BOX_PATH_HASH="$(
            node --input-type=module -e '
              import crypto from "node:crypto";
              import path from "node:path";
              process.stdout.write(
                crypto.createHash("sha256").update(path.resolve(process.argv[1])).digest("hex").slice(0, 12),
              );
            ' "$WORK_DIR"
          )"
          if [ "$BOX_PATH_HASH" != '7a31ab7775eb' ]; then
            echo "[deploy-qa] ERROR: Explorer QA workspace hash does not match the pinned identity."
            exit 1
          fi
          BOX_INSTANCE="ploinky-box-explorerqaworkspace-$BOX_PATH_HASH"
          if [ -L "$WORK_DIR" ]; then
            echo "[deploy-qa] ERROR: workspace identity path must not be a symlink: $WORK_DIR"
            exit 1
          fi
          if [ -L "$WORK_DIR/.ploinky" ]; then
            echo "[deploy-qa] ERROR: workspace authority directory must not be a symlink: $WORK_DIR/.ploinky"
            exit 1
          fi

          # BEGIN QA isolated Node runtime
          install_qa_node() (
            set -euo pipefail
            umask 077
            case "$(uname -m)" in
              x86_64)
                QA_NODE_ARCH=x64
                QA_NODE_SHA=14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
                ;;
              aarch64|arm64)
                QA_NODE_ARCH=arm64
                QA_NODE_SHA=01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc
                ;;
              *) echo '[deploy-qa] Unsupported QA Node architecture.' >&2; exit 1 ;;
            esac
            QA_TOOLS_ROOT=/home/admin/.qa-deployment-tools
            QA_NODE_DIST="node-v24.19.0-linux-$QA_NODE_ARCH"
            QA_NODE_TARGET="$QA_TOOLS_ROOT/$QA_NODE_DIST"
            QA_NODE_ARCHIVE="$QA_TOOLS_ROOT/$QA_NODE_DIST.tar.xz"
            node --input-type=module - "$QA_TOOLS_ROOT" "$QA_NODE_DIST" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [root, distribution] = process.argv.slice(2);
          assert.equal(root, '/home/admin/.qa-deployment-tools');
          assert(/^node-v24\.19\.0-linux-(x64|arm64)$/.test(distribution));
          if (!fs.existsSync(root)) fs.mkdirSync(root, { mode: 0o700 });
          for (const [file, directory, privateMode] of [
              [root, true, true],
              [path.join(root, `${distribution}.tar.xz`), false, true],
              [path.join(root, distribution), true, false],
              [path.join(root, distribution, 'bin/node'), false, false],
          ]) {
              let stat;
              try { stat = fs.lstatSync(file); } catch (error) { if (error.code === 'ENOENT') continue; throw error; }
              assert(!stat.isSymbolicLink() && (directory ? stat.isDirectory() : stat.isFile()), 'Unsafe QA Node path');
              assert.equal(fs.realpathSync(file), file, 'QA Node path traverses a symlink');
              assert.equal(stat.uid, process.getuid(), 'QA Node path has a different owner');
              assert.equal(stat.mode & (privateMode ? 0o077 : 0o022), 0, 'Unsafe QA Node permissions');
              if (!directory) assert.equal(stat.nlink, 1, 'QA Node file has multiple links');
          }
          NODE
            QA_NODE_STAGE="$(mktemp -d "$QA_TOOLS_ROOT/.node-install-XXXXXXXX")"
            cleanup_qa_node_stage() {
              node --input-type=module - "$QA_TOOLS_ROOT" "$QA_NODE_STAGE" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [root, stage] = process.argv.slice(2);
          assert.equal(root, '/home/admin/.qa-deployment-tools');
          assert.equal(path.dirname(stage), root);
          assert(/^\.node-install-[A-Za-z0-9]{8}$/.test(path.basename(stage)));
          const stat = fs.lstatSync(stage);
          assert(stat.isDirectory() && !stat.isSymbolicLink() && stat.uid === process.getuid());
          assert.equal(fs.realpathSync(stage), stage);
          fs.rmSync(stage, { recursive: true });
          NODE
            }
            trap cleanup_qa_node_stage EXIT
            if [ ! -f "$QA_NODE_ARCHIVE" ]; then
              curl -fsS --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 \
                --max-filesize 104857600 \
                "https://nodejs.org/dist/v24.19.0/$QA_NODE_DIST.tar.xz" -o "$QA_NODE_STAGE/archive.tar.xz"
              printf '%s  %s\n' "$QA_NODE_SHA" "$QA_NODE_STAGE/archive.tar.xz" | timeout 30 sha256sum -c - >/dev/null
              mv -T "$QA_NODE_STAGE/archive.tar.xz" "$QA_NODE_ARCHIVE"
            fi
            printf '%s  %s\n' "$QA_NODE_SHA" "$QA_NODE_ARCHIVE" | timeout 30 sha256sum -c - >/dev/null
            if [ ! -e "$QA_NODE_TARGET" ]; then
              timeout 60 tar --no-same-owner --no-same-permissions -xJf "$QA_NODE_ARCHIVE" -C "$QA_NODE_STAGE"
              mv -T "$QA_NODE_STAGE/$QA_NODE_DIST" "$QA_NODE_TARGET"
            fi
            # Validate an existing binary against the pinned archive too; a
            # version string or cached marker alone is not integrity evidence.
            timeout 60 tar --no-same-owner --no-same-permissions -xJf "$QA_NODE_ARCHIVE" \
              -C "$QA_NODE_STAGE" "$QA_NODE_DIST/bin/node"
            timeout 30 cmp -s "$QA_NODE_STAGE/$QA_NODE_DIST/bin/node" "$QA_NODE_TARGET/bin/node"
            [ "$(timeout 10 "$QA_NODE_TARGET/bin/node" --version)" = 'v24.19.0' ]
            printf '%s\n' "$QA_NODE_TARGET"
          )
          QA_NODE_HOME="$(install_qa_node)"
          export PATH="$QA_NODE_HOME/bin:$PATH"
          echo '[deploy-qa] Verified QA-scoped Node v24.19.0; the shared host Node installation is unchanged.'
          # END QA isolated Node runtime

          # BEGIN QA helper staging
          # The only staging location of the deployment helpers. The route re-proof, the teardown and
          # the tail run these private copies, each checked against its SHA before anything runs.
          QA_HELPERS_DIR="$(mktemp -d /tmp/explorer_qa_helpers.XXXXXX)"
          printf '%s' "$QA_TEARDOWN_SOURCE" > "$QA_HELPERS_DIR/qa-teardown.mjs"
          printf '%s' "$QA_TEARDOWN_PRIVILEGED_SOURCE" > "$QA_HELPERS_DIR/qa-teardown-privileged.mjs"
          printf '%s' "$QA_ROLLBACK_SOURCE" > "$QA_HELPERS_DIR/rollback-explorer-qa.mjs"
          printf '%s' "$QA_QUIESCE_SOURCE" > "$QA_HELPERS_DIR/quiesce-explorer-qa.mjs"
          printf '%s  %s\n' \
            "$QA_TEARDOWN_SHA" "$QA_HELPERS_DIR/qa-teardown.mjs" \
            "$QA_TEARDOWN_PRIVILEGED_SHA" "$QA_HELPERS_DIR/qa-teardown-privileged.mjs" \
            "$QA_ROLLBACK_SHA" "$QA_HELPERS_DIR/rollback-explorer-qa.mjs" \
            "$QA_QUIESCE_SHA" "$QA_HELPERS_DIR/quiesce-explorer-qa.mjs" |
            sha256sum -c - >/dev/null
          chmod 600 "$QA_HELPERS_DIR/qa-teardown.mjs" "$QA_HELPERS_DIR/qa-teardown-privileged.mjs" \
            "$QA_HELPERS_DIR/rollback-explorer-qa.mjs" "$QA_HELPERS_DIR/quiesce-explorer-qa.mjs"
          QA_TAIL_HELPER="$QA_HELPERS_DIR/rollback-explorer-qa.mjs"
          # END QA helper staging

          # BEGIN QA safe receipts
          # The answers of the teardown helper carry user file names (the kept top-level entries) and identity
          # hashes, and this log and the step summary are public. Only counts, digests, container and image
          # IDs, states, backup names and error codes pass; every value is matched against a strict pattern.
          qa_safe_result() {
            node --input-type=module -e '
              import fs from "node:fs";
              let value = null;
              try { value = JSON.parse(fs.readFileSync(0, "utf8")); } catch {
                process.stdout.write(JSON.stringify({ unreadable: true }));
                process.exit(0);
              }
              const word = (item, pattern = /^[a-z][a-z-]{0,31}$/) => (typeof item === "string" && pattern.test(item) ? item : undefined);
              const digest = item => word(item, /^sha256:[a-f0-9]{64}$/);
              const code = item => word(item, /^QA_[A-Z_]{1,80}$/);
              const count = item => (Array.isArray(item) ? item.length : undefined);
              const reference = item => (["podman", "docker"].includes(item?.engine) && /^[a-f0-9]{64}$/.test(item?.id || "") ? `${item.engine}:${item.id}` : undefined);
              const references = list => (Array.isArray(list) ? list.map(reference).filter(Boolean) : undefined);
              const clean = object => Object.fromEntries(Object.entries(object).filter(([, item]) => item !== undefined));
              const policy = ["policy-state.json", "sessions-revocations.json", "policy-audit.log", "policy-audit-archive"];
              const backup = /^\.?(?:pruning-)?redeploy-[A-Za-z0-9]{8}(?:-[A-Za-z.-]{1,24})?$/;
              const workspace = value?.workspace && typeof value.workspace === "object" ? value.workspace : null;
              const quiesce = value?.quiesce && typeof value.quiesce === "object" ? value.quiesce : null;
              const out = clean({
                result: word(value?.result), scope: word(value?.scope), mode: word(value?.mode), phase: word(value?.phase), code: code(value?.code),
                removedContainers: references(value?.removedContainers), removedImages: references(value?.removedImages),
                retainedImages: Array.isArray(value?.retainedImages) ? value.retainedImages.map(item => clean({ image: reference(item),
                  reason: word(item?.reason, /^[a-z-]{1,48}$/) })).filter(item => item.image) : undefined,
                removedVolumes: count(value?.removedVolumes), warnings: count(value?.warnings),
                stash: typeof value?.stash === "boolean" ? value.stash : word(value?.stash),
                marker: word(value?.marker?.operation, /^[a-z-]{1,16}$/),
                quiesce: quiesce ? clean({ result: word(quiesce.result), phase: word(quiesce.phase), code: code(quiesce.code) }) : undefined,
                workspace: workspace ? clean({ result: word(workspace.result), deleted: count(workspace.deleted), deleteTargets: count(workspace.delete),
                  keepCount: Number.isSafeInteger(workspace.keep?.count) ? workspace.keep.count : undefined, keepDigest: digest(workspace.keep?.digest),
                  digest: digest(workspace.digest) }) : undefined,
                copied: Array.isArray(value?.copied) ? value.copied.filter(name => policy.includes(name)) : undefined,
                discarded: count(value?.discarded), stashRemoved: typeof value?.stashRemoved === "boolean" ? value.stashRemoved : undefined,
                retainedBackups: Array.isArray(value?.retainedBackups) ? value.retainedBackups.map(item => clean({
                  name: typeof item?.name === "string" && backup.test(item.name) ? item.name : "unrecognized", reason: word(item?.reason, /^[a-z-]{1,48}$/) })) : undefined,
                removedBackups: count(value?.legacyBackups?.removed),
                privileged: value?.privileged && typeof value.privileged === "object" ? clean({ operation: word(value.privileged.operation, /^[a-z-]{1,32}$/),
                  code: code(value.privileged.code) }) : undefined,
              });
              process.stdout.write(JSON.stringify(out));
            ' || printf '{"unreadable":true}'
          }
          # END QA safe receipts

          # BEGIN QA protected resource snapshot
          PROTECTED_BEFORE_FILE="$(mktemp /tmp/explorer_qa_protected_before.XXXXXX)"
          PROTECTED_AFTER_FILE="$(mktemp /tmp/explorer_qa_protected_after.XXXXXX)"
          node "$QA_HELPERS_DIR/qa-teardown.mjs" protected-snapshot > "$PROTECTED_BEFORE_FILE"
          echo "[deploy-qa] Protected host resource identity sha256=$(sha256sum "$PROTECTED_BEFORE_FILE" | awk '{print $1}')"
          # END QA protected resource snapshot

          # BEGIN QA route re-proof
          # The route is decided again under this run's host lock with the staged helper. A rebuild is
          # admitted on a running Box without a marker (select), a stopped Box, or an existing marker;
          # a fresh installation only when no current Box exists. Any other answer stops the run before
          # anything is stopped or removed.
          QA_ROUTE="$(node "$QA_HELPERS_DIR/qa-teardown.mjs" route --lock-held)" || {
            echo "[deploy-qa] ERROR: the route was refused; nothing was stopped or removed. Result: ${QA_ROUTE:-none}"
            exit 1
          }
          QA_ROUTE_FIELDS="$(printf '%s' "$QA_ROUTE" | QA_EXPECT_OPERATION="$QA_OPERATION" node --input-type=module -e '
            import fs from "node:fs";
            const route = JSON.parse(fs.readFileSync(0, "utf8"));
            const allowed = process.env.QA_EXPECT_OPERATION === "rebuild" ? ["select", "rebuild"] : ["fresh"];
            if (route?.result !== "routed" || !allowed.includes(route.route)) process.exit(1);
            const exact = route.exact ?? null;
            if (exact !== null && (!["podman", "docker"].includes(exact.engine) || !/^[a-f0-9]{64}$/.test(exact.id || "")
              || typeof exact.running !== "boolean")) process.exit(1);
            if ((route.route === "fresh") !== (exact === null)) process.exit(1);
            const marker = route.marker ?? null;
            if (marker !== null && !["update", "rebuild", "destroy-keep"].includes(marker.operation)) process.exit(1);
            process.stdout.write([route.route, marker ? marker.operation : "", exact ? exact.engine : "", exact ? exact.id : "",
              exact ? String(exact.running) : ""].join("|"));
          ')" || {
            echo "[deploy-qa] ERROR: the route does not admit this ${QA_OPERATION} run; nothing was stopped or removed. Result: ${QA_ROUTE}"
            exit 1
          }
          IFS='|' read -r QA_ROUTE_KIND QA_MARKER_AT_ROUTE QA_EXACT_ENGINE QA_EXACT_ID QA_EXACT_RUNNING <<< "$QA_ROUTE_FIELDS"
          echo "[deploy-qa] Route confirmed under the Reconcile lock: $QA_ROUTE"
          # END QA route re-proof

          assert_qa_preservation_admission() {
          sudo -n /usr/bin/node --input-type=module - "$WORK_DIR" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          // BEGIN QA preservation admission
          const target = process.argv[2];
          assert.equal(target, '/home/admin/explorerQaWorkspace');
          const present = file => { try { return fs.lstatSync(file); } catch (error) { if (error.code === 'ENOENT') return null; throw error; } };
          const workspace = present(target);
          if (workspace) {
              assert(workspace.isDirectory() && !workspace.isSymbolicLink(), 'Unsafe QA workspace');
              for (const name of ['.ploinky', '.ploinky/data', '.data', '.runtime']) {
                  const stat = present(path.join(target, name));
                  if (stat) assert(stat.isDirectory() && !stat.isSymbolicLink(), 'Durable state must not escape the QA workspace');
              }
              const env = present(path.join(target, '.env'));
              if (env) assert(env.isFile() && env.nlink === 1 && env.uid === workspace.uid, 'Unsafe operator .env file');
              // Ploinky 7d8c04d0 keeps the encryption identity under .ploinky/data (12d76a76) and refuses the
              // same controller secrets at the retired .ploinky location once QA is stopped, so a new redeploy
              // admits only the new layout and refuses any retired file before anything is stopped.
              for (const directory of ['.ploinky/data', '.ploinky']) {
                  for (const name of ['master-key', '.secrets', 'passwords.enc', 'ploinky_subject_identity_ed25519_v1.enc']) {
                      const stat = present(path.join(target, directory, name));
                      if (stat) assert(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1, 'Unsafe QA encryption identity');
                  }
              }
              const retiredIdentity = ['master-key', '.secrets', 'ploinky_subject_identity_ed25519_v1.enc']
                  .map(name => path.join('.ploinky', name)).filter(relative => present(path.join(target, relative)));
              assert.equal(retiredIdentity.length, 0, `Retired QA controller secrets at ${retiredIdentity.join(', ')} are refused by the pinned Ploinky runtime; migrate each into .ploinky/data first`);
              const masterKey = path.join(target, '.ploinky/data/master-key');
              if (present(masterKey)) assert(present(masterKey).uid === workspace.uid, 'Unsafe QA master key owner');
              if (present(path.join(target, '.data'))) assert(present(masterKey), 'Durable QA data requires its original master key');
              const runtime = path.join(target, '.runtime');
              if (present(runtime)) assert(fs.readdirSync(runtime).every(name => name === 'ploinky'), 'Unreviewed files in the managed runtime directory');
              const managed = ['.runtime/ploinky', 'AdvancedLanguageAgent'];
              const generations = path.join(target, '.ploinky/agentlib/generations');
              if (present(generations)) {
                  assert(fs.lstatSync(generations).isDirectory() && !fs.lstatSync(generations).isSymbolicLink(), 'Unsafe shared-library generations');
                  for (const name of fs.readdirSync(generations)) {
                      assert.match(name, /^[a-f0-9]{40}-[a-f0-9]{12}$/, 'Unreviewed shared-library generation');
                      managed.push(path.join('.ploinky/agentlib/generations', name));
                  }
              }
              const repos = path.join(target, '.ploinky/repos');
              if (present(repos)) {
                  assert(fs.lstatSync(repos).isDirectory(), 'Unsafe managed repository directory');
                  managed.push(...fs.readdirSync(repos).map(name => path.join('.ploinky/repos', name)));
              }
              for (const relative of managed) {
                  const directory = path.join(target, relative), stat = present(directory);
                  if (!stat) continue;
                  assert(stat.isDirectory() && !stat.isSymbolicLink(), 'A managed source path needs explicit review');
                  const git = args => execFileSync('git', ['-c', `safe.directory=${directory}`, '-C', directory, ...args], {
                      encoding: 'utf8', stdio: 'pipe', env: { ...process.env, GIT_OPTIONAL_LOCKS: '0' },
                  }).trim();
                  assert.equal(git(['rev-parse', '--show-toplevel']), directory, 'Managed source must be its own repository');
                  const origin = git(['remote', 'get-url', 'origin']);
                  if (relative.startsWith('.ploinky/agentlib/generations/')) {
                      assert.equal(origin, path.join(target, '.ploinky/agentlib/mirror.git'), 'Unreviewed shared-library source origin');
                      assert.equal(git(['rev-parse', 'HEAD']), path.basename(relative).slice(0, 40), 'Shared-library generation commit changed');
                  } else assert.match(origin, /^https:\/\/github\.com\/AssistOS-AI\/[A-Za-z0-9_.-]+(?:\.git)?$/i, 'Unreviewed managed source origin');
                  assert.equal(git(['status', '--porcelain=v1', '--untracked-files=all', '--ignore-submodules=none']), '', 'Local managed source edits require reconciliation before redeployment');
              }
              const desiredFile = path.join(target, '.ploinky/edge-desired.json');
              if (present(desiredFile)) {
                  assert(present(desiredFile).isFile(), 'Unsafe routing intent');
                  const desired = JSON.parse(fs.readFileSync(desiredFile, 'utf8'));
                  assert.deepEqual(Object.keys(desired).sort(), ['cloudflare', 'hosts', 'media'], 'Unreviewed routing intent');
                  assert.deepEqual(Object.keys(desired.hosts), ['explorer-qa.axiologic.dev'], 'Unreviewed QA host mapping');
                  assert.deepEqual(desired.hosts['explorer-qa.axiologic.dev'], {
                      agent: 'AchillesIDE/explorer',
                      routerSurfaces: ['browser-auth', 'agent-mcp', 'user-admin', 'workspace-assets', 'blob-transfer', 'marketplace-ui', 'webchat', 'webtty'],
                  }, 'Unreviewed QA router surfaces');
                  assert(/^[a-f0-9-]{36}$/.test(String(desired.cloudflare.tunnelId || ''))
                      && desired.cloudflare.tunnelId !== '091c4096-d1c8-4dbc-bb12-0c6357431d96', 'Unreviewed QA tunnel selection');
                  assert.equal(desired.cloudflare.tunnelTokenSecret, 'publication/explorer-qa-tunnel');
                  assert.equal(desired.cloudflare.apiTokenSecret, 'publication/explorer-qa-api');
                  assert.deepEqual(desired.media, { publicIPv4: '45.136.70.141', addressMode: 'direct' });
              }
          }
          console.log('[deploy-qa] Durable-state admission passed before stopping the previous runtime.');
          // END QA preservation admission
          NODE
          }
          # The admission reads the durable state of an installation that no earlier run began to
          # rebuild. A marker means an earlier run already began, so the workspace may hold the
          # partial state of that run, which the admission would refuse.
          if { [ -e "$WORK_DIR" ] || [ -L "$WORK_DIR" ]; } && [ -z "$QA_MARKER_AT_ROUTE" ]; then
            assert_qa_preservation_admission
          fi


          resolve_default_branch() {
            local repository_url="$1"
            local symref_record default_ref default_branch
            if ! symref_record="$(git ls-remote --symref "$repository_url" HEAD)"; then
              echo "[deploy-qa] ERROR: unable to resolve the default branch for $repository_url." >&2
              return 1
            fi
            default_ref="$({
              printf '%s\n' "$symref_record" |
                awk '$1 == "ref:" && $3 == "HEAD" { print $2; exit }'
            })"
            case "$default_ref" in
              refs/heads/*) ;;
              *)
                echo "[deploy-qa] ERROR: remote HEAD for $repository_url is not a branch." >&2
                return 1
                ;;
            esac
            default_branch="${default_ref#refs/heads/}"
            git check-ref-format --branch "$default_branch" >/dev/null
            printf '%s\n' "$default_branch"
          }

          # BEGIN QA explorer fast-forward proof
          # The dispatch pins the AssistOSExplorer main commit P. A teammate's ordinary push
          # may move main to a descendant R during a long run, so Reconcile accepts R when it
          # is P itself or a fast-forward descendant of P, proven here from the remote
          # history. Anything else (a rewound or rewritten main, a fetch failure) fails
          # closed. The in-place path keeps its exact pin and never calls this function.
          prove_explorer_fast_forward() {
            local expected="$1" resolved="$2" phase="$3" detail proven=0
            case "$phase" in early|late) ;; *) return 1 ;; esac
            if [[ ! "$expected" =~ ^[a-f0-9]{40}$ ]] || [[ ! "$resolved" =~ ^[a-f0-9]{40}$ ]]; then
              echo "[deploy-qa] ERROR: the pinned or resolved AssistOSExplorer commit is missing or malformed."
              return 1
            fi
            if [ "$resolved" = "$expected" ]; then return 0; fi
            QA_ANCESTRY_DIR="$(mktemp -d /tmp/explorer_qa_ancestry.XXXXXX)" || return 1
            if [[ ! "$QA_ANCESTRY_DIR" =~ ^/tmp/explorer_qa_ancestry\.[A-Za-z0-9]{6}$ ]]; then
              QA_ANCESTRY_DIR=""
              return 1
            fi
            # A partial clone of the default branch holds every commit and no file. Removing
            # its remote disables lazy fetching on every git version (GIT_NO_LAZY_FETCH needs
            # 2.44), so a commit outside the default branch's history is refused, not fetched.
            if GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0 timeout 120 git clone --bare --filter=tree:0 --single-branch \
                --branch "$QA_EXPLORER_BRANCH" --no-tags "$QA_EXPLORER_URL" "$QA_ANCESTRY_DIR/history" >/dev/null &&
              git -C "$QA_ANCESTRY_DIR/history" remote remove origin &&
              GIT_NO_LAZY_FETCH=1 timeout 60 git -C "$QA_ANCESTRY_DIR/history" cat-file -e "$expected^{commit}" &&
              GIT_NO_LAZY_FETCH=1 timeout 60 git -C "$QA_ANCESTRY_DIR/history" cat-file -e "$resolved^{commit}" &&
              GIT_NO_LAZY_FETCH=1 timeout 60 git -C "$QA_ANCESTRY_DIR/history" merge-base --is-ancestor "$expected" "$resolved"; then
              proven=1
            fi
            remove_qa_ancestry_dir || true
            if [ "$proven" = 1 ]; then
              echo "[deploy-qa] AssistOSExplorer main moved from $expected to $resolved (fast-forward, $phase); deploying $resolved."
              return 0
            fi
            detail="AchillesIDE/$QA_EXPLORER_BRANCH resolved to $resolved, which is neither the pinned $expected nor a proven fast-forward descendant of it"
            case "$phase:$QA_OPERATION" in
              early:*)
                echo "[deploy-qa] ERROR: $detail; nothing was stopped or removed."
                ;;
              late:*)
                echo "[deploy-qa] ERROR: $detail; the data stays in place and the install marker remains, so dispatching again finishes this installation."
                ;;
              *)
                echo "[deploy-qa] ERROR: $detail."
                ;;
            esac
            return 1
          }
          # END QA explorer fast-forward proof

          if [[ ! "${EXPECTED_EXPLORER_COMMIT:-}" =~ ^[a-f0-9]{40}$ ]]; then
            echo '[deploy-qa] ERROR: the pinned AssistOSExplorer commit is missing or malformed.'
            exit 1
          fi
          QA_EXPLORER_URL='https://github.com/AssistOS-AI/AssistOSExplorer.git'
          QA_EXPLORER_BRANCH="$(resolve_default_branch "$QA_EXPLORER_URL")"
          QA_EXPLORER_HEAD="$(git ls-remote --exit-code --heads "$QA_EXPLORER_URL" "refs/heads/$QA_EXPLORER_BRANCH" | awk 'NR == 1 { print $1 }')"
          prove_explorer_fast_forward "$EXPECTED_EXPLORER_COMMIT" "$QA_EXPLORER_HEAD" early || exit 1
          QA_RESOLVED_EXPLORER_COMMIT="$QA_EXPLORER_HEAD"
          echo "[deploy-qa] Deployment pinned to AchillesIDE/$QA_EXPLORER_BRANCH at $QA_RESOLVED_EXPLORER_COMMIT (dispatch pin $EXPECTED_EXPLORER_COMMIT)."

          # BEGIN QA preflight quiesce check
          # The quiesce helper's own proofs, with no lease, no lock and no stop. They run only for a
          # rebuild of a running Box that no earlier run began to quiesce. A failed proof stops the run
          # before the teardown plan, the capacity admission and the install marker.
          if [ "$QA_OPERATION" = rebuild ] && [ "$QA_EXACT_RUNNING" = true ] && [ -z "$QA_MARKER_AT_ROUTE" ]; then
            QA_PREFLIGHT_RECEIPT="$("$QA_EXACT_ENGINE" container exec -i --user podman \
              --workdir "$WORK_DIR" --env "PLOINKY_WORKSPACE_ROOT=$WORK_DIR" \
              --env PLOINKY_ROUTER_HOST_PORT=8097 --env PLOINKY_MEDIA_HOST_PORT=7882 \
              --env QA_QUIESCE_PREFLIGHT_ONLY=1 \
              "$QA_EXACT_ID" node --input-type=module - <<< "$QA_QUIESCE_SOURCE")" || true
            echo "[deploy-qa] Preflight: quiesce preflight receipt: ${QA_PREFLIGHT_RECEIPT:-none}"
            case "$QA_PREFLIGHT_RECEIPT" in
              *'"result":"preflight-passed"'*)
                echo '[deploy-qa] Preflight: quiesce preflight passed; no service was stopped and no workspace file was removed.'
                ;;
              *)
                echo '[deploy-qa] ERROR: the quiesce preflight failed; no service was stopped and no workspace file was removed.'
                exit 1
                ;;
            esac
          else
            echo '[deploy-qa] Preflight: quiesce preflight skipped; there is no running Box without an earlier marker.'
          fi
          # END QA preflight quiesce check

          # BEGIN QA read-only plan
          # Read-only. It names what the teardown would stop and delete, refuses unsafe workspace state,
          # measures what can be reclaimed as root, and fixes the digest that the teardown must reproduce.
          # Nothing is stopped or removed here.
          QA_SCOPE=fresh
          if [ "$QA_OPERATION" = rebuild ]; then QA_SCOPE=rebuild; fi
          QA_PLAN="$(node "$QA_HELPERS_DIR/qa-teardown.mjs" plan --scope "$QA_SCOPE" --mode keep-data --lock-held)" || {
            echo "[deploy-qa] ERROR: the teardown plan was refused; nothing was stopped or removed. Result: $(printf '%s' "$QA_PLAN" | qa_safe_result)"
            exit 1
          }
          QA_PLAN_SUMMARY="$(printf '%s' "$QA_PLAN" | QA_SCOPE="$QA_SCOPE" node --input-type=module -e '
            import fs from "node:fs";
            const plan = JSON.parse(fs.readFileSync(0, "utf8"));
            const capacity = plan?.capacity;
            const numbers = ["freeBytes", "reclaimableBytes", "pullBytes", "minimumFreeBytes"];
            if (plan?.result !== "planned" || plan.scope !== process.env.QA_SCOPE || plan.mode !== "keep-data"
              || !/^sha256:[a-f0-9]{64}$/.test(plan.digest || "") || !capacity
              || numbers.some(name => !Number.isSafeInteger(capacity[name]) || capacity[name] < 0)) process.exit(1);
            const count = value => (Array.isArray(value) ? value.length : 0);
            process.stdout.write(JSON.stringify({ scope: plan.scope, mode: plan.mode, digest: plan.digest,
              containers: count(plan.containers), volumes: count(plan.volumes), imagesRemoved: count(plan.images?.remove),
              imagesRetained: count(plan.images?.retained), marker: plan.marker?.operation ?? null, stash: plan.stash === true,
              keepCount: Number.isSafeInteger(plan.workspace?.keep?.count) ? plan.workspace.keep.count : null,
              keepDigest: /^sha256:[a-f0-9]{64}$/.test(plan.workspace?.keep?.digest || "") ? plan.workspace.keep.digest : null,
              deleteTargets: count(plan.workspace?.delete),
              capacity: Object.fromEntries(numbers.map(name => [name, capacity[name]])) }));
          ')" || {
            echo "[deploy-qa] ERROR: the teardown plan is malformed; nothing was stopped or removed. Result: $(printf '%s' "$QA_PLAN" | qa_safe_result)"
            exit 1
          }
          QA_PLAN_DIGEST="$(printf '%s' "$QA_PLAN_SUMMARY" | node --input-type=module -e '
            import fs from "node:fs";
            process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).digest);
          ')"
          QA_PLAN_CAPACITY="$(printf '%s' "$QA_PLAN_SUMMARY" | node --input-type=module -e '
            import fs from "node:fs";
            process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync(0, "utf8")).capacity));
          ')"
          echo "[deploy-qa] Teardown plan: $QA_PLAN_SUMMARY"
          # END QA read-only plan

          # The numbers come from the plan: the privileged program measured what the teardown deletes. The
          # floor is repeated here, so a plan cannot lower the requirement.
          node --input-type=module - "$QA_PLAN_CAPACITY" <<'NODE'
          import assert from 'node:assert/strict';

          // BEGIN QA capacity admission
          const capacity = JSON.parse(process.argv[2]);
          const minimum = 16n * 1024n ** 3n;
          const numbers = ['freeBytes', 'reclaimableBytes', 'pullBytes', 'minimumFreeBytes'];
          assert(numbers.every(name => Number.isSafeInteger(capacity[name]) && capacity[name] >= 0), 'Invalid capacity measurement in the teardown plan');
          assert.equal(BigInt(capacity.minimumFreeBytes), minimum, 'The teardown plan lowered the 16 GiB floor');
          const free = BigInt(capacity.freeBytes);
          const reclaimable = BigInt(capacity.reclaimableBytes);
          const required = minimum + BigInt(capacity.pullBytes);
          console.log('[deploy-qa] Capacity diagnostics:', JSON.stringify({
              version: 3,
              availableBytes: free.toString(),
              reclaimableBytes: reclaimable.toString(),
              minimumFreeBytes: minimum.toString(),
              pullBytes: String(capacity.pullBytes),
              requiredBytes: required.toString(),
              shortfallBytes: (required > free + reclaimable ? required - free - reclaimable : 0n).toString(),
          }));
          assert(free + reclaimable >= required, 'Insufficient QA capacity for the rebuilt runtime; free space or review the teardown plan before anything is stopped');
          console.log('[deploy-qa] Capacity admission passed before stopping the previous runtime.');
          // END QA capacity admission
          NODE

          # BEGIN QA install marker
          # The first mutation. From here on a failure keeps the marker, and the next deploy finishes
          # this installation from the data that stays in place.
          QA_MARK="$(node "$QA_HELPERS_DIR/qa-teardown.mjs" mark --operation "$QA_OPERATION" --dispatch "$QA_DISPATCH" --lock-held)" || {
            echo "[deploy-qa] ERROR: the install marker was not written; nothing was stopped or removed. Result: ${QA_MARK:-none}"
            exit 1
          }
          QA_MARKED=1
          echo "[deploy-qa] Install marker: $QA_MARK"
          # The marker that existed before this run decides how strict the quiesce is: the first attempt
          # must quiesce, a later one may find the Box already partly stopped.
          QA_QUIESCE_MODE=fatal
          if [ -n "$QA_MARKER_AT_ROUTE" ]; then QA_QUIESCE_MODE=warn; fi
          # END QA install marker

          # BEGIN QA teardown
          # Stops and removes the QA containers and their image, stashes the access policy and reduces
          # the workspace to the data that is kept. The receipt names exactly what was removed.
          QA_TEARDOWN_RECEIPT="$(node "$QA_HELPERS_DIR/qa-teardown.mjs" execute --scope "$QA_SCOPE" --mode keep-data --quiesce "$QA_QUIESCE_MODE" --plan-digest "$QA_PLAN_DIGEST" --lock-held)" || {
            echo "[deploy-qa] ERROR: the teardown failed; the install marker is kept. Result: $(printf '%s' "$QA_TEARDOWN_RECEIPT" | qa_safe_result)"
            exit 1
          }
          echo "[deploy-qa] Teardown receipt: $(printf '%s' "$QA_TEARDOWN_RECEIPT" | qa_safe_result)"
          # What the teardown did with the access policy decides what the restore must find.
          QA_TEARDOWN_STASH="$(printf '%s' "$QA_TEARDOWN_RECEIPT" | node --input-type=module -e '
            import fs from "node:fs";
            const stash = JSON.parse(fs.readFileSync(0, "utf8"))?.stash;
            if (!["created", "kept", "none"].includes(stash)) process.exit(1);
            process.stdout.write(stash);
          ')" || {
            echo "[deploy-qa] ERROR: the teardown receipt does not state what happened to the access policy; the install marker is kept."
            exit 1
          }
          # END QA teardown

          mkdir -p "$WORK_DIR"
          chmod 700 "$WORK_DIR"
          cd "$WORK_DIR"
          node --input-type=module - "$WORK_DIR/.env" <<'NODE'
          import fs from 'node:fs';

          // BEGIN QA bootstrap environment
          const target = process.argv[2];
          const key = String(process.env.PLOINKY_MASTER_KEY || '');
          const content = `PLOINKY_MASTER_KEY=${key}\n`;
          if (!/^[A-Fa-f0-9]{64}$/.test(key)) {
            throw new Error('invalid QA Ploinky master key');
          }
          try {
            const current = fs.lstatSync(target);
            if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1
              || (typeof process.getuid === 'function' && current.uid !== process.getuid())) {
              throw new Error(`refusing unsafe workspace master-key target: ${target}`);
            }
            // Existing operator settings remain byte-for-byte intact. Managed
            // Box encryption uses the preserved master key under .ploinky/data (or the legacy .ploinky) identity.
            fs.chmodSync(target, 0o600);
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
            fs.writeFileSync(target, content, { encoding: 'utf8', flag: 'wx', mode: 0o600 });
            fs.chmodSync(target, 0o600);
          }
          // END QA bootstrap environment
          NODE
          unset PLOINKY_MASTER_KEY
          mkdir -p "$WORK_DIR/.runtime"
          RUNTIME_DIR="$WORK_DIR/.runtime/ploinky"

          inspect_outer_box_status() {
            env PLOINKY_WORKSPACE_ROOT="$WORK_DIR" \
              node --input-type=module - \
                "$RUNTIME_DIR/ploinky-box/supervisor.mjs" <<'NODE'
          import { pathToFileURL } from 'node:url';

          const supervisorModule = process.argv[2];
          const {
            createBoxSupervisor,
            formatBoxStatus,
          } = await import(pathToFileURL(supervisorModule).href);
          const status = createBoxSupervisor().inspectBoxStatus();
          process.stdout.write(formatBoxStatus(status));
          NODE
          }

          if [ -e "$RUNTIME_DIR" ] && [ ! -d "$RUNTIME_DIR/.git" ]; then
            echo "[deploy-qa] ERROR: managed runtime path is not a Ploinky git checkout: $RUNTIME_DIR"
            exit 1
          fi
          if [ ! -d "$RUNTIME_DIR/.git" ]; then
            echo "[deploy-qa] Cloning the dedicated QA Ploinky runtime..."
            git clone --no-checkout https://github.com/AssistOS-AI/ploinky.git "$RUNTIME_DIR"
          fi

          RUNTIME_ORIGIN="$(git -C "$RUNTIME_DIR" remote get-url origin)"
          case "${RUNTIME_ORIGIN%.git}" in
            https://github.com/AssistOS-AI/ploinky) ;;
            *)
              echo "[deploy-qa] ERROR: unexpected Ploinky runtime origin '$RUNTIME_ORIGIN'."
              exit 1
              ;;
          esac


          GRAPH_REPOSITORIES=(
            'AchillesIDE|https://github.com/AssistOS-AI/AssistOSExplorer.git'
            'UmamiAgent|https://github.com/AssistOS-AI/UmamiAgent.git'
            'OnlyOfficeAgent|https://github.com/AssistOS-AI/OnlyOfficeAgent.git'
            'AchillesCLI|https://github.com/AssistOS-AI/AchillesCLI.git'
            'copilot-agents|https://github.com/AssistOS-AI/copilot-agents.git'
            'webmeet|https://github.com/AssistOS-AI/webmeet.git'
          )
          BRANCH_ARGS=()
          declare -A EXPECTED_BRANCHES=()
          declare -A EXPECTED_COMMITS=()

          echo "[deploy-qa] Resolving every managed repository from its configured default branch..."
          for repository_record in "${GRAPH_REPOSITORIES[@]}"; do
            IFS='|' read -r repository_name repository_url <<< "$repository_record"
            default_branch="$(resolve_default_branch "$repository_url")"
            if ! branch_record="$(
              git ls-remote --exit-code --heads \
                "$repository_url" \
                "refs/heads/$default_branch"
            )"; then
              echo "[deploy-qa] ERROR: $repository_name has no '$default_branch' branch."
              exit 1
            fi
            expected_commit="$(
              printf '%s\n' "$branch_record" | awk 'NR == 1 { print $1 }'
            )"
            if [[ ! "$expected_commit" =~ ^[a-f0-9]{40}$ ]]; then
              echo "[deploy-qa] ERROR: unable to resolve $repository_name/$default_branch."
              exit 1
            fi
            EXPECTED_BRANCHES["$repository_name"]="$default_branch"
            EXPECTED_COMMITS["$repository_name"]="$expected_commit"
            BRANCH_ARGS+=(--repo-branch "$repository_name=$default_branch")
            echo "[deploy-qa] Selected $repository_name/$default_branch at $expected_commit."
          done
          EXPLORER_BRANCH="${EXPECTED_BRANCHES[AchillesIDE]}"
          # The commit may have moved since the early check. It is accepted when it is the pin or a
          # proven fast-forward descendant of it, and the post-start check carries what was cloned.
          prove_explorer_fast_forward "$EXPECTED_EXPLORER_COMMIT" "${EXPECTED_COMMITS[AchillesIDE]}" late || exit 1
          echo "[deploy-qa] Selected AssistOSExplorer commit ${EXPECTED_COMMITS[AchillesIDE]} (dispatch pin $EXPECTED_EXPLORER_COMMIT)."

          PLOINKY_URL='https://github.com/AssistOS-AI/ploinky.git'
          PLOINKY_BRANCH="$(resolve_default_branch "$PLOINKY_URL")"
          echo "[deploy-qa] Selected Ploinky/$PLOINKY_BRANCH."

          git -C "$RUNTIME_DIR" fetch --prune origin \
            "refs/heads/$PLOINKY_BRANCH:refs/remotes/origin/$PLOINKY_BRANCH"
          git -C "$RUNTIME_DIR" checkout -B "$PLOINKY_BRANCH" "refs/remotes/origin/$PLOINKY_BRANCH"
          git -C "$RUNTIME_DIR" branch --set-upstream-to="origin/$PLOINKY_BRANCH" "$PLOINKY_BRANCH"
          git -C "$RUNTIME_DIR" reset --hard "refs/remotes/origin/$PLOINKY_BRANCH"
          git -C "$RUNTIME_DIR" clean -ffd

          PLOINKY="$RUNTIME_DIR/bin/ploinky"
          if [ ! -x "$PLOINKY" ]; then
            echo "[deploy-qa] ERROR: selected Ploinky branch does not provide bin/ploinky."
            exit 1
          fi
          echo "[deploy-qa] Ploinky runtime: $(git -C "$RUNTIME_DIR" rev-parse --short HEAD) ($PLOINKY_BRANCH)"
          # The Box image supplies achillesAgentLib, identified by that exact
          # image. It is verified with the image's own probe once the Box runs.
          echo "[deploy-qa] achillesAgentLib comes from the Box image; no commit is pinned."

          ALA_URL='https://github.com/AssistOS-AI/AdvancedLanguageAgent.git'
          ALA_BRANCH="$(resolve_default_branch "$ALA_URL")"
          ALA_COMMIT="$(git ls-remote --exit-code --heads "$ALA_URL" "refs/heads/$ALA_BRANCH" | awk 'NR == 1 { print $1 }')"
          ALA_DIR="$WORK_DIR/AdvancedLanguageAgent"
          if [[ ! "$ALA_COMMIT" =~ ^[a-f0-9]{40}$ ]] || [ -e "$ALA_DIR" ] || [ -L "$ALA_DIR" ]; then
            echo "[deploy-qa] ERROR: ALA requires an exact default-branch commit and an absent fresh checkout."
            exit 1
          fi
          git clone --single-branch --branch "$ALA_BRANCH" "$ALA_URL" "$ALA_DIR"
          verify_ala_checkout() {
            if [ "$(git -C "$ALA_DIR" rev-parse HEAD)" != "$ALA_COMMIT" ] ||
              [ "$(git -C "$ALA_DIR" branch --show-current)" != "$ALA_BRANCH" ] ||
              [ "$(git -C "$ALA_DIR" rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" != "origin/$ALA_BRANCH" ] ||
              [ -n "$(git -C "$ALA_DIR" status --porcelain)" ]; then
              echo "[deploy-qa] ERROR: ALA checkout must remain clean and track the selected default-branch commit."
              return 1
            fi
            echo "[deploy-qa] Verified AdvancedLanguageAgent/$ALA_BRANCH at $ALA_COMMIT."
          }
          verify_ala_checkout

          mkdir -p "$WORK_DIR/.ploinky"
          chmod 700 "$WORK_DIR/.ploinky"
          EDGE_DESIRED_FILE="$WORK_DIR/.ploinky/edge-desired.json"
          node --input-type=module - \
            "$EDGE_DESIRED_FILE" \
            "$PUBLIC_HOST" \
            "$CLOUDFLARE_ACCOUNT_ID" \
            "$CLOUDFLARE_ZONE_ID" \
            "$CLOUDFLARE_TUNNEL_ID" \
            "$CLOUDFLARE_TUNNEL_SECRET_HANDLE" \
            "$CLOUDFLARE_API_SECRET_HANDLE" \
            "$MEDIA_PUBLIC_IPV4" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const target = path.resolve(process.argv[2]);
          const [
            publicHost,
            accountId,
            zoneId,
            tunnelId,
            tunnelTokenSecret,
            apiTokenSecret,
            mediaPublicIPv4,
          ] = process.argv.slice(3);
          const desired = {
            hosts: {
              [publicHost]: {
                agent: 'AchillesIDE/explorer',
                routerSurfaces: [
                  'browser-auth',
                  'agent-mcp',
                  'user-admin',
                  'workspace-assets',
                  'blob-transfer',
                  'marketplace-ui',
                  'webchat',
                  'webtty',
                ],
              },
            },
            cloudflare: {
              accountId,
              zoneId,
              tunnelId,
              tunnelTokenSecret,
              apiTokenSecret,
            },
            media: {
              publicIPv4: mediaPublicIPv4,
              addressMode: 'direct',
            },
          };
          try {
            const current = fs.lstatSync(target);
            if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
              throw new Error(`refusing unsafe edge desired target: ${target}`);
            }
          } catch (error) {
            if (error?.code !== 'ENOENT') throw error;
          }
          const temporary = `${target}.${process.pid}.tmp`;
          try {
            fs.writeFileSync(temporary, `${JSON.stringify(desired, null, 2)}\n`, {
              encoding: 'utf8',
              flag: 'wx',
              mode: 0o600,
            });
            fs.renameSync(temporary, target);
            fs.chmodSync(target, 0o600);
          } finally {
            try { fs.unlinkSync(temporary); } catch (error) {
              if (error?.code !== 'ENOENT') throw error;
            }
          }
          NODE
          echo "[deploy-qa] Selected the exact dedicated Cloudflare tunnel for $PUBLIC_HOST."

          SOUL_HEALTH_URL="http://127.0.0.1:${SOUL_GATEWAY_ROUTER_PORT:-8080}/base-agent-additional-server/soul-gateway/7000/healthz/"
          SOUL_UP_BEFORE=0
          if curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            SOUL_UP_BEFORE=1
            echo "[deploy-qa] Protected Soul Gateway was healthy before deployment."
          fi

          export PLOINKY_WORKSPACE_ROOT="$WORK_DIR"
          PLAN_JSON="$(
            "$PLOINKY" --dry-run --port "$ROUTER_PORT" start explorer "${BRANCH_ARGS[@]}"
          )"
          BOX_INSTANCE="$(
            printf '%s' "$PLAN_JSON" |
              node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  const plan = JSON.parse(input);
                  if (!/^ploinky-box-[a-z0-9-]+-[a-f0-9]{12}$/.test(plan.identity || "")) {
                    throw new Error("invalid Box identity in dry-run plan");
                  }
                  process.stdout.write(plan.identity);
                });
              '
          )"
          if [ "$BOX_INSTANCE" != "ploinky-box-explorerqaworkspace-$BOX_PATH_HASH" ]; then
            echo "[deploy-qa] ERROR: Ploinky dry-run selected an identity outside the pinned Explorer QA Box."
            exit 1
          fi
          echo "[deploy-qa] Box plan: $PLAN_JSON"

          echo "[deploy-qa] Preparing the exact QA Box..."
          node --input-type=module - \
            "$RUNTIME_DIR/ploinky-box/supervisor.mjs" \
            "$ROUTER_PORT" <<'NODE'
          import { pathToFileURL } from 'node:url';

          const supervisorModule = process.argv[2];
          const routerPort = Number(process.argv[3]);
          if (!Number.isSafeInteger(routerPort) || routerPort < 1 || routerPort > 65535) {
            throw new Error('invalid Router port');
          }
          const { createBoxSupervisor } = await import(pathToFileURL(supervisorModule).href);
          await createBoxSupervisor().prepareBoxForCommand({ explicitPort: routerPort });
          NODE

          BOX_ENGINE=""
          for candidate in podman docker; do
            if command -v "$candidate" >/dev/null 2>&1 &&
              "$candidate" container inspect "$BOX_INSTANCE" >/dev/null 2>&1; then
              if [ -n "$BOX_ENGINE" ]; then
                echo "[deploy-qa] ERROR: Box identity exists in more than one container engine."
                exit 1
              fi
              BOX_ENGINE="$candidate"
            fi
          done
          if [ -z "$BOX_ENGINE" ]; then
            echo "[deploy-qa] ERROR: exact Box instance '$BOX_INSTANCE' was not found."
            exit 1
          fi

          "$BOX_ENGINE" container exec --user podman --workdir "$WORK_DIR" \
            --env "PLOINKY_WORKSPACE_ROOT=$WORK_DIR" "$BOX_INSTANCE" node --input-type=module -e '
              const { initializeFreshEdgeRoutingSources } = await import("/opt/ploinky/cli/sandbox/edgeGeneration.js");
              initializeFreshEdgeRoutingSources({ workspaceRoot: "/home/admin/explorerQaWorkspace" });
            '
          # BEGIN QA policy restoration
          # One restore, the tested one: the helper removes the destination entry before it copies, verifies
          # each copy under the mount guard, discards leftovers and removes the stash. The stash is gone before
          # the Box starts; any other answer leaves the marker and the stash for the next deploy. A teardown that
          # stashed the policy (created) or found a stash (kept) must be answered by a restore, never by no-stash.
          QA_RESTORE="$(node "$QA_HELPERS_DIR/qa-teardown.mjs" stash-restore --lock-held)" || {
            echo "[deploy-qa] ERROR: the access policy was not restored; the install marker and the stash remain for the next deploy. Result: $(printf '%s' "$QA_RESTORE" | qa_safe_result)"
            exit 1
          }
          QA_RESTORE_LINE="$(printf '%s' "$QA_RESTORE" | QA_EXPECT_STASH="$QA_TEARDOWN_STASH" node --input-type=module -e '
            import fs from "node:fs";
            const restore = JSON.parse(fs.readFileSync(0, "utf8"));
            const policy = ["policy-state.json", "sessions-revocations.json", "policy-audit.log", "policy-audit-archive"];
            const expected = process.env.QA_EXPECT_STASH;
            if (restore?.result === "no-stash" && expected === "none" && Array.isArray(restore.copied) && restore.copied.length === 0
              && restore.stashRemoved === false) {
              process.stdout.write("fresh access policy: no stashed policy exists, so nothing is restored.");
            } else if (restore?.result === "restored" && Array.isArray(restore.copied) && restore.copied.length > 0
              && restore.copied.every(name => policy.includes(name)) && restore.stashRemoved === true) {
              process.stdout.write(`Durable access policy, revocations and audit history restored before graph activation (${restore.copied.join(", ")}); the stash was removed.`);
            } else process.exit(1);
          ')" || {
            echo "[deploy-qa] ERROR: the access policy restore receipt is not a complete restore; the install marker and the stash remain for the next deploy. Result: $(printf '%s' "$QA_RESTORE" | qa_safe_result)"
            exit 1
          }
          echo "[deploy-qa] $QA_RESTORE_LINE"
          # END QA policy restoration

          echo "[deploy-qa] Checking the dependency-free ALA CLI contract..."
          "$BOX_ENGINE" container exec -i --user podman "$BOX_INSTANCE" \
            node --input-type=module - "$WORK_DIR/AdvancedLanguageAgent" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';

          const [alaRoot] = process.argv.slice(2);
          for (const directory of [alaRoot, path.join(alaRoot, 'bin')]) {
              const stat = fs.lstatSync(directory);
              assert.ok(stat.isDirectory() && !stat.isSymbolicLink(), 'ALA checkout and bin must be real directories');
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(alaRoot, 'package.json'), 'utf8'));
          assert.equal(manifest.name, 'advanced-language-agent');
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              assert.deepEqual(Object.keys(manifest[field] || {}), [], 'ALA runtime dependency changes require deployment review');
          }
          const executable = path.join(alaRoot, 'bin/ala.mjs');
          const stat = fs.lstatSync(executable);
          assert.ok(stat.isFile() && !stat.isSymbolicLink(), 'ALA CLI must be a regular file');
          fs.accessSync(executable, fs.constants.X_OK);
          const help = spawnSync(process.execPath, [executable, '--help'], { encoding: 'utf8', timeout: 15000 });
          assert.equal(help.status, 0, 'ALA help must run successfully');
          for (const option of ['--home', '--cwd', '--MCPServers']) {
              assert.ok(help.stdout.includes(option), 'ALA must support ' + option);
          }
          console.log('[deploy-qa] Dependency-free ALA supports the RoboTeam CLI contract.');
          NODE
          verify_ala_checkout

          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const target = "/home/admin/explorerQaWorkspace/.ploinky";
              try {
                const current = fs.lstatSync(target);
                if (!current.isDirectory() || current.isSymbolicLink()) {
                  throw new Error(`refusing unsafe Ploinky authority directory: ${target}`);
                }
                if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                  throw new Error(`Ploinky authority directory has the wrong owner: ${target}`);
                }
              } catch (error) {
                if (error?.code !== "ENOENT") throw error;
                fs.mkdirSync(target, { mode: 0o700 });
              }
              fs.chmodSync(target, 0o700);
            '

          STAGED_EDGE_DESIRED="$WORK_DIR/.ploinky/.explorer-qa-edge-desired.json"
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const staged = "/home/admin/explorerQaWorkspace/.ploinky/.explorer-qa-edge-desired.json";
              try {
                const current = fs.lstatSync(staged);
                if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
                  throw new Error(`refusing unsafe staged edge desired file: ${staged}`);
                }
                if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                  throw new Error(`staged edge desired file has the wrong owner: ${staged}`);
                }
                fs.unlinkSync(staged);
              } catch (error) {
                if (error?.code !== "ENOENT") throw error;
              }
            '
          "$BOX_ENGINE" container cp \
            "$EDGE_DESIRED_FILE" \
            "$BOX_INSTANCE:$STAGED_EDGE_DESIRED"
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
              import fs from "node:fs";
              const staged = "/home/admin/explorerQaWorkspace/.ploinky/.explorer-qa-edge-desired.json";
              const target = "/home/admin/explorerQaWorkspace/.ploinky/edge-desired.json";
              try {
                const stagedStat = fs.lstatSync(staged);
                if (!stagedStat.isFile() || stagedStat.isSymbolicLink() || stagedStat.nlink !== 1) {
                  throw new Error(`refusing unsafe staged edge desired file: ${staged}`);
                }
                if (typeof process.getuid === "function" && stagedStat.uid !== process.getuid()) {
                  throw new Error(`staged edge desired file has the wrong owner: ${staged}`);
                }
                JSON.parse(fs.readFileSync(staged, "utf8"));
                try {
                  const current = fs.lstatSync(target);
                  if (!current.isFile() || current.isSymbolicLink() || current.nlink !== 1) {
                    throw new Error(`refusing unsafe edge desired target: ${target}`);
                  }
                  if (typeof process.getuid === "function" && current.uid !== process.getuid()) {
                    throw new Error(`edge desired target has the wrong owner: ${target}`);
                  }
                } catch (error) {
                  if (error?.code !== "ENOENT") throw error;
                }
                fs.renameSync(staged, target);
                fs.chmodSync(target, 0o600);
              } finally {
                try { fs.unlinkSync(staged); } catch (error) {
                  if (error?.code !== "ENOENT") throw error;
                }
              }
            '

          CLOUDFLARE_CREDENTIAL_FILE="$(mktemp /tmp/explorer_qa_cloudflare.XXXXXX)"
          node --input-type=module - "$CLOUDFLARE_CREDENTIAL_FILE" <<'NODE'
          import fs from 'node:fs';

          const target = process.argv[2];
          const values = {
            'publication/explorer-qa-api': String(process.env.CLOUDFLARE_API_TOKEN || ''),
            'publication/explorer-qa-tunnel': String(process.env.CLOUDFLARE_TUNNEL_TOKEN || ''),
          };
          if (Object.values(values).some((value) => !value)) {
            throw new Error('Cloudflare credentials are missing');
          }
          fs.writeFileSync(target, JSON.stringify(values), {
            encoding: 'utf8',
            flag: 'w',
            mode: 0o600,
          });
          fs.chmodSync(target, 0o600);
          NODE
          STAGED_CREDENTIAL_FILE="$WORK_DIR/.ploinky/.explorer-qa-cloudflare-credentials.json"
          CREDENTIAL_STATUS=0
          "$BOX_ENGINE" container cp \
            "$CLOUDFLARE_CREDENTIAL_FILE" \
            "$BOX_INSTANCE:$STAGED_CREDENTIAL_FILE" || CREDENTIAL_STATUS=$?
          if [ "$CREDENTIAL_STATUS" = "0" ]; then
            "$BOX_ENGINE" container exec \
              --user podman \
              --workdir "$WORK_DIR" \
              --env "PLOINKY_WORKSPACE_ROOT=$WORK_DIR" \
              "$BOX_INSTANCE" \
              node --input-type=module --eval '
                import fs from "node:fs";
                import { setSecretValue } from "/opt/ploinky/cli/utils/security/encryptedSecretsFile.js";
                const file = process.argv.at(-1);
                const values = JSON.parse(fs.readFileSync(file, "utf8"));
                const expected = [
                  "publication/explorer-qa-api",
                  "publication/explorer-qa-tunnel",
                ];
                if (JSON.stringify(Object.keys(values).sort()) !== JSON.stringify(expected)) {
                  throw new Error("unexpected Cloudflare credential handles");
                }
                for (const [name, value] of Object.entries(values)) {
                  if (!String(value || "")) throw new Error(`empty Cloudflare credential ${name}`);
                  setSecretValue(name, value);
                }
              ' "$STAGED_CREDENTIAL_FILE" || CREDENTIAL_STATUS=$?
          fi
          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            rm -f "$STAGED_CREDENTIAL_FILE" >/dev/null 2>&1 || true
          rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
          CLOUDFLARE_CREDENTIAL_FILE=""
          unset CLOUDFLARE_API_TOKEN
          unset CLOUDFLARE_TUNNEL_TOKEN
          if [ "$CREDENTIAL_STATUS" != "0" ]; then
            echo "[deploy-qa] ERROR: unable to persist Cloudflare credentials in the encrypted Ploinky store."
            exit "$CREDENTIAL_STATUS"
          fi

          "$BOX_ENGINE" container exec -i --user podman --workdir "$WORK_DIR" \
            --env "QA_USERPERSISTO_GOOGLE_CLIENT_ID=$QA_USERPERSISTO_GOOGLE_CLIENT_ID" \
            --env "PLOINKY_WORKSPACE_ROOT=$WORK_DIR" "$BOX_INSTANCE" node --input-type=module - "$PUBLIC_URL" <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { collectManifestEnv } from '/opt/ploinky/cli/utils/security/secretVars.js';
          import { handleVarCommand } from '/opt/ploinky/cli/commands/envVarCommands.js';

          // BEGIN QA UserPersisto configuration
          const publicUrl = process.argv[2];
          assert.equal(publicUrl, 'https://explorer-qa.axiologic.dev');
          const googleClientId = String(process.env.QA_USERPERSISTO_GOOGLE_CLIENT_ID || '').trim();
          assert(!googleClientId || (googleClientId.length <= 512 && /^[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/.test(googleClientId)),
              'EXPLORER_QA_USERPERSISTO_GOOGLE_CLIENT_ID must be a Google Web application client ID');
          // Use the same secret/alias, process, .env and default precedence as
          // the agent launch. Generic getSecret has a different precedence.
          const { resolved } = collectManifestEnv({ env: {
              USERPERSISTO_ALLOWED_REDIRECT_ORIGINS: { default: '' },
              PERSISTENCE_FOLDER: { default: '/data/persisto' },
          } });
          const values = Object.fromEntries(resolved.map(entry => [entry.insideName, entry.value]));
          let origins = String(values.USERPERSISTO_ALLOWED_REDIRECT_ORIGINS || '').split(',').map(value => value.trim()).filter(Boolean);
          if (!origins.length) {
              assert.equal(values.PERSISTENCE_FOLDER, '/data/persisto', 'Review the noncanonical UserPersisto persistence folder before configuring QA origins');
              // The service is stopped. Read its preserved snapshot without
              // opening/migrating the store or touching users and setup state.
              const folder = '/home/admin/explorerQaWorkspace/.data/userPersistoAgent/persisto';
              let objects = {};
              try {
                  const snapshot = JSON.parse(fs.readFileSync(`${folder}/.userpersisto.snapshot.json`, 'utf8'));
                  assert.equal(snapshot.version, 1);
                  assert.equal(typeof snapshot.payload, 'string');
                  assert.equal(crypto.createHash('sha256').update(snapshot.payload).digest('hex'), snapshot.sha256,
                      'Preserved UserPersisto snapshot checksum mismatch');
                  objects = JSON.parse(snapshot.payload);
                  assert(Number.isSafeInteger(objects?.system?.currentIDNumber), 'Invalid UserPersisto snapshot system record');
              } catch (error) {
                  if (error.code !== 'ENOENT') throw error;
                  let entries = [];
                  try { entries = fs.readdirSync(folder, { withFileTypes: true }); } catch (readError) {
                      if (readError.code !== 'ENOENT') throw readError;
                  }
                  for (const entry of entries) {
                      if (entry.name.startsWith('.') || !/^[a-zA-Z0-9_.]+$/.test(entry.name)) continue;
                      assert(entry.isFile(), 'Unsupported legacy UserPersisto entry');
                      objects[entry.name] = JSON.parse(fs.readFileSync(`${folder}/${entry.name}`, 'utf8'));
                  }
                  assert(!Object.keys(objects).length || objects.system, 'Invalid legacy UserPersisto store');
              }
              const policies = Object.values(objects).filter(value => value?.key === 'auth.policy');
              assert(policies.length <= 1, 'Ambiguous preserved UserPersisto authentication policy');
              origins = policies[0]?.value?.allowedRedirectOrigins || [];
              assert(Array.isArray(origins), 'Invalid preserved UserPersisto redirect origins');
          }
          const allowed = [...new Set([...origins, publicUrl].map(value => {
              assert.equal(typeof value, 'string');
              const url = new URL(value.trim());
              assert(['http:', 'https:'].includes(url.protocol) && !url.username && !url.password
                  && url.pathname === '/' && !url.search && !url.hash, 'Invalid preserved UserPersisto redirect origin');
              return url.origin;
          }))].sort();
          handleVarCommand(['USERPERSISTO_OIDC_ISSUER', `${publicUrl}/base-agent-additional-server/userPersistoAgent/7000/service/oidc`]);
          handleVarCommand(['USERPERSISTO_ALLOWED_REDIRECT_ORIGINS', allowed.join(',')]);
          // A public callback disables the distributed localhost-only Google
          // fallback. Without a supplied or preserved client, Google stays off.
          handleVarCommand(['USERPERSISTO_GOOGLE_REDIRECT_URI', `${publicUrl}/base-agent-additional-server/userPersistoAgent/7000/service/auth/google/callback`]);
          if (googleClientId) handleVarCommand(['USERPERSISTO_GOOGLE_CLIENT_ID', googleClientId]);
          // END QA UserPersisto configuration
          NODE

          echo "[deploy-qa] Starting Explorer from each managed repository's configured default branch..."
          export PLOINKY_NO_WAIT_SEQUENCE_TERMINAL_GRACE_MS='300000'
          QA_DEPLOY_STARTED_AT_MS="$(node -p 'Date.now()')"
          EXPECTED_NO_WAIT_AGENTS=4
          "$PLOINKY" start explorer "${BRANCH_ARGS[@]}"

          QA_READY=0
          QA_READY_STREAK=0
          QA_TERMINAL_FAILURE=0
          NO_WAIT_SUMMARY=""
          # Detached no-wait runtimes activate serially. Allow the complete
          # bounded sequence to settle without weakening terminal-failure
          # detection or the job's independent 90-minute hard limit.
          for _ in $(seq 1 180); do
            BOX_STATUS="$(inspect_outer_box_status)"
            NO_WAIT_READY=0
            NO_WAIT_EXIT=0
            NO_WAIT_SUMMARY="$(
              "$BOX_ENGINE" container exec \
                --user podman \
                "$BOX_INSTANCE" \
                node \
                "$WORK_DIR/.ploinky/repos/AchillesIDE/.github/scripts/check-no-wait-readiness.mjs" \
                "$WORK_DIR/.ploinky/running/no-wait" \
                "$EXPECTED_NO_WAIT_AGENTS" \
                "$QA_DEPLOY_STARTED_AT_MS" 2>&1
            )" || NO_WAIT_EXIT=$?
            case "$NO_WAIT_EXIT" in
              0) NO_WAIT_READY=1 ;;
              1) ;;
              2|3)
                QA_TERMINAL_FAILURE=1
                break
                ;;
              *)
                NO_WAIT_SUMMARY="[deploy-qa] no-wait readiness checker exited unexpectedly with status $NO_WAIT_EXIT"
                QA_TERMINAL_FAILURE=1
                break
                ;;
            esac
            if [[ "$BOX_STATUS" == *"Ploinky Box: running-initialized"* ]] &&
              [[ "$BOX_STATUS" == *"Tracked agents: 9"* ]] &&
              [[ "$BOX_STATUS" == *"Running agents: 9"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare mode: cloudflare"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare management: api-managed"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare publication: ready"* ]] &&
              [[ "$BOX_STATUS" == *"Cloudflare connector: running"* ]] &&
              [ "$NO_WAIT_READY" = "1" ]; then
              QA_READY_STREAK=$((QA_READY_STREAK + 1))
              if [ "$QA_READY_STREAK" -ge 3 ]; then
                QA_READY=1
                break
              fi
            else
              QA_READY_STREAK=0
            fi
            sleep 10
          done
          printf '%s\n' "$BOX_STATUS"
          printf '%s\n' "$NO_WAIT_SUMMARY"
          if [ "$QA_TERMINAL_FAILURE" = "1" ]; then
            echo "[deploy-qa] ERROR: current-run no-wait readiness evidence failed."
            exit 1
          fi
          if [ "$QA_READY" != "1" ]; then
            echo "[deploy-qa] ERROR: timed out waiting for stable 9/9 process admission and 4/4 semantic readiness."
            exit 1
          fi
          case "$BOX_STATUS" in
            *"Ploinky Box: running-initialized"*) ;;
            *)
              echo "[deploy-qa] ERROR: Box did not reach running-initialized state."
              exit 1
              ;;
          esac
          for expected_status in \
            'Tracked agents: 9' \
            'Running agents: 9' \
            'Cloudflare mode: cloudflare' \
            'Cloudflare management: api-managed' \
            'Cloudflare publication: ready' \
            'Cloudflare connector: running'; do
            case "$BOX_STATUS" in
              *"$expected_status"*) ;;
              *)
                echo "[deploy-qa] ERROR: missing Box status '$expected_status'."
                exit 1
                ;;
            esac
          done
          node --input-type=module - "$QA_TAIL_HELPER" <<'NODE'
          import assert from 'node:assert/strict';

          // BEGIN QA fresh graph readiness
          // The fresh default graph decides what runs; no earlier selection is carried over, so only
          // its own agents must be ready.
          const [helper] = process.argv.slice(2);
          const { currentQaBox, productionAdapters } = await import(helper);
          const adapters = productionAdapters();
          const current = currentQaBox(adapters.boxes());
          const assertCurrent = () => {
              const found = adapters.boxes().filter(item => item.box.id === current.box.id);
              assert.equal(found.length, 1, 'Current QA Box disappeared');
              assert.equal(found[0].box.contract, current.box.contract, 'Current QA Box changed');
              assert(found[0].box.running, 'Current QA Box stopped');
          };
          assertCurrent();
          const readiness = await adapters.ready(current, { agents: [] });
          assert(readiness.ready, 'The fresh QA graph is not ready');
          assertCurrent();
          console.log('[deploy-qa] Fresh graph readiness confirmed.');
          // END QA fresh graph readiness
          NODE
          # BEGIN QA deployed source verification
          for repository_record in "${GRAPH_REPOSITORIES[@]}"; do
            IFS='|' read -r repository_name _ <<< "$repository_record"
            expected_branch="${EXPECTED_BRANCHES[$repository_name]}"
            deployed_commit="$(
              "$BOX_ENGINE" container exec \
                --user podman \
                "$BOX_INSTANCE" \
                git -C "$WORK_DIR/.ploinky/repos/$repository_name" rev-parse HEAD
            )"
            expected_commit="${EXPECTED_COMMITS[$repository_name]}"
            if [ "$deployed_commit" != "$expected_commit" ]; then
              # ploinky start clones minutes after the commit was resolved. A branch that only
              # moved forward in between is accepted and logged; the clone is full, so the
              # ancestry is proven inside the Box. Any other result, including a git failure
              # (status 128), is a mismatch.
              if [[ ! "$deployed_commit" =~ ^[a-f0-9]{40}$ ]] || ! "$BOX_ENGINE" container exec \
                --user podman "$BOX_INSTANCE" \
                git -C "$WORK_DIR/.ploinky/repos/$repository_name" merge-base --is-ancestor "$expected_commit" "$deployed_commit"; then
                echo "[deploy-qa] ERROR: deployed $repository_name commit $deployed_commit"
                echo "[deploy-qa]        does not match $expected_branch at $expected_commit."
                exit 1
              fi
              echo "[deploy-qa] $repository_name/$expected_branch moved from $expected_commit to $deployed_commit between source resolution and start (fast-forward); verifying $deployed_commit."
              EXPECTED_COMMITS["$repository_name"]="$deployed_commit"
              expected_commit="$deployed_commit"
            fi
            deployed_branch="$(
              "$BOX_ENGINE" container exec --user podman "$BOX_INSTANCE" \
                git -C "$WORK_DIR/.ploinky/repos/$repository_name" branch --show-current
            )"
            deployed_upstream="$(
              "$BOX_ENGINE" container exec --user podman "$BOX_INSTANCE" \
                git -C "$WORK_DIR/.ploinky/repos/$repository_name" rev-parse \
                  --abbrev-ref --symbolic-full-name '@{upstream}'
            )"
            deployed_dirty="$(
              "$BOX_ENGINE" container exec --user podman "$BOX_INSTANCE" \
                git -C "$WORK_DIR/.ploinky/repos/$repository_name" status --porcelain
            )"
            if [ "$deployed_branch" != "$expected_branch" ] ||
              [ "$deployed_upstream" != "origin/$expected_branch" ] ||
              [ -n "$deployed_dirty" ]; then
              echo "[deploy-qa] ERROR: deployed $repository_name checkout is not clean and tracking origin/$expected_branch."
              echo "[deploy-qa]        observed branch: ${deployed_branch:-<detached>}"
              echo "[deploy-qa]        observed upstream: ${deployed_upstream:-<none>}"
              if [ -n "$deployed_dirty" ]; then
                echo "[deploy-qa]        dirty paths:"
                printf '%s\n' "$deployed_dirty" | sed 's/^/[deploy-qa]          /'
              fi
              exit 1
            fi
            echo "[deploy-qa] Verified $repository_name/$expected_branch at $deployed_commit."
          done
          echo "[deploy-qa] Deployed AssistOSExplorer commit: ${EXPECTED_COMMITS[AchillesIDE]}"
          # END QA deployed source verification
          verify_ala_checkout
          node --input-type=module - "$QA_TAIL_HELPER" "$BOX_INSTANCE" <<'NODE'
          import assert from 'node:assert/strict';
          // BEGIN QA image-owned AgentLib verification
          const [helper, instance] = process.argv.slice(2);
          assert.equal(instance, 'ploinky-box-explorerqaworkspace-7a31ab7775eb');
          const { productionAdapters } = await import(helper);
          const adapters = productionAdapters();
          const boxes = adapters.boxes().filter(item => item.box.name === instance);
          assert.equal(boxes.length, 1, 'Current QA Box is ambiguous');
          const selection = await adapters.verifyAgentLib(boxes[0]);
          const provenance = selection.provenance
            ? `${selection.provenance.repository}@${selection.provenance.commit}` : 'unavailable';
          console.log(`[deploy-qa] Verified image-supplied achillesAgentLib ${selection.packageName}@${selection.packageVersion ?? 'unversioned'} from ${selection.imageId}; immutable source ${selection.sourceId}; build provenance ${provenance} (diagnostic only).`);
          // END QA image-owned AgentLib verification
          NODE

          # A diagnostic record of the deployed Box, its image and its sources.
          QA_VERIFY_BOX_ID="$("$BOX_ENGINE" container inspect "$BOX_INSTANCE" --format '{{.Id}}')"
          QA_VERIFY_IMAGE_ID="$("$BOX_ENGINE" container inspect "$BOX_INSTANCE" --format '{{.Image}}')"
          QA_VERIFY_IMAGE_ID="${QA_VERIFY_IMAGE_ID#sha256:}"
          QA_EXPECTED_SOURCES=(
            ".runtime/ploinky|$PLOINKY_BRANCH|$(git -C "$RUNTIME_DIR" rev-parse HEAD)"
            "AdvancedLanguageAgent|$ALA_BRANCH|$ALA_COMMIT"
          )
          for repository_record in "${GRAPH_REPOSITORIES[@]}"; do
            IFS='|' read -r repository_name _ <<< "$repository_record"
            QA_EXPECTED_SOURCES+=(".ploinky/repos/$repository_name|${EXPECTED_BRANCHES[$repository_name]}|${EXPECTED_COMMITS[$repository_name]}")
          done
          node --input-type=module - "$QA_VERIFY_BOX_ID" "$QA_VERIFY_IMAGE_ID" "$QA_DEPLOY_STARTED_AT_MS" "${QA_EXPECTED_SOURCES[@]}" <<'NODE'
          // BEGIN QA verification expectation
          const [boxId, imageId, startedAt, ...records] = process.argv.slice(2);
          const sources = Object.fromEntries(records.map(record => {
              const [relative, branch, commit] = record.split('|');
              return [relative, { commit, branch }];
          }));
          console.log('[deploy-qa] Verification expectation:', JSON.stringify({ boxId, imageId, minimumRunStartedAtMs: Number(startedAt), sources }));
          // END QA verification expectation
          NODE

          echo "[deploy-qa] Verifying the loopback Router publication..."
          ROUTER_OK=0
          for _ in $(seq 1 30); do
            code="$(
              curl -s -o /dev/null -w '%{http_code}' \
                "http://127.0.0.1:${ROUTER_PORT}/dashboard" || true
            )"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              ROUTER_OK=1
              break
            fi
            sleep 2
          done
          if [ "$ROUTER_OK" != "1" ]; then
            echo "[deploy-qa] ERROR: Box Router did not answer on loopback port $ROUTER_PORT."
            exit 1
          fi

          if [ "$SOUL_UP_BEFORE" = "1" ] && ! curl -sf "$SOUL_HEALTH_URL" >/dev/null 2>&1; then
            echo "[deploy-qa] ERROR: protected Soul Gateway became unhealthy during QA deployment."
            exit 1
          fi

          node "$QA_HELPERS_DIR/qa-teardown.mjs" protected-snapshot > "$PROTECTED_AFTER_FILE"
          if ! cmp -s "$PROTECTED_BEFORE_FILE" "$PROTECTED_AFTER_FILE"; then
            echo "[deploy-qa] ERROR: an unrelated host container or volume identity changed during QA teardown/deployment."
            exit 1
          fi
          echo "[deploy-qa] Protected host resource identities remained unchanged (sha256=$(sha256sum "$PROTECTED_AFTER_FILE" | awk '{print $1}'))."

          QA_COMPLETE="$(node "$QA_HELPERS_DIR/qa-teardown.mjs" complete --lock-held)" || {
            echo "[deploy-qa] ERROR: the install marker was not cleared; it is kept. Result: ${QA_COMPLETE:-none}"
            exit 1
          }
          QA_MARKED=0
          echo "[deploy-qa] Install marker cleared: $QA_COMPLETE"

          echo "[deploy-qa] Explorer QA Box is ready."
          REMOTE
          REMOTE_ENV_UPLOADED='false'

      - name: Verify public URL
        run: |
          set -euo pipefail
          echo "[deploy-qa] Verifying the exact public Explorer login application..."
          RESPONSE_FILE="$RUNNER_TEMP/explorer-qa-response.txt"
          HEADER_FILE="$RUNNER_TEMP/explorer-qa-headers.txt"
          MISMATCH_RESPONSE_FILE="$RUNNER_TEMP/explorer-qa-mismatch-response.txt"
          MISMATCH_HEADER_FILE="$RUNNER_TEMP/explorer-qa-mismatch-headers.txt"
          for attempt in $(seq 1 60); do
            code="$(
              curl -sS --max-time 15 \
                -D "$HEADER_FILE" \
                -o "$RESPONSE_FILE" \
                -w '%{http_code}' \
                "${PUBLIC_URL%/}/auth/login?agent=explorer" || true
            )"
            mismatch_code="$(
              curl -sS --max-time 15 \
                -D "$MISMATCH_HEADER_FILE" \
                -o "$MISMATCH_RESPONSE_FILE" \
                -w '%{http_code}' \
                "${PUBLIC_URL%/}/auth/login?agent=dpuAgent" || true
            )"
            if [ "$code" = "200" ] && [ "$mismatch_code" = "400" ] && node --input-type=module - \
              "$RESPONSE_FILE" \
              "$HEADER_FILE" \
              "$MISMATCH_RESPONSE_FILE" \
              "$MISMATCH_HEADER_FILE" <<'NODE'
          import fs from 'node:fs';

          const body = fs.readFileSync(process.argv[2], 'utf8');
          const headers = fs.readFileSync(process.argv[3], 'utf8').toLowerCase();
          const mismatchBody = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));
          const mismatchHeaders = fs.readFileSync(process.argv[5], 'utf8').toLowerCase();
          // BEGIN QA public email-first verification
          const publicUrl = 'https://explorer-qa.axiologic.dev';
          if (/EDGE_GENERATION_INACTIVE|cloudflare tunnel error|error code: 1033/i.test(body)) process.exit(1);
          const redirect = body.match(/window\.location\.replace\(("(?:[^"\\]|\\.)*")\)/);
          if (!/Continue with Single Sign-On/.test(body) || !redirect
            || /<input[^>]+type=["']password["']/i.test(body)) process.exit(1);
          const login = new URL(JSON.parse(redirect[1]));
          const service = '/base-agent-additional-server/userPersistoAgent/7000/service';
          if (login.origin !== publicUrl || login.username || login.password || login.hash
            || login.pathname !== `${service}/auth/` || !login.searchParams.get('requestId')
            || !login.searchParams.get('state')) process.exit(1);
          if (mismatchBody?.ok !== false || mismatchBody?.error !== 'auth_route_context_mismatch') process.exit(1);
          if (!/^cf-ray:/mi.test(headers) || !/^cf-ray:/mi.test(mismatchHeaders)) process.exit(1);
          const get = async url => {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(15000) });
              if (!response.ok || !response.headers.get('cf-ray')) throw new Error();
              return response;
            } catch {
              throw new Error('QA identity endpoint is not ready through the public edge');
            }
          };
          const wizard = await (await get(login.href)).text();
          if (!/id=["']auth_content["']/.test(wizard) || !/<script[^>]+src=["']main\.js["']/.test(wizard)
            || /<input[^>]+type=["']password["']/i.test(wizard)) process.exit(1);
          const setup = await (await get(`${publicUrl}${service}/auth/setup`)).json();
          if (setup.ok !== true || typeof setup.setupComplete !== 'boolean' || typeof setup.registration !== 'boolean'
            || typeof setup.methods !== 'object' || setup.methods === null) process.exit(1);
          const issuer = `${publicUrl}${service}/oidc`;
          const discovery = await (await get(`${issuer}/.well-known/openid-configuration`)).json();
          if (discovery.issuer !== issuer || !discovery.code_challenge_methods_supported?.includes('S256')) process.exit(1);
          for (const key of ['authorization_endpoint', 'token_endpoint', 'jwks_uri', 'userinfo_endpoint']) {
            const endpoint = new URL(discovery[key]);
            if (endpoint.origin !== publicUrl || endpoint.username || endpoint.password || endpoint.search || endpoint.hash
              || !endpoint.pathname.startsWith(`${service}/oidc/`)) process.exit(1);
          }
          console.log('[deploy-qa] UserPersisto readiness:', JSON.stringify({
            setupComplete: setup.setupComplete,
            registration: setup.registration,
            methods: Object.fromEntries(['password', 'emailCode', 'passkey', 'totp', 'google'].map(name => [name, setup.methods[name] === true])),
          }));
          // END QA public email-first verification
          NODE
            then
              echo "[deploy-qa] Public edge verified the host-bound SSO login, email-first wizard, OIDC issuer, and rejected a mismatched agent selector."
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::Exact public Explorer application did not become ready; last HTTP codes: ${code:-none}/${mismatch_code:-none}"
              exit 1
            fi
            sleep 5
          done

      - name: Verify dedicated connector and protected Cloudflare topology
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          SNAPSHOT_FILE="$RUNNER_TEMP/explorer_qa_protected_cloudflare_before.json"
          if [ ! -f "$SNAPSHOT_FILE" ]; then
            echo "[deploy-qa] No protected Cloudflare preflight snapshot exists; no Cloudflare mutation was authorized."
            exit 0
          fi
          node --input-type=module - "$SNAPSHOT_FILE" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const before = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || '');
          const protectedTunnelId = String(process.env.CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID || '');
          const dedicatedTunnelId = String(process.env.CLOUDFLARE_TUNNEL_ID || '');
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value)
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([key, child]) => [key, stable(child)]));
          };
          const digest = (value) => `sha256:${crypto.createHash('sha256')
            .update(JSON.stringify(stable(value))).digest('hex')}`;
          const api = async (pathname) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              redirect: 'error',
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) throw new Error('Cloudflare post-deploy inventory failed');
            return payload.result;
          };
          const sharedDetail = await api(`/accounts/${accountId}/cfd_tunnel/${protectedTunnelId}`);
          const sharedConfig = await api(`/accounts/${accountId}/cfd_tunnel/${protectedTunnelId}/configurations`);
          const protectedDns = [];
          for (let page = 1; ; page += 1) {
            if (page > 100) throw new Error('protected DNS inventory exceeded the fail-closed page bound');
            const query = new URLSearchParams({ page: String(page), per_page: '100' });
            const records = await api(`/zones/${zoneId}/dns_records?${query}`);
            if (!Array.isArray(records)) throw new Error('protected DNS inventory is malformed');
            protectedDns.push(...records.filter((record) => record?.name !== process.env.PUBLIC_HOST));
            if (records.length < 100) break;
          }
          protectedDns.sort((left, right) => String(left?.id || '').localeCompare(String(right?.id || '')));
          const after = {
            tunnel: { id: sharedDetail.id, name: sharedDetail.name, accountTag: sharedDetail.account_tag || accountId },
            ingress: sharedConfig?.config?.ingress,
            dns: protectedDns,
          };
          const beforeJson = JSON.stringify(stable(before));
          const afterJson = JSON.stringify(stable(after));
          if (beforeJson !== afterJson || digest(after) !== process.env.PROTECTED_CLOUDFLARE_DIGEST) {
            throw new Error('protected proxies ingress or unrelated DNS identity changed during Explorer QA deployment');
          }
          if (/^[a-f0-9-]{36}$/.test(dedicatedTunnelId)) {
            const tunnelQuery = new URLSearchParams({ name: 'explorer-qa', is_deleted: 'false', per_page: '100' });
            const named = await api(`/accounts/${accountId}/cfd_tunnel?${tunnelQuery}`);
            const detail = await api(`/accounts/${accountId}/cfd_tunnel/${dedicatedTunnelId}`);
            const config = await api(`/accounts/${accountId}/cfd_tunnel/${dedicatedTunnelId}/configurations`);
            const dnsQuery = new URLSearchParams({ name: process.env.PUBLIC_HOST, per_page: '100' });
            const dns = await api(`/zones/${zoneId}/dns_records?${dnsQuery}`);
            const connections = await api(`/accounts/${accountId}/cfd_tunnel/${dedicatedTunnelId}/connections`);
            const expectedIngress = [
              { hostname: process.env.PUBLIC_HOST, service: 'http://127.0.0.1:8080' },
              { service: 'http_status:404' },
            ];
            if (!Array.isArray(named) || named.length !== 1 || named[0]?.id !== dedicatedTunnelId
              || detail?.id !== dedicatedTunnelId || detail?.name !== 'explorer-qa'
              || detail?.deleted_at != null
              || (detail?.account_tag != null && detail.account_tag !== accountId)
              || JSON.stringify(stable(config?.config?.ingress)) !== JSON.stringify(stable(expectedIngress))) {
              throw new Error('dedicated Explorer QA tunnel identity or ingress did not converge exactly');
            }
            if (!Array.isArray(dns) || dns.length !== 1
              || dns[0]?.type !== 'CNAME'
              || dns[0]?.name !== process.env.PUBLIC_HOST
              || dns[0]?.content !== `${dedicatedTunnelId}.cfargotunnel.com`
              || dns[0]?.proxied !== true
              || Number(dns[0]?.ttl) !== 1
              || !String(dns[0]?.id || '')) {
              throw new Error('Explorer QA DNS did not converge to the dedicated tunnel');
            }
            if (!Array.isArray(connections) || connections.length < 1) {
              throw new Error('dedicated Explorer QA connector has no active Cloudflare connection');
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `EXPLORER_QA_DNS_RECORD_ID=${dns[0].id}\n`);
            console.log(`Dedicated Explorer QA tunnel id=${dedicatedTunnelId} DNS id=${dns[0].id} connections=${connections.length}.`);
          }
          console.log(`Protected proxies ingress and unrelated DNS are unchanged at ${digest(after)}.`);
          NODE

      - name: Create summary
        if: always()
        env:
          UPDATED_IN_PLACE: ${{ steps.inplace.outputs.updated }}
          QA_OPERATION: ${{ steps.inplace.outputs.operation }}
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          SELECTION_LINE=''
          ROUTE_LINE=''
          TEARDOWN_LINE=''
          DEPLOYED_LINE=''
          if [ -f "$RUNNER_TEMP/explorer-qa-update-result.json" ]; then
            SELECTION_LINE="$(sed -n 's/^\[deploy-qa\] Deployment selection: //p' "$RUNNER_TEMP/explorer-qa-update-result.json" | tail -n 1)"
            ROUTE_LINE="$(sed -n 's/^\[deploy-qa\] Deployment route: //p' "$RUNNER_TEMP/explorer-qa-update-result.json" | tail -n 1)"
          fi
          if [ -f "$RUNNER_TEMP/explorer-qa-reconcile.log" ]; then
            TEARDOWN_LINE="$(sed -n 's/^\[deploy-qa\] Teardown receipt: //p' "$RUNNER_TEMP/explorer-qa-reconcile.log" | tail -n 1)"
            DEPLOYED_LINE="$(sed -n 's/^\[deploy-qa\] Deployed AssistOSExplorer commit: //p' "$RUNNER_TEMP/explorer-qa-reconcile.log" | tail -n 1)"
          fi
          {
            echo "## Explorer QA Box Deploy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`"
            echo "- Identity directory: \`~/${WORKSPACE}\`"
            echo "- Router publication: \`127.0.0.1:${ROUTER_PORT}:8080/tcp\`"
            echo "- Media publication: \`0.0.0.0:7882:7882/udp\`"
            echo "- Helpers and tests from \`${DISPATCH_REF}@${DISPATCH_SHA}\`; deployed AssistOSExplorer main pinned at \`${EXPECTED_EXPLORER_COMMIT:-unresolved}\`"
            if [ -n "$ROUTE_LINE" ]; then
              echo "- Deployment route: \`${ROUTE_LINE}\`"
            fi
            if [ -n "$SELECTION_LINE" ]; then
              echo "- Deployment selection and reasons: \`${SELECTION_LINE}\`"
            fi
            if [ "$UPDATED_IN_PLACE" = true ]; then
              echo "- Deployment: AssistOSExplorer updated in place from its configured default branch"
              echo "- Existing Box, image, AgentLib, other repositories and workspace data retained"
            elif [ "$QA_OPERATION" = rebuild ]; then
              echo "- Rebuild: the Box, its containers and image, and the regenerated workspace state were removed and installed fresh onto the data left in place; the log carries the Install marker, Teardown receipt and Verification expectation lines"
              if [ -n "$TEARDOWN_LINE" ]; then
                echo "- Teardown receipt: \`${TEARDOWN_LINE}\`"
              fi
              if [ -n "$DEPLOYED_LINE" ]; then
                echo "- Deployed AssistOSExplorer commit: \`${DEPLOYED_LINE}\`"
              fi
            elif [ "$UPDATED_IN_PLACE" = false ]; then
              echo "- Fresh installation: configured repository defaults, resolved and pinned at deploy time, onto any data left in place"
              if [ -n "$TEARDOWN_LINE" ]; then
                echo "- Teardown receipt: \`${TEARDOWN_LINE}\`"
              fi
              if [ -n "$DEPLOYED_LINE" ]; then
                echo "- Deployed AssistOSExplorer commit: \`${DEPLOYED_LINE}\`"
              fi
            else
              echo "- No installation was performed by the update step (in-place update failed)"
            fi
            printf -- '- Cloudflare: dedicated persistent `%s` tunnel `%s`, ingress, and DNS API-managed by Ploinky\n' \
              "$CLOUDFLARE_TUNNEL_NAME" "${CLOUDFLARE_TUNNEL_ID:-not-created}"
            printf -- '- Cloudflare DNS record: `%s`\n' "${EXPLORER_QA_DNS_RECORD_ID:-not-created}"
            printf -- '- Protected shared tunnel: `%s` unchanged at `%s`\n' \
              "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" "${PROTECTED_CLOUDFLARE_DIGEST:-not-snapshotted}"
            echo "- Recovery: in-place source failures restore the previous commit; a failed rebuild or installation keeps its install marker and the next deploy finishes it from the data left in place; teardown belongs to the separate destroy workflow."
            echo "- Public URL: \`${PUBLIC_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            ~/.ssh/deploy_key \
            ~/.ssh/explorer_qa_known_hosts \
            /tmp/explorer_qa_deploy.env \
            "$RUNNER_TEMP/explorer-qa-response.txt" \
            "$RUNNER_TEMP/explorer-qa-headers.txt" \
            "$RUNNER_TEMP/explorer-qa-update-result.json" \
            "$RUNNER_TEMP/explorer-qa-reconcile.log" \
            "$RUNNER_TEMP/explorer_qa_protected_cloudflare_before.json"
