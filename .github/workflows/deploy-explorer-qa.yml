          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';

          const [alaRoot, selectedAgentLib] = process.argv.slice(2);
          for (const directory of [alaRoot, selectedAgentLib]) {
              const stat = fs.lstatSync(directory);
              assert.ok(stat.isDirectory() && !stat.isSymbolicLink(), 'ALA and selected AgentLib must be real directories');
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(alaRoot, 'package.json'), 'utf8'));
          assert.equal(manifest.name, 'advanced-language-agent');
          assert.deepEqual(Object.keys(manifest.dependencies || {}), ['ploinky-agent-lib'], 'ALA dependency changes require deployment review');
          const modules = path.join(alaRoot, 'node_modules');
          try {
              const stat = fs.lstatSync(modules);
              assert.ok(stat.isDirectory() && !stat.isSymbolicLink(), 'ALA node_modules must be a real directory');
          } catch (error) {
              if (error.code !== 'ENOENT') throw error;
              fs.mkdirSync(modules);
          }
          const binding = path.join(modules, 'ploinky-agent-lib');
          try {
              assert.ok(fs.lstatSync(binding).isSymbolicLink(), 'ALA must not install a private AgentLib copy');
              assert.equal(fs.readlinkSync(binding), selectedAgentLib, 'ALA must use the selected AgentLib');
          } catch (error) {
              if (error.code !== 'ENOENT') throw error;
              fs.symlinkSync(selectedAgentLib, binding, 'dir');
          }
          const { loadAchillesAgentLib } = await import(pathToFileURL(path.join(alaRoot, 'src/achilles-loader.mjs')).href);
          const loaded = await loadAchillesAgentLib({ env: {} });
          assert.equal(loaded.strategy, 'package', 'ALA must not shadow the selected AgentLib with another checkout');
          assert.ok(fs.realpathSync(loaded.entry).startsWith(`${fs.realpathSync(selectedAgentLib)}${path.sep}`), 'ALA must load the selected AgentLib');
          assert.equal(typeof loaded.module.MainAgent, 'function');
          assert.equal(typeof loaded.module.LLMAgent, 'function');
          const executable = path.join(alaRoot, 'bin/ala.mjs');
          fs.accessSync(executable, fs.constants.X_OK);
          const help = spawnSync(process.execPath, [executable, '--help'], { encoding: 'utf8', timeout: 15000 });
          assert.equal(help.status, 0, 'ALA help must run successfully');
          for (const option of ['--home', '--cwd', '--MCPServers']) {
              assert.ok(help.stdout.includes(option), `ALA must support ${option}`);
          }
          console.log('[deploy-qa] ALA imports the selected AgentLib and supports the RoboTeam CLI contract.');
          NODE
          verify_ala_checkout

          "$BOX_ENGINE" container exec \
            --user podman \
            "$BOX_INSTANCE" \
            node --input-type=module --eval '
