            --user podman \
            "$BOX_INSTANCE" \
            rm -f "$STAGED_CREDENTIAL_FILE" >/dev/null 2>&1 || true
          rm -f "$CLOUDFLARE_CREDENTIAL_FILE"
          CLOUDFLARE_CREDENTIAL_FILE=""
          unset CLOUDFLARE_API_TOKEN
          unset CLOUDFLARE_TUNNEL_TOKEN
          if [ "$CREDENTIAL_STATUS" != "0" ]; then
