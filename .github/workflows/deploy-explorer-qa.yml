          const expectedUrl = 'https://github.com/AssistOS-AI/AchillesAgentLib.git';
          const lock = JSON.parse(fs.readFileSync(lockFile, 'utf8'));
          const source = lock?.repositories?.achillesAgentLib;
          const url = String(source?.url || '');
          const commit = String(source?.commit || '');
          if (url !== expectedUrl || !/^[a-f0-9]{40}$/.test(commit)) {
