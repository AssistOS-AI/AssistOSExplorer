name: Deploy Explorer QA Box (Ploinky commands)

# The QA target driven through Ploinky commands, as docs/deploy-explorer-qa.md describes. The host work
# outside Ploinky is the bootstrap it cannot do for itself: the pinned Node, the Ploinky checkout and the
# empty workspace directory.

on:
  workflow_dispatch:
    inputs:
      force_cache_probe_failure:
        description: 'T9 negative control. Fail the QA origin cache probe and leave the page rule off.'
        required: false
        default: false
        type: boolean
      recreate_box:
        description: 'Destroy and recreate the Box, keeping the data. Needed to pick up a new Box image, which no Ploinky command can detect.'
        required: false
        default: false
        type: boolean
      reset_explorer_checkout:
        description: 'Reset the kept AchillesIDE checkout to main in the first start after the unpublished-source check passes. Only when no Box exists, for a kept checkout that the current Ploinky refuses.'
        required: false
        default: false
        type: boolean
      create_cache_rules:
        description: 'D19 first creation: create this host''s two cache rules if both are missing. Tick only with Daniel''s approval for this zone.'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: 'admin'
  SSH_HOST: '45.136.70.141'
  SSH_ED25519_FINGERPRINT: 'SHA256:pcVG+7QFbfi3Ojn3LeveNutqCWaTOIlgek1o3GKD/KA'
  WORKSPACE: 'explorerQaWorkspace'
  ROUTER_PORT: '8097'
  PUBLIC_HOST: 'explorer-qa.axiologic.dev'
  PUBLIC_URL: 'https://explorer-qa.axiologic.dev'
  CLOUDFLARE_TUNNEL_NAME: 'explorer-qa'
  CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID: '091c4096-d1c8-4dbc-bb12-0c6357431d96'
  CLOUDFLARE_TUNNEL_SECRET_HANDLE: 'publication/explorer-qa-tunnel'
  CLOUDFLARE_API_SECRET_HANDLE: 'publication/explorer-qa-api'
  MEDIA_PUBLIC_IPV4: '45.136.70.141'
  SOUL_GATEWAY_WORKSPACE: 'soulGateway'
  SOUL_GATEWAY_ROUTER_PORT: '8080'
  CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_CACHE_R1_REF: 'explorer_qa_cache_r1'
  CLOUDFLARE_CACHE_R2_REF: 'explorer_qa_cache_r2'

jobs:
  deploy:
    name: Deploy Explorer QA through Ploinky commands
    runs-on: ubuntu-latest
    # A fresh installation or a recreated Box runs start, repository updates, restart and start, and each may take 30 minutes.
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Check out the workflow tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up the test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test these workflows
        run: node --test tests/smoke/lib/deploy-qa-ploinky-workflows.test.mjs tests/smoke/lib/deploy-qa-cache-rules.test.mjs tests/smoke/lib/deploy-qa-cache-origin.test.mjs tests/smoke/lib/deploy-qa-cache-workflows.test.mjs

      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          BIZANSO_DEPLOY_KEY: ${{ secrets.EXPLORER_QA_BIZANSO_DEPLOY_KEY }}
          PROMOTIONSCOUT_DEPLOY_KEY: ${{ secrets.EXPLORER_QA_PROMOTIONSCOUT_DEPLOY_KEY }}
          CSVMAIL_DEPLOY_KEY: ${{ secrets.EXPLORER_QA_CSVMAIL_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${BIZANSO_DEPLOY_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_BIZANSO_DEPLOY_KEY"
            exit 1
          fi
          if [ -z "${PROMOTIONSCOUT_DEPLOY_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_PROMOTIONSCOUT_DEPLOY_KEY"
            exit 1
          fi
          if [ -z "${CSVMAIL_DEPLOY_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CSVMAIL_DEPLOY_KEY"
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::EXPLORER_QA_SSH_USER and EXPLORER_QA_SSH_HOST must be configured"
            exit 1
          fi
          if [ "$SSH_HOST" != '45.136.70.141' ] || [ "$SSH_USER" != 'admin' ] ||
            [ "$WORKSPACE" != 'explorerQaWorkspace' ]; then
            echo "::error::Explorer QA target identity is not the pinned admin@45.136.70.141/explorerQaWorkspace target"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == cfk_* ]]; then
            echo "::error::EXPLORER_QA_CLOUDFLARE_API_TOKEN is a Global API Key; Ploinky requires a scoped Account or User API Token used as a Bearer token"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] ||
            [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Explorer QA Cloudflare account or zone variables are missing or malformed"
            exit 1
          fi
          if [ "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" != '091c4096-d1c8-4dbc-bb12-0c6357431d96' ]; then
            echo "::error::Protected shared tunnel identity is not pinned"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,47}$ ]]; then
            echo "::error::Explorer QA managed Cloudflare tunnel name is malformed"
            exit 1
          fi
          case "${WORKSPACE:-}" in
            ''|.|..|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid workspace name '${WORKSPACE:-}' (allowed: A-Za-z0-9._-)"
              exit 1
              ;;
          esac
          if [ "$WORKSPACE" = "$SOUL_GATEWAY_WORKSPACE" ]; then
            echo "::error::Refusing to deploy into the production Soul Gateway workspace"
            exit 1
          fi
          case "${ROUTER_PORT:-}" in
            ''|*[!0-9]*)
              echo "::error::Invalid router port '${ROUTER_PORT:-}'"
              exit 1
              ;;
          esac
          if [ "$ROUTER_PORT" -lt 1 ] || [ "$ROUTER_PORT" -gt 65535 ]; then
            echo "::error::Router port must be between 1 and 65535"
            exit 1
          fi
          case "$ROUTER_PORT" in
            8042|8043|8080|8085|8317|8318)
              echo "::error::Refusing to use protected proxies-host port ${ROUTER_PORT}"
              exit 1
              ;;
          esac
          if [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "::error::PUBLIC_URL and PUBLIC_HOST must identify the fixed Explorer QA hostname"
            exit 1
          fi
          TUNNEL_LIST_RESPONSE="$(mktemp /tmp/explorer_qa_tunnel_list.XXXXXX)"
          DNS_RESPONSE="$(mktemp /tmp/explorer_qa_dns.XXXXXX)"
          SHARED_TUNNEL_RESPONSE="$(mktemp /tmp/explorer_qa_shared_tunnel.XXXXXX)"
          SHARED_CONFIG_RESPONSE="$(mktemp /tmp/explorer_qa_shared_config.XXXXXX)"
          trap 'rm -f "$TUNNEL_LIST_RESPONSE" "$DNS_RESPONSE" "$SHARED_TUNNEL_RESPONSE" "$SHARED_CONFIG_RESPONSE"' EXIT
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode "name=$PUBLIC_HOST" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
            > "$DNS_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" \
            > "$SHARED_TUNNEL_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID/configurations" \
            > "$SHARED_CONFIG_RESPONSE"

          node --input-type=module - \
            "$TUNNEL_LIST_RESPONSE" \
            "$DNS_RESPONSE" \
            "$SHARED_TUNNEL_RESPONSE" \
            "$SHARED_CONFIG_RESPONSE" \
            "$RUNNER_TEMP/explorer_qa_protected_cloudflare_before.json" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const [listPath, dnsPath, sharedTunnelPath, sharedConfigPath, snapshotPath] = process.argv.slice(2);
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const tunnelName = String(process.env.CLOUDFLARE_TUNNEL_NAME || '');
          const sharedTunnelId = String(process.env.CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID || '');
          const publicHost = String(process.env.PUBLIC_HOST || '');
          const parse = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const requireSuccess = (payload, label) => {
            if (payload?.success !== true) throw new Error(`${label} inventory failed`);
            return payload.result;
          };
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value)
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([key, child]) => [key, stable(child)]));
          };
          const digest = (value) => `sha256:${crypto.createHash('sha256')
            .update(JSON.stringify(stable(value))).digest('hex')}`;
          const api = async (pathname) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              redirect: 'error',
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) throw new Error('protected Cloudflare inventory failed');
            return payload.result;
          };

          const named = requireSuccess(parse(listPath), 'named tunnel');
          if (!Array.isArray(named) || named.length > 1
            || named.some((entry) => entry?.id === sharedTunnelId)) {
            throw new Error('active explorer-qa tunnel inventory is ambiguous or aliases the protected shared tunnel');
          }
          const records = requireSuccess(parse(dnsPath), 'Explorer QA DNS');
          if (!Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA DNS is ambiguous or points outside the selected tunnel');
          }
          if (named.length === 0 && records.length !== 0) {
            throw new Error('Explorer QA DNS exists without the authorized dedicated tunnel');
          }
          if (named.length === 1) {
            const tunnelId = String(named[0]?.id || '');
            if (!/^[a-f0-9-]{36}$/.test(tunnelId) || named[0]?.name !== tunnelName
              || named[0]?.deleted_at != null
              || (named[0]?.account_tag != null && named[0]?.account_tag !== accountId)) {
              throw new Error('selected dedicated Explorer QA tunnel identity is invalid');
            }
            const detail = await api(`/accounts/${accountId}/cfd_tunnel/${tunnelId}`);
            const config = await api(`/accounts/${accountId}/cfd_tunnel/${tunnelId}/configurations`);
            if (detail?.id !== tunnelId || detail?.name !== tunnelName || detail?.deleted_at != null) {
              throw new Error('dedicated Explorer QA tunnel detail changed during inventory');
            }
            const ingress = config?.config?.ingress ?? config?.ingress ?? [];
            if (!Array.isArray(ingress) || ingress.length > 2) {
              throw new Error('dedicated Explorer QA tunnel is shared or has ambiguous ingress');
            }
            if (ingress.length) {
              const catchAll = ingress.at(-1);
              if (catchAll?.hostname != null || catchAll?.service !== 'http_status:404') {
                throw new Error('dedicated Explorer QA tunnel lacks the terminal 404 ingress');
              }
            }
            if (ingress.length === 2
              && (ingress[0]?.hostname !== publicHost
                || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
              throw new Error('dedicated Explorer QA tunnel contains unrelated or incorrect ingress');
            }
            const expectedTarget = `${tunnelId}.cfargotunnel.com`;
            if (records.length === 1 && (records[0]?.name !== publicHost
              || records[0]?.type !== 'CNAME'
              || records[0]?.content !== expectedTarget
              || records[0]?.proxied !== true)) {
              throw new Error('Explorer QA DNS points outside the dedicated tunnel');
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_TUNNEL_ID=${tunnelId}\n`);
          }

          const sharedDetail = requireSuccess(parse(sharedTunnelPath), 'protected shared tunnel detail');
          const sharedConfig = requireSuccess(parse(sharedConfigPath), 'protected shared tunnel configuration');
          if (sharedDetail?.id !== sharedTunnelId || sharedDetail?.name !== 'proxies'
            || sharedDetail?.deleted_at != null
            || (sharedDetail?.account_tag != null && sharedDetail.account_tag !== accountId)) {
            throw new Error('protected proxies tunnel identity changed');
          }
          const sharedIngress = sharedConfig?.config?.ingress;
          const expectedIngress = [
            ['antigravity.axiologic.dev', 'http://localhost:8001'],
            ['proxy.axiologic.dev', 'http://localhost:8318'],
            ['soul.axiologic.dev', 'http://localhost:8042'],
            ['search.axiologic.dev', 'http://localhost:8043'],
            ['kiro.axiologic.dev', 'http://localhost:8000'],
            ['explorer-qa.axiologic.dev', 'http://localhost:8097'],
            ['office-qa.axiologic.dev', 'http://localhost:8082'],
          ];
          if (!Array.isArray(sharedIngress) || sharedIngress.length !== 8
            || expectedIngress.some(([hostname, service], index) => (
              sharedIngress[index]?.hostname !== hostname || sharedIngress[index]?.service !== service
            ))
            || sharedIngress.at(-1)?.hostname != null
            || sharedIngress.at(-1)?.service !== 'http_status:404') {
            throw new Error('protected proxies ingress topology is not the authorized immutable baseline');
          }
          const protectedDns = [];
          for (let page = 1; ; page += 1) {
            if (page > 100) throw new Error('protected DNS inventory exceeded the fail-closed page bound');
            const query = new URLSearchParams({ page: String(page), per_page: '100' });
            const result = await api(`/zones/${process.env.CLOUDFLARE_ZONE_ID}/dns_records?${query}`);
            if (!Array.isArray(result)) throw new Error('protected DNS inventory is malformed');
            protectedDns.push(...result.filter((record) => record?.name !== publicHost));
            if (result.length < 100) break;
          }
          protectedDns.sort((left, right) => String(left?.id || '').localeCompare(String(right?.id || '')));
          const snapshot = {
            tunnel: { id: sharedDetail.id, name: sharedDetail.name, accountTag: sharedDetail.account_tag || accountId },
            ingress: sharedIngress,
            dns: protectedDns,
          };
          fs.writeFileSync(snapshotPath, `${JSON.stringify(stable(snapshot))}\n`, { mode: 0o600, flag: 'wx' });
          const protectedDigest = digest(snapshot);
          fs.appendFileSync(process.env.GITHUB_ENV, `PROTECTED_CLOUDFLARE_DIGEST=${protectedDigest}\n`);
          console.log(`Validated protected proxies topology ${protectedDigest} and a safe dedicated Explorer QA tunnel slot.`);
          NODE

          HOST_KEY_CANDIDATE="$RUNNER_TEMP/explorer_qa_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOST_KEY_CANDIDATE"
          HOST_KEY_FINGERPRINT="$({ ssh-keygen -lf "$HOST_KEY_CANDIDATE" -E sha256 || true; } | awk '{print $2}' | sort -u)"
          if [ "$HOST_KEY_FINGERPRINT" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::Explorer QA ED25519 host fingerprint did not match the pinned identity"
            exit 1
          fi
          chmod 600 "$HOST_KEY_CANDIDATE"
          echo "Validated the pinned Explorer QA SSH host identity."

      - name: Disable QA page caching
        id: cache_off
        env:
          CREATE_CACHE_RULES: ${{ inputs.create_cache_rules }}
          EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN }}
        run: |
          set -euo pipefail
          case "$CREATE_CACHE_RULES" in
            true) cache_flags=() ;;
            false) cache_flags=(--existing-only) ;;
            *) echo "::error::create_cache_rules must be true or false"; exit 1 ;;
          esac
          node .github/scripts/cloudflare-cache-rules.mjs ensure-r1 --token-env EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN ${cache_flags[@]+"${cache_flags[@]}"}
          node .github/scripts/cloudflare-cache-rules.mjs r2-off --token-env EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN ${cache_flags[@]+"${cache_flags[@]}"}

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 "$RUNNER_TEMP/explorer_qa_known_hosts" ~/.ssh/explorer_qa_known_hosts

      # The key stays on the runner: neither the QA host nor the Box ever holds it.
      - name: Check out ScriptaHub
        uses: actions/checkout@v4
        with:
          repository: Axiologic/ScriptaHubAgent
          path: .qa-scriptahub-source
          persist-credentials: false
          fetch-depth: 0

      # Resolve immutable indexes and validate both native image configurations against the selected source.
      - name: Resolve the ScriptaHub source and the published images
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/.qa-scriptahub-source"
          AGENT_REPO=docker.io/assistos/scriptahub-agent
          ROBOTEAM_REPO=docker.io/assistos/roboteam-agent
          source_git() { git -C "$SOURCE" "$@"; }
          HEAD_COMMIT="$(source_git rev-parse HEAD)"
          BRANCH="$(source_git symbolic-ref --short HEAD)"
          [[ "$HEAD_COMMIT" =~ ^[0-9a-f]{40}$ ]] && [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::Invalid ScriptaHub source identity. Nothing was changed."; exit 1; }
          index_digest() {
            local sum
            sum="$(docker buildx imagetools inspect --raw "$1" | sha256sum | cut -d ' ' -f1)" || return 1
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf 'sha256:%s\n' "$sum"
          }
          if ! AGENT_INDEX="$(index_digest "$AGENT_REPO:runtime")" || ! ROBOTEAM_INDEX="$(index_digest "$ROBOTEAM_REPO:runtime")"; then
            echo "::error::Published image indexes could not be read. Nothing was changed."
            exit 1
          fi
          docker buildx imagetools inspect "$AGENT_REPO@$AGENT_INDEX" --format '{{json .Image}}' > "$RUNNER_TEMP/qa-scriptahub-agent-image.json"
          # Exit 3 means the revision and assets labels are valid but the image carries no dependency fingerprint label on
          # either platform, which is an image published before the skill sources were mounted.
          LABEL_STATUS=0
          IMAGE_LABELS="$(node --input-type=module - "$RUNNER_TEMP/qa-scriptahub-agent-image.json" <<'NODE'
          import fs from 'node:fs';
          const image = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const label = (platform, key) => image?.[platform]?.config?.Labels?.[key];
          const revisionKey = 'org.opencontainers.image.revision';
          const revision = label('linux/amd64', revisionKey);
          if (typeof revision !== 'string' || revision.length !== 40 || !/^[0-9a-f]{40}$/.test(revision) || revision !== label('linux/arm64', revisionKey)) throw new Error(`Invalid or inconsistent image label ${revisionKey}`);
          const assets = label('linux/amd64', 'io.assistos.scriptahub.assets-image');
          if (typeof assets !== 'string' || assets.length !== 108 || !/^docker\.io\/assistos\/scriptahub-assets@sha256:[0-9a-f]{64}$/.test(assets) || assets !== label('linux/arm64', 'io.assistos.scriptahub.assets-image')) throw new Error('Invalid or inconsistent assets image label');
          const fingerprintKey = 'io.assistos.scriptahub.dependency-fingerprint';
          const a = label('linux/amd64', fingerprintKey);
          const b = label('linux/arm64', fingerprintKey);
          if (a === undefined && b === undefined) process.exit(3);
          if (typeof a !== 'string' || !/^[0-9a-f]{64}$/.test(a) || a !== b) throw new Error(`Invalid or inconsistent image label ${fingerprintKey}`);
          process.stdout.write(`${revision} ${a}`);
          NODE
          )" || LABEL_STATUS=$?
          if [ "$LABEL_STATUS" -eq 3 ]; then
            echo "::error::The agent image predates mounted skill sources: it carries no io.assistos.scriptahub.dependency-fingerprint label. Publish a matching agent image using publish-scriptahub-agent-image.yml. Nothing was changed."
            exit 1
          fi
          if [ "$LABEL_STATUS" -ne 0 ]; then
            echo "::error::Invalid ScriptaHub image labels. Nothing was changed."
            exit 1
          fi
          read -r AGENT_REVISION DEPENDENCY_LABEL <<< "$IMAGE_LABELS"
          [[ "$AGENT_REVISION" =~ ^[0-9a-f]{40}$ ]] && [[ "$DEPENDENCY_LABEL" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid ScriptaHub image labels. Nothing was changed."; exit 1; }
          REFUSAL="Publish a matching agent image from a committed source lock using publish-scriptahub-agent-image.yml. Nothing was changed."
          if ! source_git cat-file -e "$AGENT_REVISION^{commit}" 2> /dev/null || ! source_git merge-base --is-ancestor "$AGENT_REVISION" "$HEAD_COMMIT"; then
            echo "::error::The agent image revision is not an ancestor of $BRANCH@$HEAD_COMMIT. $REFUSAL"
            exit 1
          fi
          # BEGIN ScriptaHub dependency fingerprint
          # Dependency fingerprint v1 of a commit: the sha256 of a header and one line, blob id and path, for every file that
          # scriptahubAgent/deployment/dependency-inputs.txt lists. It runs Git with hooks off and executes nothing from the
          # checkout. Usage: scripta_dependency_fingerprint <repository directory> <40-hex commit>. It prints 64 lowercase hex
          # digits, or prints nothing and fails on every input that parseDependencyInputs of dependency-fingerprint.mjs
          # rejects. The body is a subshell and checks every step itself, because errexit is off wherever a caller tests the result.
          scripta_dependency_fingerprint() (
            LC_ALL=C
            export LC_ALL
            repo=$1
            rev=$2
            inputs=scriptahubAgent/deployment/dependency-inputs.txt
            fp_fail() { echo "dependency fingerprint: $1" >&2; exit 1; }
            fp_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$repo" "$@"; }
            case "$rev" in ""|*[!0-9a-f]*) fp_fail "invalid commit" ;; esac
            [ "${#rev}" -eq 40 ] || fp_fail "invalid commit"
            nl=$(printf "\nx")
            nl=${nl%x}
            tab=$(printf "\tx")
            tab=${tab%x}
            cr=$(printf "\rx")
            cr=${cr%x}
            list=$(fp_git cat-file blob "$rev:$inputs") || fp_fail "cannot read $inputs at $rev"
            [ -n "$list" ] || fp_fail "dependency inputs are empty"
            case "$list" in *"$cr"*) fp_fail "dependency inputs must use LF line endings" ;; esac
            blob=$(fp_git rev-parse "$rev:$inputs") || fp_fail "cannot read $inputs at $rev"
            hashed=$(printf "%s\n" "$list" | fp_git hash-object --no-filters --stdin) || fp_fail "cannot hash the dependency inputs"
            case "$blob" in ""|*[!0-9a-f]*) fp_fail "invalid blob id" ;; esac
            [ "${#blob}" -eq 40 ] || fp_fail "invalid blob id"
            [ "$hashed" = "$blob" ] || fp_fail "dependency inputs must end with exactly one newline"
            case "$nl$list$nl" in *"$nl$nl"*) fp_fail "dependency inputs contain a blank line" ;; esac
            sorted=$(printf "%s\n" "$list" | sort -u) || fp_fail "cannot sort the dependency inputs"
            [ "$sorted" = "$list" ] || fp_fail "dependency inputs must be strictly ascending"
            data=
            self=0
            set -f
            IFS=$nl
            for p in $list; do
              case "$p" in
                ""|/*|*/|*//*|*[!A-Za-z0-9._/-]*) fp_fail "invalid dependency input path" ;;
              esac
              case "/$p/" in */./*|*/../*) fp_fail "invalid dependency input path" ;; esac
              entry=$(fp_git ls-tree "$rev" -- "$p") || fp_fail "cannot list $p at $rev"
              case "$entry" in
                "100644 blob "*|"100755 blob "*) ;;
                *) fp_fail "$p is not a regular file at $rev" ;;
              esac
              rest=${entry#* blob }
              oid=${rest%%"$tab"*}
              name=${rest#*"$tab"}
              [ "$name" = "$p" ] || fp_fail "$p is not one tree entry at $rev"
              case "$oid" in ""|*[!0-9a-f]*) fp_fail "invalid blob id of $p" ;; esac
              [ "${#oid}" -eq 40 ] || fp_fail "invalid blob id of $p"
              if [ "$p" = "$inputs" ]; then self=1; fi
              data="$data$oid $p$nl"
            done
            [ "$self" -eq 1 ] || fp_fail "dependency inputs must list $inputs"
            if command -v sha256sum > /dev/null 2>&1; then
              out=$(printf "scriptahub-dependency-fingerprint-v1\n%s" "$data" | sha256sum) || fp_fail "cannot hash"
            else
              out=$(printf "scriptahub-dependency-fingerprint-v1\n%s" "$data" | shasum -a 256) || fp_fail "cannot hash"
            fi
            sum=${out%% *}
            case "$sum" in ""|*[!0-9a-f]*) fp_fail "invalid digest" ;; esac
            [ "${#sum}" -eq 64 ] || fp_fail "invalid digest"
            printf "%s\n" "$sum"
          )
          # END ScriptaHub dependency fingerprint
          # The image carries what the listed dependency inputs install; skill sources run from the mounted checkout.
          # The label must equal the fingerprint at the image revision and at the selected head.
          if ! REVISION_FINGERPRINT="$(scripta_dependency_fingerprint "$SOURCE" "$AGENT_REVISION")"; then
            echo "::error::The dependency fingerprint of the agent image revision $AGENT_REVISION could not be computed. $REFUSAL"
            exit 1
          fi
          if ! HEAD_FINGERPRINT="$(scripta_dependency_fingerprint "$SOURCE" "$HEAD_COMMIT")"; then
            echo "::error::The dependency fingerprint of $BRANCH@$HEAD_COMMIT could not be computed. $REFUSAL"
            exit 1
          fi
          if [ "$REVISION_FINGERPRINT" != "$DEPENDENCY_LABEL" ]; then
            echo "::error::The agent image dependency fingerprint $DEPENDENCY_LABEL differs from the fingerprint $REVISION_FINGERPRINT of its revision $AGENT_REVISION. $REFUSAL"
            exit 1
          fi
          if [ "$HEAD_FINGERPRINT" != "$DEPENDENCY_LABEL" ]; then
            # The head list was just validated by the fingerprint function, so the paths below are plain.
            CHANGED_INPUTS="$(source_git diff --name-only --no-renames "$AGENT_REVISION" "$HEAD_COMMIT" -- | grep -Fx -f <(source_git cat-file blob "$HEAD_COMMIT:scriptahubAgent/deployment/dependency-inputs.txt") | tr '\n' ' ' || true)"
            CHANGED_INPUTS="${CHANGED_INPUTS% }"
            echo "::error::Skill dependencies changed after the agent image revision: the dependency fingerprint of $BRANCH@$HEAD_COMMIT is $HEAD_FINGERPRINT, the image carries $DEPENDENCY_LABEL (changed inputs: ${CHANGED_INPUTS:-none found}). $REFUSAL"
            exit 1
          fi
          {
            printf 'SCRIPTA_HEAD=%s\n' "$HEAD_COMMIT"
            printf 'SCRIPTA_BRANCH=%s\n' "$BRANCH"
            printf 'SCRIPTA_AGENT_REVISION=%s\n' "$AGENT_REVISION"
            printf 'SCRIPTA_AGENT_INDEX=%s\n' "$AGENT_INDEX"
            printf 'SCRIPTA_ROBOTEAM_INDEX=%s\n' "$ROBOTEAM_INDEX"
            printf 'SCRIPTA_DEPENDENCY_FINGERPRINT=%s\n' "$HEAD_FINGERPRINT"
          } >> "$GITHUB_ENV"
          echo "[deploy-qa-scriptahub] Resolved $BRANCH@$HEAD_COMMIT; agent image $AGENT_REPO@$AGENT_INDEX revision $AGENT_REVISION; RoboTeam $ROBOTEAM_REPO@$ROBOTEAM_INDEX"

      - name: Check out Bizanso
        uses: actions/checkout@v4
        with:
          repository: Axiologic/bizanso
          ssh-key: ${{ secrets.EXPLORER_QA_BIZANSO_DEPLOY_KEY }}
          path: .qa-bizanso-source
          fetch-depth: 0
          persist-credentials: false

      # Same rule: the key stays on the runner. The full history is fetched because it is bundled for the Box.
      - name: Check out PromotionScoutV2
        uses: actions/checkout@v4
        with:
          repository: AssistOS-AI/PromotionScoutV2
          ssh-key: ${{ secrets.EXPLORER_QA_PROMOTIONSCOUT_DEPLOY_KEY }}
          path: .qa-promotionscout-source
          persist-credentials: false
          fetch-depth: 0

      # Same rule: the key stays on the runner. Only the agent folder is copied into the Box later, so the shared
      # campaign data the repository also tracks under data/ never reaches the QA host.
      - name: Check out simpleCSVMailSend
        uses: actions/checkout@v4
        with:
          repository: Axiologic/simpleCSVMailSend
          ssh-key: ${{ secrets.EXPLORER_QA_CSVMAIL_DEPLOY_KEY }}
          path: .qa-csvmail-source
          fetch-depth: 0
          persist-credentials: false

      # No SSH here: a source without the agent folder is refused before anything on the host changes.
      - name: Resolve the CSV Mail source
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/.qa-csvmail-source"
          COMMIT="$(git -C "$SOURCE" rev-parse HEAD)"
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The simpleCSVMailSend checkout has no 40-hex HEAD commit"
            exit 1
          fi
          if ! git -C "$SOURCE" cat-file -e "$COMMIT:csvMailAgent/manifest.json"; then
            echo "::error::simpleCSVMailSend@$COMMIT has no csvMailAgent/manifest.json. Nothing was changed."
            exit 1
          fi
          printf 'CSVMAIL_COMMIT=%s\n' "$COMMIT" >> "$GITHUB_ENV"
          echo "[deploy-qa] simpleCSVMailSend resolved at $COMMIT."

      - name: Test the unpublished-source check
        run: node --test tests/smoke/lib/qa-unpublished-acceptance.test.mjs tests/smoke/lib/qa-predeploy.test.mjs tests/smoke/lib/qa-copy-manifest.test.mjs tests/smoke/lib/qa-source-inventory.test.mjs tests/smoke/lib/qa-publication.test.mjs

      - name: Check for unpublished QA sources
        id: source_check
        env:
          EXPLORER_QA_LAST_BIZANSO_COMMIT: ${{ vars.EXPLORER_QA_LAST_BIZANSO_COMMIT }}
          EXPLORER_QA_LAST_CSVMAIL_COMMIT: ${{ vars.EXPLORER_QA_LAST_CSVMAIL_COMMIT }}
          RESET_EXPLORER_CHECKOUT: ${{ inputs.reset_explorer_checkout }}
        run: node .github/scripts/qaPredeploy.mjs check full

      - name: Retain the blocked source report
        if: ${{ failure() && steps.source_check.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-unpublished-report
          path: ${{ runner.temp }}/qa-unpublished-report.md
          retention-days: 7

      - name: Bootstrap the host and deploy through Ploinky commands
        env:
          EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN }}
          RECREATE_BOX: ${{ inputs.recreate_box }}
          RESET_EXPLORER_CHECKOUT: ${{ inputs.reset_explorer_checkout }}
          QA_USERPERSISTO_GOOGLE_CLIENT_ID: ${{ vars.EXPLORER_QA_USERPERSISTO_GOOGLE_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          export -n EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN
          umask 077
          case "$RECREATE_BOX" in
            true|false) ;;
            *) echo "::error::recreate_box must be true or false"; exit 1 ;;
          esac
          case "$RESET_EXPLORER_CHECKOUT" in
            true|false) ;;
            *) echo "::error::reset_explorer_checkout must be true or false"; exit 1 ;;
          esac
          # Everything below this check changes the host, so it comes first: it only reads, and it refuses before anything is changed.
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${SSH_USER}@${SSH_HOST}")
          LOCK=/home/admin/.qa-deployment-operation.lock
          WORK_DIR="/home/admin/$WORKSPACE"
          PLOINKY_BIN=/home/admin/.qa-deployment-tools/ploinky/bin/ploinky

          # In-Box programs are fixed strings without a single quote, because run_in_box embeds them in one. A value
          # reaches a program only on stdin, and the program checks it again.
          run_in_box() {
            "${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman container exec -i --user podman --workdir '$WORK_DIR' --env 'PLOINKY_WORKSPACE_ROOT=$WORK_DIR' ploinky-box-explorerqaworkspace-7a31ab7775eb sh -c '$1' sh"
          }
          # BEGIN QA registry check
          # Every Bizanso agent the QA registry lists as enabled must still have its folder in the checked-out Bizanso tree, so that
          # a tree without an enabled agent's folder is refused before anything changes. The registry is read inside the Box by a
          # fixed program, and it is a read: nothing has changed when this refuses. Records with an alias are skipped, as the
          # production deploy skips them. The registry lives in the host workspace and outlives a stopped Box, so a host with no
          # running Box passes only the first call. A caller that has just started the Box passes a second argument and
          # a missing Box then refuses. The first argument says what the refusal leaves behind.
          QA_REGISTRY_PROGRAM='set -eu
          if [ ! -e .ploinky/agents.json ]; then exit 3; fi
          cat .ploinky/agents.json'
          qa_registry_check() {
            local outcome="$1" need_box="${2:-}"
            local box=ploinky-box-explorerqaworkspace-7a31ab7775eb running='' file="$RUNNER_TEMP/qa-registry-agents.json" status=0 missing=''
            running="$("${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman ps --quiet --no-trunc --filter 'name=^$box\$'" < /dev/null)" || status=$?
            if [ "$status" -eq 75 ]; then
              echo "::error::Another Explorer QA operation holds the host lock. $outcome"
              return 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::Cannot read the QA registry: the check for a running Box exited $status. $outcome"
              return 1
            fi
            if [ -z "$running" ] && [ -n "$need_box" ]; then
              echo "::error::The QA Box is not running although it was just started, so the registry cannot be checked. $outcome"
              return 1
            fi
            if [ -z "$running" ]; then
              echo "[qa] No QA Box is running yet; the registry is checked again once it runs."
              return 0
            fi
            run_in_box "$QA_REGISTRY_PROGRAM" < /dev/null > "$file" || status=$?
            case "$status" in
              0) ;;
              3)
                echo "[qa] The running Box has no registry yet, so there is nothing to check."
                return 0
                ;;
              75)
                echo "::error::Another Explorer QA operation holds the host lock. $outcome"
                return 1
                ;;
              *)
                echo "::error::Cannot read the QA registry (exit $status). $outcome"
                return 1
                ;;
            esac
            status=0
            missing="$(node --input-type=module - "$file" "$GITHUB_WORKSPACE/.qa-bizanso-source" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const [file, tree] = process.argv.slice(2);
          let agents;
          try {
            agents = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch {
            process.exit(3);
          }
          if (!agents || typeof agents !== 'object' || Array.isArray(agents)) process.exit(3);
          const names = new Set();
          for (const record of Object.values(agents)) {
            if (!record || record.type !== 'agent' || record.repoName !== 'bizanso' || record.alias) continue;
            const name = record.agentName;
            if (typeof name !== 'string' || !/^[A-Za-z0-9._-]+$/.test(name) || name === '.' || name === '..') process.exit(3);
            names.add(name);
          }
          const missing = [...names].sort().filter((name) => {
            try {
              return !fs.statSync(path.join(tree, name, 'manifest.json')).isFile();
            } catch {
              return true;
            }
          });
          process.stdout.write(missing.map((name) => `${name}\n`).join(''));
          process.exit(missing.length ? 4 : 0);
          NODE
            )" || status=$?
            case "$status" in
              0) ;;
              4)
                echo "::error::The QA registry lists the enabled Bizanso agent(s) ${missing//$'\n'/ }, but the checked-out Bizanso tree has no <agent>/manifest.json for them. $outcome Disable the agent on QA first, or restore its folder in the Bizanso tree."
                return 1
                ;;
              *)
                echo "::error::Cannot read the QA registry: it is empty, malformed or not a JSON object (exit $status). $outcome"
                return 1
                ;;
            esac
            echo "[qa] The QA registry lists no Bizanso agent whose folder the checked-out tree lacks."
          }
          qa_registry_check "Nothing was changed." || exit 1
          # END QA registry check

          echo '[deploy-qa] Bootstrapping the pinned Node before cache admission...'
          BOOTSTRAP_LOG="$RUNNER_TEMP/explorer-qa-bootstrap.log"
          "${SSH[@]}" "flock -n -E 75 --close '$LOCK' bash -s" <<'REMOTE' | tee "$BOOTSTRAP_LOG"
          set -euo pipefail
          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ]; then
            echo '[qa] ERROR: the remote identity is not the pinned admin account.'
            exit 1
          fi
          WORK_DIR=/home/admin/explorerQaWorkspace
          if [ -L "$WORK_DIR" ] || { [ -e "$WORK_DIR" ] && [ ! -d "$WORK_DIR" ]; }; then
            echo "[qa] ERROR: the workspace path is not a real directory: $WORK_DIR"
            exit 1
          fi
          # The removed non-Ploinky workflows parked the router access policy and an install marker here, and only
          # they restored them. Running over that state would silently lose the policy.
          STATE_DIR=/home/admin/.qa-deployment-state
          if [ -e "$STATE_DIR" ] && [ -n "$(ls -A "$STATE_DIR")" ]; then
            echo "[qa] ERROR: $STATE_DIR holds state parked by the removed non-Ploinky QA workflows. No tracked workflow finishes it: restore that workflow from history through the reviewed change process first."
            exit 1
          fi
          for tool in git node curl podman flock; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          # BEGIN QA isolated Node runtime
          install_qa_node() (
            set -euo pipefail
            umask 077
            case "$(uname -m)" in
              x86_64)
                QA_NODE_ARCH=x64
                QA_NODE_SHA=14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
                ;;
              aarch64|arm64)
                QA_NODE_ARCH=arm64
                QA_NODE_SHA=01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc
                ;;
              *) echo '[deploy-qa] Unsupported QA Node architecture.' >&2; exit 1 ;;
            esac
            QA_TOOLS_ROOT=/home/admin/.qa-deployment-tools
            QA_NODE_DIST="node-v24.19.0-linux-$QA_NODE_ARCH"
            QA_NODE_TARGET="$QA_TOOLS_ROOT/$QA_NODE_DIST"
            QA_NODE_ARCHIVE="$QA_TOOLS_ROOT/$QA_NODE_DIST.tar.xz"
            node --input-type=module - "$QA_TOOLS_ROOT" "$QA_NODE_DIST" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [root, distribution] = process.argv.slice(2);
          assert.equal(root, '/home/admin/.qa-deployment-tools');
          assert(/^node-v24\.19\.0-linux-(x64|arm64)$/.test(distribution));
          if (!fs.existsSync(root)) fs.mkdirSync(root, { mode: 0o700 });
          for (const [file, directory, privateMode] of [
              [root, true, true],
              [path.join(root, `${distribution}.tar.xz`), false, true],
              [path.join(root, distribution), true, false],
              [path.join(root, distribution, 'bin/node'), false, false],
          ]) {
              let stat;
              try { stat = fs.lstatSync(file); } catch (error) { if (error.code === 'ENOENT') continue; throw error; }
              assert(!stat.isSymbolicLink() && (directory ? stat.isDirectory() : stat.isFile()), 'Unsafe QA Node path');
              assert.equal(fs.realpathSync(file), file, 'QA Node path traverses a symlink');
              assert.equal(stat.uid, process.getuid(), 'QA Node path has a different owner');
              assert.equal(stat.mode & (privateMode ? 0o077 : 0o022), 0, 'Unsafe QA Node permissions');
              if (!directory) assert.equal(stat.nlink, 1, 'QA Node file has multiple links');
          }
          NODE
            QA_NODE_STAGE="$(mktemp -d "$QA_TOOLS_ROOT/.node-install-XXXXXXXX")"
            cleanup_qa_node_stage() {
              node --input-type=module - "$QA_TOOLS_ROOT" "$QA_NODE_STAGE" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [root, stage] = process.argv.slice(2);
          assert.equal(root, '/home/admin/.qa-deployment-tools');
          assert.equal(path.dirname(stage), root);
          assert(/^\.node-install-[A-Za-z0-9]{8}$/.test(path.basename(stage)));
          const stat = fs.lstatSync(stage);
          assert(stat.isDirectory() && !stat.isSymbolicLink() && stat.uid === process.getuid());
          assert.equal(fs.realpathSync(stage), stage);
          fs.rmSync(stage, { recursive: true });
          NODE
            }
            trap cleanup_qa_node_stage EXIT
            if [ ! -f "$QA_NODE_ARCHIVE" ]; then
              curl -fsS --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 \
                --max-filesize 104857600 \
                "https://nodejs.org/dist/v24.19.0/$QA_NODE_DIST.tar.xz" -o "$QA_NODE_STAGE/archive.tar.xz"
              printf '%s  %s\n' "$QA_NODE_SHA" "$QA_NODE_STAGE/archive.tar.xz" | timeout 30 sha256sum -c - >/dev/null
              mv -T "$QA_NODE_STAGE/archive.tar.xz" "$QA_NODE_ARCHIVE"
            fi
            printf '%s  %s\n' "$QA_NODE_SHA" "$QA_NODE_ARCHIVE" | timeout 30 sha256sum -c - >/dev/null
            if [ ! -e "$QA_NODE_TARGET" ]; then
              timeout 60 tar --no-same-owner --no-same-permissions -xJf "$QA_NODE_ARCHIVE" -C "$QA_NODE_STAGE"
              mv -T "$QA_NODE_STAGE/$QA_NODE_DIST" "$QA_NODE_TARGET"
            fi
            # Validate an existing binary against the pinned archive too; a
            # version string or cached marker alone is not integrity evidence.
            timeout 60 tar --no-same-owner --no-same-permissions -xJf "$QA_NODE_ARCHIVE" \
              -C "$QA_NODE_STAGE" "$QA_NODE_DIST/bin/node"
            timeout 30 cmp -s "$QA_NODE_STAGE/$QA_NODE_DIST/bin/node" "$QA_NODE_TARGET/bin/node"
            [ "$(timeout 10 "$QA_NODE_TARGET/bin/node" --version)" = 'v24.19.0' ]
            printf '%s\n' "$QA_NODE_TARGET"
          )
          QA_NODE_HOME="$(install_qa_node)"
          export PATH="$QA_NODE_HOME/bin:$PATH"
          # END QA isolated Node runtime
          printf 'QA_NODE_HOME=%s\n' "$QA_NODE_HOME"
          REMOTE
          QA_NODE_HOME="$(sed -n 's/^QA_NODE_HOME=//p' "$BOOTSTRAP_LOG" | tail -n 1)"
          if [[ ! "$QA_NODE_HOME" =~ ^/home/admin/\.qa-deployment-tools/node-v24\.19\.0-linux-(x64|arm64)$ ]]; then
            echo "::error::The bootstrap did not report the pinned Node."
            exit 1
          fi
          printf 'QA_NODE_HOME=%s\n' "$QA_NODE_HOME" >> "$GITHUB_ENV"
          QA_NODE_HOME="$QA_NODE_HOME" EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN="${EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN:-}" bash "$GITHUB_WORKSPACE/.github/scripts/qa-cache-router.sh" pre
          unset EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN

          TUNNEL_LIST_RESPONSE=''
          TUNNEL_MUTATION_RESPONSE=''
          TUNNEL_TOKEN_RESPONSE=''
          TUNNEL_DETAIL_RESPONSE=''
          TUNNEL_CONFIG_RESPONSE=''
          TUNNEL_DNS_RESPONSE=''
          cleanup_local_files() {
            for target in \
              "$TUNNEL_LIST_RESPONSE" \
              "$TUNNEL_MUTATION_RESPONSE" \
              "$TUNNEL_TOKEN_RESPONSE" \
              "$TUNNEL_DETAIL_RESPONSE" \
              "$TUNNEL_CONFIG_RESPONSE" \
              "$TUNNEL_DNS_RESPONSE"; do
              if [ -n "$target" ]; then rm -f "$target"; fi
            done
          }
          trap cleanup_local_files EXIT

          TUNNEL_LIST_RESPONSE="$(mktemp /tmp/explorer_qa_provision_list.XXXXXX)"
          TUNNEL_MUTATION_RESPONSE="$(mktemp /tmp/explorer_qa_provision_mutation.XXXXXX)"
          TUNNEL_TOKEN_RESPONSE="$(mktemp /tmp/explorer_qa_provision_token.XXXXXX)"
          TUNNEL_DETAIL_RESPONSE="$(mktemp /tmp/explorer_qa_provision_detail.XXXXXX)"
          TUNNEL_CONFIG_RESPONSE="$(mktemp /tmp/explorer_qa_provision_config.XXXXXX)"
          TUNNEL_DNS_RESPONSE="$(mktemp /tmp/explorer_qa_provision_dns.XXXXXX)"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          CLOUDFLARE_TUNNEL_ID="$(
            node --input-type=module - "$TUNNEL_LIST_RESPONSE" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tunnels = payload?.success === true ? payload.result : null;
          if (!Array.isArray(tunnels) || tunnels.length > 1) {
            throw new Error('dedicated Explorer QA tunnel inventory is ambiguous');
          }
          if (tunnels.length === 1 && (tunnels[0]?.name !== process.env.CLOUDFLARE_TUNNEL_NAME
            || tunnels[0]?.deleted_at != null)) {
            throw new Error('dedicated Explorer QA tunnel identity changed');
          }
          process.stdout.write(String(tunnels[0]?.id || ''));
          NODE
          )"
          CLOUDFLARE_TUNNEL_CREATED='false'
          if [ -z "$CLOUDFLARE_TUNNEL_ID" ]; then
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"name":"explorer-qa","config_src":"cloudflare"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
              > "$TUNNEL_MUTATION_RESPONSE"
            CLOUDFLARE_TUNNEL_ID="$(
              node --input-type=module - "$TUNNEL_MUTATION_RESPONSE" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tunnel = payload?.success === true ? payload.result : null;
          if (!tunnel || tunnel.name !== 'explorer-qa' || tunnel.deleted_at != null) {
            throw new Error('Cloudflare did not create the exact dedicated Explorer QA tunnel');
          }
          process.stdout.write(String(tunnel.id || ''));
          NODE
            )"
            CLOUDFLARE_TUNNEL_CREATED='true'
          fi
          if [[ ! "$CLOUDFLARE_TUNNEL_ID" =~ ^[a-f0-9-]{36}$ ]] ||
            [ "$CLOUDFLARE_TUNNEL_ID" = "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" ]; then
            echo "::error::Dedicated Explorer QA tunnel identity is malformed or aliases the protected shared tunnel"
            exit 1
          fi
          export CLOUDFLARE_TUNNEL_ID CLOUDFLARE_TUNNEL_CREATED
          {
            printf 'CLOUDFLARE_TUNNEL_ID=%s\n' "$CLOUDFLARE_TUNNEL_ID"
            printf 'CLOUDFLARE_TUNNEL_CREATED=%s\n' "$CLOUDFLARE_TUNNEL_CREATED"
          } >> "$GITHUB_ENV"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode "name=$CLOUDFLARE_TUNNEL_NAME" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
            > "$TUNNEL_LIST_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID" \
            > "$TUNNEL_DETAIL_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/configurations" \
            > "$TUNNEL_CONFIG_RESPONSE"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --get \
            --data-urlencode "name=$PUBLIC_HOST" \
            --data-urlencode 'per_page=100' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
            > "$TUNNEL_DNS_RESPONSE"
          node --input-type=module - \
            "$TUNNEL_LIST_RESPONSE" \
            "$TUNNEL_DETAIL_RESPONSE" \
            "$TUNNEL_CONFIG_RESPONSE" \
            "$TUNNEL_DNS_RESPONSE" \
            "$CLOUDFLARE_TUNNEL_ID" \
            "$CLOUDFLARE_TUNNEL_CREATED" <<'NODE'
          import fs from 'node:fs';

          const [listPath, detailPath, configPath, dnsPath, selectedId, created] = process.argv.slice(2);
          const parseResult = (file, label) => {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (payload?.success !== true) throw new Error(`${label} inventory failed`);
            return payload.result;
          };
          const named = parseResult(listPath, 'dedicated tunnel list');
          const detail = parseResult(detailPath, 'dedicated tunnel detail');
          const config = parseResult(configPath, 'dedicated tunnel configuration');
          const records = parseResult(dnsPath, 'dedicated tunnel DNS');
          if (!['true', 'false'].includes(created)
            || !Array.isArray(named) || named.length !== 1 || named[0]?.id !== selectedId
            || detail?.id !== selectedId || detail?.name !== 'explorer-qa'
            || detail?.deleted_at != null
            || (detail?.account_tag != null && detail.account_tag !== process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error('dedicated Explorer QA tunnel create/reuse did not converge to one exact identity');
          }
          const ingress = config?.config?.ingress ?? config?.ingress ?? [];
          if (!Array.isArray(ingress) || ingress.length > 2) {
            throw new Error('dedicated Explorer QA tunnel has shared or ambiguous ingress');
          }
          if (ingress.length) {
            if (ingress.at(-1)?.hostname != null || ingress.at(-1)?.service !== 'http_status:404') {
              throw new Error('dedicated Explorer QA tunnel lacks the terminal 404 ingress');
            }
          }
          if (ingress.length === 2
            && (ingress[0]?.hostname !== process.env.PUBLIC_HOST
              || ingress[0]?.service !== 'http://127.0.0.1:8080')) {
            throw new Error('dedicated Explorer QA tunnel contains an unrelated route');
          }
          if (!Array.isArray(records) || records.length > 1) {
            throw new Error('Explorer QA DNS is ambiguous');
          }
          const expectedTarget = `${selectedId}.cfargotunnel.com`;
          if (records.length === 1 && (records[0]?.type !== 'CNAME'
            || records[0]?.name !== process.env.PUBLIC_HOST
            || records[0]?.content !== expectedTarget
            || records[0]?.proxied !== true)) {
            throw new Error('Explorer QA DNS does not target the selected dedicated tunnel');
          }
          if (created === 'true' && (ingress.length > 1 || records.length !== 0)) {
            throw new Error('new dedicated tunnel was not empty at its create/reuse boundary');
          }
          NODE
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/token" \
            > "$TUNNEL_TOKEN_RESPONSE"
          CLOUDFLARE_TUNNEL_TOKEN="$(
            node --input-type=module - "$TUNNEL_TOKEN_RESPONSE" "$CLOUDFLARE_TUNNEL_ID" <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedTunnel = process.argv[3];
          const token = payload?.success === true ? String(payload.result || '').trim() : '';
          if (!token) throw new Error('Cloudflare returned no dedicated connector credential');
          let claims = null;
          for (const candidate of [token, ...token.split('.')]) {
            try {
              const decoded = JSON.parse(Buffer.from(candidate, 'base64url').toString('utf8'));
              const account = String(decoded?.a || decoded?.accountId || '');
              const tunnel = String(decoded?.t || decoded?.tunnelId || '');
              if (account && tunnel) { claims = { account, tunnel }; break; }
            } catch { }
          }
          if (!claims || claims.account !== process.env.CLOUDFLARE_ACCOUNT_ID
            || claims.tunnel !== expectedTunnel) {
            throw new Error('connector token claims do not match the dedicated Explorer QA tunnel/account');
          }
          process.stdout.write(token);
          NODE
          )"
          if [ "$CLOUDFLARE_TUNNEL_TOKEN" = "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare management and connector authorities must be separate credentials"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_TUNNEL_TOKEN"
          export CLOUDFLARE_TUNNEL_TOKEN
          rm -f \
            "$TUNNEL_LIST_RESPONSE" \
            "$TUNNEL_MUTATION_RESPONSE" \
            "$TUNNEL_TOKEN_RESPONSE" \
            "$TUNNEL_DETAIL_RESPONSE" \
            "$TUNNEL_CONFIG_RESPONSE" \
            "$TUNNEL_DNS_RESPONSE"
          TUNNEL_LIST_RESPONSE=''
          TUNNEL_MUTATION_RESPONSE=''
          TUNNEL_TOKEN_RESPONSE=''
          TUNNEL_DETAIL_RESPONSE=''
          TUNNEL_CONFIG_RESPONSE=''
          TUNNEL_DNS_RESPONSE=''
          echo "[deploy-qa] Dedicated Explorer QA tunnel id=$CLOUDFLARE_TUNNEL_ID created=$CLOUDFLARE_TUNNEL_CREATED."


          "${SSH[@]}" "flock -n -E 75 --close '$LOCK' bash -s -- '$QA_NODE_HOME'" <<'REMOTE' | tee -a "$BOOTSTRAP_LOG"
          set -euo pipefail
          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ]; then
            echo '[qa] ERROR: the remote identity is not the pinned admin account.'
            exit 1
          fi
          export PATH="$1/bin:$PATH"
          for tool in git node curl podman flock; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          WORK_DIR=/home/admin/explorerQaWorkspace
          if [ -L "$WORK_DIR" ] || { [ -e "$WORK_DIR" ] && [ ! -d "$WORK_DIR" ]; }; then
            echo '[qa] ERROR: the workspace is no longer the expected QA directory.'
            exit 1
          fi
          if [ -d /home/admin/.qa-deployment-state ] && [ -n "$(ls -A /home/admin/.qa-deployment-state)" ]; then
            echo '[qa] ERROR: the removed non-Ploinky QA workflows parked state in /home/admin/.qa-deployment-state. Restore that workflow from history through the reviewed change process first.'
            exit 1
          fi
          # Ploinky cannot install itself, so this bootstrap is the one Git use on the host. The checkout lies
          # outside the workspace: a Box mounts it read-only and cannot write its hooks or configuration.
          PLOINKY_URL=https://github.com/AssistOS-AI/ploinky.git
          CHECKOUT=/home/admin/.qa-deployment-tools/ploinky
          BRANCH="$(git ls-remote --symref "$PLOINKY_URL" HEAD | awk '$1 == "ref:" && $3 == "HEAD" { sub("refs/heads/", "", $2); print $2 }')"
          [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          if [ -L "$CHECKOUT" ]; then
            echo "[qa] ERROR: the Ploinky checkout path must not be a symlink: $CHECKOUT"
            exit 1
          fi
          if [ ! -e "$CHECKOUT" ]; then
            git clone --quiet --branch "$BRANCH" "$PLOINKY_URL" "$CHECKOUT"
          fi
          if [ "$(git -C "$CHECKOUT" remote get-url origin)" != "$PLOINKY_URL" ]; then
            echo "[qa] ERROR: unexpected Ploinky checkout origin."
            exit 1
          fi
          git -C "$CHECKOUT" fetch --quiet origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git -C "$CHECKOUT" checkout --quiet "$BRANCH"
          git -C "$CHECKOUT" merge --quiet --ff-only "origin/$BRANCH"
          echo "[qa] Ploinky $(git -C "$CHECKOUT" rev-parse --short HEAD) on $BRANCH."
          mkdir -p "$WORK_DIR"
          chmod 700 "$WORK_DIR"
          # The one read of the workspace: a kept publication cannot follow a replaced tunnel.
          if [ -e "$WORK_DIR/.ploinky/edge-desired.json" ]; then echo 'QA_KEPT_PUBLICATION=true'; fi
          REMOTE

          REMOTE_ENV="cd '$WORK_DIR' && export PATH='$QA_NODE_HOME/bin':\"\$PATH\" PLOINKY_WORKSPACE_ROOT='$WORK_DIR'"
          # Every argument below is a fixed word. A secret only ever reaches a command through ssh stdin.
          ploinky_locked() {
            local status=0
            "${SSH[@]}" "$REMOTE_ENV && exec flock -n -E 75 --close '$LOCK' '$PLOINKY_BIN' $*" || status=$?
            if [ "$status" -eq 75 ]; then
              echo "::error::Another Explorer QA operation holds the host lock."
            fi
            return "$status"
          }
          ploinky_read() {
            "${SSH[@]}" "$REMOTE_ENV && exec '$PLOINKY_BIN' $*"
          }
          unrelated_containers() {
            "${SSH[@]}" "set -o pipefail; podman ps -a --format '{{.ID}} {{.Names}}' | { grep -v ' ploinky-box-explorerqaworkspace-7a31ab7775eb$' || true; } | sort"
          }
          soul_healthy() {
            "${SSH[@]}" "curl -sf 'http://127.0.0.1:${SOUL_GATEWAY_ROUTER_PORT}/base-agent-additional-server/soul-gateway/7000/healthz/' >/dev/null"
          }

          # Image housekeeping. Every removal is `podman image rm <id>` on an ID that was listed and validated first;
          # podman refuses an image a container still uses. The prune never forces, never removes by a broad filter,
          # and never fails the job: only the disk gate below can stop a run.
          # BEGIN QA image cleanup
          BOX_CONTAINER=ploinky-box-explorerqaworkspace-7a31ab7775eb
          PRUNE_BOX_IMAGE=docker.io/assistos/ploinky-box
          DISK_MIN_FREE_GIB=5
          # Reserve space for the prepared ScriptaHub agent image before pulling new layers.
          SCRIPTA_AGENT_IMAGE_NEW_GIB=11
          DISK_WARN_FREE_GIB=10
          # One podman call on the host or inside the Box, under the same host lock as every other mutation.
          prune_podman() {
            local scope="$1"
            shift
            if [ "$scope" = host ]; then
              "${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman $*" < /dev/null
            else
              "${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman container exec --user podman --workdir '$WORK_DIR' --env 'PLOINKY_WORKSPACE_ROOT=$WORK_DIR' $BOX_CONTAINER podman $*" < /dev/null
            fi
          }
          # Removes each validated unused candidate image and reports the unused named images it keeps. On the host,
          # which other workspaces share, a candidate is a dangling image whose name history shows it was the Box image.
          # Inside the Box a candidate is an unused image that is dangling, or whose names are all digest references to a
          # product repository these workflows pull by digest (PRUNE_DIGEST_REPOS): such a pull never leaves the image it
          # replaces dangling, and each rollout would otherwise keep the superseded agent image (about 10 GB for
          # ScriptaHub). An image with a tag, such as scriptahub-agent:runtime, is never a candidate, because a later start
          # resolves that tag; nor is any other digest-pinned image, such as Ploinky's Router authority helper
          # (library/node@sha256:...), which has no container between probes but must stay present.
          PRUNE_DIGEST_REPOS='docker.io/assistos/scriptahub-agent docker.io/assistos/roboteam-agent docker.io/assistos/bizanso-agent'
          prune_scope() {
            local scope="$1" phase="$2" listing filter id containers dangling refs names line is_box_image ref repo product keep removed=0
            local -a ref_list
            filter='--filter dangling=true'
            [ "$scope" = host ] || filter=''
            if ! listing="$(prune_podman "$scope" image ls $filter --format "'{{.ID}} {{.Containers}} {{.Dangling}} {{.Names}}'")"; then
              echo "::warning::prune $scope failed ($phase): the image listing failed"
              return 0
            fi
            while read -r id containers dangling refs; do
              [ -n "$id" ] || continue
              refs="${refs#[}"
              refs="${refs%]}"
              if [[ ! "$id" =~ ^[a-f0-9]{12,64}$ ]]; then
                echo "::warning::prune $scope: skipped an unexpected image ID in the listing"
                continue
              fi
              if [ "$containers" != 0 ]; then
                [ "$scope" = box ] && [ "$dangling" != true ] && continue
                echo "[deploy-qa] prune $scope: kept $id in use by $containers container(s)"
                continue
              fi
              if [ "$scope" = host ]; then
                if ! names="$(prune_podman host image inspect --format "'{{range .NamesHistory}}{{println .}}{{end}}'" "$id")"; then
                  echo "::warning::prune host failed ($phase): inspecting $id failed"
                  continue
                fi
                is_box_image=false
                while IFS= read -r line; do
                  case "$line" in
                    "$PRUNE_BOX_IMAGE"|"$PRUNE_BOX_IMAGE":*|"$PRUNE_BOX_IMAGE"@*) is_box_image=true ;;
                  esac
                done <<< "$names"
                if [ "$is_box_image" != true ]; then
                  echo "[deploy-qa] prune host: kept unrelated dangling image $id"
                  continue
                fi
              elif [ "$dangling" != true ]; then
                [ "$dangling" = false ] || continue
                keep=true
                if [ -n "$refs" ]; then
                  keep=false
                  read -r -a ref_list <<< "$refs"
                  for ref in "${ref_list[@]}"; do
                    if [[ ! "$ref" =~ ^([a-z0-9./_-]+)@sha256:[a-f0-9]{64}$ ]]; then
                      keep=true
                      continue
                    fi
                    product=false
                    for repo in $PRUNE_DIGEST_REPOS; do
                      [ "${BASH_REMATCH[1]}" = "$repo" ] && product=true
                    done
                    [ "$product" = true ] || keep=true
                  done
                fi
                [ "$keep" = false ] || continue
              fi
              if prune_podman "$scope" image rm "$id" > /dev/null; then
                echo "[deploy-qa] prune $scope: removed $id${refs:+ $refs}"
                removed=$((removed + 1))
              else
                echo "::warning::prune $scope: podman kept $id"
              fi
            done <<< "$listing"
            if [ "$scope" = host ]; then
              echo "[deploy-qa] prune host: removed $removed dangling image(s)"
            else
              echo "[deploy-qa] prune box: removed $removed unused dangling or digest-only image(s)"
            fi
            if listing="$(prune_podman "$scope" image ls --format "'{{.ID}} {{.Containers}} {{.Dangling}} {{.Size}} {{.Names}}'")"; then
              while read -r id containers dangling rest; do
                if [ "$containers" = 0 ] && [ "$dangling" = false ]; then
                  echo "[deploy-qa] prune $scope: kept unused named image $id $rest"
                fi
              done <<< "$listing"
            fi
            return 0
          }
          prune_images() {
            local phase="$1"
            echo "[deploy-qa] Pruning unused dangling images ($phase)..."
            prune_scope host "$phase" || true
            if [ "$phase" = post ] || [ "${BOX_STATE:-absent}" = present ]; then
              prune_scope box "$phase" || true
            else
              echo '[deploy-qa] prune box: skipped, no Box exists yet'
            fi
          }
          # Free GiB of the admin home filesystem.
          free_disk_gib() {
            local kib
            kib="$("${SSH[@]}" "df -Pk /home/admin" < /dev/null | awk 'NR == 2 { print $4 }')"
            if [[ ! "$kib" =~ ^[0-9]+$ ]]; then
              return 1
            fi
            echo $((kib / 1048576))
          }
          require_free_disk() {
            local free
            if ! free="$(free_disk_gib)"; then
              echo "::error::Could not read the free disk space of the QA host."
              exit 1
            fi
            echo "[deploy-qa] free disk: $free GiB"
            if [ "$free" -lt "$DISK_MIN_FREE_GIB" ]; then
              echo "::error::Free disk $free GiB is below $DISK_MIN_FREE_GIB GiB; no agent or repository moved yet. See usage on the host with: du -xh --max-depth=2 $WORK_DIR | sort -h | tail; then free space or grow the disk."
              exit 1
            fi
            if [ "$free" -lt "$DISK_WARN_FREE_GIB" ]; then
              echo "::warning::QA host free disk $free GiB is below $DISK_WARN_FREE_GIB GiB"
            fi
          }
          # END QA image cleanup

          SOUL_UP_BEFORE=0
          if soul_healthy; then SOUL_UP_BEFORE=1; fi
          UNRELATED_BEFORE="$(unrelated_containers)"

          # The graph this deploy owns. An operator may enable more agents; those need not be ready, but a
          # failed one still fails the run.
          GRAPH_RUNTIMES='explorer gitAgent userPersistoAgent emailAgent dpuAgent roboTeamAgent soul-gateway workspaceMonitorAgent local-llm'
          # Prints "agent state" for the runtime block of `ploinky status`, whose repository block also has badges.
          runtime_states() {
            awk '/^Agent runtimes:/ { on = 1; next }
              on && match($0, /\[[a-z-]+\] \[[a-z-]+\]/) { split(substr($0, RSTART, RLENGTH), word, /[][ ]+/); state = word[2]; next }
              on && state != "" && /agent:/ { for (i = 1; i <= NF; i++) if ($i == "agent:") print $(i + 1), state; state = "" }'
          }
          # Prints each installed repository of `ploinky list repos`, whose other lines name uninstalled ones.
          installed_repos() {
            awk '/^- / && /\[installed\]/ { name = $2; sub(/:$/, "", name); print name }'
          }
          # `ploinky status` overlays each detached runtime's semantic readiness on its state. Waiting also
          # lets the detached launches settle before the next start or update.
          wait_ready() {
            local streak=0 states agent complete
            for _ in $(seq 1 180); do
              states="$(ploinky_read status | sed 's/\x1b\[[0-9;]*m//g' | runtime_states)" || states=''
              if grep -q ' failed$' <<< "$states"; then
                printf '%s\n' "$states"
                echo "::error::A runtime reported failed readiness."
                return 1
              fi
              complete=1
              for agent in $GRAPH_RUNTIMES; do
                grep -qx "$agent running" <<< "$states" || complete=0
              done
              if [ "$complete" = 1 ]; then
                streak=$((streak + 1))
                if [ "$streak" -ge 3 ]; then
                  printf '%s\n' "$states"
                  return 0
                fi
              else
                streak=0
              fi
              sleep 10
            done
            printf '%s\n' "$states"
            echo "::error::Timed out waiting for the graph runtimes to stay ready."
            return 1
          }
          # RoboTeam's manifest declares these two `link-install` checkouts at the workspace root. They hold no agent
          # folder, so `ploinky update repo <name>` cannot resolve them ("not installed") and the repository listing
          # never names them. Each moves by a fast-forward inside the Box under the host lock, and only when it exists.
          # A checkout that is a symlink, has another (or a redirected) origin, is off its branch, is dirty (untracked files count) or has diverged fails the
          # run and is left untouched. The program holds no single quote, because run_in_box wraps it in one.
          LINK_INSTALL_PROGRAM='set -eu
          export GIT_ALLOW_PROTOCOL=https
          for name in AdvancedLanguageAgent DocumentationSkills; do
            if [ ! -e "$name" ] && [ ! -L "$name" ]; then echo "$name is not at the workspace root; skipped."; continue; fi
            if [ -L "$name" ]; then echo "$name is a symlink; left untouched." >&2; exit 1; fi
            url=https://github.com/AssistOS-AI/$name.git
            link_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$name" "$@"; }
            origin=$(link_git remote get-url origin) || { echo "$name has no origin; left untouched." >&2; exit 1; }
            if [ "$origin" != "$url" ] && [ "$origin" != "${url%.git}" ]; then echo "$name has an unexpected origin; left untouched." >&2; exit 1; fi
            branch=$(link_git symbolic-ref --short HEAD) || { echo "$name is on a detached HEAD; left untouched." >&2; exit 1; }
            if [ -n "$(link_git status --porcelain)" ]; then echo "$name has uncommitted or untracked changes; left untouched." >&2; exit 1; fi
            link_git fetch --quiet "$url" "+refs/heads/$branch:refs/remotes/origin/$branch"
            if link_git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch"; then
              :
            else
              status=$?
              if [ "$status" -eq 1 ]; then echo "$name has commits that $branch lacks; left untouched." >&2
              else echo "$name could not be compared with origin/$branch; left untouched." >&2; fi
              exit 1
            fi
            link_git merge --quiet --ff-only "refs/remotes/origin/$branch"
            echo "$name $(link_git rev-parse --short HEAD) on $branch."
          done'
          # Start never fetches a checkout that exists, so kept sources move forward here. A full `ploinky update`
          # fails on an enabled repository with no Git checkout, so each other repository moves on its own; a
          # dirty or diverged required source fails the run and is left untouched.
          update_kept_repos() {
            local managed repo
            managed="$(ploinky_read list repos | sed 's/\x1b\[[0-9;]*m//g' | installed_repos)"
            if ! grep -qx 'AchillesIDE' <<< "$managed"; then
              echo "::error::The repository listing did not name AchillesIDE."
              exit 1
            fi
            for repo in $managed; do
              if [[ ! "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                echo "::error::Unexpected repository name in the listing."
                exit 1
              fi
              if [ "$repo" != bizanso ] && [ "$repo" != PromotionScoutV2 ] && [ "$repo" != simpleCSVMailSend ]; then
                ploinky_locked update repo "$repo"
              fi
            done
            if ! run_in_box "$LINK_INSTALL_PROGRAM" < /dev/null; then
              echo "::error::A link-install checkout could not be fast-forwarded (it must be clean, untracked files included) and was left untouched, or another Explorer QA operation holds the host lock. Repositories may already have changed; no restart has occurred."
              exit 1
            fi
          }

          if [ "${CLOUDFLARE_TUNNEL_CREATED:-}" = true ] && grep -qx 'QA_KEPT_PUBLICATION=true' "$BOOTSTRAP_LOG"; then
            echo "::error::The dedicated tunnel was missing and a new one was created, but the workspace keeps a publication naming the old one. Dispatch destroy-explorer-qa-ploinky.yml with delete_data ticked."
            exit 1
          fi
          if ! STATUS_OUTPUT="$(ploinky_read status)"; then
            printf '%s\n' "$STATUS_OUTPUT"
            echo "::error::Status failed. A Box that this checkout refuses, such as one the removed non-Ploinky deploy workflow created: dispatch destroy-explorer-qa-ploinky.yml with delete_data unchecked, then deploy again."
            exit 1
          fi
          BOX_STATE=present
          if [[ "$STATUS_OUTPUT" == *'Ploinky Box: absent'* ]]; then BOX_STATE=absent; fi
          echo "[deploy-qa] Box before this run: $BOX_STATE; recreate requested: $RECREATE_BOX; Explorer checkout reset requested: $RESET_EXPLORER_CHECKOUT."
          # A reset runs only in the first start of a workspace with no Box, before anything has moved.
          if [ "$RESET_EXPLORER_CHECKOUT" = true ] && [ "$BOX_STATE" = present ]; then
            echo "::error::reset_explorer_checkout needs a workspace with no Box. Nothing was changed."
            exit 1
          fi
          # Nothing has moved yet: free what earlier rollouts left behind, then refuse to start on a full disk.
          prune_images pre
          require_free_disk
          if [ "$BOX_STATE" = present ] && [ "$RECREATE_BOX" = true ]; then
            # Repair retained production mode while the Box still has its selected port.
            ploinky_locked var PROD false
            ploinky_locked destroy
            BOX_STATE=absent
          fi
          # The update and restart below expect a running graph, so anything short of one starts first.
          GRAPH_UP=true
          STATUS_STATES="$(printf '%s\n' "$STATUS_OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' | runtime_states)"
          for agent in $GRAPH_RUNTIMES; do
            grep -qx "$agent running" <<< "$STATUS_STATES" || GRAPH_UP=false
          done
          # A Box that was just destroyed, or never existed, has no graph whatever the status read before the destroy showed.
          # The first start then always runs, with the router port, before anything else needs a Box.
          if [ "$BOX_STATE" = absent ]; then GRAPH_UP=false; fi
          if [ "$BOX_STATE" = present ]; then
            ploinky_locked var PROD false
            ploinky_locked profile qa
          fi
          if [ "$GRAPH_UP" = false ]; then
            # `ploinky var` needs a Box, and only `start` accepts the port; a Box created by `var` would take
            # 8080, which Soul Gateway owns on this host. So the first start runs before the values are set.
            # A fresh workspace has no publication yet; kept data republishes its kept tunnel.
            # Start does not move a kept checkout, and a failed start removes the Box it created, so nothing can
            # update a kept checkout that the current Ploinky refuses. reset_explorer_checkout asks this start to
            # hard-reset only AchillesIDE to main before it reads any manifest.
            if [ "$RESET_EXPLORER_CHECKOUT" = true ]; then
              ploinky_locked --port "$ROUTER_PORT" start explorer --profile qa --repo-branch AchillesIDE=main --reset-repos
            else
              ploinky_locked --port "$ROUTER_PORT" start explorer --profile qa
            fi
            wait_ready
          fi
          ploinky_locked var PROD false
          ploinky_locked profile qa
          # The Box runs now, possibly started on a kept workspace whose registry the first check could not read. Nothing
          # below has copied the Bizanso tree yet.
          qa_registry_check "Bizanso was not copied; the Box may have been started." need_box || exit 1

          printf '%s' "$CLOUDFLARE_API_TOKEN" | ploinky_locked var "$CLOUDFLARE_API_SECRET_HANDLE" --stdin
          printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" | ploinky_locked var "$CLOUDFLARE_TUNNEL_SECRET_HANDLE" --stdin
          unset CLOUDFLARE_TUNNEL_TOKEN

          SAVED_ORIGINS="$(ploinky_read echo USERPERSISTO_ALLOWED_REDIRECT_ORIGINS | sed -n 's/^USERPERSISTO_ALLOWED_REDIRECT_ORIGINS=//p' | tail -n 1)"
          ALLOWED_ORIGINS="$(node --input-type=module - "$SAVED_ORIGINS" "$PUBLIC_URL" <<'NODE'
          const origins = [...process.argv[2].split(','), process.argv[3]].map((value) => value.trim()).filter(Boolean);
          const allowed = [...new Set(origins.map((value) => {
            const url = new URL(value);
            if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password
              || url.pathname !== '/' || url.search || url.hash) {
              throw new Error('invalid saved UserPersisto redirect origin');
            }
            return url.origin;
          }))].sort();
          process.stdout.write(allowed.join(','));
          NODE
          )"
          USERPERSISTO_SERVICE="$PUBLIC_URL/base-agent-additional-server/userPersistoAgent/7000/service"
          printf '%s' "$USERPERSISTO_SERVICE/oidc" | ploinky_locked var USERPERSISTO_OIDC_ISSUER --stdin
          printf '%s' "$ALLOWED_ORIGINS" | ploinky_locked var USERPERSISTO_ALLOWED_REDIRECT_ORIGINS --stdin
          # A public callback disables the distributed localhost-only Google fallback. Without a
          # supplied or saved client, Google stays off.
          printf '%s' "$USERPERSISTO_SERVICE/auth/google/callback" | ploinky_locked var USERPERSISTO_GOOGLE_REDIRECT_URI --stdin
          if [ -n "${QA_USERPERSISTO_GOOGLE_CLIENT_ID:-}" ]; then
            if [[ ! "$QA_USERPERSISTO_GOOGLE_CLIENT_ID" =~ ^[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
              echo "::error::EXPLORER_QA_USERPERSISTO_GOOGLE_CLIENT_ID must be a Google Web application client ID"
              exit 1
            fi
            printf '%s' "$QA_USERPERSISTO_GOOGLE_CLIENT_ID" | ploinky_locked var USERPERSISTO_GOOGLE_CLIENT_ID --stdin
          fi

          # Bizanso, PromotionScoutV2, ScriptaHub and simpleCSVMailSend live at the workspace root, where RoboTeam finds their flows and Ploinky prefers
          # them. No Ploinky command places a repository there, so these steps run inside the Box, and never Git on
          # the host. A repository still in its earlier managed location is uninstalled first, which also disables
          # its agent and keeps its data; finding it in both places is left to an operator.
          # BEGIN QA workspace repositories
          run_in_box() {
            "${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman container exec -i --user podman --workdir '$WORK_DIR' --env 'PLOINKY_WORKSPACE_ROOT=$WORK_DIR' ploinky-box-explorerqaworkspace-7a31ab7775eb sh -c '$1' sh"
          }
          MANAGED_PROGRAM='set -eu
          for name in bizanso PromotionScoutV2 ScriptaHubAgent simpleCSVMailSend; do
            if [ -e ".ploinky/repos/$name" ]; then
              if [ -e "$name" ]; then echo "$name is both managed and at the workspace root" >&2; exit 1; fi
              echo "$name"
            fi
          done'
          # Bizanso is private and the Box holds no credential, so the runner streams its default branch in as a
          # copy with no Git metadata. The previous copy stays until the next run, because the running agent still
          # reads it until the restart below. A run that follows a failed restart removes it, and Bizanso alone is
          # then broken until a restart succeeds.
          COPY_PROGRAM='set -eu
          stage=$PWD/.ploinky/.qa-private-copy
          mkdir -p "$stage"
          for stale in "$stage"/*; do
            if [ -e "$stale" ] || [ -L "$stale" ]; then rm -rf -- "$stale"; fi
          done
          incoming=$(mktemp -d "$stage/incoming.XXXXXX")
          tar -xf - -C "$incoming"
          test -n "$(ls -A "$incoming")"
          test ! -e "$incoming/.git"
          if [ -e bizanso ] || [ -L bizanso ]; then mv bizanso "$stage/previous"; fi
          mv "$incoming" bizanso'
          # PromotionScoutV2 is private too, but it must stay a real checkout. The runner streams a Git bundle of its
          # default branch, which the Box clones once, with `origin` set to the public URL, and afterwards fetches
          # into refs/remotes/origin only. A clean checkout that is behind fast-forwards; a dirty, diverged or
          # otherwise different one fails the run and is left untouched. `update repo` skips it, because the Box
          # holds no credential for that origin. Its stage directory is separate, so Bizanso keeps its predecessor.
          BUNDLE_PROGRAM='set -eu
          url=https://github.com/AssistOS-AI/PromotionScoutV2.git
          stage=$PWD/.ploinky/.qa-private-bundle
          mkdir -p "$stage"
          rm -rf -- "$stage"/* "$stage"/.[!.]*
          trap "rm -rf -- \"$stage\"" EXIT
          cat > "$stage/incoming.bundle"
          heads=$(git bundle list-heads "$stage/incoming.bundle")
          test "$(printf "%s\n" "$heads" | wc -l)" -eq 1
          ref=${heads#* }
          case "$ref" in refs/heads/?*) ;; *) echo "The bundle must hold exactly one branch." >&2; exit 1 ;; esac
          branch=${ref#refs/heads/}
          if [ ! -e PromotionScoutV2 ] && [ ! -L PromotionScoutV2 ]; then
            git -c core.hooksPath=/dev/null clone --quiet --branch "$branch" "$stage/incoming.bundle" "$stage/clone"
            git -C "$stage/clone" remote set-url origin "$url"
            mv "$stage/clone" PromotionScoutV2
            exit 0
          fi
          test "$(git -C PromotionScoutV2 remote get-url origin)" = "$url"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C PromotionScoutV2 fetch --quiet "$stage/incoming.bundle" "+$ref:refs/remotes/origin/$branch"
          if [ "$(git -C PromotionScoutV2 symbolic-ref --short HEAD)" != "$branch" ]; then
            echo "PromotionScoutV2 is not on $branch; left untouched." >&2; exit 1
          fi
          if [ -n "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C PromotionScoutV2 status --porcelain)" ]; then
            echo "PromotionScoutV2 has uncommitted changes; left untouched." >&2; exit 1
          fi
          if ! git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C PromotionScoutV2 merge-base --is-ancestor HEAD "refs/remotes/origin/$branch"; then
            echo "PromotionScoutV2 has commits that $branch lacks; left untouched." >&2; exit 1
          fi
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C PromotionScoutV2 merge --quiet --ff-only "refs/remotes/origin/$branch"'
          # ScriptaHub is public, so it is an ordinary checkout that `update repo` fast-forwards below.
          CLONE_PROGRAM='set -eu
          url=https://github.com/Axiologic/ScriptaHubAgent.git
          if [ ! -e ScriptaHubAgent ]; then git clone --quiet "$url" ScriptaHubAgent; fi
          test "$(git -C ScriptaHubAgent remote get-url origin)" = "$url"'
          # simpleCSVMailSend is private too and is placed like Bizanso, as a copy with no Git metadata: CSV Mail keeps
          # its sync clone in its own data directory and never reads Git in its code. Only csvMailAgent/ arrives, so
          # the campaign data the repository tracks under data/ stays off the host. Its stage directory is separate,
          # so Bizanso keeps its predecessor, and a tree without the agent manifest leaves the live copy in place.
          CSVMAIL_PLACE_PROGRAM='set -eu
          stage=$PWD/.ploinky/.qa-csvmail-copy
          repo=$PWD/simpleCSVMailSend
          previous=$stage/previous
          real_dir_or_absent() {
            if [ -L "$1" ] || { [ -e "$1" ] && [ ! -d "$1" ]; }; then
              echo "Expected a real directory or absent path: $1" >&2; exit 1
            fi
          }
          real_dir_or_absent "$PWD/.ploinky"
          real_dir_or_absent "$stage"
          real_dir_or_absent "$repo"
          real_dir_or_absent "$previous"
          real_dir_or_absent "$repo/csvMailAgent"
          real_dir_or_absent "$previous/csvMailAgent"
          mkdir -p "$stage" "$repo" "$previous"
          incoming=$(mktemp -d "$stage/incoming.XXXXXX")
          trap "rm -rf -- \"$incoming\"" EXIT
          tar -xf - -C "$incoming"
          test "$(ls -A "$incoming")" = csvMailAgent
          test ! -L "$incoming/csvMailAgent"
          test -d "$incoming/csvMailAgent"
          test ! -L "$incoming/csvMailAgent/manifest.json"
          test -f "$incoming/csvMailAgent/manifest.json"
          if [ -d "$repo/csvMailAgent" ]; then
            rm -rf -- "$previous/csvMailAgent"
            mv "$repo/csvMailAgent" "$previous/csvMailAgent"
            if ! mv "$incoming/csvMailAgent" "$repo/csvMailAgent"; then
              if [ ! -e "$repo/csvMailAgent" ] && [ ! -L "$repo/csvMailAgent" ]; then
                mv "$previous/csvMailAgent" "$repo/csvMailAgent" || echo "Could not restore CSV Mail predecessor" >&2
              else
                echo "Cannot restore CSV Mail predecessor: destination exists" >&2
              fi
              exit 1
            fi
          else
            mv "$incoming/csvMailAgent" "$repo/csvMailAgent"
          fi'
          # A plain assignment, because a failed command in a `for` list would not stop the run.
          MANAGED_LOCATIONS="$(run_in_box "$MANAGED_PROGRAM" < /dev/null)"
          for repo in $MANAGED_LOCATIONS; do
            case "$repo" in
              bizanso|PromotionScoutV2|ScriptaHubAgent|simpleCSVMailSend) ploinky_locked uninstall repo "$repo" ;;
              *) echo "::error::Unexpected repository in the managed location check."; exit 1 ;;
            esac
          done
          node .github/scripts/qaPredeploy.mjs prepare bizanso
          git -C "$GITHUB_WORKSPACE/.qa-bizanso-source" archive --format=tar HEAD | run_in_box "$COPY_PROGRAM"
          node .github/scripts/qaPredeploy.mjs installed bizanso
          node .github/scripts/qaPredeploy.mjs prepare simpleCSVMailSend
          git -C "$GITHUB_WORKSPACE/.qa-csvmail-source" archive --format=tar "$CSVMAIL_COMMIT" csvMailAgent | run_in_box "$CSVMAIL_PLACE_PROGRAM"
          node .github/scripts/qaPredeploy.mjs installed simpleCSVMailSend
          PROMOTIONSCOUT_SOURCE="$GITHUB_WORKSPACE/.qa-promotionscout-source"
          PROMOTIONSCOUT_BRANCH="$(git -C "$PROMOTIONSCOUT_SOURCE" symbolic-ref --short HEAD)"
          git -C "$PROMOTIONSCOUT_SOURCE" bundle create - "refs/heads/$PROMOTIONSCOUT_BRANCH" | run_in_box "$BUNDLE_PROGRAM"
          run_in_box "$CLONE_PROGRAM" < /dev/null
          # END QA workspace repositories
          printf '%s' "$PUBLIC_URL/base-agent-additional-server/bizanso/8787" | ploinky_locked var BIZANSO_PUBLIC_LINK_BASE --stdin

          # Bizanso, PromotionScoutV2, ScriptaHub and CSV Mail sit beside the Explorer graph, so they join the awaited runtimes only from here:
          # a first start cannot wait for agents it has not been asked to run. `add repo` registers the checkouts
          # placed above. Enabling issues a new instance identity, so only a missing runtime is enabled.
          # Bizanso lists CSV Mail among the agents it enables, but a start of the Explorer graph never reads that
          # list, so CSV Mail is registered and enabled here, before Bizanso, as the Bizanso production deploy does.
          ploinky_locked add repo https://github.com/Axiologic/simpleCSVMailSend.git simpleCSVMailSend
          ploinky_locked add repo https://github.com/Axiologic/bizanso.git bizanso
          ploinky_locked add repo https://github.com/AssistOS-AI/PromotionScoutV2.git PromotionScoutV2
          ploinky_locked add repo https://github.com/Axiologic/ScriptaHubAgent.git ScriptaHubAgent
          ENABLED_STATES="$(ploinky_read status | sed 's/\x1b\[[0-9;]*m//g' | runtime_states)"
          if ! grep -q '^csvMailAgent ' <<< "$ENABLED_STATES"; then
            ploinky_locked enable agent simpleCSVMailSend/csvMailAgent
          fi
          if ! grep -q '^bizanso ' <<< "$ENABLED_STATES"; then
            ploinky_locked enable agent bizanso/bizanso
          fi
          if ! grep -q '^promotionScout ' <<< "$ENABLED_STATES"; then
            ploinky_locked enable agent PromotionScoutV2/promotionScout
          fi
          if ! grep -q '^scriptahubAgent ' <<< "$ENABLED_STATES"; then
            ploinky_locked enable agent ScriptaHubAgent/scriptahubAgent
          fi
          GRAPH_RUNTIMES="$GRAPH_RUNTIMES bizanso promotionScout scriptahubAgent"
          # A line of its own: the line above is shared byte for byte with the product workflows, which never place
          # or enable CSV Mail.
          GRAPH_RUNTIMES="$GRAPH_RUNTIMES csvMailAgent"

          # BEGIN QA ScriptaHub images
          # Both images are pinned to registry indexes resolved on the runner. The generic RoboTeam tag may
          # still name an older custom image, so it is always restored from the registry-resolved image.
          IMAGE_FREE_GIB="$(free_disk_gib)" || { echo "::error::Could not read free disk; repositories may already have changed."; exit 1; }
          if [ "$IMAGE_FREE_GIB" -lt $((DISK_MIN_FREE_GIB + SCRIPTA_AGENT_IMAGE_NEW_GIB)) ]; then
            echo "::error::Insufficient disk for the prepared agent image; repositories may already have changed, no image was pulled or restarted."
            exit 1
          fi
          if ! printf '%s\n%s\n%s\n' "$SCRIPTA_AGENT_INDEX" "$SCRIPTA_ROBOTEAM_INDEX" "$SCRIPTA_AGENT_REVISION" | run_in_box 'set -eu
          read -r agent_digest
          read -r robot_digest
          read -r revision
          case "$agent_digest$robot_digest" in *[!a-z0-9:]*) exit 1 ;; esac
          case "$agent_digest" in sha256:*) ;; *) exit 1 ;; esac
          case "$robot_digest" in sha256:*) ;; *) exit 1 ;; esac
          test "${#agent_digest}" -eq 71
          test "${#robot_digest}" -eq 71
          case "${agent_digest#sha256:}${robot_digest#sha256:}" in *[!0-9a-f]*) exit 1 ;; esac
          agent=docker.io/assistos/scriptahub-agent@$agent_digest
          robot=docker.io/assistos/roboteam-agent@$robot_digest
          podman pull -q "$agent" > /dev/null
          podman pull -q "$robot" > /dev/null
          test "$(podman image inspect --format "{{index .Labels \"org.opencontainers.image.revision\"}}" "$agent")" = "$revision"
          podman tag "$agent" docker.io/assistos/scriptahub-agent:runtime
          podman tag "$robot" docker.io/assistos/roboteam-agent:runtime
          printf "AGENT_ID=%s\n" "$(podman image inspect --format "{{.Id}}" "$agent")"
          printf "ROBOTEAM_ID=%s\n" "$(podman image inspect --format "{{.Id}}" "$robot")"' > "$RUNNER_TEMP/qa-scriptahub-pull.txt"; then
            echo "::error::Image preparation failed; images may have been pulled and runtime tags may have moved. Repositories may already have changed; no restart has occurred."
            exit 1
          fi
          AGENT_ID="$(sed -n 's/^AGENT_ID=//p' "$RUNNER_TEMP/qa-scriptahub-pull.txt" | tail -n 1)"
          ROBOTEAM_ID="$(sed -n 's/^ROBOTEAM_ID=//p' "$RUNNER_TEMP/qa-scriptahub-pull.txt" | tail -n 1)"
          if [[ ! "$AGENT_ID" =~ ^[0-9a-f]{64}$ ]] || [[ ! "$ROBOTEAM_ID" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Image IDs were not reported; images were pulled and tags may have moved. No restart has occurred."
            exit 1
          fi
          # END QA ScriptaHub images

          # Kept sources move forward here. The restart activates them and registers the MCP tools of newly
          # enabled agents with the Router.
          update_kept_repos
          # Check the populated registry only after all retained and copied sources have been refreshed.
          ploinky_locked profile check
          # Check the exact selected source and its dependency fingerprint after repository updates and before restart.
          # Both values arrive on stdin and are checked again inside the Box.
          if ! printf '%s\n%s\n' "$SCRIPTA_HEAD" "$SCRIPTA_DEPENDENCY_FINGERPRINT" | run_in_box 'set -eu
          read -r head
          read -r expected
          case "$head" in ""|*[!0-9a-f]*) exit 1 ;; esac
          test "${#head}" -eq 40
          case "$expected" in ""|*[!0-9a-f]*) exit 1 ;; esac
          test "${#expected}" -eq 64
          g() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C ScriptaHubAgent "$@"; }
          test -z "$(g status --porcelain)"
          test "$(g rev-parse HEAD)" = "$head"
          # BEGIN ScriptaHub dependency fingerprint
          # Dependency fingerprint v1 of a commit: the sha256 of a header and one line, blob id and path, for every file that
          # scriptahubAgent/deployment/dependency-inputs.txt lists. It runs Git with hooks off and executes nothing from the
          # checkout. Usage: scripta_dependency_fingerprint <repository directory> <40-hex commit>. It prints 64 lowercase hex
          # digits, or prints nothing and fails on every input that parseDependencyInputs of dependency-fingerprint.mjs
          # rejects. The body is a subshell and checks every step itself, because errexit is off wherever a caller tests the result.
          scripta_dependency_fingerprint() (
            LC_ALL=C
            export LC_ALL
            repo=$1
            rev=$2
            inputs=scriptahubAgent/deployment/dependency-inputs.txt
            fp_fail() { echo "dependency fingerprint: $1" >&2; exit 1; }
            fp_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$repo" "$@"; }
            case "$rev" in ""|*[!0-9a-f]*) fp_fail "invalid commit" ;; esac
            [ "${#rev}" -eq 40 ] || fp_fail "invalid commit"
            nl=$(printf "\nx")
            nl=${nl%x}
            tab=$(printf "\tx")
            tab=${tab%x}
            cr=$(printf "\rx")
            cr=${cr%x}
            list=$(fp_git cat-file blob "$rev:$inputs") || fp_fail "cannot read $inputs at $rev"
            [ -n "$list" ] || fp_fail "dependency inputs are empty"
            case "$list" in *"$cr"*) fp_fail "dependency inputs must use LF line endings" ;; esac
            blob=$(fp_git rev-parse "$rev:$inputs") || fp_fail "cannot read $inputs at $rev"
            hashed=$(printf "%s\n" "$list" | fp_git hash-object --no-filters --stdin) || fp_fail "cannot hash the dependency inputs"
            case "$blob" in ""|*[!0-9a-f]*) fp_fail "invalid blob id" ;; esac
            [ "${#blob}" -eq 40 ] || fp_fail "invalid blob id"
            [ "$hashed" = "$blob" ] || fp_fail "dependency inputs must end with exactly one newline"
            case "$nl$list$nl" in *"$nl$nl"*) fp_fail "dependency inputs contain a blank line" ;; esac
            sorted=$(printf "%s\n" "$list" | sort -u) || fp_fail "cannot sort the dependency inputs"
            [ "$sorted" = "$list" ] || fp_fail "dependency inputs must be strictly ascending"
            data=
            self=0
            set -f
            IFS=$nl
            for p in $list; do
              case "$p" in
                ""|/*|*/|*//*|*[!A-Za-z0-9._/-]*) fp_fail "invalid dependency input path" ;;
              esac
              case "/$p/" in */./*|*/../*) fp_fail "invalid dependency input path" ;; esac
              entry=$(fp_git ls-tree "$rev" -- "$p") || fp_fail "cannot list $p at $rev"
              case "$entry" in
                "100644 blob "*|"100755 blob "*) ;;
                *) fp_fail "$p is not a regular file at $rev" ;;
              esac
              rest=${entry#* blob }
              oid=${rest%%"$tab"*}
              name=${rest#*"$tab"}
              [ "$name" = "$p" ] || fp_fail "$p is not one tree entry at $rev"
              case "$oid" in ""|*[!0-9a-f]*) fp_fail "invalid blob id of $p" ;; esac
              [ "${#oid}" -eq 40 ] || fp_fail "invalid blob id of $p"
              if [ "$p" = "$inputs" ]; then self=1; fi
              data="$data$oid $p$nl"
            done
            [ "$self" -eq 1 ] || fp_fail "dependency inputs must list $inputs"
            if command -v sha256sum > /dev/null 2>&1; then
              out=$(printf "scriptahub-dependency-fingerprint-v1\n%s" "$data" | sha256sum) || fp_fail "cannot hash"
            else
              out=$(printf "scriptahub-dependency-fingerprint-v1\n%s" "$data" | shasum -a 256) || fp_fail "cannot hash"
            fi
            sum=${out%% *}
            case "$sum" in ""|*[!0-9a-f]*) fp_fail "invalid digest" ;; esac
            [ "${#sum}" -eq 64 ] || fp_fail "invalid digest"
            printf "%s\n" "$sum"
          )
          # END ScriptaHub dependency fingerprint
          actual=$(scripta_dependency_fingerprint ScriptaHubAgent "$head") || exit 1
          test "$actual" = "$expected"'; then
            echo "::error::ScriptaHub checkout did not match the selected source or its dependency fingerprint; repositories and image tags may have changed, no restart has occurred."
            exit 1
          fi
          ploinky_locked restart
          wait_ready
          # Verify actual running image IDs, rather than relying on mutable local tags.
          if ! printf '%s\n%s\n' "$AGENT_ID" "$ROBOTEAM_ID" | run_in_box 'set -eu
          read -r agent_id
          read -r robot_id
          for spec in "ploinky_ScriptaHubAgent_scriptahubAgent_:$agent_id" "ploinky_AchillesIDE_roboTeamAgent_:$robot_id" "ploinky_AchillesIDE_roboWorkAgent_:$robot_id"; do
            prefix=${spec%:*}; expected=${spec#*:}
            lines=$(podman ps --no-trunc --format "{{.Names}} {{.ImageID}}" | awk -v p="$prefix" "index(\$1,p)==1 {print \$2}")
            test "$(printf "%s\n" "$lines" | grep -c .)" -eq 1
            test "$lines" = "$expected"
          done'; then
            echo "::error::Post-restart image verification failed; repositories and image tags have changed and the workspace was restarted."
            exit 1
          fi

          # Handles only: this document never holds a secret value.
          EDGE_DOCUMENT="$(node --input-type=module <<'NODE'
          const { PUBLIC_HOST, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID, CLOUDFLARE_TUNNEL_ID,
            CLOUDFLARE_TUNNEL_SECRET_HANDLE, CLOUDFLARE_API_SECRET_HANDLE, MEDIA_PUBLIC_IPV4 } = process.env;
          process.stdout.write(JSON.stringify({
            hosts: {
              [PUBLIC_HOST]: {
                agent: 'AchillesIDE/explorer',
                routerSurfaces: ['browser-auth', 'agent-mcp', 'user-admin', 'workspace-assets', 'blob-transfer',
                  'marketplace-ui', 'webchat', 'webtty'],
              },
            },
            cloudflare: {
              accountId: CLOUDFLARE_ACCOUNT_ID,
              zoneId: CLOUDFLARE_ZONE_ID,
              tunnelId: CLOUDFLARE_TUNNEL_ID,
              tunnelTokenSecret: CLOUDFLARE_TUNNEL_SECRET_HANDLE,
              apiTokenSecret: CLOUDFLARE_API_SECRET_HANDLE,
            },
            media: { publicIPv4: MEDIA_PUBLIC_IPV4, addressMode: 'direct' },
          }));
          NODE
          )"
          printf '%s\n' "$EDGE_DOCUMENT" | ploinky_locked edge set -

          echo '[deploy-qa] Starting Explorer with the publication...'
          ploinky_locked --port "$ROUTER_PORT" start explorer --profile qa

          wait_ready

          if ! "${SSH[@]}" "curl -s -o /dev/null --max-time 15 'http://127.0.0.1:${ROUTER_PORT}/'"; then
            echo "::error::The Box Router did not answer on loopback port $ROUTER_PORT."
            exit 1
          fi
          if [ "$SOUL_UP_BEFORE" = 1 ] && ! soul_healthy; then
            echo "::error::Protected Soul Gateway became unhealthy during the deployment."
            exit 1
          fi
          if [ "$UNRELATED_BEFORE" != "$(unrelated_containers)" ]; then
            echo "::error::An unrelated host container changed during the deployment."
            exit 1
          fi
          echo '[deploy-qa] Explorer QA Box is ready.'
          # After the readiness checks, so a prune problem can never mask them. It only warns.
          prune_images post
          if FREE_AFTER="$(free_disk_gib)"; then
            echo "[deploy-qa] free disk after prune: $FREE_AFTER GiB"
          else
            echo '::warning::Could not read the free disk space after the prune.'
          fi

      - name: Verify public URL
        run: |
          set -euo pipefail
          echo "[deploy-qa] Verifying the exact public Explorer login application..."
          RESPONSE_FILE="$RUNNER_TEMP/explorer-qa-response.txt"
          HEADER_FILE="$RUNNER_TEMP/explorer-qa-headers.txt"
          MISMATCH_RESPONSE_FILE="$RUNNER_TEMP/explorer-qa-mismatch-response.txt"
          MISMATCH_HEADER_FILE="$RUNNER_TEMP/explorer-qa-mismatch-headers.txt"
          for attempt in $(seq 1 60); do
            code="$(
              curl -sS --max-time 15 \
                -D "$HEADER_FILE" \
                -o "$RESPONSE_FILE" \
                -w '%{http_code}' \
                "${PUBLIC_URL%/}/auth/login?agent=explorer" || true
            )"
            mismatch_code="$(
              curl -sS --max-time 15 \
                -D "$MISMATCH_HEADER_FILE" \
                -o "$MISMATCH_RESPONSE_FILE" \
                -w '%{http_code}' \
                "${PUBLIC_URL%/}/auth/login?agent=dpuAgent" || true
            )"
            if { [ "$code" = "303" ] || [ "$code" = "200" ]; } && [ "$mismatch_code" = "400" ] && node --input-type=module - \
              "$RESPONSE_FILE" \
              "$HEADER_FILE" \
              "$MISMATCH_RESPONSE_FILE" \
              "$MISMATCH_HEADER_FILE" <<'NODE'
          import fs from 'node:fs';

          const body = fs.readFileSync(process.argv[2], 'utf8');
          const headers = fs.readFileSync(process.argv[3], 'utf8');
          const mismatchBody = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));
          const mismatchHeaders = fs.readFileSync(process.argv[5], 'utf8').toLowerCase();
          // BEGIN QA public email-first verification
          const publicUrl = 'https://explorer-qa.axiologic.dev';
          if (/EDGE_GENERATION_INACTIVE|cloudflare tunnel error|error code: 1033/i.test(body)) process.exit(1);
          // Current Routers answer with a 303 to the provider; older ones served
          // a Continue with Single Sign-On page that redirected from script.
          const location = headers.match(/^location:[ \t]*(\S+)[ \t]*\r?$/mi)?.[1];
          const redirect = body.match(/window\.location\.replace\(("(?:[^"\\]|\\.)*")\)/);
          if ((!location && (!/Continue with Single Sign-On/.test(body) || !redirect))
            || /<input[^>]+type=["']password["']/i.test(body)) process.exit(1);
          const login = new URL(location || JSON.parse(redirect[1]), publicUrl);
          const service = '/base-agent-additional-server/userPersistoAgent/7000/service';
          if (login.origin !== publicUrl || login.username || login.password || login.hash
            || login.pathname !== `${service}/auth/` || !login.searchParams.get('requestId')
            || !login.searchParams.get('state')) process.exit(1);
          if (mismatchBody?.ok !== false || mismatchBody?.error !== 'auth_route_context_mismatch') process.exit(1);
          if (!/^cf-ray:/mi.test(headers) || !/^cf-ray:/mi.test(mismatchHeaders)) process.exit(1);
          const get = async url => {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(15000) });
              if (!response.ok || !response.headers.get('cf-ray')) throw new Error();
              return response;
            } catch {
              throw new Error('QA identity endpoint is not ready through the public edge');
            }
          };
          const wizard = await (await get(login.href)).text();
          if (!/id=["']auth_content["']/.test(wizard) || !/<script[^>]+src=["']main\.js["']/.test(wizard)
            || /<input[^>]+type=["']password["']/i.test(wizard)) process.exit(1);
          const setup = await (await get(`${publicUrl}${service}/auth/setup`)).json();
          if (setup.ok !== true || typeof setup.setupComplete !== 'boolean' || typeof setup.registration !== 'boolean'
            || typeof setup.methods !== 'object' || setup.methods === null) process.exit(1);
          const issuer = `${publicUrl}${service}/oidc`;
          const discovery = await (await get(`${issuer}/.well-known/openid-configuration`)).json();
          if (discovery.issuer !== issuer || !discovery.code_challenge_methods_supported?.includes('S256')) process.exit(1);
          for (const key of ['authorization_endpoint', 'token_endpoint', 'jwks_uri', 'userinfo_endpoint']) {
            const endpoint = new URL(discovery[key]);
            if (endpoint.origin !== publicUrl || endpoint.username || endpoint.password || endpoint.search || endpoint.hash
              || !endpoint.pathname.startsWith(`${service}/oidc/`)) process.exit(1);
          }
          console.log('[deploy-qa] UserPersisto readiness:', JSON.stringify({
            setupComplete: setup.setupComplete,
            registration: setup.registration,
            methods: Object.fromEntries(['password', 'emailCode', 'passkey', 'totp', 'google'].map(name => [name, setup.methods[name] === true])),
          }));
          // END QA public email-first verification
          NODE
            then
              echo "[deploy-qa] Public edge verified the host-bound SSO login, email-first wizard, OIDC issuer, and rejected a mismatched agent selector."
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::Exact public Explorer application did not become ready; last HTTP codes: ${code:-none}/${mismatch_code:-none}"
              exit 1
            fi
            sleep 5
          done

      - name: Verify Bizanso and ScriptaHub
        run: |
          set -euo pipefail
          for path in bizanso/8787/how-it-works/ scriptahubAgent/3002/health; do
            url="${PUBLIC_URL%/}/base-agent-additional-server/$path"
            for attempt in $(seq 1 60); do
              code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$url" || true)"
              if [ "$code" = '200' ]; then
                echo "[deploy-qa] $path answers through the public edge."
                break
              fi
              if [ "$attempt" = '60' ]; then
                echo "::error::$path did not become ready; last HTTP code: ${code:-none}"
                exit 1
              fi
              sleep 5
            done
          done

      # CSV Mail accepts only signed-in users, so without a session the Router answers its route with a redirect to
      # the sign-in page. On the published QA host the Router leaves `agent=` out of that redirect, and it sends
      # unknown paths there too, so this only shows that the route asks for sign-in, not that it is published.
      # The runtime itself is proven by the awaited `csvMailAgent running` state of the deploy step.
      - name: Verify CSV Mail
        run: |
          set -euo pipefail
          route='/csvMailAgent/public/'
          expected="/auth/login?returnTo=%2FcsvMailAgent%2Fpublic%2F"
          for attempt in $(seq 1 60); do
            reply="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code} %header{location}' "${PUBLIC_URL%/}$route" || true)"
            if [ "$reply" = "302 $expected" ]; then
              echo "[deploy-qa] $route is published and asks for sign-in."
              break
            fi
            if [ "$attempt" = '60' ]; then
              echo "::error::$route was not published behind sign-in; last reply: ${reply:-none}"
              exit 1
            fi
            sleep 5
          done

      - name: Verify dedicated connector and protected Cloudflare topology
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.EXPLORER_QA_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          SNAPSHOT_FILE="$RUNNER_TEMP/explorer_qa_protected_cloudflare_before.json"
          if [ ! -f "$SNAPSHOT_FILE" ]; then
            echo "[deploy-qa] No protected Cloudflare preflight snapshot exists; no Cloudflare mutation was authorized."
            exit 0
          fi
          node --input-type=module - "$SNAPSHOT_FILE" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const before = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || '');
          const protectedTunnelId = String(process.env.CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID || '');
          const dedicatedTunnelId = String(process.env.CLOUDFLARE_TUNNEL_ID || '');
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value)
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([key, child]) => [key, stable(child)]));
          };
          const digest = (value) => `sha256:${crypto.createHash('sha256')
            .update(JSON.stringify(stable(value))).digest('hex')}`;
          const api = async (pathname) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              redirect: 'error',
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) throw new Error('Cloudflare post-deploy inventory failed');
            return payload.result;
          };
          const sharedDetail = await api(`/accounts/${accountId}/cfd_tunnel/${protectedTunnelId}`);
          const sharedConfig = await api(`/accounts/${accountId}/cfd_tunnel/${protectedTunnelId}/configurations`);
          const protectedDns = [];
          for (let page = 1; ; page += 1) {
            if (page > 100) throw new Error('protected DNS inventory exceeded the fail-closed page bound');
            const query = new URLSearchParams({ page: String(page), per_page: '100' });
            const records = await api(`/zones/${zoneId}/dns_records?${query}`);
            if (!Array.isArray(records)) throw new Error('protected DNS inventory is malformed');
            protectedDns.push(...records.filter((record) => record?.name !== process.env.PUBLIC_HOST));
            if (records.length < 100) break;
          }
          protectedDns.sort((left, right) => String(left?.id || '').localeCompare(String(right?.id || '')));
          const after = {
            tunnel: { id: sharedDetail.id, name: sharedDetail.name, accountTag: sharedDetail.account_tag || accountId },
            ingress: sharedConfig?.config?.ingress,
            dns: protectedDns,
          };
          const beforeJson = JSON.stringify(stable(before));
          const afterJson = JSON.stringify(stable(after));
          if (beforeJson !== afterJson || digest(after) !== process.env.PROTECTED_CLOUDFLARE_DIGEST) {
            throw new Error('protected proxies ingress or unrelated DNS identity changed during Explorer QA deployment');
          }
          if (/^[a-f0-9-]{36}$/.test(dedicatedTunnelId)) {
            const tunnelQuery = new URLSearchParams({ name: 'explorer-qa', is_deleted: 'false', per_page: '100' });
            const named = await api(`/accounts/${accountId}/cfd_tunnel?${tunnelQuery}`);
            const detail = await api(`/accounts/${accountId}/cfd_tunnel/${dedicatedTunnelId}`);
            const config = await api(`/accounts/${accountId}/cfd_tunnel/${dedicatedTunnelId}/configurations`);
            const dnsQuery = new URLSearchParams({ name: process.env.PUBLIC_HOST, per_page: '100' });
            const dns = await api(`/zones/${zoneId}/dns_records?${dnsQuery}`);
            const connections = await api(`/accounts/${accountId}/cfd_tunnel/${dedicatedTunnelId}/connections`);
            const expectedIngress = [
              { hostname: process.env.PUBLIC_HOST, service: 'http://127.0.0.1:8080' },
              { service: 'http_status:404' },
            ];
            if (!Array.isArray(named) || named.length !== 1 || named[0]?.id !== dedicatedTunnelId
              || detail?.id !== dedicatedTunnelId || detail?.name !== 'explorer-qa'
              || detail?.deleted_at != null
              || (detail?.account_tag != null && detail.account_tag !== accountId)
              || JSON.stringify(stable(config?.config?.ingress)) !== JSON.stringify(stable(expectedIngress))) {
              throw new Error('dedicated Explorer QA tunnel identity or ingress did not converge exactly');
            }
            if (!Array.isArray(dns) || dns.length !== 1
              || dns[0]?.type !== 'CNAME'
              || dns[0]?.name !== process.env.PUBLIC_HOST
              || dns[0]?.content !== `${dedicatedTunnelId}.cfargotunnel.com`
              || dns[0]?.proxied !== true
              || Number(dns[0]?.ttl) !== 1
              || !String(dns[0]?.id || '')) {
              throw new Error('Explorer QA DNS did not converge to the dedicated tunnel');
            }
            if (!Array.isArray(connections) || connections.length < 1) {
              throw new Error('dedicated Explorer QA connector has no active Cloudflare connection');
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `EXPLORER_QA_DNS_RECORD_ID=${dns[0].id}\n`);
            console.log(`Dedicated Explorer QA tunnel id=${dedicatedTunnelId} DNS id=${dns[0].id} connections=${connections.length}.`);
          }
          console.log(`Protected proxies ingress and unrelated DNS are unchanged at ${digest(after)}.`);
          NODE

      - name: Verify and clear the new QA origin cache
        id: cache_probe
        env:
          EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_PURGE_TOKEN }}
          QA_CACHE_FORCE_PROBE_FAILURE: ${{ inputs.force_cache_probe_failure }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/qa-cache-router.sh" post

      - name: Create summary
        if: always()
        env:
          RECREATE_BOX: ${{ inputs.recreate_box }}
          RESET_EXPLORER_CHECKOUT: ${{ inputs.reset_explorer_checkout }}
        run: |
          {
            echo "## Explorer QA Box Deploy (Ploinky commands)"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`, workspace \`~/${WORKSPACE}\`"
            echo "- Router publication: \`127.0.0.1:${ROUTER_PORT}:8080/tcp\`"
            echo "- Box recreated on request: \`${RECREATE_BOX}\`"
            echo "- Explorer checkout reset on request: \`${RESET_EXPLORER_CHECKOUT}\`"
            echo "- Sources: each managed repository's default branch at deploy time; no Ploinky command reports the deployed commits"
            printf -- '- Cloudflare tunnel: `%s` `%s`\n' "$CLOUDFLARE_TUNNEL_NAME" "${CLOUDFLARE_TUNNEL_ID:-not-created}"
            printf -- '- Cloudflare DNS record: `%s`\n' "${EXPLORER_QA_DNS_RECORD_ID:-not-created}"
            printf -- '- Protected shared tunnel: `%s` unchanged at `%s`\n' \
              "$CLOUDFLARE_PROTECTED_SHARED_TUNNEL_ID" "${PROTECTED_CLOUDFLARE_DIGEST:-not-snapshotted}"
            echo "- Public URL: \`${PUBLIC_URL}\`"
            echo "- Bizanso: \`${PUBLIC_URL}/base-agent-additional-server/bizanso/8787/\`"
            echo "- ScriptaHub: \`${PUBLIC_URL}/base-agent-additional-server/scriptahubAgent/3002/\`"
            echo "- CSV Mail: \`${PUBLIC_URL}/csvMailAgent/public/\` from simpleCSVMailSend \`${CSVMAIL_COMMIT:-not-resolved}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            ~/.ssh/deploy_key \
            ~/.ssh/explorer_qa_known_hosts \
            "$RUNNER_TEMP/explorer-qa-bootstrap.log" \
            "$RUNNER_TEMP/explorer-qa-response.txt" \
            "$RUNNER_TEMP/explorer-qa-headers.txt" \
            "$RUNNER_TEMP/explorer_qa_protected_cloudflare_before.json"

      - name: Enable QA page caching
        id: cache_on
        if: ${{ success() && steps.cache_probe.outputs.verified == 'true' }}
        env:
          CREATE_CACHE_RULES: ${{ inputs.create_cache_rules }}
          EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN }}
        run: |
          set -euo pipefail
          case "$CREATE_CACHE_RULES" in
            true) cache_flags=() ;;
            false) cache_flags=(--existing-only) ;;
            *) echo "::error::create_cache_rules must be true or false"; exit 1 ;;
          esac
          node .github/scripts/cloudflare-cache-rules.mjs r2-on --token-env EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN ${cache_flags[@]+"${cache_flags[@]}"} --activation-receipt "$RUNNER_TEMP/cache-activation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

      - name: Disable QA page caching after a failed initial guard
        if: ${{ always() && (steps.cache_off.outcome == 'failure' || steps.cache_off.outcome == 'cancelled') }}
        env:
          EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN }}
        run: node .github/scripts/cloudflare-cache-rules.mjs r2-off --token-env EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN --if-present

      - name: Disable QA page caching after a cancelled activation
        if: ${{ always() && steps.cache_on.outcome == 'cancelled' }}
        env:
          EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN: ${{ secrets.EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN }}
        run: node .github/scripts/cloudflare-cache-rules.mjs r2-off --token-env EXPLORER_QA_CLOUDFLARE_CACHE_RULES_TOKEN --activation-receipt "$RUNNER_TEMP/cache-activation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
