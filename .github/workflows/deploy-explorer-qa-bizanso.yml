name: Deploy Explorer QA Bizanso

# Updates only Bizanso inside the running Explorer QA Box, without the Ploinky checkout, the Box, the tunnel or any other
# repository (docs/deploy-explorer-qa.md, "Product workflows"). The runner streams the private Bizanso default branch in as
# the same no-git copy the full deploy makes, pulls its digest-pinned image and restarts only bizanso/bizanso. If that
# targeted restart drops routes, the run recovers with a whole-workspace restart; a refused drain is never answered with
# another restart. Actions are pinned by commit: checkout as in container-image-builds, setup-node as in bizanso.

on:
  workflow_dispatch:

concurrency:
  group: deploy-explorer-qa
  cancel-in-progress: false

env:
  SSH_USER: 'admin'
  SSH_HOST: '45.136.70.141'
  SSH_ED25519_FINGERPRINT: 'SHA256:pcVG+7QFbfi3Ojn3LeveNutqCWaTOIlgek1o3GKD/KA'
  WORKSPACE: 'explorerQaWorkspace'
  ROUTER_PORT: '8097'
  PUBLIC_HOST: 'explorer-qa.axiologic.dev'
  PUBLIC_URL: 'https://explorer-qa.axiologic.dev'
  SOUL_GATEWAY_ROUTER_PORT: '8080'

jobs:
  deploy:
    name: Deploy Bizanso to Explorer QA
    runs-on: ubuntu-latest
    # A whole-workspace recovery restart and its 6-minute route dwell come after the targeted restart's own.
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      # The full history is fetched because the tests compare the shared shell blocks with the revision they were copied from.
      - name: Check out the workflow tests
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4, as pinned in container-image-builds
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, as pinned in bizanso
        with:
          node-version: '24'

      - name: Test these workflows
        run: node --test tests/smoke/lib/deploy-qa-product-workflows.test.mjs

      - name: Validate GitHub configuration
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
          BIZANSO_DEPLOY_KEY: ${{ secrets.EXPLORER_QA_BIZANSO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_SSH_KEY"
            exit 1
          fi
          if [ -z "${BIZANSO_DEPLOY_KEY:-}" ]; then
            echo "::error::Missing required repository secret EXPLORER_QA_BIZANSO_DEPLOY_KEY"
            exit 1
          fi
          if [ "$SSH_HOST" != '45.136.70.141' ] || [ "$SSH_USER" != 'admin' ] ||
            [ "$WORKSPACE" != 'explorerQaWorkspace' ] || [ "$ROUTER_PORT" != '8097' ]; then
            echo "::error::Explorer QA target identity is not the pinned admin@45.136.70.141/explorerQaWorkspace target"
            exit 1
          fi
          if [ "$PUBLIC_HOST" != 'explorer-qa.axiologic.dev' ] || [ "$PUBLIC_URL" != "https://$PUBLIC_HOST" ]; then
            echo "::error::PUBLIC_URL and PUBLIC_HOST must identify the fixed Explorer QA hostname"
            exit 1
          fi
          HOST_KEY_CANDIDATE="$RUNNER_TEMP/explorer_qa_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$HOST_KEY_CANDIDATE"
          HOST_KEY_FINGERPRINT="$({ ssh-keygen -lf "$HOST_KEY_CANDIDATE" -E sha256 || true; } | awk '{print $2}' | sort -u)"
          if [ "$HOST_KEY_FINGERPRINT" != "$SSH_ED25519_FINGERPRINT" ]; then
            echo "::error::Explorer QA ED25519 host fingerprint did not match the pinned identity"
            exit 1
          fi
          chmod 600 "$HOST_KEY_CANDIDATE"
          echo "Validated the pinned Explorer QA SSH host identity."

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EXPLORER_QA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 "$RUNNER_TEMP/explorer_qa_known_hosts" ~/.ssh/explorer_qa_known_hosts

      # The key stays on the runner: neither the QA host nor the Box ever holds it.
      - name: Check out Bizanso
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4, as pinned in container-image-builds
        with:
          repository: Axiologic/bizanso
          ssh-key: ${{ secrets.EXPLORER_QA_BIZANSO_DEPLOY_KEY }}
          path: .qa-bizanso-source
          persist-credentials: false

      # No SSH here. The incoming tree is what the copy below streams, so its digest is the one the live tree must reach.
      - name: Resolve the Bizanso source
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/.qa-bizanso-source"
          INCOMING="$RUNNER_TEMP/qa-bizanso-incoming"
          COMMIT="$(git -C "$SOURCE" rev-parse HEAD)"
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The Bizanso checkout has no 40-hex HEAD commit"
            exit 1
          fi
          mkdir "$INCOMING"
          git -C "$SOURCE" archive --format=tar HEAD | tar -xf - -C "$INCOMING"
          IMAGE="$(node --input-type=module - "$INCOMING/bizanso/manifest.json" <<'NODE'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(String(manifest?.container ?? ''));
          NODE
          )"
          if [[ ! "$IMAGE" =~ ^docker\.io/assistos/bizanso-agent@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The container field of bizanso/manifest.json is not a digest-pinned docker.io/assistos/bizanso-agent reference"
            exit 1
          fi
          TREE="sha256:$(cd "$INCOMING" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0r sha256sum | sha256sum | cut -d " " -f1)"
          if [[ ! "$TREE" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The Bizanso tree digest could not be computed"
            exit 1
          fi
          {
            printf 'BIZANSO_SOURCE_COMMIT=%s\n' "$COMMIT"
            printf 'BIZANSO_IMAGE=%s\n' "$IMAGE"
            printf 'BIZANSO_SOURCE_TREE=%s\n' "$TREE"
            printf 'BIZANSO_INCOMING_DIR=%s\n' "$INCOMING"
          } >> "$GITHUB_ENV"
          echo "[deploy-qa-bizanso] Bizanso source $COMMIT, tree $TREE, image $IMAGE"

      - name: Deploy Bizanso through Ploinky commands
        run: |
          set -euo pipefail
          umask 077

          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/explorer_qa_known_hosts"
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${SSH_USER}@${SSH_HOST}")
          LOCK=/home/admin/.qa-deployment-operation.lock
          WORK_DIR="/home/admin/$WORKSPACE"
          PLOINKY_BIN=/home/admin/.qa-deployment-tools/ploinky/bin/ploinky

          # Refusal 2. Read-only apart from the idempotent Node install: nothing here moves the Ploinky checkout or the workspace.
          echo '[deploy-qa-bizanso] Checking the host and the Ploinky checkout; nothing is moved...'
          PREFLIGHT_LOG="$RUNNER_TEMP/explorer-qa-product-preflight.log"
          PREFLIGHT_STATUS=0
          "${SSH[@]}" "flock -n -E 75 --close '$LOCK' bash -s" <<'REMOTE' | tee "$PREFLIGHT_LOG" || PREFLIGHT_STATUS=$?
          set -euo pipefail
          if [ "$(id -un)" != 'admin' ] || [ "$HOME" != '/home/admin' ]; then
            echo '[qa] ERROR: the remote identity is not the pinned admin account.'
            exit 1
          fi
          WORK_DIR=/home/admin/explorerQaWorkspace
          if [ -L "$WORK_DIR" ] || [ ! -d "$WORK_DIR" ]; then
            echo "[qa] ERROR: the workspace is not an existing real directory: $WORK_DIR"
            exit 1
          fi
          # The older workflows park the router access policy and an install marker here, and only they
          # restore them. Running over that state would silently lose the policy.
          STATE_DIR=/home/admin/.qa-deployment-state
          if [ -e "$STATE_DIR" ] && [ -n "$(ls -A "$STATE_DIR")" ]; then
            echo "[qa] ERROR: $STATE_DIR holds state from deploy-explorer-qa.yml. Dispatch that workflow to finish it first."
            exit 1
          fi
          for tool in git node curl podman flock; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "[qa] ERROR: missing required host tool '$tool'."
              exit 1
            fi
          done
          # BEGIN QA isolated Node runtime
          install_qa_node() (
            set -euo pipefail
            umask 077
            case "$(uname -m)" in
              x86_64)
                QA_NODE_ARCH=x64
                QA_NODE_SHA=14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
                ;;
              aarch64|arm64)
                QA_NODE_ARCH=arm64
                QA_NODE_SHA=01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc
                ;;
              *) echo '[deploy-qa] Unsupported QA Node architecture.' >&2; exit 1 ;;
            esac
            QA_TOOLS_ROOT=/home/admin/.qa-deployment-tools
            QA_NODE_DIST="node-v24.19.0-linux-$QA_NODE_ARCH"
            QA_NODE_TARGET="$QA_TOOLS_ROOT/$QA_NODE_DIST"
            QA_NODE_ARCHIVE="$QA_TOOLS_ROOT/$QA_NODE_DIST.tar.xz"
            node --input-type=module - "$QA_TOOLS_ROOT" "$QA_NODE_DIST" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [root, distribution] = process.argv.slice(2);
          assert.equal(root, '/home/admin/.qa-deployment-tools');
          assert(/^node-v24\.19\.0-linux-(x64|arm64)$/.test(distribution));
          if (!fs.existsSync(root)) fs.mkdirSync(root, { mode: 0o700 });
          for (const [file, directory, privateMode] of [
              [root, true, true],
              [path.join(root, `${distribution}.tar.xz`), false, true],
              [path.join(root, distribution), true, false],
              [path.join(root, distribution, 'bin/node'), false, false],
          ]) {
              let stat;
              try { stat = fs.lstatSync(file); } catch (error) { if (error.code === 'ENOENT') continue; throw error; }
              assert(!stat.isSymbolicLink() && (directory ? stat.isDirectory() : stat.isFile()), 'Unsafe QA Node path');
              assert.equal(fs.realpathSync(file), file, 'QA Node path traverses a symlink');
              assert.equal(stat.uid, process.getuid(), 'QA Node path has a different owner');
              assert.equal(stat.mode & (privateMode ? 0o077 : 0o022), 0, 'Unsafe QA Node permissions');
              if (!directory) assert.equal(stat.nlink, 1, 'QA Node file has multiple links');
          }
          NODE
            QA_NODE_STAGE="$(mktemp -d "$QA_TOOLS_ROOT/.node-install-XXXXXXXX")"
            cleanup_qa_node_stage() {
              node --input-type=module - "$QA_TOOLS_ROOT" "$QA_NODE_STAGE" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [root, stage] = process.argv.slice(2);
          assert.equal(root, '/home/admin/.qa-deployment-tools');
          assert.equal(path.dirname(stage), root);
          assert(/^\.node-install-[A-Za-z0-9]{8}$/.test(path.basename(stage)));
          const stat = fs.lstatSync(stage);
          assert(stat.isDirectory() && !stat.isSymbolicLink() && stat.uid === process.getuid());
          assert.equal(fs.realpathSync(stage), stage);
          fs.rmSync(stage, { recursive: true });
          NODE
            }
            trap cleanup_qa_node_stage EXIT
            if [ ! -f "$QA_NODE_ARCHIVE" ]; then
              curl -fsS --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 \
                --max-filesize 104857600 \
                "https://nodejs.org/dist/v24.19.0/$QA_NODE_DIST.tar.xz" -o "$QA_NODE_STAGE/archive.tar.xz"
              printf '%s  %s\n' "$QA_NODE_SHA" "$QA_NODE_STAGE/archive.tar.xz" | timeout 30 sha256sum -c - >/dev/null
              mv -T "$QA_NODE_STAGE/archive.tar.xz" "$QA_NODE_ARCHIVE"
            fi
            printf '%s  %s\n' "$QA_NODE_SHA" "$QA_NODE_ARCHIVE" | timeout 30 sha256sum -c - >/dev/null
            if [ ! -e "$QA_NODE_TARGET" ]; then
              timeout 60 tar --no-same-owner --no-same-permissions -xJf "$QA_NODE_ARCHIVE" -C "$QA_NODE_STAGE"
              mv -T "$QA_NODE_STAGE/$QA_NODE_DIST" "$QA_NODE_TARGET"
            fi
            # Validate an existing binary against the pinned archive too; a
            # version string or cached marker alone is not integrity evidence.
            timeout 60 tar --no-same-owner --no-same-permissions -xJf "$QA_NODE_ARCHIVE" \
              -C "$QA_NODE_STAGE" "$QA_NODE_DIST/bin/node"
            timeout 30 cmp -s "$QA_NODE_STAGE/$QA_NODE_DIST/bin/node" "$QA_NODE_TARGET/bin/node"
            [ "$(timeout 10 "$QA_NODE_TARGET/bin/node" --version)" = 'v24.19.0' ]
            printf '%s\n' "$QA_NODE_TARGET"
          )
          QA_NODE_HOME="$(install_qa_node)"
          export PATH="$QA_NODE_HOME/bin:$PATH"
          # END QA isolated Node runtime
          # The Ploinky checkout lies outside the workspace and a Box mounts it read-only. It is only read here.
          CHECKOUT=/home/admin/.qa-deployment-tools/ploinky
          if [ -L "$CHECKOUT" ] || [ ! -d "$CHECKOUT" ]; then
            echo "[qa] ERROR: the Ploinky checkout is missing or a symlink: $CHECKOUT"
            exit 1
          fi
          if [ "$(git -C "$CHECKOUT" remote get-url origin)" != 'https://github.com/AssistOS-AI/ploinky.git' ]; then
            echo '[qa] ERROR: unexpected Ploinky checkout origin.'
            exit 1
          fi
          printf 'PLOINKY_COMMIT=%s\n' "$(git -C "$CHECKOUT" rev-parse --short HEAD)"
          printf 'QA_NODE_HOME=%s\n' "$QA_NODE_HOME"
          REMOTE
          if [ "$PREFLIGHT_STATUS" -eq 75 ]; then
            echo "::error::Another Explorer QA operation holds the host lock."
          fi
          if [ "$PREFLIGHT_STATUS" -ne 0 ]; then
            echo "::error::The host preflight failed (exit $PREFLIGHT_STATUS); nothing was changed."
            exit 1
          fi
          QA_NODE_HOME="$(sed -n 's/^QA_NODE_HOME=//p' "$PREFLIGHT_LOG" | tail -n 1)"
          if [[ ! "$QA_NODE_HOME" =~ ^/home/admin/\.qa-deployment-tools/node-v24\.19\.0-linux-(x64|arm64)$ ]]; then
            echo "::error::The preflight did not report the pinned Node."
            exit 1
          fi
          PLOINKY_COMMIT="$(sed -n 's/^PLOINKY_COMMIT=//p' "$PREFLIGHT_LOG" | tail -n 1)"
          if [[ ! "$PLOINKY_COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::The preflight did not report the Ploinky checkout commit."
            exit 1
          fi
          echo "[deploy-qa-bizanso] Ploinky checkout $PLOINKY_COMMIT (not moved)."

          # BEGIN QA product flow
          REMOTE_ENV="cd '$WORK_DIR' && export PATH='$QA_NODE_HOME/bin':\"\$PATH\" PLOINKY_WORKSPACE_ROOT='$WORK_DIR'"
          # Every argument below is a fixed word. A value only ever reaches a command through ssh stdin.
          ploinky_locked() {
            local status=0
            "${SSH[@]}" "$REMOTE_ENV && exec flock -n -E 75 --close '$LOCK' '$PLOINKY_BIN' $*" || status=$?
            if [ "$status" -eq 75 ]; then
              echo "::error::Another Explorer QA operation holds the host lock."
            fi
            return "$status"
          }
          ploinky_read() {
            "${SSH[@]}" "$REMOTE_ENV && exec '$PLOINKY_BIN' $*"
          }
          unrelated_containers() {
            "${SSH[@]}" "set -o pipefail; podman ps -a --format '{{.ID}} {{.Names}}' | { grep -v ' ploinky-box-explorerqaworkspace-7a31ab7775eb$' || true; } | sort"
          }
          soul_healthy() {
            "${SSH[@]}" "curl -sf 'http://127.0.0.1:${SOUL_GATEWAY_ROUTER_PORT}/base-agent-additional-server/soul-gateway/7000/healthz/' >/dev/null"
          }

          # Image housekeeping. Every removal is `podman image rm <id>` on an ID that was listed and validated first;
          # podman refuses an image a container still uses. The prune never forces, never removes by a broad filter,
          # and never fails the job: only the disk gate below can stop a run.
          # BEGIN QA image cleanup
          BOX_CONTAINER=ploinky-box-explorerqaworkspace-7a31ab7775eb
          PRUNE_BOX_IMAGE=docker.io/assistos/ploinky-box
          DISK_MIN_FREE_GIB=5
          # Unpacked size of the ScriptaHub robot image not shared with the RoboTeam runtime (11.2 GB, 9 of 29 layers new).
          ROBOT_IMAGE_NEW_GIB=11
          DISK_WARN_FREE_GIB=10
          # One podman call on the host or inside the Box, under the same host lock as every other mutation.
          prune_podman() {
            local scope="$1"
            shift
            if [ "$scope" = host ]; then
              "${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman $*" < /dev/null
            else
              "${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman container exec --user podman --workdir '$WORK_DIR' --env 'PLOINKY_WORKSPACE_ROOT=$WORK_DIR' $BOX_CONTAINER podman $*" < /dev/null
            fi
          }
          # Lists unused dangling images, removes each validated one, and reports the unused named ones. A host
          # image is removed only when its name history shows it was the Box image; the host holds other images.
          prune_scope() {
            local scope="$1" phase="$2" listing id containers dangling rest names line is_box_image removed=0
            if ! listing="$(prune_podman "$scope" image ls --filter dangling=true --format "'{{.ID}} {{.Containers}}'")"; then
              echo "::warning::prune $scope failed ($phase): the image listing failed"
              return 0
            fi
            while read -r id containers; do
              [ -n "$id" ] || continue
              if [[ ! "$id" =~ ^[a-f0-9]{12,64}$ ]]; then
                echo "::warning::prune $scope: skipped an unexpected image ID in the listing"
                continue
              fi
              if [ "$containers" != 0 ]; then
                echo "[deploy-qa] prune $scope: kept $id in use by $containers container(s)"
                continue
              fi
              if [ "$scope" = host ]; then
                if ! names="$(prune_podman host image inspect --format "'{{range .NamesHistory}}{{println .}}{{end}}'" "$id")"; then
                  echo "::warning::prune host failed ($phase): inspecting $id failed"
                  continue
                fi
                is_box_image=false
                while IFS= read -r line; do
                  case "$line" in
                    "$PRUNE_BOX_IMAGE"|"$PRUNE_BOX_IMAGE":*|"$PRUNE_BOX_IMAGE"@*) is_box_image=true ;;
                  esac
                done <<< "$names"
                if [ "$is_box_image" != true ]; then
                  echo "[deploy-qa] prune host: kept unrelated dangling image $id"
                  continue
                fi
              fi
              if prune_podman "$scope" image rm "$id" > /dev/null; then
                echo "[deploy-qa] prune $scope: removed $id"
                removed=$((removed + 1))
              else
                echo "::warning::prune $scope: podman kept $id"
              fi
            done <<< "$listing"
            echo "[deploy-qa] prune $scope: removed $removed dangling image(s)"
            if listing="$(prune_podman "$scope" image ls --format "'{{.ID}} {{.Containers}} {{.Dangling}} {{.Size}} {{.Names}}'")"; then
              while read -r id containers dangling rest; do
                if [ "$containers" = 0 ] && [ "$dangling" = false ]; then
                  echo "[deploy-qa] prune $scope: kept unused named image $id $rest"
                fi
              done <<< "$listing"
            fi
            return 0
          }
          prune_images() {
            local phase="$1"
            echo "[deploy-qa] Pruning unused dangling images ($phase)..."
            prune_scope host "$phase" || true
            if [ "$phase" = post ] || [ "${BOX_STATE:-absent}" = present ]; then
              prune_scope box "$phase" || true
            else
              echo '[deploy-qa] prune box: skipped, no Box exists yet'
            fi
          }
          # Free GiB of the admin home filesystem.
          free_disk_gib() {
            local kib
            kib="$("${SSH[@]}" "df -Pk /home/admin" < /dev/null | awk 'NR == 2 { print $4 }')"
            if [[ ! "$kib" =~ ^[0-9]+$ ]]; then
              return 1
            fi
            echo $((kib / 1048576))
          }
          require_free_disk() {
            local free
            if ! free="$(free_disk_gib)"; then
              echo "::error::Could not read the free disk space of the QA host."
              exit 1
            fi
            echo "[deploy-qa] free disk: $free GiB"
            if [ "$free" -lt "$DISK_MIN_FREE_GIB" ]; then
              echo "::error::Free disk $free GiB is below $DISK_MIN_FREE_GIB GiB; no agent or repository moved yet. See usage on the host with: du -xh --max-depth=2 $WORK_DIR | sort -h | tail; then free space or grow the disk."
              exit 1
            fi
            if [ "$free" -lt "$DISK_WARN_FREE_GIB" ]; then
              echo "::warning::QA host free disk $free GiB is below $DISK_WARN_FREE_GIB GiB"
            fi
          }
          # END QA image cleanup

          SOUL_UP_BEFORE=0
          if soul_healthy; then SOUL_UP_BEFORE=1; fi
          UNRELATED_BEFORE="$(unrelated_containers)"

          # The graph this deploy expects. Every runtime of it, and Bizanso, PromotionScoutV2 and ScriptaHub beside it,
          # must already run: this workflow only restarts what exists.
          GRAPH_RUNTIMES='explorer gitAgent userPersistoAgent emailAgent dpuAgent roboTeamAgent soul-gateway workspaceMonitorAgent local-llm'
          # Prints "agent state" for the runtime block of `ploinky status`, whose repository block also has badges.
          runtime_states() {
            awk '/^Agent runtimes:/ { on = 1; next }
              on && match($0, /\[[a-z-]+\] \[[a-z-]+\]/) { split(substr($0, RSTART, RLENGTH), word, /[][ ]+/); state = word[2]; next }
              on && state != "" && /agent:/ { for (i = 1; i <= NF; i++) if ($i == "agent:") print $(i + 1), state; state = "" }'
          }
          # Prints each installed repository of `ploinky list repos`, whose other lines name uninstalled ones.
          installed_repos() {
            awk '/^- / && /\[installed\]/ { name = $2; sub(/:$/, "", name); print name }'
          }
          # `ploinky status` overlays each detached runtime's semantic readiness on its state. Waiting also
          # lets the detached launches settle before the next start or update.
          wait_ready() {
            local streak=0 states agent complete
            for _ in $(seq 1 180); do
              states="$(ploinky_read status | sed 's/\x1b\[[0-9;]*m//g' | runtime_states)" || states=''
              if grep -q ' failed$' <<< "$states"; then
                printf '%s\n' "$states"
                echo "::error::A runtime reported failed readiness."
                return 1
              fi
              complete=1
              for agent in $GRAPH_RUNTIMES; do
                grep -qx "$agent running" <<< "$states" || complete=0
              done
              if [ "$complete" = 1 ]; then
                streak=$((streak + 1))
                if [ "$streak" -ge 3 ]; then
                  printf '%s\n' "$states"
                  return 0
                fi
              else
                streak=0
              fi
              sleep 10
            done
            printf '%s\n' "$states"
            echo "::error::Timed out waiting for the graph runtimes to stay ready."
            return 1
          }
          GRAPH_RUNTIMES="$GRAPH_RUNTIMES bizanso promotionScout scriptahubAgent"

          # In-Box programs are fixed strings without a single quote, because run_in_box embeds them in one. A value
          # reaches a program only on stdin, and the program checks it again.
          run_in_box() {
            "${SSH[@]}" "exec flock -n -E 75 --close '$LOCK' podman container exec -i --user podman --workdir '$WORK_DIR' --env 'PLOINKY_WORKSPACE_ROOT=$WORK_DIR' ploinky-box-explorerqaworkspace-7a31ab7775eb sh -c '$1' sh"
          }
          # BEGIN QA product routes
          # The public paths of the three products that share this Router. They are fetched from the runner, so a Router
          # that answers on loopback but is cut off from the edge counts as lost.
          route_code() {
            : > "$RUNNER_TEMP/qa-product-route-body"
            curl -sS --max-time 15 -o "$RUNNER_TEMP/qa-product-route-body" -w '%{http_code}' "$1" || true
          }
          routes_alive() {
            local explorer bizanso scriptahub
            explorer="$(route_code "${PUBLIC_URL%/}/auth/login?agent=explorer")"
            if [ "$explorer" = 303 ] || [ "$explorer" = 200 ]; then
              if grep -Eqi 'EDGE_GENERATION_INACTIVE|cloudflare tunnel error|error code: 1033' "$RUNNER_TEMP/qa-product-route-body"; then
                explorer=inactive
              fi
            fi
            bizanso="$(route_code "${PUBLIC_URL%/}/base-agent-additional-server/bizanso/8787/how-it-works/")"
            scriptahub="$(route_code "${PUBLIC_URL%/}/base-agent-additional-server/scriptahubAgent/3002/health")"
            ROUTES_STATE="explorer=$explorer bizanso=$bizanso scriptahub=$scriptahub"
            { [ "$explorer" = 303 ] || [ "$explorer" = 200 ]; } && [ "$bizanso" = 200 ] && [ "$scriptahub" = 200 ]
          }
          await_routes() {
            local attempts="${1:-18}" attempt
            for attempt in $(seq 1 "$attempts"); do
              if routes_alive; then return 0; fi
              echo "[deploy-qa-product] routes $ROUTES_STATE"
              if [ "$attempt" -lt "$attempts" ]; then sleep 10; fi
            done
            return 1
          }
          # The Box monitor and snapshot run every 5 minutes, so a route lost by them shows up within this window.
          routes_dwell() {
            local poll
            echo '[deploy-qa-product] routes must stay alive for 6 minutes (24 polls, 15 s apart).'
            for poll in $(seq 1 24); do
              sleep 15
              if ! routes_alive; then
                echo "[deploy-qa-product] routes lost on dwell poll $poll: $ROUTES_STATE"
                return 1
              fi
            done
            return 0
          }
          # END QA product routes

          PRODUCT_AGENT=bizanso/bizanso
          PRODUCT_RUNTIME=bizanso
          # Prints the image ID, start time and name of the one container whose name starts with the key's prefix.
          PROBE_PROGRAM='set -eu
          read -r key
          case "$key" in
            bizanso) prefix=ploinky_bizanso_bizanso_ ;;
            *) echo "Unexpected container probe." >&2; exit 1 ;;
          esac
          podman ps --no-trunc --filter "name=^$prefix" --format "{{.ImageID}} {{.StartedAt}} {{.Names}}"'
          # Bizanso is a real directory at the workspace root, a copy with no Git metadata that is not also managed.
          BIZANSO_READ_PROGRAM='set -eu
          test -d bizanso
          test ! -L bizanso
          test ! -e bizanso/.git
          test ! -L bizanso/.git
          test ! -e .ploinky/repos/bizanso
          test ! -L .ploinky/repos/bizanso
          cd bizanso
          printf "TREE=sha256:%s\n" "$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0r sha256sum | sha256sum | cut -d " " -f1)"'
          # The files that decide how far a change reaches. tar fails without bizanso/manifest.json.
          BIZANSO_MANIFEST_PROGRAM='set -eu
          cd bizanso
          set -- bizanso/manifest.json
          for name in bizanso/mcp-config.json bizanso/package.json package.json package-lock.json; do
            if [ -e "$name" ]; then set -- "$@" "$name"; fi
          done
          tar -cf - "$@"'
          # The reference arrives on stdin and is checked again here: the exact repository, a digest and nothing else.
          BIZANSO_PULL_PROGRAM='set -eu
          read -r ref
          prefix=docker.io/assistos/bizanso-agent@sha256:
          case "$ref" in
            "$prefix"*) ;;
            *) echo "Unexpected Bizanso image reference." >&2; exit 1 ;;
          esac
          test "${#ref}" -eq 104
          case "${ref#"$prefix"}" in
            *[!0-9a-f]*) echo "Unexpected Bizanso image digest." >&2; exit 1 ;;
          esac
          podman pull -q "$ref" > /dev/null
          printf "IMAGE_ID=%s\n" "$(podman image inspect --format "{{.Id}}" "$ref")"'
          # The private copy replaces the workspace-root repository and keeps one predecessor.
          COPY_PROGRAM='set -eu
          stage=$PWD/.ploinky/.qa-private-copy
          mkdir -p "$stage"
          for stale in "$stage"/*; do
            if [ -e "$stale" ] || [ -L "$stale" ]; then rm -rf -- "$stale"; fi
          done
          incoming=$(mktemp -d "$stage/incoming.XXXXXX")
          tar -xf - -C "$incoming"
          test -n "$(ls -A "$incoming")"
          test ! -e "$incoming/.git"
          if [ -e bizanso ] || [ -L bizanso ]; then mv bizanso "$stage/previous"; fi
          mv "$incoming" bizanso'

          # Sets CONTAINER_LINE to the probe's one line. Not run in a substitution, so its error reaches the log.
          # A value read back from the Box is printed with everything but plain characters replaced.
          printable() { printf '%s' "${1//[^A-Za-z0-9._\/: -]/?}"; }
          container_line() {
            local key="$1" output count
            CONTAINER_LINE=''
            if ! output="$(printf '%s\n' "$key" | run_in_box "$PROBE_PROGRAM")"; then
              echo "::error::The container probe for $key failed."
              return 1
            fi
            count="$(printf '%s\n' "$output" | grep -c . || true)"
            if [ "$count" != 1 ]; then
              echo "::error::Expected exactly one $key container, found $count."
              return 1
            fi
            CONTAINER_LINE="$output"
          }
          # Passes when the container runs the pulled image and started no earlier than the copy (5 s of clock skew allowed).
          product_check() {
            local image started name
            if ! container_line bizanso; then return 1; fi
            read -r image started name <<< "$CONTAINER_LINE"
            if [[ ! "$image" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$started" =~ ^[0-9]+$ ]]; then
              echo "::error::The bizanso container probe returned an unexpected image ID or start time."
              return 1
            fi
            if [ "$image" != "$IMAGE_ID" ]; then
              echo "::error::The bizanso container runs image $image, not $IMAGE_ID."
              return 1
            fi
            if [ "$started" -lt $((COPY_EPOCH - 5)) ]; then
              echo "::error::The bizanso container started at $started, before the copy at $COPY_EPOCH."
              return 1
            fi
            PRODUCT_CHECK_SUMMARY="container $(printable "$name") image $image started $started >= copy $COPY_EPOCH"
          }
          # BEGIN QA product restart
          # Expects PRODUCT_AGENT (<repository>/<agent>), PRODUCT_RUNTIME and product_check to be defined first. Sets
          # RESTART_RESULT. A refused targeted drain is never answered with another restart: a whole restart would stop
          # every agent and then refuse its graph. Only an operator accepts a drain.
          DRAIN_ROUTING_PROGRAM='set -eu
          cat .ploinky/routing.json'
          DRAIN_AGENTS_PROGRAM='set -eu
          cat .ploinky/agents.json'
          # The container ID arrives on stdin. Prints it when that container is running.
          DRAIN_RUNNING_PROGRAM='set -eu
          read -r id
          case "$id" in
            ""|*[!0-9a-f]*) echo "Unexpected container ID." >&2; exit 1 ;;
          esac
          test "${#id}" -eq 64
          podman ps --no-trunc --quiet --filter "id=$id"'
          # Runs a command, shows its output and keeps it in a file; returns the command's own status.
          run_logged() {
            local log="$1" status=0
            shift
            : > "$log"
            set +e
            "$@" 2>&1 | tee -a "$log"
            status="${PIPESTATUS[0]}"
            set -e
            return "$status"
          }
          product_settled() {
            local poll misses=0 states
            for poll in $(seq 1 30); do
              states="$(ploinky_read status | sed 's/\x1b\[[0-9;]*m//g' | runtime_states)" || states=''
              if grep -qxF "$PRODUCT_RUNTIME running" <<< "$states"; then return 0; fi
              if grep -qxE "$PRODUCT_RUNTIME (running|starting)" <<< "$states"; then
                misses=0
              else
                misses=$((misses + 1))
                if [ "$misses" -ge 3 ]; then
                  echo "[deploy-qa-product] $PRODUCT_RUNTIME is not running or starting on 3 polls in a row."
                  return 1
                fi
              fi
              sleep 10
            done
            echo "[deploy-qa-product] $PRODUCT_RUNTIME did not reach running within 30 polls."
            return 1
          }
          # Print yes, no or unknown for the product's route in a copy of .ploinky/routing.json: the draining flag that
          # a refused targeted drain leaves. Print the 64-hex containerId of the product's agent record in a copy of
          # .ploinky/agents.json. Neither file is ever printed.
          product_route_flag() {
            node --input-type=module - "$@" 2> /dev/null <<'NODE'
          import fs from 'node:fs';
          const [file, repo, agent] = process.argv.slice(2);
          let routes = null;
          try { routes = JSON.parse(fs.readFileSync(file, 'utf8'))?.routes; } catch { routes = null; }
          if (!routes || typeof routes !== 'object') {
            process.stdout.write('unknown');
          } else {
            const prefix = 'ploinky_' + repo + '_' + agent + '_';
            const mine = Object.entries(routes).filter(([key, route]) => key === agent
              || String(route?.container || '').startsWith(prefix));
            process.stdout.write(mine.some(([, route]) => route?.draining === true) ? 'yes' : 'no');
          }
          NODE
          }
          product_container_id() {
            node --input-type=module - "$@" 2> /dev/null <<'NODE'
          import fs from 'node:fs';
          const [file, repo, agent] = process.argv.slice(2);
          const agents = JSON.parse(fs.readFileSync(file, 'utf8'));
          const mine = Object.values(agents || {}).filter((record) => record?.type === 'agent' && !record.alias
            && record.agentName === agent && record.repoName === repo && /^[a-f0-9]{64}$/.test(String(record.containerId || '')));
          if (mine.length === 1) process.stdout.write(mine[0].containerId);
          NODE
          }
          # Prints yes, no or unknown: has a targeted drain of the product been refused? The output text of the restart
          # is one witness, the draining flag of the product's route the other.
          # Prints yes, no or unknown: does any route in a copy of .ploinky/routing.json carry the draining flag?
          routes_draining_flag() {
            node --input-type=module - "$@" 2> /dev/null <<'NODE'
          import fs from 'node:fs';
          let routes = null;
          try { routes = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))?.routes; } catch { routes = null; }
          if (!routes || typeof routes !== 'object') {
            process.stdout.write('unknown');
          } else {
            process.stdout.write(Object.values(routes).some((route) => route?.draining === true) ? 'yes' : 'no');
          }
          NODE
          }
          # A whole restart stops every agent and then refuses its graph while any route is draining, so it is read first.
          any_route_draining() {
            local file="$RUNNER_TEMP/qa-product-all-routes.json" state
            if ! run_in_box "$DRAIN_ROUTING_PROGRAM" < /dev/null > "$file" 2> /dev/null; then
              echo unknown
              return 0
            fi
            if ! state="$(routes_draining_flag "$file")"; then
              echo unknown
              return 0
            fi
            echo "$state"
          }
          # The log of a targeted restart concerns the product alone. A whole restart logs for every agent, so only the
          # line that names the product counts there.
          product_drain_state() {
            local log="$1" mode="$2" file="$RUNNER_TEMP/qa-product-routing.json" state
            if [ "$mode" = targeted ] && grep -Eq 'did not exit cleanly|refusing removal or recreate|remains running|TARGETED_DRAIN_TIMEOUT' "$log"; then
              echo yes
              return 0
            fi
            if grep -qF "$PRODUCT_AGENT: keeping its stopped runtime after a refused targeted drain" "$log"; then
              echo yes
              return 0
            fi
            if ! run_in_box "$DRAIN_ROUTING_PROGRAM" < /dev/null > "$file" 2> /dev/null; then
              echo unknown
              return 0
            fi
            if ! state="$(product_route_flag "$file" "${PRODUCT_AGENT%%/*}" "${PRODUCT_AGENT#*/}")"; then
              echo unknown
              return 0
            fi
            echo "$state"
          }
          product_drain_error() {
            local id='' running='' file="$RUNNER_TEMP/qa-product-agents.json"
            if run_in_box "$DRAIN_AGENTS_PROGRAM" < /dev/null > "$file" 2> /dev/null; then
              id="$(product_container_id "$file" "${PRODUCT_AGENT%%/*}" "${PRODUCT_AGENT#*/}")" || id=''
            fi
            if [[ ! "$id" =~ ^[a-f0-9]{64}$ ]]; then
              id='<the 64-hex containerId of the agent record in .ploinky/agents.json>'
            else
              running="$(printf '%s\n' "$id" | run_in_box "$DRAIN_RUNNING_PROGRAM" 2> /dev/null)" || running=''
            fi
            if [ "$running" = "$id" ]; then
              echo "::error::The targeted drain of $PRODUCT_AGENT timed out: its container $id is still running, Ploinky never signals it again, and the route stays draining, so nothing further was restarted (a whole restart would refuse its graph). The container must exit first; then an operator must run, under the host lock: ploinky restart $PRODUCT_AGENT --accept-failed-drain $id"
            else
              echo "::error::The targeted drain of $PRODUCT_AGENT was refused: Ploinky keeps its stopped container and the route stays draining, so nothing further was restarted (a whole restart would refuse its graph). An operator must run, under the host lock: ploinky restart $PRODUCT_AGENT --accept-failed-drain $id"
            fi
          }
          # mode is targeted or whole.
          restart_product() {
            local mode="$1" status=0 log drain
            RESTART_RESULT=failed
            if [ "$mode" = targeted ]; then
              log="$RUNNER_TEMP/qa-product-targeted.log"
              run_logged "$log" ploinky_locked restart "$PRODUCT_AGENT" || status=$?
              if [ "$status" -eq 75 ]; then return 75; fi
              if [ "$status" -eq 0 ] && product_settled && wait_ready && await_routes && product_check && routes_dwell; then
                RESTART_RESULT=targeted
                return 0
              fi
              drain="$(product_drain_state "$log" targeted)"
              case "$drain" in
                yes) product_drain_error; return 1 ;;
                no) ;;
                *)
                  echo "::error::The targeted restart of $PRODUCT_AGENT failed and a refused drain cannot be ruled out, so no whole restart was tried. Read .ploinky/routing.json inside the Box, then recover with deploy-explorer-qa-ploinky.yml or, for a refused drain, ploinky restart $PRODUCT_AGENT --accept-failed-drain <containerId>."
                  return 1
                  ;;
              esac
              echo "::warning::The targeted restart of $PRODUCT_AGENT exited $status or a runtime, route or image check failed; recovering with a whole-workspace restart."
            fi
            log="$RUNNER_TEMP/qa-product-restart.log"
            status=0
            run_logged "$log" ploinky_locked restart || status=$?
            if [ "$status" -eq 75 ]; then return 75; fi
            if [ "$status" -eq 0 ] && product_settled && wait_ready && await_routes && product_check && routes_dwell; then
              if [ "$mode" = targeted ]; then RESTART_RESULT=whole-after-targeted; else RESTART_RESULT=whole; fi
              return 0
            fi
            drain="$(product_drain_state "$log" whole)"
            if [ "$drain" = yes ]; then
              product_drain_error
            else
              echo "::error::$PRODUCT_AGENT is not ready after a whole-workspace restart (exit $status). Recover with deploy-explorer-qa-ploinky.yml."
            fi
            return 1
          }
          # END QA product restart

          # How far the change reaches. none: tree and image identical. whole: the manifest outside its container field,
          # mcp-config.json or a package file differs, which a restart of one agent may not pick up. targeted: the rest.
          # A missing manifest.json on either side fails.
          # BEGIN QA Bizanso classifier
          classify_bizanso() {
            node --input-type=module - "$@" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const [liveDir, incomingDir, liveTree, sourceTree, liveImage, imageId] = process.argv.slice(2);
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value)
              .sort(([left], [right]) => (left < right ? -1 : left > right ? 1 : 0))
              .map(([key, child]) => [key, stable(child)]));
          };
          const manifest = (dir) => {
            const parsed = JSON.parse(fs.readFileSync(path.join(dir, 'bizanso/manifest.json'), 'utf8'));
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('bizanso/manifest.json is not an object');
            const { container, ...rest } = parsed;
            return JSON.stringify(stable(rest));
          };
          const read = (dir, name) => {
            try { return fs.readFileSync(path.join(dir, name)); } catch (error) {
              if (error.code === 'ENOENT') return null;
              throw error;
            }
          };
          const verdict = (scope, reason) => process.stdout.write('scope=' + scope + ' reason=' + reason + '\n');
          const liveManifest = manifest(liveDir);
          const incomingManifest = manifest(incomingDir);
          if (liveManifest !== incomingManifest) {
            verdict('whole', 'bizanso/manifest.json differs outside its container field');
          } else {
            const changed = ['bizanso/mcp-config.json', 'bizanso/package.json', 'package.json', 'package-lock.json'].filter((name) => {
              const live = read(liveDir, name);
              const incoming = read(incomingDir, name);
              return (live === null) !== (incoming === null) || (live !== null && !live.equals(incoming));
            });
            if (changed.length) verdict('whole', changed.join(', ') + ' differs');
            else if (liveTree === sourceTree && liveImage === imageId) verdict('none', 'the tree and the image are identical');
            else verdict('targeted', 'the sources or the container image changed');
          }
          NODE
          }
          # END QA Bizanso classifier

          # Refusal 3: the Box must exist and belong to the Ploinky-command workflows.
          if ! STATUS_OUTPUT="$(ploinky_read status)"; then
            printf '%s\n' "$STATUS_OUTPUT"
            echo "::error::Status failed: this QA Box is not one the Ploinky-command workflows manage. Nothing was changed. Dispatch deploy-explorer-qa-ploinky.yml (see docs/deploy-explorer-qa.md)."
            exit 1
          fi
          if [[ "$STATUS_OUTPUT" == *'Ploinky Box: absent'* ]]; then
            echo "::error::There is no QA Box. Nothing was changed. Dispatch deploy-explorer-qa-ploinky.yml to install it."
            exit 1
          fi
          BOX_STATE=present
          # Refusal 4: every runtime of the graph, and the three products, must already run.
          STATUS_STATES="$(printf '%s\n' "$STATUS_OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' | runtime_states)"
          for agent in $GRAPH_RUNTIMES; do
            if ! grep -qx "$agent running" <<< "$STATUS_STATES"; then
              echo "::error::Runtime $agent is not running, so the QA graph is not healthy. Nothing was changed. Dispatch deploy-explorer-qa-ploinky.yml."
              exit 1
            fi
          done
          # Refusal 5: the product check. Read-only.
          if ! LIVE_OUTPUT="$(run_in_box "$BIZANSO_READ_PROGRAM" < /dev/null)"; then
            echo "::error::The product check failed: bizanso must be a real directory at the workspace root, without Git metadata and not also under .ploinky/repos (or the host lock is held). Nothing was changed. deploy-explorer-qa-ploinky.yml installs it."
            exit 1
          fi
          LIVE_TREE="$(sed -n 's/^TREE=//p' <<< "$LIVE_OUTPUT" | tail -n 1)"
          if [[ ! "$LIVE_TREE" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The product check did not report a tree digest. Nothing was changed."
            exit 1
          fi
          LIVE_DIR="$(mktemp -d "$RUNNER_TEMP/qa-bizanso-live.XXXXXX")"
          if ! run_in_box "$BIZANSO_MANIFEST_PROGRAM" < /dev/null | tar -xf - -C "$LIVE_DIR"; then
            echo "::error::The product check could not read bizanso/manifest.json and the package files from the Box. Nothing was changed."
            exit 1
          fi
          if ! container_line bizanso; then
            echo "::error::The product check found no single running bizanso container. Nothing was changed. Dispatch deploy-explorer-qa-ploinky.yml."
            exit 1
          fi
          read -r LIVE_IMAGE LIVE_STARTED _ <<< "$CONTAINER_LINE"
          if [[ ! "$LIVE_IMAGE" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$LIVE_STARTED" =~ ^[0-9]+$ ]]; then
            echo "::error::The product check read a malformed bizanso container line (image ID or start time). Nothing was changed."
            exit 1
          fi
          # A draining route on any agent would make the whole restart refuse its graph after it stopped everything.
          if [ "$(any_route_draining)" != no ]; then
            echo "::error::A route in .ploinky/routing.json is draining, or the routes could not be read. Nothing was changed. An operator must resolve the refused drain first: ploinky restart <agent> --accept-failed-drain <containerId>."
            exit 1
          fi
          # Refusal 6: restarting must never be what first shows a broken edge.
          if ! await_routes 3; then
            echo "::error::QA routes are not healthy before this run ($ROUTES_STATE). Nothing was changed. Dispatch deploy-explorer-qa-ploinky.yml."
            exit 1
          fi
          # Refusal 7: free what earlier rollouts left behind, then refuse to start on a full disk.
          prune_images pre
          require_free_disk

          # From here on the QA Box changes. Each later failure says what is left changed.
          if ! PULL_OUTPUT="$(printf '%s\n' "$BIZANSO_IMAGE" | run_in_box "$BIZANSO_PULL_PROGRAM")"; then
            echo "::error::Pulling $BIZANSO_IMAGE inside the Box failed; nothing else was changed."
            exit 1
          fi
          IMAGE_ID="$(sed -n 's/^IMAGE_ID=//p' <<< "$PULL_OUTPUT" | tail -n 1)"
          if [[ ! "$IMAGE_ID" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::The pull did not report an image ID; nothing else was changed."
            exit 1
          fi
          echo "[deploy-qa-bizanso] source $BIZANSO_SOURCE_COMMIT tree $BIZANSO_SOURCE_TREE image $BIZANSO_IMAGE id $IMAGE_ID"
          echo "[deploy-qa-bizanso] live tree before $LIVE_TREE"
          if ! CLASSIFICATION="$(classify_bizanso "$LIVE_DIR" "$BIZANSO_INCOMING_DIR" "$LIVE_TREE" "$BIZANSO_SOURCE_TREE" "$LIVE_IMAGE" "$IMAGE_ID")"; then
            echo "::error::The live and incoming Bizanso manifests could not be compared; the image was pulled and nothing else was changed."
            exit 1
          fi
          RESTART_SCOPE="$(sed -n 's/^scope=\([a-z]*\) reason=.*/\1/p' <<< "$CLASSIFICATION" | tail -n 1)"
          case "$RESTART_SCOPE" in
            none|targeted|whole) ;;
            *)
              echo "::error::The classifier returned no restart scope; nothing else was changed."
              exit 1
              ;;
          esac
          echo "[deploy-qa-bizanso] restart scope: $RESTART_SCOPE (${CLASSIFICATION#*reason=})"

          RESTART_RESULT=none
          COPY_EPOCH=0
          PRODUCT_CHECK_SUMMARY=''
          if [ "$RESTART_SCOPE" != none ]; then
            COPY_EPOCH="$("${SSH[@]}" 'date +%s' < /dev/null)"
            if [[ ! "$COPY_EPOCH" =~ ^[0-9]{9,12}$ ]]; then
              echo "::error::The host clock could not be read; nothing was copied."
              exit 1
            fi
            if ! git -C "$GITHUB_WORKSPACE/.qa-bizanso-source" archive --format=tar HEAD | run_in_box "$COPY_PROGRAM"; then
              echo "::error::Post-mutation failure: the Bizanso copy did not complete. The copy program replaces bizanso/ only after extracting everything and keeps the previous copy at .ploinky/.qa-private-copy/previous; the agent was not restarted."
              exit 1
            fi
            if ! printf '%s' "$PUBLIC_URL/base-agent-additional-server/bizanso/8787" | ploinky_locked var BIZANSO_PUBLIC_LINK_BASE --stdin; then
              echo "::error::Post-mutation failure: bizanso/ holds the copy, but BIZANSO_PUBLIC_LINK_BASE could not be set. The agent was not restarted."
              exit 1
            fi
            # Post-mutation check: the copy replaced bizanso/ and kept the previous one under .ploinky/.qa-private-copy/previous.
            if ! COPIED_OUTPUT="$(run_in_box "$BIZANSO_READ_PROGRAM" < /dev/null)" ||
              [ "$(sed -n 's/^TREE=//p' <<< "$COPIED_OUTPUT" | tail -n 1)" != "$BIZANSO_SOURCE_TREE" ]; then
              echo "::error::Post-mutation failure: the copied Bizanso tree is not the source tree $BIZANSO_SOURCE_TREE. bizanso/ now holds the copy, the previous one is at .ploinky/.qa-private-copy/previous, and the agent was not restarted. Dispatch this workflow again or deploy-explorer-qa-ploinky.yml."
              exit 1
            fi
            RESTART_STATUS=0
            restart_product "$RESTART_SCOPE" || RESTART_STATUS=$?
            if [ "$RESTART_STATUS" -ne 0 ]; then
              echo "::error::Post-mutation failure: Bizanso was copied and its image pulled, but the restart did not complete (exit $RESTART_STATUS). The previous copy is at .ploinky/.qa-private-copy/previous."
              exit "$RESTART_STATUS"
            fi
          fi
          echo "[deploy-qa-bizanso] restart result: $RESTART_RESULT"
          if [ "$RESTART_SCOPE" != none ]; then
            echo "[deploy-qa-bizanso] $PRODUCT_CHECK_SUMMARY"
          fi
          if ! AFTER_OUTPUT="$(run_in_box "$BIZANSO_READ_PROGRAM" < /dev/null)"; then
            echo "::error::Post-mutation failure: the live Bizanso tree could not be read after the restart."
            exit 1
          fi
          AFTER_TREE="$(sed -n 's/^TREE=//p' <<< "$AFTER_OUTPUT" | tail -n 1)"
          echo "[deploy-qa-bizanso] live tree after $(printable "$AFTER_TREE")"
          if [ "$AFTER_TREE" != "$BIZANSO_SOURCE_TREE" ]; then
            echo "::error::Post-mutation failure: the live Bizanso tree is not the source tree $BIZANSO_SOURCE_TREE."
            exit 1
          fi

          if [ "$SOUL_UP_BEFORE" = 1 ] && ! soul_healthy; then
            echo "::error::Protected Soul Gateway became unhealthy during the deployment."
            exit 1
          fi
          if [ "$UNRELATED_BEFORE" != "$(unrelated_containers)" ]; then
            echo "::error::An unrelated host container changed during the deployment."
            exit 1
          fi
          # After the readiness checks, so a prune problem can never mask them. It only warns.
          prune_images post
          if FREE_AFTER="$(free_disk_gib)"; then
            echo "[deploy-qa] free disk after prune: $FREE_AFTER GiB"
          else
            echo '::warning::Could not read the free disk space after the prune.'
          fi
          # END QA product flow

      - name: Verify the QA routes
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/qa-product-verify-body"
          fetch_code() {
            : > "$BODY"
            curl -sS --max-time 15 -o "$BODY" -w '%{http_code}' "$1" || true
          }
          for attempt in $(seq 1 60); do
            explorer="$(fetch_code "${PUBLIC_URL%/}/auth/login?agent=explorer")"
            if { [ "$explorer" = 303 ] || [ "$explorer" = 200 ]; } && grep -Eqi 'EDGE_GENERATION_INACTIVE|cloudflare tunnel error|error code: 1033' "$BODY"; then
              explorer=inactive
            fi
            bizanso="$(fetch_code "${PUBLIC_URL%/}/base-agent-additional-server/bizanso/8787/how-it-works/")"
            scriptahub="$(fetch_code "${PUBLIC_URL%/}/base-agent-additional-server/scriptahubAgent/3002/health")"
            if { [ "$explorer" = 303 ] || [ "$explorer" = 200 ]; } && [ "$bizanso" = 200 ] && [ "$scriptahub" = 200 ]; then
              echo "[deploy-qa-bizanso] The Explorer login, Bizanso and ScriptaHub answer through the public edge."
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo "::error::The QA routes did not answer; last HTTP codes explorer=${explorer:-none} bizanso=${bizanso:-none} scriptahub=${scriptahub:-none}"
              exit 1
            fi
            sleep 5
          done

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Explorer QA Bizanso Deploy"
            echo ""
            echo "- Host: \`${SSH_USER}@${SSH_HOST}\`, workspace \`~/${WORKSPACE}\`"
            echo "- Scope: only \`bizanso/bizanso\` inside the running Box. The Ploinky checkout, the Box, the tunnel and every other repository are untouched"
            echo "- Source: private Bizanso default branch \`${BIZANSO_SOURCE_COMMIT:-not-resolved}\`, tree \`${BIZANSO_SOURCE_TREE:-not-resolved}\`"
            echo "- Image: \`${BIZANSO_IMAGE:-not-resolved}\`"
            echo "- Restart scope and result: the \`restart scope\` and \`restart result\` lines of the deploy step"
            echo "- A whole-workspace restart interrupts in-flight robot work on QA"
            echo "- Concurrency: any dispatch in the group \`deploy-explorer-qa\` (the full QA deploys, both destroys, the ScriptaHub workflow) cancels a queued, not running, run of the same group"
            echo "- Bizanso: \`${PUBLIC_URL}/base-agent-additional-server/bizanso/8787/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            ~/.ssh/deploy_key \
            ~/.ssh/explorer_qa_known_hosts \
            "$RUNNER_TEMP/explorer_qa_known_hosts" \
            "$RUNNER_TEMP/explorer-qa-product-preflight.log" \
            "$RUNNER_TEMP/qa-product-route-body" \
            "$RUNNER_TEMP/qa-product-verify-body" \
            "$RUNNER_TEMP/qa-product-routing.json" \
            "$RUNNER_TEMP/qa-product-agents.json" \
            "$RUNNER_TEMP/qa-product-targeted.log" \
            "$RUNNER_TEMP/qa-product-restart.log"
