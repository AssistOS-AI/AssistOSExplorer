# Build input (copied into the frozen candidate). The real file is CARGO_HOME/config.toml in the task-local build root;
# replace <TASK_ROOT> with that root. Nothing here is read from the repository at build time.
[source.crates-io]
replace-with = "vendored-sources"
[source.vendored-sources]
directory = "<TASK_ROOT>/vendor"
# Target-scoped ONLY. Host artifacts (build scripts, proc macros, host tests) keep the Apple linker.
[target.x86_64-unknown-linux-musl]
linker = "<TASK_ROOT>/rustup/toolchains/1.99.1-aarch64-apple-darwin/lib/rustlib/aarch64-apple-darwin/bin/rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "link-self-contained=yes", "-C", "target-feature=+crt-static"]
[net]
offline = true
