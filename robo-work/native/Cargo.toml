[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/fsview",
    "crates/confine",
    "crates/keeper",
    "crates/file-server",
    "tools/elfcheck",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

# Exact pins only. Both crates come from the R-B vendored set (vendor checksums verified by cargo).
[workspace.dependencies]
fuser = { version = "=0.18.0", default-features = false }
libc = { version = "=0.2.191", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
debug = false
incremental = false

[profile.dev]
panic = "unwind"
