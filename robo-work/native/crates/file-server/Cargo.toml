[package]
name = "rw-file-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The RoboWork per-grant file server (plan section 5.4): serves one keeper-provided /dev/fuse connection through fuser's Session::from_fd, confined to one inherited grant-root descriptor."

[[bin]]
name = "rw-file-server"
path = "src/main.rs"

[dependencies]
rw-fsview = { path = "../fsview" }
rw-confine = { path = "../confine" }
rw-proto = { path = "../proto" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
fuser = { workspace = true }
