[package]
name = "rw-keeper"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The RoboWork execution keeper (plan section 5.5): framed supervisor channel, filtered-view mounts and their root leases, file-server spawn and descriptor custody, the single bwrap construction stage and the gated pre-exec stage."

[[bin]]
name = "keeper"
path = "src/main.rs"

[features]
# APPARATUS ONLY (first-G1 amendment A1.6): embed the image policy file named by the build-time environment variable
# RW_KEEPER_APPARATUS_POLICY_FILE. Off by default; a default build has no policy and refuses every process-bearing create.
apparatus-policy = []

[dependencies]
rw-proto = { path = "../proto" }
rw-confine = { path = "../confine" }
# Unconditional (N-E): the portable channel writer and its host test use plain write(2), read(2) and recvmsg(2). Same
# vendored, locked version as before; no new crate.
libc = { workspace = true }
