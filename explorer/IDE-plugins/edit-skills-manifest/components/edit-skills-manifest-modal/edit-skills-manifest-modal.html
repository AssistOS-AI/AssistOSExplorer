<header class="skills-dialog-heading">
    <h2>Manage skills</h2>
    <button type="button" class="button secondary" data-local-action="closeModal">Close</button>
</header>
<div data-repository-list></div>
<section class="skill-recommendations">
    <h3>Recommended repositories</h3>
    <p class="muted">Registered in Ploinky. Workspace checkouts are preferred.</p>
    <div data-preset-list></div>
</section>
<form class="repository-form" data-add-form>
    <label>Repository URL<input id="editSkillsManifestRepoInput" name="repositoryUrl" type="text" required autocomplete="off" spellcheck="false" placeholder="https://github.com/owner/skills.git"></label>
    <button class="button primary" type="submit">Add repo</button>
</form>
<p class="message" data-status hidden></p>
