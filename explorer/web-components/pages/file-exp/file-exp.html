<main>
    <section class="panel" id="directoryPanel">
        <div class="path-info">
            <span>Path:</span>
            <div class="breadcrumbs" id="breadcrumbs"></div>
            <div class="path-info-actions">
                <a href="#file-exp/Confidential" class="secondary toolbar-menu-button path-info-menu-button" title="Confidential">
                    <img class="path-info-menu-icon" loading="lazy" src="./assets/icons/folder-secure.svg" alt="">
                </a>
                <button id="openInNewTabButton" type="button" class="secondary toolbar-menu-button path-info-menu-button" title="Open in new tab"
                        data-local-action="openInNewTab">
                    <img class="path-info-menu-icon" loading="lazy" src="./assets/icons/open-in-new-tab.svg" alt="">
                </button>
                <div class="toolbar-dropdown path-info-dropdown">
                    <button id="accountMenuButton" class="secondary toolbar-menu-button path-info-menu-button" title="Account actions"
                            aria-haspopup="true" aria-expanded="false">
                        <img class="path-info-menu-icon" loading="lazy" src="./assets/icons/person.svg" alt="">
                        <span class="chevron">▾</span>
                    </button>
                    <div class="toolbar-dropdown-menu action-menu-dropdown path-info-dropdown-menu" id="accountMenu" role="menu">
                        <button type="button" class="toolbar-dropdown-item action-menu-item" data-local-action="openSettingsModal" role="menuitem">
                            <img class="action-menu-item-icon" loading="lazy" src="./assets/icons/advanced-settings.svg" alt="">
                            <span class="action-menu-item-label">Settings</span>
                        </button>
                        <button type="button" class="toolbar-dropdown-item action-menu-item" data-local-action="openLogoutConfirmation" role="menuitem">
                            <img class="action-menu-item-icon" loading="lazy" src="./assets/icons/logout.svg" alt="">
                            <span class="action-menu-item-label">Logout</span>
                        </button>
                        <div class="app-plugin-account-slot" id="fileExpAccountMenuPlugins" aria-label="Account menu plugins"></div>
                    </div>
                </div>
            </div>
        </div>
	        <div class="toolbar">
            <button id="upButton" class="secondary" title="Go to parent directory" data-local-action="goUp">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-arrow-up-short" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                          d="M8 12a.5.5 0 0 0 .5-.5V5.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 5.707V11.5a.5.5 0 0 0 .5.5z"/>
                </svg>
                Up
            </button>
            <button id="refreshButton" class="secondary" title="Reload directory" data-local-action="refresh">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                </svg>
                Refresh
            </button>
            <button id="uploadButton" class="secondary" title="Upload files" data-local-action="openUploadPicker">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-upload" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.6a.5.5 0 0 1 1 0v2.6A2 2 0 0 1 14 15H2a2 2 0 0 1-2-2v-2.6a.5.5 0 0 1 .5-.5"/>
                    <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
                </svg>
                Upload
            </button>
            <div class="toolbar-dropdown">
                <button id="toolbarMenuButton" class="secondary toolbar-menu-button" title="More actions" aria-haspopup="true"
                        aria-expanded="false">
                    New
                    <span class="chevron">▾</span>
                </button>
                <div class="toolbar-dropdown-menu action-menu-dropdown" id="toolbarMenu" role="menu">
                    <app-menu id="toolbarAppMenu" data-presenter="app-menu"></app-menu>
                </div>
            </div>
            <div class="toolbar-dropdown">
                <button id="pluginsMenuButton" class="secondary toolbar-menu-button" title="Plugin tools" aria-haspopup="true"
                        aria-expanded="false">
                    Tools
                    <span class="chevron">▾</span>
                </button>
                <div class="toolbar-dropdown-menu action-menu-dropdown" id="pluginsMenu" role="menu">
                    <div class="app-menu-list" id="fileExpToolbarPluginsDropdown" aria-label="Toolbar plugins dropdown"></div>
                </div>
            </div>
            <button id="searchInFilesButton" class="secondary" title="Find/Replace in files (content)"
                    data-local-action="openSearchInFiles">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-search" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.85-3.85zm-5.242.656a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                </svg>
                <span>Find/Replace in files</span>
            </button>
            <div class="clipboard-group">
                <span id="clipboardInfo" class="clipboard-info"></span>
                <button id="clearClipboardButton" class="secondary" title="Clear the current clipboard selection"
                        data-local-action="clearClipboard" disabled>
                    Clear
                </button>
            </div>
            <label class="filter-specs-toggle">
                <input type="checkbox" id="filterSpecsToggle"/>
                Filter specs (.md)
            </label>
            <span class="toolbar-spacer"></span>
            <div class="app-toolbar-slot" id="fileExpToolbarPlugins" aria-label="Application toolbar plugins"></div>
        </div>
        <input id="fileUploadInput" type="file" multiple hidden>
        <div class="workspace">
            <div class="panel list">
                <div class="list-header">
                    <div class="directory-filter" role="search" aria-label="Filter directory contents">
                        <input id="directoryFilterInput" type="search" placeholder="Find file…" autocomplete="off"
                               spellcheck="false"/>
                        <button id="directoryFilterClear" type="button" class="secondary" title="Clear filter"
                                aria-label="Clear filter">
                            Clear
                        </button>
                    </div>
                    <div class="list-header-actions">
                        <button id="directoryViewModeButton" class="toggle-list view-button" type="button" title="Switch to tree view" aria-pressed="false" aria-label="Switch to tree view">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                                <g class="directory-view-icon-tree">
                                    <rect x="6.1" y="2" width="3.8" height="2.6" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                    <rect x="1.9" y="11.1" width="3.8" height="2.6" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                    <rect x="10.3" y="11.1" width="3.8" height="2.6" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                    <path d="M8 4.9v2.2M4 8.1h8M4 8.1v3M12 8.1v3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                                </g>
                                <g class="directory-view-icon-list">
                                    <path d="M3 4h10M3 8h10M3 12h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                </g>
                            </svg>
                        </button>
                        <div class="column-visibility">
                            <button id="columnVisibilityButton" class="toggle-list view-button" title="Choose columns" aria-haspopup="true" aria-expanded="false">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                                    <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                    <circle cx="4.5" cy="8" r="1" fill="currentColor"/>
                                    <circle cx="8" cy="8" r="1" fill="currentColor"/>
                                    <circle cx="11.5" cy="8" r="1" fill="currentColor"/>
                                </svg>
	                            </button>
	                            <div class="column-visibility-menu" id="columnVisibilityMenu" role="menu">
	                                <label><input type="checkbox" data-column="type"> Type</label>
	                                <label><input type="checkbox" data-column="size"> Size</label>
	                                <label><input type="checkbox" data-column="modified"> Modified</label>
	                            </div>
	                        </div>
                        <button id="toggleListButton" class="toggle-list" title="Toggle directory view"
                                aria-label="Hide directory panel">
                            <svg class="toggle-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                                 viewBox="0 0 22 22" aria-hidden="true">
                                <path class="toggle-folder"
                                      d="M2.5 18.5h17a1.5 1.5 0 0 0 1.5-1.5V9A1.5 1.5 0 0 0 19.5 7.5h-8.6l-1.8-2H4.5A1.5 1.5 0 0 0 3 7v10a1.5 1.5 0 0 0 1.5 1.5Z"/>
                                <g class="icon-inward">
                                    <path d="M5.5 12.5 H9.5 M7.8 10 L9.5 12.5 L7.8 15"/>
                                    <path d="M16.5 12.5 H12.5 M14.2 10 L12.5 12.5 L14.2 15"/>
                                </g>
                                <g class="icon-outward">
                                    <path d="M11 12.5 H6 M8 10 L6 12.5 L8 15"/>
                                    <path d="M11 12.5 H16 M13 10 L16 12.5 L13 15"/>
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
                <file-exp-entries data-presenter="file-exp-entries"></file-exp-entries>
            </div>
            <div class="resizer" id="resizer"></div>
            <div class="panel preview">
                <div id="previewStatusStrip" class="preview-status-strip hidden" role="status" aria-live="polite"></div>
                <div class="preview-header">
                    <div class="preview-title">
                        <span id="editorFileName" class="preview-filename"></span>
                    </div>
                    <div id="previewHeaderExtras" class="preview-header-extras"></div>
                    <button id="toggleHeaderButton" class="secondary toolbar-menu-button path-info-menu-button" type="button" aria-expanded="true" title="Hide Explorer header">
                        <img class="path-info-menu-icon toggle-header-icon collapse-icon" src="./assets/icons/header-toggle-v4.svg" alt="" aria-hidden="true" width="18" height="18">
                        <img class="path-info-menu-icon toggle-header-icon expand-icon" src="./assets/icons/header-expand-v4.svg" alt="" aria-hidden="true" width="18" height="18">
                    </button>
                    <div id="markdownViewActions" class="hidden">
                        <button id="toggleMarkdownViewButton" class="secondary" data-local-action="toggleMarkdownView">
                            View as text
                        </button>
                        <button id="soplangMarkdownEditButton" class="secondary" data-local-action="editSoplangMarkdown">
                            Advanced edit
                        </button>
                    </div>
                    <div id="webViewActions" class="hidden">
                        <button id="showCodeViewButton" class="secondary" data-local-action="setPreviewViewMode code">Code</button>
                        <button id="showWebViewButton" class="secondary" data-local-action="setPreviewViewMode web">Web View</button>
                        <button id="showSplitViewButton" class="secondary" data-local-action="setPreviewViewMode split">Split</button>
                    </div>
                    <div id="editorActions" class="hidden">
                        <button id="wrapPreviewButton" class="secondary" type="button" data-local-action="togglePreviewWrap" aria-pressed="false">
                            Wrap
                        </button>
                        <button id="editButton" data-local-action="editFile">Edit</button>
                    </div>
                    <div id="editingActions" class="hidden">
                        <button id="saveButton" data-local-action="saveFile">Save</button>
                        <button id="cancelButton" data-local-action="cancelEdit" class="secondary">Cancel</button>
                    </div>
                </div>
                <div id="previewNotice" class="preview-notice hidden" role="status"></div>
                <div class="preview-body">
                    <file-exp-preview data-presenter="file-exp-preview"></file-exp-preview>
                </div>
            </div>
            <aside class="app-plugin-bar" id="fileExpPluginBar" aria-label="Application plugins"></aside>
        </div>
    </section>
    <div class="app-plugin-internal-slot" id="fileExpInternalPlugins" aria-hidden="true"></div>
    <div class="app-plugin-global-slot" id="fileExpGlobalPlugins" aria-label="Global application plugins"></div>
</main>
