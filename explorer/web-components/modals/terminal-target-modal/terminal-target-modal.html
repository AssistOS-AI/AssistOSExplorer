<div class="terminal-target-shell" role="document" aria-labelledby="terminalTargetTitle">
    <div class="modal-header">
        <div class="modal-header-left">
            <div class="modal-title" id="terminalTargetTitle">Open terminal in</div>
            <div class="modal-subtitle" id="terminalTargetDirectory"></div>
        </div>
        <button type="button" class="close" data-local-action="closeModal" aria-label="Cancel and close terminal target chooser"></button>
    </div>
    <div class="modal-body terminal-target-body">
        <p class="terminal-target-status" id="terminalTargetStatus" role="status" aria-live="polite"></p>
        <div class="terminal-target-warning" id="terminalTargetWarning" role="alert" hidden></div>
        <div class="terminal-target-robot">
            <label class="terminal-target-field-label" for="terminalTargetRobotSearch">Robot</label>
            <div class="terminal-robot-combobox">
                <input id="terminalTargetRobotSearch" class="terminal-target-select" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="terminalTargetRobotOptions" placeholder="Search and select a robot…" autocomplete="off" disabled aria-label="Robot" />
                <div id="terminalTargetRobotOptions" class="terminal-robot-options" role="listbox" aria-label="Robots" hidden></div>
            </div>
            <p class="terminal-target-robot-note" id="terminalTargetRobotNote" role="status" aria-live="polite"></p>
        </div>
        <ul class="terminal-target-list" id="terminalTargetList" aria-label="Available Ploinky containers" aria-busy="true"></ul>
        <div class="modal-actions">
            <button type="button" class="general-button" id="terminalTargetOpen" data-local-action="openTerminal" disabled>Open</button>
        </div>
    </div>
</div>
