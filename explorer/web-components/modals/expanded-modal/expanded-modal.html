<div class="expanded-modal" role="document">
    <div class="modal-header expanded-modal-header">
        <div class="modal-title expanded-modal-title" id="expandedModalTitle">$$data-title</div>
        <div class="expanded-modal-actions">
            <button type="button" class="icon-button expanded-modal-action" id="expandedModalReload"
                    data-local-action="reloadContent" aria-label="Reload panel" title="Reload">
                <img class="expanded-modal-icon" src="/explorer/assets/icons/refresh.svg" alt="" aria-hidden="true">
            </button>
            <button type="button" class="icon-button expanded-modal-action" id="expandedModalFullscreen"
                    data-local-action="toggleFullscreen" aria-label="Toggle fullscreen" title="Toggle fullscreen"
                    aria-pressed="false">
                <img class="expanded-modal-icon" src="/explorer/assets/icons/fullscreen.svg" alt="" aria-hidden="true">
            </button>
            <button type="button" class="icon-button expanded-modal-action" id="expandedModalClose"
                    data-local-action="closeModal" aria-label="Close panel" title="Close">
                <img class="expanded-modal-icon" src="/explorer/assets/icons/x-mark.svg" alt="" aria-hidden="true">
            </button>
        </div>
    </div>
    <div class="expanded-modal-body" id="expandedModalBody">
        <div class="expanded-modal-state" id="expandedModalState" role="status" aria-live="polite">
            <span class="expanded-modal-spinner" aria-hidden="true"></span>
            <span id="expandedModalStateMessage">Loading…</span>
        </div>
    </div>
    <div class="expanded-modal-resize-handle" data-resize-dir="n"></div>
    <div class="expanded-modal-resize-handle" data-resize-dir="s"></div>
    <div class="expanded-modal-resize-handle" data-resize-dir="e"></div>
    <div class="expanded-modal-resize-handle" data-resize-dir="w"></div>
    <div class="expanded-modal-resize-handle" data-resize-dir="ne"></div>
    <div class="expanded-modal-resize-handle" data-resize-dir="nw"></div>
    <div class="expanded-modal-resize-handle" data-resize-dir="se"></div>
    <div class="expanded-modal-resize-handle" data-resize-dir="sw"></div>
</div>
