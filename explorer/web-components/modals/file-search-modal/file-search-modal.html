<div class="search-modal">
    <div class="search-modal-header">
        <div class="search-modal-title-group">
            <div class="search-modal-title">Search</div>
            <div class="search-modal-subtitle">Find files or text in the workspace</div>
        </div>
        <div class="search-modal-header-actions">
            <button type="button" class="icon-button" id="searchModalFullscreen" data-local-action="toggleFullscreen"
                    aria-label="Toggle fullscreen" title="Toggle fullscreen">
                <img src="/explorer/shared/assets/icons/fullscreen.svg" alt="" class="search-settings-icon" aria-hidden="true">
            </button>
            <button type="button" class="icon-button" id="searchModalClose" data-local-action="closeModal" action=""
                    aria-label="Close search">✕
            </button>
        </div>
    </div>
    <div class="search-modal-body">
        <div class="search-mode-switch" role="tablist" aria-label="Search mode">
            <button type="button" class="mode-button" data-mode="name" data-local-action="setSearchMode name" role="tab" aria-selected="false">Find file</button>
            <button type="button" class="mode-button" data-mode="replace" data-local-action="setSearchMode replace" role="tab" aria-selected="false">Find/Replace in files</button>
        </div>
        <div class="search-overlay" id="searchByNameOverlay" aria-hidden="true">
            <div class="search-overlay-card">
                <div class="search-overlay-header">
                    <div>
                        <div class="search-overlay-title">Find file</div>
                        <div class="search-overlay-subtitle">Jump to a file by name (Cmd/Ctrl+P)</div>
                    </div>
                    <div class="search-exclude-wrapper">
                        <label>Excluded files:</label>
                        <input type="text" id="searchByNameExclude" class="search-exclude"
                               placeholder="Exclude (comma separated globs)" autocomplete="off">

                    </div>
                </div>
                <div class="search-overlay-body">
                    <div class="search-row">
                        <input type="text" id="searchByNameInput" placeholder="Type a file or folder name..."
                               autocomplete="off">
                    </div>
                    <div class="search-status" id="searchByNameStatus"></div>
                    <div class="search-results" id="searchByNameResults"></div>
                </div>
            </div>
        </div>
        <div class="search-overlay" id="searchInFilesOverlay" aria-hidden="true">
            <div class="search-overlay-card">
                <div class="search-overlay-header">
                    <div>
                        <div class="search-overlay-title">Find/Replace in files</div>
                        <div class="search-overlay-subtitle" id="searchInFilesSubtitle">Find and replace across workspace (Cmd/Ctrl+Shift+F)</div>
                    </div>
                    <div class="search-exclude-wrapper">
                        <label>Excluded files:</label>
                        <input type="text" id="searchInFilesExclude" class="search-exclude"
                               placeholder="Exclude (comma separated globs)" autocomplete="off">
                    </div>
                </div>
                <div class="search-overlay-body">
                    <div class="search-row search-row-primary">
                        <div class="search-query-group">
                            <input type="text" id="searchInFilesQuery" placeholder="Search text..." autocomplete="off">
                        </div>
                    </div>
                    <div class="search-row search-row-primary replace-only">
                        <div class="search-query-group">
                            <input type="text" id="replaceInFilesWith" placeholder="Replace with..." autocomplete="off">
                        </div>
                    </div>
                    <div class="search-row search-row-secondary">
                        <label class="search-toggle">
                            <input type="checkbox" id="searchInFilesCase">
                            Case sensitive
                        </label>
                        <label class="search-toggle">
                            <input type="checkbox" id="searchInFilesRegex">
                            Regex
                        </label>
                        <label class="search-toggle">
                            <input type="checkbox" id="searchInFilesWholeWord">
                            Whole word
                        </label>
                    </div>
                    <div class="search-row search-row-secondary search-scope-row">
                        <label class="search-scope-label" for="searchInFilesBasePath">Scope</label>
                        <div class="search-scope-control">
                            <input type="text" id="searchInFilesBasePath" placeholder="/" autocomplete="off" aria-autocomplete="list" aria-controls="searchInFilesBasePathList" aria-expanded="false">
                            <div id="searchInFilesBasePathList" class="search-scope-suggestions hidden" role="listbox" hidden></div>
                        </div>
                    </div>
                    <div class="search-row search-row-actions replace-only">
                        <button type="button" class="general-button" id="replaceSelectedButton" data-local-action="replaceSelected">Replace Selected</button>
                        <button type="button" class="general-button secondary" id="replaceAllButton" data-local-action="replaceAll">Replace All</button>
                        <div class="replace-status" id="replaceInFilesStatus"></div>
                    </div>
                    <div class="search-status" id="searchInFilesStatus"></div>
                    <div class="search-results" id="searchInFilesResults"></div>
                </div>
            </div>
        </div>
    </div>
</div>
