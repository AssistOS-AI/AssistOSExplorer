<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboTeam</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (() => {
      const keys = ['assistosExplorerTheme', 'webchat_theme'];
      const browserTheme = window.matchMedia('(prefers-color-scheme: dark)');
      const syncTheme = () => {
        let preference;
        try { preference = keys.map(key => localStorage.getItem(key)).find(Boolean); }
        catch { /* Browser settings may disable storage. */ }
        const dark = preference ? ['dark', 'obsidian'].includes(preference.toLowerCase()) : browserTheme.matches;
        const root = document.documentElement;
        root.classList.toggle('theme-dark', dark);
        root.classList.toggle('theme-light', !dark);
        root.setAttribute('theme', dark ? 'dark' : 'light');
      };
      syncTheme();
      browserTheme.addEventListener('change', syncTheme);
      window.addEventListener('storage', event => {
        if (event.key === null || keys.includes(event.key)) syncTheme();
      });
      window.addEventListener('focus', syncTheme);
      window.addEventListener('pageshow', syncTheme);
    })();
  </script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <h1>RoboTeam</h1>
        <p class="lede">Manage your robots, conversations and workstations.</p>
      </div>
      <button id="refreshButton" class="button secondary" type="button">Refresh</button>
    </header>

    <section class="panel" aria-labelledby="create-title">
      <div class="section-heading"><h2 id="create-title">Create a robot</h2></div>
      <form id="createForm" class="robot-form">
        <label><span>Name</span><input name="name" maxlength="80" required placeholder="Research analyst"></label>
        <label><span>Specialization</span><textarea name="specialization" maxlength="500" rows="1" placeholder="Competitive research and source verification"></textarea></label>
        <button class="button primary" type="submit">Create robot</button>
      </form>
      <p id="formMessage" class="message" role="status"></p>
    </section>

    <section class="robots" aria-labelledby="robots-title">
      <div class="section-heading"><h2 id="robots-title">Robots</h2><span id="robotCount" class="count">0 robots</span></div>
      <div id="robotsList" class="robot-list" aria-live="polite"></div>
    </section>
  </main>

  <template id="robotTemplate">
    <article class="robot-card">
      <div class="robot-main">
        <div class="avatar" aria-hidden="true"></div>
        <div><div class="robot-title-row"><h3></h3><span class="run-state"></span></div><p class="specialization"></p><p class="robot-id"></p></div>
      </div>
      <div class="robot-actions">
        <button class="button secondary open-browser" type="button">Start Browser</button>
        <button class="button primary open-desktop" type="button">Start Desktop</button>
        <button class="button open-chat" type="button">Open Chat</button>
        <button class="button open-terminal" type="button" hidden>Open Terminal</button>
        <button class="button secondary manage-skills" type="button">Manage skills</button>
        <button class="button danger delete-robot" type="button" hidden>Delete robot</button>
      </div>
      <p class="robot-session" hidden><span></span><a class="session-url" target="_blank" rel="noopener noreferrer"></a></p>
      <div class="robot-log-controls">
        <button class="button secondary view-logs" type="button" aria-expanded="false">Logs</button>
      </div>
      <pre class="robot-logs" hidden></pre>
    </article>
  </template>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
