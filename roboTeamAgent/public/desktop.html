<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboTeam Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="desktop-page">
  <header class="desktop-toolbar">
    <div>
      <strong id="desktopName">Robot desktop</strong>
      <span id="connectionState" class="desktop-state state-starting">Connecting</span>
    </div>
    <div class="toolbar-actions">
      <button id="fullscreenButton" class="button secondary" type="button">Full screen</button>
      <a id="backLink" class="button secondary" href="./">Profiles</a>
      <button id="stopButton" class="button danger" type="button">Stop desktop</button>
    </div>
  </header>
  <main id="desktopScreen" class="desktop-screen" tabindex="0" aria-label="Interactive robot desktop">
    <div id="desktopPlaceholder" class="desktop-placeholder">
      <div class="spinner" aria-hidden="true"></div>
      <p>Preparing the virtual desktop…</p>
    </div>
  </main>
  <script src="config.js"></script>
  <script type="module" src="desktop.js"></script>
</body>
</html>
