<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboTeam · Generate flow type</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (() => {
      const keys = ['assistosExplorerTheme', 'webchat_theme'];
      const browserTheme = window.matchMedia('(prefers-color-scheme: dark)');
      const syncTheme = () => {
        let preference;
        try { preference = keys.map(key => localStorage.getItem(key)).find(Boolean); }
        catch { /* Browser settings may disable storage. */ }
        const dark = preference ? ['dark', 'obsidian'].includes(preference.toLowerCase()) : browserTheme.matches;
        const root = document.documentElement;
        root.classList.toggle('theme-dark', dark);
        root.classList.toggle('theme-light', !dark);
        root.setAttribute('theme', dark ? 'dark' : 'light');
      };
      syncTheme();
      browserTheme.addEventListener('change', syncTheme);
      window.addEventListener('storage', event => { if (event.key === null || keys.includes(event.key)) syncTheme(); });
      window.addEventListener('focus', syncTheme);
      window.addEventListener('pageshow', syncTheme);
    })();
  </script>
</head>
<body class="generate-page">
  <main class="shell">
    <header class="hero">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="./">RoboTeam</a>
        <span class="breadcrumb-sep" aria-hidden="true">/</span>
        <span aria-current="page">generate</span>
      </nav>
    </header>

    <section class="panel" aria-labelledby="generate-title">
      <div class="section-heading"><h2 id="generate-title">Describe the workflow</h2></div>
      <p class="lede">Describe what the workflow should do. RoboFlow generates a task graph you can refine on the next step.</p>
      <label class="field"><span>Workflow description</span><textarea id="generationDescription" rows="5" placeholder="Review a change, revise it if needed, and report the result"></textarea></label>
      <p id="generationMessage" class="message" role="status"></p>
      <div class="generation-actions">
        <button id="generateButton" class="button primary" type="button">Generate</button>
        <button id="skipButton" class="button" type="button" title="Skip generation and edit the workflow manually" aria-label="Skip generation and edit manually">Skip <span aria-hidden="true">→</span></button>
        <button id="cancelButton" class="button" type="button" hidden>Cancel</button>
      </div>
      <pre id="generationLog" class="generation-log" aria-live="polite" aria-label="Generation logs" hidden></pre>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="generate.js"></script>
</body>
</html>
