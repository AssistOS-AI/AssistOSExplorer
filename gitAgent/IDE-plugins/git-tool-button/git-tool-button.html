<button
    id="gitButton"
    class="git-tool-button app-plugin-tool-button"
    type="button"
    title="Commit and push with Git"
    aria-label="Open Git tools"
    data-local-action="openGitPanel"
>
    <span class="git-tool-button-icon app-plugin-tool-icon" aria-hidden="true">
        <img class="git-tool-button-icon-image app-plugin-tool-icon-image" alt="" src="" />
    </span>
    <span class="git-tool-button-label app-plugin-tool-label">Git</span>
    <span class="git-tool-button-indicator git-conflict-indicator" aria-hidden="true">!</span>
    <span class="git-tool-button-indicator git-push-warning-indicator" aria-hidden="true">!</span>
</button>
