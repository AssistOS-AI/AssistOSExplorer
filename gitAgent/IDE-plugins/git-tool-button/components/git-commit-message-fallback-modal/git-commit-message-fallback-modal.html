<div class="modal-header">
    <div class="modal-title">Commit message</div>
    <div class="close" data-local-action="cancel" aria-label="Close">
        <img class="close-icon" src="/explorer/shared/assets/icons/x-mark.svg" alt="close">
    </div>
</div>
<div class="modal-body git-commit-message-fallback">
    <p class="git-commit-message-fallback-warning">
        Unable to generate a commit message now. Please edit the message below or cancel the operation.</p>
    <textarea
            id="gitCommitMessageFallbackText"
            class="git-commit-message-fallback-textarea"
            rows="8"
            autocomplete="off"
    >$$messageText</textarea>
    <div class="git-commit-message-fallback-error" id="gitCommitMessageFallbackError" hidden></div>
    <div class="bottom-modal-section modal-actions">
        <button class="general-button" data-local-action="continueWithMessage">Continue</button>
        <button class="gray-button" data-local-action="cancel">Cancel</button>
    </div>
</div>
