<div class="modal-header">
    <div class="modal-title">Local changes</div>
    <div class="close" data-local-action="cancel" aria-label="Close">
        <img class="close-icon" src="/explorer/shared/assets/icons/x-mark.svg" alt="close">
    </div>
</div>
<div class="modal-body git-branch-dirty-modal">
    <div class="git-branch-dirty-message">
        This repository has local changes. Choose how to continue before $$actionLabel.
    </div>
    <div class="git-branch-dirty-counts">
        $$countsHTML
    </div>
    <div class="bottom-modal-section modal-actions">
        <button class="general-button" data-local-action="stashAndContinue">Stash and continue</button>
        <button class="gray-button" data-local-action="runWithoutStash">Run without stashing</button>
        <button class="gray-button" data-local-action="cancel">Cancel</button>
    </div>
</div>
